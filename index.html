<script>
let buf=""; 
let ac=0, er=0; 
let colunaAlvo="2/3"; // começa em 2/3 mas pode mudar clicando

function getColuna(n){
 if(n==0) return 0;
 if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n)) return 1;
 if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n)) return 2;
 if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n)) return 3;
 return 0;
}

// NOVA FUNÇÃO - CLICA NO VEM COLUNA PRA TROCAR
function trocarColuna(){
 let nova = prompt('Qual coluna mandar? Digite: 1/2, 2/3, 1/3, 1, 2 ou 3', colunaAlvo);
 if(nova){
   colunaAlvo = nova;
   document.getElementById('barra').innerText = 'VEM COLUNA '+colunaAlvo;
   document.getElementById('sinal').innerText = colunaAlvo;
 }
}

function dig(n){if(buf.length<2)buf+=n; document.getElementById('barra').innerText=buf?'DIGITANDO: '+buf:'VEM COLUNA '+colunaAlvo;}
function corrigir(){buf=buf.slice(0,-1); document.getElementById('barra').innerText=buf?'DIGITANDO: '+buf:'VEM COLUNA '+colunaAlvo;}
function apagar(){buf="";}
function limpar(){
 document.getElementById('hist-top').innerHTML='';
 document.getElementById('hist-result').innerHTML='';
 ac=0; er=0;
 document.getElementById('ac').innerText=ac;
 document.getElementById('er').innerText=er;
}
function inicio(){window.location.href='index.html';}
function prox(){window.location.href='https://rafigasp-netizen.github.io/proxima.html';}

function enter(){
 if(!buf) return;
 if(buf==='000'){window.location.href='https://rafigasp-netizen.github.io/menu.html'; return;}
 let num=parseInt(buf); if(num<0||num>36){buf='';return;}
 let h=document.getElementById('hist-top');
 let d=document.createElement('div'); d.className='chip '+(num%2==0?'p':'r'); d.textContent=num;
 h.appendChild(d); h.scrollLeft=h.scrollWidth;
 let col=getColuna(num);
 let alvo=colunaAlvo.split('/').map(Number);
 let acertou=alvo.includes(col);
 let hr=document.getElementById('hist-result');
 let chip=document.createElement('div');
 chip.className='hr-chip '+(acertou?'C':'E');
 chip.textContent=num;
 hr.appendChild(chip); hr.scrollLeft=hr.scrollWidth;
 if(acertou)ac++; else er++;
 document.getElementById('ac').innerText=ac;
 document.getElementById('er').innerText=er;
 buf=''; document.getElementById('barra').innerText='VEM COLUNA '+colunaAlvo;
}
</script>
