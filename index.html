<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#001a00;display:flex;justify-content:center}
.app{width:100%;max-width:400px;background:#000;min-height:100vh;display:flex;flex-direction:column}
.topo{height:64px;background:linear-gradient(180deg,#f7e8a5,#d4af37);display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #d4af37}
.topo h1{color:#000;font-size:30px;font-weight:900}
.topo span{color:#000;font-size:10px;letter-spacing:3px;font-weight:700}
.menu{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:8px}
.menu button{height:42px;border-radius:8px;border:1px solid #d4af37;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:11px;font-weight:800}
.barra-verm{background:linear-gradient(180deg,#ff3333,#991111);border:1px solid #d4af37;text-align:center;color:#fff;font-weight:900;padding:10px;font-size:16px;margin:0 6px;border-radius:8px;cursor:pointer}
.hist{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#111;min-height:54px}
.chip{min-width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:2px solid #d4af37;flex-shrink:0}
.r{background:#991b1b}.p{background:#222}
.card-verm{margin:8px;background:linear-gradient(180deg,#ff4444,#cc0000);border:2px solid #d4af37;border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.card-verm h2{color:#fff;font-size:14px}
.card-verm .big{color:#ffff00;font-size:52px;font-weight:900;line-height:1}
.placar{display:flex;justify-content:space-between;background:#000;border-radius:8px;padding:6px 12px;margin-top:8px}
.placar b{font-size:10px;color:#d4af37}
.placar .verde{color:#00ff00;font-size:26px;font-weight:900}
.placar .verm{color:#ff3333;font-size:26px;font-weight:900}
.hist-result{margin-top:8px;background:#000;border-radius:8px;padding:6px;display:flex;gap:6px;overflow-x:auto;min-height:40px;border:1px solid #333}
.hr-chip{min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0;border:1px solid #fff}
.hr-chip.C{background:#00c800;color:#fff}
.hr-chip.E{background:#c80000;color:#fff}
.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px;background:#1a1a0a;border-top:2px solid #d4af37}
.b{height:58px;border-radius:10px;border:1px solid #8a6a1a;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:26px;font-weight:900}
.b-a{font-size:15px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div>
<div class="menu">
<button onclick="inicio()">🏠 INICIO</button>
<button onclick="apagar()">⬅️ APAGAR</button>
<button onclick="limpar()">🗑️ LIMPAR</button>
<button onclick="prox()">➡️ PROX</button>
</div>
<div class="barra-verm" id="barra" onclick="trocarColuna()">VEM COLUNA 2/3</div>
<div class="hist" id="hist-top"></div>
<div class="card-verm" onclick="trocarColuna()">
<h2>VEM COLUNA</h2><div class="big" id="sinal">2/3</div>
<div class="placar">
<div><b>✅ ACERTOU</b><div class="verde" id="ac">0</div></div>
<div><b>❌ ERROU</b><div class="verm" id="er">0</div></div>
</div>
<div class="hist-result" id="hist-result"></div>
</div>
<div class="teclado">
<button class="b" onclick="dig(1)">1</button><button class="b" onclick="dig(2)">2</button><button class="b" onclick="dig(3)">3</button>
<button class="b" onclick="dig(4)">4</button><button class="b" onclick="dig(5)">5</button><button class="b" onclick="dig(6)">6</button>
<button class="b" onclick="dig(7)">7</button><button class="b" onclick="dig(8)">8</button><button class="b" onclick="dig(9)">9</button>
<button class="b b-a" onclick="enter()">ENTER</button><button class="b" onclick="dig(0)">0</button><button class="b b-a" onclick="corrigir()">CORRIGIR</button>
</div>
</div>
<script>
let buf=""; let ac=0, er=0; let colunaAlvo="2/3";
function getColuna(n){
 if(n==0) return 0;
 if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n)) return 1;
 if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n)) return 2;
 if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n)) return 3;
 return 0;
}
function trocarColuna(){
 let nova = prompt('Qual coluna? 1/2 , 2/3 , 1/3 , 1 , 2 , 3', colunaAlvo);
 if(nova){ colunaAlvo=nova; document.getElementById('barra').innerText='VEM COLUNA '+colunaAlvo; document.getElementById('sinal').innerText=colunaAlvo; }
}
function dig(n){if(buf.length<2)buf+=n; document.getElementById('barra').innerText=buf?'DIGITANDO: '+buf:'VEM COLUNA '+colunaAlvo;}
function corrigir(){buf=buf.slice(0,-1); document.getElementById('barra').innerText=buf?'DIGITANDO: '+buf:'VEM COLUNA '+colunaAlvo;}
function apagar(){buf=""; document.getElementById('barra').innerText='VEM COLUNA '+colunaAlvo;}
function limpar(){document.getElementById('hist-top').innerHTML=''; document.getElementById('hist-result').innerHTML=''; ac=0; er=0; document.getElementById('ac').innerText=ac; document.getElementById('er').innerText=er;}
function inicio(){location.reload();}
function prox(){ alert('PROX - Aqui vai sua proxima estrategia. Sem erro 404.'); }
function enter(){
 if(!buf) return;
 if(buf==='000'){ window.location.href='https://rafigasp-netizen.github.io/menu.html'; return; }
 let num=parseInt(buf); if(num<0||num>36){buf='';return;}
 let h=document.getElementById('hist-top'); let d=document.createElement('div'); d.className='chip '+(num%2==0?'p':'r'); d.textContent=num; h.appendChild(d); h.scrollLeft=h.scrollWidth;
 let col=getColuna(num); let alvo=colunaAlvo.split('/').map(Number); let acertou=alvo.includes(col);
 let hr=document.getElementById('hist-result'); let chip=document.createElement('div'); chip.className='hr-chip '+(acertou?'C':'E'); chip.textContent=num; hr.appendChild(chip); hr.scrollLeft=hr.scrollWidth;
 if(acertou)ac++; else er++; document.getElementById('ac').innerText=ac; document.getElementById('er').innerText=er;
 buf=''; document.getElementById('barra').innerText='VEM COLUNA '+colunaAlvo;
}
</script>
</body>
</html>
