<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d2818}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:3px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:12px;text-align:center}
.topo h1{color:#000;font-size:17px;font-weight:900}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#0f2e1f}
.slot{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;border:2px dashed #d4af37;color:#d4af37;background:#0a2a1a}
.slot.yellow{background:#d4af37;color:#000;border:2px solid #d4af37}
.slot.green{background:#16a34a;color:#fff;border:2px solid #16a34a}
.slot.red{background:#dc2626;color:#fff;border:2px solid #dc2626}
.historyBox{background:#0a2a1a;margin:6px 8px;border:2px solid #3b82f6;border-radius:10px;padding:6px;flex:0 200px;overflow-y:auto;display:flex;gap:6px}
.colBox{flex:1;background:#0f2e1f;border-radius:8px;padding:4px}
.colTitle{color:#fff;background:#000;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:900;text-align:center;margin-bottom:6px}
.colTitle.duzia{background:#fff;color:#000}
.squares{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sq{height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#fff}
.sq.green{background:#16a34a}.sq.red{background:#dc2626}
.bottom{flex:1;display:flex;flex-direction:column;padding:8px;background:#0d2818}
.keypad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{width:100%;height:100%;min-height:68px;border-radius:14px;border:none;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.k:active{transform:scale(0.95)}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:14px;font-weight:900}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP COACH DA ROLETA</h1></div>
<div class="top2">
<div class="slot" id="slotY">VAZIO</div>
<div class="slot" id="slotR">VAZIO</div>
</div>
<div class="historyBox">
<div class="colBox"><div class="colTitle">COLUNA</div><div class="squares" id="sqCol"></div></div>
<div class="colBox"><div class="colTitle duzia">DUZIA</div><div class="squares" id="sqDuz"></div></div>
</div>
<div class="bottom">
<div class="keypad">
<button type="button" class="k num" onclick="addN('1')">1</button>
<button type="button" class="k num" onclick="addN('2')">2</button>
<button type="button" class="k num" onclick="addN('3')">3</button>
<button type="button" class="k num" onclick="addN('4')">4</button>
<button type="button" class="k num" onclick="addN('5')">5</button>
<button type="button" class="k num" onclick="addN('6')">6</button>
<button type="button" class="k num" onclick="addN('7')">7</button>
<button type="button" class="k num" onclick="addN('8')">8</button>
<button type="button" class="k num" onclick="addN('9')">9</button>
<button type="button" class="k act" onclick="enterN()">ENTER</button>
<button type="button" class="k zero" onclick="addN('0')">0</button>
<button type="button" class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
</div>
<script>
let history=[],cur='',colSquares=[],duzSquares=[];
const tabela={1:"C2/3",2:"C1/2",3:"C1/2",4:"C3",5:"C2/3",6:"C1/2",7:"C2/3",8:"C1/2",9:"C1",10:"C2/3",11:"C1/3",12:"C2/3",13:"C2",14:"C1",15:"C1/3",16:"C1/3",17:"C1/3",18:"C2/3",19:"C1/2",20:"C1/2",21:"C1",22:"C3",23:"C3",24:"C2/3",25:"C2",26:"C1",27:"C1/3",28:"C2/3",29:"C1/3",30:"C2/3",31:"C2",32:"C1/2",33:"C1",34:"C3",35:"C2/3",36:"C1/2"};
function getAlvo(n){return tabela[n]||"";}
function getColReal(n){if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;return 0;}
function getDuzReal(n){if(n>=1&&n<=12)return 1;if(n>=13&&n<=24)return 2;if(n>=25&&n<=36)return 3;return 0;}
function getAlvos(a){if(!a) return [];let t=a.replace('C','');if(t.includes('/')) return t.split('/').map(x=>parseInt(x));return [parseInt(t)];}
const slotY=document.getElementById('slotY'),slotR=document.getElementById('slotR'),sqCol=document.getElementById('sqCol'),sqDuz=document.getElementById('sqDuz');

function render(preview){
if(preview){
  if(history.length%2===0){
    slotY.className='slot yellow'; slotY.textContent=preview.num+' '+preview.alvo;
    slotR.className='slot'; slotR.textContent='...';
  }else{
    let h=history[history.length-1];
    slotY.className='slot yellow'; slotY.textContent=h.num+' '+h.alvo;
    let cr=getColReal(preview.num);
    let ca=getAlvos(h.alvo);
    slotR.className='slot '+(ca.includes(cr)?'green':'red'); slotR.textContent=preview.num;
  }
}else{
  if(history.length===0){
    slotY.className='slot'; slotY.textContent='VAZIO';
    slotR.className='slot'; slotR.textContent='VAZIO';
  }else{
    let lastY = history.length%2===1 ? history[history.length-1] : history[history.length-2];
    slotY.className='slot yellow'; slotY.textContent=lastY.num+' '+lastY.alvo;
    if(history.length>=2 && history.length%2===0){
      let lastR=history[history.length-1];
      let h=history[history.length-2];
      let cr=getColReal(lastR.num);
      let ca=getAlvos(h.alvo);
      slotR.className='slot '+(ca.includes(cr)?'green':'red'); slotR.textContent=lastR.num;
    }else{
      slotR.className='slot'; slotR.textContent='...';
    }
  }
}
sqCol.innerHTML=''; sqDuz.innerHTML='';
colSquares.forEach(s=>{let d=document.createElement('div');d.className='sq '+s.color;d.textContent=s.num;sqCol.appendChild(d);});
duzSquares.forEach(s=>{let d=document.createElement('div');d.className='sq '+s.color;d.textContent=s.num;sqDuz.appendChild(d);});
}

function addN(d){
if(cur.length>=2) return;
cur+=d;
let v=parseInt(cur);
if(cur==="0" || cur==="00"){render({num:cur,alvo:""});return;}
if(isNaN(v)) {cur=''; render(); return;}
if(v>36){cur=d; v=parseInt(cur);}
render({num:v,alvo:getAlvo(v)});
}

function enterN(){
if(cur==='' ) return;
if(cur==="0" || cur==="00"){history=[];colSquares=[];duzSquares=[];cur='';render();return;}
let v=parseInt(cur);
if(isNaN(v) || v<1 || v>36){cur='';render();return;}
let alvo=getAlvo(v);
if(history.length%2===0){
  history.push({num:v,alvo:alvo});
}else{
  history.push({num:v,alvo:""});
  let y=history[history.length-2];
  let cr=getColReal(v), ca=getAlvos(y.alvo);
  colSquares.push({num:v,color:ca.includes(cr)?'green':'red'});
  let dr=getDuzReal(v);
  duzSquares.push({num:v,color:ca.includes(dr)?'green':'red'});
  history.push({num:v,alvo:alvo});
}
cur='';render();
}

function corrige(){
if(cur!==''){cur=cur.slice(0,-1); if(cur===''){render();} else {let v=parseInt(cur); render({num:v,alvo:getAlvo(v)});} }
else if(history.length>0){
  let wasAuto=history.length%2===1;
  history.pop();
  if(wasAuto){if(colSquares.length>0){colSquares.pop(); duzSquares.pop();} if(history.length>0) history.pop();}
  render();
}
}
render();
</script>
</body>
</html>
