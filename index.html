<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RAFIGASP</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}html,body{height:100%;overflow:hidden}body{background:#000;display:flex;justify-content:center}.app{width:100%;max-width:400px;background:#000;height:100dvh;display:flex;flex-direction:column}.topo{height:42px;background:linear-gradient(180deg,#f7e8a5,#d4af37);display:flex;flex-direction:column;align-items:center;justify-content:center}.topo h1{font-size:20px;font-weight:900}.topo span{font-size:8px;letter-spacing:2px}.menu{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:3px;padding:4px}.menu button{height:30px;border-radius:6px;border:1px solid #d4af37;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:9px;font-weight:800}.barra-verm{background:linear-gradient(180deg,#ff3333,#991111);border:1px solid gold;text-align:center;color:#fff;font-weight:900;padding:4px;margin:0 4px;border-radius:6px;min-height:36px;font-size:18px;display:flex;align-items:center;justify-content:center}.hist{display:flex;gap:5px;padding:5px;overflow-x:auto;background:#111;min-height:40px}.chip{min-width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:1px solid gold;font-size:13px;flex-shrink:0}.chip.C{background:#00c800}.chip.E{background:#c80000}.chip.zero{background:#00aa00;border:2px solid gold}.card-verm{margin:4px;background:linear-gradient(180deg,#ff4444,#cc0000);border:1px solid #d4af37;border-radius:10px;padding:6px;text-align:center}.big{color:#ffff00;font-size:36px;font-weight:900}.placar{display:flex;justify-content:space-between;background:#000;border-radius:6px;padding:4px 10px;margin-top:4px}.verde{color:#00ff00;font-size:20px;font-weight:900}.verm{color:#ff3333;font-size:20px;font-weight:900}.hist-result{background:#000;border-radius:6px;padding:5px;display:flex;gap:5px;overflow-x:auto;min-height:40px;border:1px solid #333;flex-wrap:nowrap;margin-top:5px}.hr-quad{min-width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;border:1px solid #fff;flex-shrink:0}.hr-quad.C{background:#00c800}.hr-quad.E{background:#c80000}.hr-quad.zero{background:#00aa00}.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:6px;background:#1a1a0a;border-top:1px solid #d4af37}.b{border-radius:10px;border:1px solid #8a6a1a;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:22px;font-weight:900;min-height:48px}.pagina{display:none;flex:1;flex-direction:column;overflow-y:auto}.pagina.ativa{display:flex}.boasorte{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background-image:url('capa.jpg');background-size:cover;background-position:center top;padding:20px;padding-bottom:80px;position:relative;background-color:#000}.boasorte::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(0,0,0,0.1),rgba(0,0,0,0.5))}.btn-jogar{position:relative;z-index:2;width:90%;height:60px;background:linear-gradient(180deg,#f7e8a5,#d4af37);border:2px solid gold;border-radius:14px;font-size:22px;font-weight:900}.semaforo{margin:10px;background:#111;border:1px solid gold;border-radius:12px;padding:15px;text-align:center}.bola{width:80px;height:80px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:40px}.bola.verde{background:#00c800}.bola.amarelo{background:#ffcc00}.bola.vermelho{background:#ff0000}.status-text{font-size:22px;font-weight:900;color:#fff}.dica{font-size:13px;color:#ccc;margin-top:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat-box{background:#000;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}.stat-box b{font-size:10px;color:gold;display:block}.stat-box span{font-size:18px;font-weight:900;color:#fff}
</style></head><body><div class="app"><div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div><div class="menu"><button onclick="irPara(1)">INICIO</button><button onclick="irPara(2)">JOGO</button><button onclick="irPara(3)">GERAL</button><button onclick="irPara(4)" style="background:linear-gradient(180deg,#00ff00,#009900)">MOMENTO</button></div><div id="pag1" class="pagina ativa"><div class="boasorte"><button class="btn-jogar" onclick="irPara(2)">Começar a jogar</button></div></div><div id="pag2" class="pagina"><div class="barra-verm" id="barra">BOA SORTE</div><div class="hist" id="hist-top"></div><div class="card-verm"><div style="color:#fff;font-size:11px;font-weight:900">VEM COLUNA</div><div class="big" id="sinal">BOA SORTE</div><div class="placar"><div><b style="font-size:9px;color:gold">ACERTOU</b><div class="verde" id="ac">0</div></div><div><b style="font-size:9px;color:gold">ERROU</b><div class="verm" id="er">0</div></div></div><div class="hist-result" id="hist-result"></div></div><div class="teclado"><button class="b" onclick="dig(1)">1</button><button class="b" onclick="dig(2)">2</button><button class="b" onclick="dig(3)">3</button><button class="b" onclick="dig(4)">4</button><button class="b" onclick="dig(5)">5</button><button class="b" onclick="dig(6)">6</button><button class="b" onclick="dig(7)">7</button><button class="b" onclick="dig(8)">8</button><button class="b" onclick="dig(9)">9</button><button class="b" style="background:#006600;color:#fff;border:2px solid gold" onclick="dig(0)">0</button><button class="b" onclick="dig(0)">0</button><button class="b" style="font-size:14px" onclick="corrigir()">CORRIGIR</button><button class="b" style="font-size:13px" onclick="apagar()">APAGAR</button><button class="b" style="font-size:13px" onclick="enter()">ENTER</button><button class="b" style="font-size:13px;background:#222;color:#aaa;border:1px solid #444" onclick="limpar()">LIMPAR</button></div><div style="padding:5px;background:#000;color:#666;font-size:10px;text-align:center">Modo antigo - ZERO verde - Sem roleta dentro</div></div><div id="pag3" class="pagina"><h2 style="color:gold;text-align:center;font-size:13px;padding:8px">GERAL - HISTÓRICO COM ZERO</h2><div id="lista-geral" style="display:flex;gap:5px;flex-wrap:wrap;padding:8px"></div><button onclick="limparGeral()" style="margin:10px;height:36px;background:#333;color:#fff;border:1px solid gold;border-radius:8px">LIMPAR GERAL</button></div><div id="pag4" class="pagina"><h2 style="color:gold;text-align:center;font-size:15px;padding:10px">MOMENTO CERTO PARA JOGAR</h2><div class="semaforo"><div id="bola" class="bola amarelo">⏳</div><div id="status" class="status-text">ANALISANDO...</div><div id="dica" class="dica">Digite números no JOGO</div><div class="stats"><div class="stat-box"><b>ACERTO RECENTE (10)</b><span id="acc10">0%</span></div><div class="stat-box"><b>SEQUENCIA ATUAL</b><span id="seq">-</span></div><div class="stat-box"><b>COLUNA QUENTE</b><span id="colQuente">-</span></div><div class="stat-box"><b>ZERO / GATILHO</b><span id="gatilho">-</span></div></div></div><button onclick="atualizarMomento()" style="margin:12px;height:44px;background:linear-gradient(180deg,#f7e8a5,#d4af37);border-radius:10px;font-weight:900">🔄 ANALISAR AGORA</button></div></div><script>
const TABELA={1:"2/3",2:"1/2",3:"1/2",4:"1/2",5:"2/3",6:"1/2",7:"2/3",8:"1/2",9:"2/3",10:"2/3",11:"1/3",12:"2/3",13:"1/3",14:"2/3",15:"1/3",16:"1/3",17:"1/3",18:"2/3",19:"1/2",20:"1/2",21:"2/3",22:"1/2",23:"1/2",24:"2/3",25:"1/3",26:"2/3",27:"1/3",28:"2/3",29:"1/3",30:"2/3",31:"1/3",32:"1/2",33:"2/3",34:"1/2",35:"2/3",36:"1/2",0:"ZERO - NEUTRO"};
let buf="";let ac=0,er=0;let colunaAlvo="BOA SORTE";let geral=JSON.parse(localStorage.getItem('rafigasp_geral')||'[]');let historicoNumeros=[];let historicoDetalhes=[];
function getColunaReal(n){if(n==0)return 0;const c1=[1,4,7,10,13,16,19,22,25,28,31,34];const c2=[2,5,8,11,14,17,20,23,26,29,32,35];if(c1.includes(n))return 1;if(c2.includes(n))return 2;return 3;}
function irPara(n){document.querySelectorAll('.pagina').forEach(p=>p.classList.remove('ativa'));document.getElementById('pag'+n).classList.add('ativa');if(n==3)renderGeral();if(n==4)atualizarMomento();}
function recalcular(){ac=0;er=0;historicoDetalhes.forEach((it,i)=>{if(i==historicoDetalhes.length-1) return; if(it.num===0) return; if(it.acertou) ac++; else er++;});document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;}
function renderHist(){let h=document.getElementById('hist-top');h.innerHTML='';let hr=document.getElementById('hist-result');hr.innerHTML='';for(let i=historicoDetalhes.length-1;i>=0;i--){let it=historicoDetalhes[i];let cls='chip ';if(it.num===0)cls+='zero';else cls+=(i==historicoDetalhes.length-1?'C':(it.acertou?'C':'E'));let d=document.createElement('div');d.className=cls;d.textContent=it.num;h.prepend(d);let cls2='hr-quad ';if(it.num===0)cls2+='zero';else cls2+=(i==historicoDetalhes.length-1?'C':(it.acertou?'C':'E'));let q=document.createElement('div');q.className=cls2;q.textContent=it.num;hr.prepend(q);}}
function atualizaSinal(){if(historicoNumeros.length>0 && historicoNumeros[0]!==0){colunaAlvo=TABELA[historicoNumeros[0]]||"BOA SORTE";}else if(historicoNumeros[0]===0){colunaAlvo="ZERO";}else{colunaAlvo="BOA SORTE";}let sinalEl=document.getElementById('sinal');if(colunaAlvo==="ZERO"){sinalEl.innerText="ZERO - NEUTRO";sinalEl.style.color="#00ff00";}else{sinalEl.innerText=colunaAlvo;sinalEl.style.color="#ffff00";}document.getElementById('barra').innerText=colunaAlvo=="BOA SORTE"?"BOA SORTE":colunaAlvo=="ZERO"?"ZERO - AGUARDE":"VEM COLUNA "+colunaAlvo;}
function atualizaBarra(){let el=document.getElementById('barra');if(buf.length>0){let num=parseInt(buf);if(!isNaN(num) && TABELA[num]!==undefined){el.innerHTML=num+" > "+TABELA[num];}else el.innerHTML=buf;el.style.background="#ffff00";el.style.color="#000";el.style.fontSize="22px";}else{let txt=colunaAlvo=="BOA SORTE"?"BOA SORTE":colunaAlvo=="ZERO"?"ZERO - AGUARDE":"VEM COLUNA "+colunaAlvo;el.innerHTML=txt;el.style.background="linear-gradient(180deg,#ff3333,#991111)";el.style.color="#fff";el.style.fontSize="18px";}}
function dig(n){if(buf.length<2)buf+=n;atualizaBarra();}
function apagar(){buf="";atualizaBarra();}
function limpar(){document.getElementById('hist-top').innerHTML='';document.getElementById('hist-result').innerHTML='';ac=0;er=0;historicoNumeros=[];historicoDetalhes=[];buf="";document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;colunaAlvo="BOA SORTE";atualizaSinal();atualizaBarra();}
function limparGeral(){geral=[];localStorage.setItem('rafigasp_geral',JSON.stringify(geral));renderGeral();}
function renderGeral(){let div=document.getElementById('lista-geral');div.innerHTML='';geral.forEach(item=>{let cls='hr-quad ';if(item.num===0)cls+='zero';else cls+=(item.acertou?'C':'E');let q=document.createElement('div');q.className=cls;q.textContent=item.num;div.appendChild(q);});}
function corrigir(){if(buf.length>0){buf=buf.slice(0,-1);atualizaBarra();return;}if(historicoDetalhes.length>0){historicoDetalhes.shift();historicoNumeros.shift();geral.shift();localStorage.setItem('rafigasp_geral',JSON.stringify(geral));renderHist();recalcular();atualizaSinal();atualizaBarra();atualizarMomento();}}
function enter(){if(buf==="")return;let num=parseInt(buf);if(isNaN(num)||num<0||num>36){buf="";atualizaBarra();return;}let colReal=getColunaReal(num);let acertou=false;let isZero=num===0;if(!isZero && historicoNumeros.length>0 && colunaAlvo!=="ZERO" && colunaAlvo!=="BOA SORTE"){let alvoAnterior=colunaAlvo.split('/').map(Number);if(!isNaN(alvoAnterior[0]))acertou=alvoAnterior.includes(colReal);}historicoNumeros.unshift(num);historicoDetalhes.unshift({num:num,acertou:acertou,col:colReal});geral.unshift({num:num,acertou:acertou});localStorage.setItem('rafigasp_geral',JSON.stringify(geral));renderHist();if(historicoDetalhes.length>1 && !isZero){if(acertou)ac++;else er++;}document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;buf="";atualizaSinal();atualizaBarra();atualizarMomento();}
function atualizarMomento(){let bola=document.getElementById('bola');let status=document.getElementById('status');let dica=document.getElementById('dica');let acc10El=document.getElementById('acc10');let seqEl=document.getElementById('seq');let colEl=document.getElementById('colQuente');let gatEl=document.getElementById('gatilho');if(historicoDetalhes.length<3){bola.className='bola amarelo';bola.innerText='⏳';status.innerText='AGUARDE';dica.innerText='Digite pelo menos 5 números no JOGO';acc10El.innerText='-';seqEl.innerText='-';colEl.innerText='-';gatEl.innerText='Coletando';return;}let filtrados=historicoDetalhes.filter(it=>it.num!==0);let ultimos=filtrados.slice(0,10);let acertos10=ultimos.filter((it,i)=>i!==ultimos.length-1 && it.acertou).length;let total10=Math.min(9,ultimos.length-1);let taxa=total10>0?Math.round((acertos10/total10)*100):0;acc10El.innerText=taxa+'%';let streak=0;let lastAcerto=null;for(let it of filtrados){if(lastAcerto===null){lastAcerto=it.acertou;streak=1;}else if(it.acertou===lastAcerto)streak++;else break;}let seqTxt=lastAcerto?'✅ '+streak+' acertos':'❌ '+streak+' erros';seqEl.innerText=seqTxt;let contCol={1:0,2:0,3:0};filtrados.slice(0,15).forEach(it=>{if(it.col)contCol[it.col]++;});let colQuente=Object.keys(contCol).reduce((a,b)=>contCol[a]>contCol[b]?a:b,1);colEl.innerText='Coluna '+colQuente;let zeros=historicoDetalhes.filter(it=>it.num===0).length;let gatilho=zeros>0?'ZERO x'+zeros:(streak>=2 && !lastAcerto?'2 erros!':(taxa>=70?'Alta':'Normal'));gatEl.innerText=gatilho;let cor='amarelo',tipo='🟡',msg='AGUARDE';if(!lastAcerto && streak>=2){cor='vermelho';tipo='🔴';msg='NÃO JOGUE';}else if(taxa>=65){cor='verde';tipo='🟢';msg='MOMENTO BOM - JOGUE';}else if(taxa<=40){cor='vermelho';tipo='🔴';msg='MERCADO RUIM';}bola.className='bola '+cor;bola.innerText=tipo;status.innerText=msg;}
atualizaSinal();atualizaBarra();renderGeral();
</script></body></html>
