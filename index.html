<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0d2818;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:3px solid #d4af37;display:flex;flex-direction:column}
.topo{background:#d4af37;padding:5px;text-align:center;color:#000;font-weight:900;font-size:13px}
.top3{display:grid;grid-template-columns:1fr 1fr 125px;gap:5px;padding:4px;background:#0a2a1a;border:1px solid #d4af37;border-radius:8px;margin:3px}
.s{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;background:#d4af37;color:#000;border:1px solid #000}
.s.d{border:2px dashed #d4af37;color:#d4af37;background:#0a2a1a}
.corBox{display:flex;gap:4px;align-items:center;min-height:36px}
.cb{width:44px;height:30px;border-radius:8px;flex-shrink:0;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}
.cb.b{background:#1e40af;border-color:#60a5fa}.cb.g{background:#16a34a;border-color:#86efac}.cb.r{background:#dc2626;border-color:#fca5a5}
.hist{margin:0 3px;background:#0a1f14;border:1px solid #1e4d2b;border-radius:6px;padding:4px;display:flex;gap:4px;align-items:center;min-height:40px;overflow:hidden}
.hist2{margin:3px;background:#0a1f14;border:1px solid #d4af37;border-radius:6px;padding:4px;display:flex;gap:4px;align-items:center;min-height:40px;overflow:hidden}
.histT{font-size:9px;color:#4ade80;font-weight:900;min-width:30px}
.lg{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.lg::-webkit-scrollbar{display:none}
.ln{min-width:38px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;border:2px solid #000;color:#fff}
.ln.g{background:#16a34a;border-color:#86efac}.ln.r{background:#dc2626;border-color:#fca5a5}.ln.b{background:#1e3a8a;border-color:#60a5fa}
.kb{flex:1;display:flex;flex-direction:column;gap:3px;padding:4px;min-height:0}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;min-height:0}
.k{width:100%;height:100%;border-radius:12px;border:none;font-weight:900;font-size:22px;background:linear-gradient(#e8c86a,#b8941f);color:#3a2a0a}
.k:active{transform:scale(0.96)}.k.z{background:#ef4444;color:#fff}.k.zz{background:#991b1b;color:#fff;font-size:14px}
</style>
</head>
<body>
<div class="app">
<div class="topo">RAFIGASP COACH DA ROLETA</div>
<div class="top3" style="border:2px solid #3b82f6"><div class="s d" id="syA">VAZIO</div><div class="s d" id="srA">VAZIO</div><div class="corBox" id="crA"></div></div>
<div class="hist" style="border-color:#3b82f6"><div class="histT">A HIST:</div><div class="lg" id="lgA"></div></div>
<div class="top3" style="border:2px solid #ef4444"><div class="s d" id="syB">VAZIO</div><div class="s d" id="srB">VAZIO</div><div class="corBox" id="crB"></div></div>
<div class="hist2" style="border-color:#ef4444"><div class="histT" style="color:#fca5a5">B HIST:</div><div class="lg" id="lgB"></div></div>
<div class="top3" style="border:2px solid #22c55e"><div class="s d" id="syC">VAZIO</div><div class="s d" id="srC">VAZIO</div><div class="corBox" id="crC"></div></div>
<div class="hist2" style="border-color:#22c55e"><div class="histT" style="color:#86efac">C HIST:</div><div class="lg" id="lgC"></div></div>
<div class="kb">
<div class="kr"><button class="k" onclick="A('1')">1</button><button class="k" onclick="A('2')">2</button><button class="k" onclick="A('3')">3</button></div>
<div class="kr"><button class="k" onclick="A('4')">4</button><button class="k" onclick="A('5')">5</button><button class="k" onclick="A('6')">6</button></div>
<div class="kr"><button class="k" onclick="A('7')">7</button><button class="k" onclick="A('8')">8</button><button class="k" onclick="A('9')">9</button></div>
<div class="kr"><button class="k" onclick="E()" style="font-size:11px">ENTER</button><button class="k z" onclick="Z()">0</button><button class="k zz" onclick="ZZ()">00</button></div>
</div>
</div>
<script>
var cur='',logA=[],logB=[],logC=[],lastA=null,lastB=null,lastC=null;
var tb={1:"C2/3",2:"C1/2",3:"C1/2",4:"C1/2",5:"C2/3",6:"C1/2",7:"C2/3",8:"C1/2",9:"C2/3",10:"C2/3",11:"C1/3",12:"C2/3",13:"C1/3",14:"C2/3",15:"C1/3",16:"C1/3",17:"C1/3",18:"C2/3",19:"C1/2",20:"C1/2",21:"C2/3",22:"C1/2",23:"C1/2",24:"C2/3",25:"C1/3",26:"C2/3",27:"C1/3",28:"C2/3",29:"C1/3",30:"C2/3",31:"C1/3",32:"C1/2",33:"C2/3",34:"C1/2",35:"C2/3",36:"C1/2"};
var histA={},histB={},histC={};
function gv(n){return tb[n]||""}
function gc(n){if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0)return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0)return 2;return 3}
function ga(a){var t=a.replace('C','');return t.split('/').map(function(x){return +x})}
function norm(n){if(n>100){var dez=parseInt((''+n).slice(-2)); if(dez===0) dez=100; var g=Math.ceil(dez/4); if(g>36) g=((g-1)%36)+1; return g;} return n;}
function R(p){
var show=p||lastC||lastB||lastA;
if(show){
var col=show.a||gv(show.raw||show.n);
var label=(show.raw||show.n)+' '+col;
['syA','srA','syB','srB','syC','srC'].forEach(function(id){var isY=id.startsWith('sy'); document.getElementById(id).textContent=isY?label:col; document.getElementById(id).className='s';});
}else{
['syA','srA','syB','srB','syC','srC'].forEach(function(id){document.getElementById(id).textContent='VAZIO';document.getElementById(id).className='s d';});
}
function renderTop(hist, elId, max){
var el=document.getElementById(elId); el.innerHTML='';
if(!show) return;
var arr=hist[show.n];
if(!arr || arr.length===0) return;
for(var i=0;i<Math.min(max,arr.length);i++){var d=document.createElement('div');d.className='cb '+(arr[i].w?'g':'r');d.textContent=arr[i].raw;el.appendChild(d);}
}
renderTop(histA,'crA',1); renderTop(histB,'crB',1); renderTop(histC,'crC',2);
var lgA=document.getElementById('lgA');lgA.innerHTML=''; for(var j=logA.length-1;j>=0;j--){var l=logA[j]; var d=document.createElement('div');d.className='ln '+(l.w===null?'b':l.w?'g':'r');d.textContent=l.raw;lgA.appendChild(d);}
var lgB=document.getElementById('lgB');lgB.innerHTML=''; for(var j=logB.length-1;j>=0;j--){var l=logB[j]; var d=document.createElement('div');d.className='ln '+(l.w===null?'b':l.w?'g':'r');d.textContent=l.raw;lgB.appendChild(d);}
var lgC=document.getElementById('lgC');lgC.innerHTML=''; for(var j=logC.length-1;j>=0;j--){var l=logC[j]; var d=document.createElement('div');d.className='ln '+(l.w===null?'b':l.w?'g':'r');d.textContent=l.raw;lgC.appendChild(d);}
}
function A(d){if(cur.length>=4)return;cur+=d;var v=parseInt(cur); R({n:norm(v),raw:cur,a:gv(v)})}
function E(){
if(cur==='')return;
var raw=cur; var v=parseInt(cur); var n=norm(v); var col=gv(v);
// A = CORRIGIDO: SÓ PRIMEIRO AZUL, RESTO TUDO VERDE/VERMELHO
if(logA.length===0){logA.push({n:n,raw:raw,w:null}); lastA={n:n,raw:raw,a:col};}
else{
var cwA=lastA?ga(lastA.a).indexOf(gc(v))>=0:false;
if(!histA[lastA.n]) histA[lastA.n]=[];
histA[lastA.n].unshift({n:n,raw:raw,w:cwA});
logA.push({n:n,raw:raw,w:cwA});
}
// B = 🟦⬜️🟦⬜️
if(logB.length%2===0){logB.push({n:n,raw:raw,w:null}); lastB={n:n,raw:raw,a:col};}
else{var cwB=lastB?ga(lastB.a).indexOf(gc(v))>=0:false; if(lastB){if(!histB[lastB.n]) histB[lastB.n]=[]; histB[lastB.n].unshift({n:n,raw:raw,w:cwB});} logB.push({n:n,raw:raw,w:cwB});}
// C = 🟦⬜️⬜️🟦⬜️⬜️
if(logC.length%3===0){logC.push({n:n,raw:raw,w:null}); lastC={n:n,raw:raw,a:col};}
else{
var cwC=lastC?ga(lastC.a).indexOf(gc(v))>=0:false;
if(lastC){if(!histC[lastC.n]) histC[lastC.n]=[]; histC[lastC.n].unshift({n:n,raw:raw,w:cwC});}
logC.push({n:n,raw:raw,w:cwC});
}
cur='';R();
}
function Z(){
if(cur!==''){cur=cur.slice(0,-1); if(cur==='')R(); else R({n:norm(parseInt(cur)),raw:cur,a:gv(parseInt(cur))}); return;}
if(logA.length>0){var r=logA.pop(); if(r.w!==null && lastA && histA[lastA.n]) histA[lastA.n].shift(); if(logA.length===0) lastA=null;}
if(logB.length>0){var r=logB.pop(); if(r.w!==null){var prev=null; for(var i=logB.length-1;i>=0;i--){if(logB[i].w===null){prev=logB[i];break;}} if(prev&&histB[prev.n]) histB[prev.n].shift();}}
if(logC.length>0){var r=logC.pop(); if(r.w!==null){var prev=null; for(var i=logC.length-1;i>=0;i--){if(logC[i].w===null){prev=logC[i];break;}} if(prev&&histC[prev.n]) histC[prev.n].shift();} else {lastC=null;}}
if(logA.length===0) lastA=null; if(logB.length===0) lastB=null; if(logC.length===0) lastC=null;
R();
}
function ZZ(){logA=[];logB=[];logC=[];lastA=null;lastB=null;lastC=null;histA={};histB={};histC={};cur='';R();}
R();
</script>
</body>
</html>
