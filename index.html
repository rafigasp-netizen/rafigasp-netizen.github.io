<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RAFIGASP</title><link rel="manifest" href="manifest.json"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial}body{background:#000;height:100dvh;display:flex;flex-direction:column}.topo{background:linear-gradient(#ffe66a,#ffcc00);text-align:center;padding:8px}.topo b{font-size:30px}.topo span{font-size:10px;letter-spacing:3px;font-family:Arial}.meio{flex:1;display:flex;gap:4px;padding:4px;overflow:hidden}.esq{width:90px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}.par{display:flex;gap:2px;border:1.5px solid #ffcc00;border-radius:6px;padding:2px;background:#111}.q{flex:1;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}.C{background:#00a000}.E{background:#c00000}.dir{flex:1;background:#0a4d0a;border:2px solid #fff;border-radius:6px;padding:4px;display:flex;flex-direction:column}.mesa-wrap{display:flex;flex:1;gap:1px}.zero{width:32px;background:#0a4d0a;border:1px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}.numeros{flex:1;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,1fr);gap:1px}.numeros div{border:1px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900}.verm{background:#a00}.pret{background:#222}.cols{width:22px;display:grid;grid-template-rows:repeat(3,1fr);gap:1px}.cols div{background:#0a4d0a;border:1px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;writing-mode:vertical-rl}.duzias,.fora{display:grid;gap:1px;margin-top:2px}.duzias{grid-template-columns:repeat(3,1fr)}.fora{grid-template-columns:repeat(6,1fr)}.duzias div,.fora div{border:1px solid #fff;background:#0a4d0a;color:#fff;text-align:center;padding:4px 0;font-size:9px;font-weight:900}.ativo{outline:3px solid #ffcc00!important;background:#ffcc00!important;color:#000!important;animation:pisca .4s infinite alternate}.barra{background:#ffcc00;margin:4px;border-radius:8px;padding:10px;display:flex;justify-content:space-between;font-weight:900;font-size:13px}.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}.teclado button{padding:15px;border:0;border-radius:8px;font-size:20px;font-weight:900;background:linear-gradient(#ffe88a,#c89a00)}</style></head><body><div class="topo"><b>RAFIGASP</b><span>COACH DA ROLETA</span></div><div class="meio"><div class="esq" id="lista"></div><div class="dir"><div class="mesa-wrap"><div class="zero">0</div><div class="numeros" id="nums"></div><div class="cols"><div>2to1</div><div>2to1</div><div>2to1</div></div></div><div class="duzias"><div>1st12</div><div>2nd12</div><div>3rd12</div></div><div class="fora"><div>1to18</div><div>EVEN</div><div>♦</div><div>♦</div><div>ODD</div><div>19to36</div></div></div></div><div class="barra"><span id="left">-</span><span id="placar">ACERTO 0 X 0 ERRO</span></div><div class="teclado"><button onclick="d(1)">1</button><button onclick="d(2)">2</button><button onclick="d(3)">3</button><button onclick="d(4)">4</button><button onclick="d(5)">5</button><button onclick="d(6)">6</button><button onclick="d(7)">7</button><button onclick="d(8)">8</button><button onclick="d(9)">9</button><button onclick="go()">ENTER</button><button onclick="d(0)">0</button><button onclick="corr()">CORRIGIR</button></div><script>
const R=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};const TAB={0:"ZERO",1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2"};
let order=[3,6,9,12,15,18,21,24,27,30,33,36,2,5,8,11,14,17,20,23,26,29,32,35,1,4,7,10,13,16,19,22,25,28,31,34];let c=document.getElementById('nums');let ht="";order.forEach((n,i)=>{let idx=i%12;let row=Math.floor(i/12);let col=R.includes(n)?"verm":"pret";ht+=`<div id="c${n}" class="${col}" style="grid-column:${idx+1};grid-row:${row+1}">${n}</div>`});c.innerHTML=ht;
let buf="",geral=JSON.parse(localStorage.getItem('g')||'[]');
function marca(n){document.querySelectorAll('.ativo').forEach(e=>e.classList.remove('ativo'));let el=document.getElementById('c'+n);if(el){el.classList.add('ativo');}}
function render(){let l=document.getElementById('lista');l.innerHTML="";let a=0,e=0;geral.forEach(it=>it.ok?a++:e++);document.getElementById('placar').innerText=`ACERTO ${a} X ${e} ERRO`;[...geral].reverse().forEach((it,idx)=>{let prev=geral[geral.length-2-idx];let div=document.createElement('div');div.className='par';let q1=document.createElement('div');q1.className='q '+(prev?prev.ok?'C':'E':'C');q1.textContent=prev?prev.num:it.num;let q2=document.createElement('div');q2.className='q '+(it.ok?'C':'E');q2.textContent=it.num;div.appendChild(q1);div.appendChild(q2);l.appendChild(div);if(idx>18)return;});}
render();if(geral.length){document.getElementById('left').innerText=geral[0].num+"> "+TAB[geral[0].num];marca(geral[0].num);}
function d(n){if(buf.length<2)buf+=String(n);if(parseInt(buf)>36)buf=buf.slice(0,-1);document.getElementById('left').innerText=buf|| (geral.length?geral[0].num+"> "+TAB[geral[0].num]:"-");if(buf)marca(parseInt(buf));}
function corr(){if(buf){buf=buf.slice(0,-1);document.getElementById('left').innerText=buf||"-";return;}geral.shift();localStorage.setItem('g',JSON.stringify(geral));render();}
function go(){if(!buf)return;let num=parseInt(buf);buf="";let ok=true;if(geral.length){let alvo=TAB[geral[0].num].split('/').map(Number);ok=alvo.includes(COL[num]);}geral.unshift({num:num,ok:ok});localStorage.setItem('g',JSON.stringify(geral));document.getElementById('left').innerText=num+"> "+TAB[num];render();marca(num);}
</script></body></html>
