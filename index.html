function calcula(n1,n4){if(n1!==0 && !n1 || n4!==0 && !n4) return null;let c1=COL[n1],c4=COL[n4];if(c1===0||c4===0) return null;if(!c1||!c4) return null;if(c1===c4)return {n1:n1,n4:n4,c1:c1,c4:c4,jogar:[1,2,3].filter(c=>c!==c1)};else return {n1:n1,n4:n4,c1:c1,c4:c4,jogar:[c1,c4].sort((a,b)=>a-b)}}

  resumo.innerHTML='<div style="flex:1;background:#000;border:2px solid #ffcc00;border-radius:10px;padding:8px;text-align:center"><b style="color:#ffcc00">A</b><br>✅ '+acertoA+' ❌ '+erroA+'<br>'+percA+'%</div><div style="flex:1;background:#000;border:2px solid #00ffff;border-radius:10px;padding:8px;text-align:center"><b style="color:#00ffff">B</b><br>✅ '+acertoB+' ❌ '+erroB+'<br>'+percB+'%</div><div style="flex:1;background:#000;border:2px solid #00ff00;border-radius:10px;padding:8px;text-align:center"><b style="color:#00ff00">TOTAL</b><br>✅ '+(acertoA+acertoB)+' ❌ '+(erroA+erroB)+'<br>'+percG+'%</div>';
  seqHist.innerHTML=''; textoTrios.innerHTML='';

  else{
    let cron=[...histGeralCron].reverse(); let grupos=[]; for(let i=0;i<cron.length;i+=3) grupos.push(cron.slice(i,i+3)); let disp=[...grupos].reverse(); let str='';
    disp.forEach(g=>{

function getColStats(){
 let total=histGeralCron.filter(h=>h.num!==0).length;
 let c1=0,c2=0,c3=0;
 histGeralCron.forEach(h=>{let col=COL[h.num]; if(col===1)c1++; else if(col===2)c2++; else if(col===3)c3++;});
 let p1=total>0?Math.round(c1/total*100):0; let p2=total>0?Math.round(c2/total*100):0; let p3=total>0?Math.round(c3/total*100):0;

}
