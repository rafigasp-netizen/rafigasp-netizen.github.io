<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d2818;display:flex;justify-content:center;font-family:Arial}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:2px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:8px;text-align:center}
.topo h1{color:#000;font-size:18px;font-weight:900}
.topo span{font-size:11px;color:#4a3410;font-weight:800;display:block}
.history{background:#123524;padding:8px}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.hslot{height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.hslot.empty{border:1.5px dashed #d4af37;opacity:.3}
.hslot.yellow{background:#d4af37!important;color:#000!important}
.hslot.green{background:#16a34a!important;color:#fff!important}
.hslot.red{background:#dc2626!important;color:#fff!important}
.hslot.preview{opacity:.6;outline:2px solid #fff}
.spacer{flex:1}
.bottom{padding:8px;display:flex;flex-direction:column;gap:10px}
.blue-box{border:3px solid #3b82f6;border-radius:14px;min-height:130px;background:#0a2a1a;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.blue-card{background:#123524;border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:5px;font-weight:900;font-size:13px;color:#d4af37}
.blue-card .num{color:#fff;font-size:13px}
.blue-card .b{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.b.green{background:#16a34a}.b.red{background:#dc2626}.b.yellow{background:#d4af37;color:#000}
.b.empty{border:1px dashed #3b82f6;opacity:.3;background:transparent}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{height:58px;border-radius:12px;border:none;font-weight:900;font-size:22px}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:13px}
.typing{position:fixed;bottom:210px;left:50%;transform:translateX(-50%);background:#d4af37;color:#000;padding:8px 18px;border-radius:20px;font-weight:900;font-size:18px;display:none;z-index:10;box-shadow:0 4px 12px #000}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div>
<div class="history"><div class="hist-grid" id="grid"></div></div>
<div class="spacer"></div>
<div class="typing" id="typing"></div>
<div class="bottom">
<div class="blue-box" id="blueBox"></div>
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
</div>
<script>
let history=[],cur='';
const grid=document.getElementById('grid');
const blueBox=document.getElementById('blueBox');
const typing=document.getElementById('typing');
const gC23=[6,9,11,14,16,17,19,21,26,29,33,36];
const gC13=[2,3,5,8,10,13,20,25,28,31,32,35];
const gC12=[1,4,7,12,15,18,22,23,24,27,30,34];
function getAlvo(n){
if(gC23.includes(n))return "C2/3";
if(gC13.includes(n))return "C1/3";
if(gC12.includes(n))return "C1/2";
return "";
}
function getColunaReal(n){
if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;
if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;
if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;
return 0;
}
function getColunasDoAlvo(alvo){
if(alvo=="C1/3")return [1,3];
if(alvo=="C2/3")return [2,3];
if(alvo=="C1/2")return [1,2];
return [];
}
function render(preview=null){
grid.innerHTML='';
for(let i=0;i<12;i++){
let d=document.createElement('div');
if(preview && i==history.length){
let v=preview.num;
if(i<4){d.className='hslot yellow preview'; d.textContent=`${v} ${preview.alvo}`;}
else{
let col=i%4; let alvoTopo=history[col]?.alvo;
let colReal=getColunaReal(v);
let colsAlvo=getColunasDoAlvo(alvoTopo);
d.textContent=`${v}`;
d.className=`hslot ${colsAlvo.includes(colReal)?'green':'red'} preview`;
}
grid.appendChild(d); continue;
}
if(i<history.length){
let h=history[i];
if(i<4){d.className='hslot yellow'; d.textContent=`${h.num} ${h.alvo}`;}
else{
let col=i%4; let alvoTopo=history[col]?.alvo;
let colReal=getColunaReal(h.num);
let colsAlvo=getColunasDoAlvo(alvoTopo);
d.textContent=`${h.num}`;
d.className='hslot '+(colsAlvo.includes(colReal)?'green':'red');
}
}else{d.className='hslot empty';}
grid.appendChild(d);
}
// BLUE BOX GRANDE
blueBox.innerHTML='';
for(let col=0;col<4;col++){
let card=document.createElement('div');
card.className='blue-card';
let header=history[col];
if(!header){
card.innerHTML=`<span style="opacity:.3">- C1/2</span>`;
}else{
let res1=history[col+4];
let res2=history[col+8];
let html=`<span>${header.num} ${header.alvo}</span>`;
function boxFor(h){
if(!h) return `<div class="b empty"></div>`;
let alvoTopo=header.alvo;
let colReal=getColunaReal(h.num);
let colsAlvo=getColunasDoAlvo(alvoTopo);
let color=colsAlvo.includes(colReal)?'green':'red';
return `<div class="b ${color}">${h.num}</div>`;
}
html+=boxFor(res1)+boxFor(res2);
// preview no azul tbm
if(preview && history.length>=4 && col==history.length%4 && history.length>=4){
let colReal=getColunaReal(preview.num);
let colsAlvo=getColunasDoAlvo(header.alvo);
let color=colsAlvo.includes(colReal)?'green':'red';
html+=`<div class="b ${color}" style="opacity:.6">${preview.num}</div>`;
}
card.innerHTML=html;
}
blueBox.appendChild(card);
}
}
function addN(n){
if(cur=='00')cur='';
if(cur.length==0 && n==0){cur='0';}
else if(cur.length==1 && cur=='0' && n==0){cur='00'; typing.style.display='block'; typing.textContent='00 = ZERAR'; render(); return;}
else if(cur.length>=2){return;}
else{cur+=n;}
let v=parseInt(cur);
if(isNaN(v)){render(); return;}
if(cur=='0'){render(); return;}
let alvo=getAlvo(v);
typing.style.display='block';
if(cur=='00'){typing.textContent='00 = ZERAR TUDO';}
else{typing.textContent=`Digitando: ${v} ${alvo}`;}
render({num:v, alvo:alvo});
}
function enterN(){
typing.style.display='none';
if(cur=='')return;
if(cur=='00'){history=[];cur='';render();return;}
let v=parseInt(cur);if(v>36){cur='';render();return;}
if(v==0){history=[];cur='';render();return}
let alvo=getAlvo(v);
history.push({num:v, alvo:alvo});
cur='';render();
if(history.length>=12){setTimeout(()=>{history=[];render();}, 1200);}
}
function corrige(){
if(cur!=''){cur=cur.slice(0,-1); if(cur==''){typing.style.display='none';} else {addN(''); cur=cur.slice(0,-1); addN(cur.slice(-1)); return;} render();}
else if(history.length>0){history.pop();render();}
}
render();
</script>
</body>
</html>
