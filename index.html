<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RAFIGASP</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black}html,body{height:100%;background:#000}body{display:flex;justify-content:center;align-items:flex-start}#app{width:100vw;max-width:100%;height:100dvh;background:#0a2e1e;display:flex;flex-direction:column;gap:3px;padding-bottom:5px}.topo{background:#ffcc00;text-align:center;padding:14px 6px;font-size:17px;cursor:pointer;border-radius:0 0 10px 10px;display:flex;align-items:center;justify-content:center;min-height:48px}.verde{margin:2px 3px;background:#0a5a2e;border-radius:8px;padding:6px;min-height:62px;display:none;overflow-x:auto}.verde.ativa{display:flex}.historico{display:flex;gap:5px}.coluna{display:flex;flex-direction:column;gap:4px}.hist{width:38px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;border:2px solid #fff}.C{background:#00c000}.E{background:#c00000}.boxHist{background:#0a3d1f;border-radius:8px;margin:2px 3px;padding:6px;display:none}.boxHist.ativa{display:block}.linhaH{background:#001a1a;border-radius:6px;padding:6px;margin-bottom:4px}.linhaH h3{color:#ffcc00;font-size:11px}.faixa{display:flex;gap:3px;min-height:26px;flex-wrap:wrap}.q{width:26px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;border:1px solid #fff}.q.C{background:#00a000}.q.E{background:#c00000}.vermelho{margin:2px 3px;background:#0a3d1f;border-radius:8px;padding:4px;display:none;flex:1}.vermelho.ativa{display:flex;flex-direction:column}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;flex:1}.cell{border:1.5px solid #d4af37;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;min-height:38px;position:relative}.cell.red{background:#b50000}.cell.black{background:#111}.badgeG{position:absolute;top:-6px;right:-4px;background:#000;color:#ffcc00;font-size:10px;padding:1px 5px;border-radius:10px;border:1px solid #ffcc00}.doisparaum{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:4px}.doisparaum div{background:#0a5a2e;border:1px solid #d4af37;color:#d4d46a;text-align:center;padding:6px 0;font-size:14px;font-weight:900;border-radius:4px}.azulBox{display:flex;gap:3px;margin:2px 3px}.azul{flex:1;background:#001a8a;border-radius:6px;padding:6px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:10px;font-weight:900}.azul span{color:#ffcc00}.azul.alerta{background:#cc0000!important}.btns{display:flex;gap:3px;padding:4px 3px}.btns button{flex:1;padding:10px;border:0;border-radius:6px;font-weight:900;font-size:13px;background:#ffcc00}</style></head><body><div id="app">
<div class="topo" onclick="mudaModo()"><b id="tituloTopo">RAFIGASP GERAL</b></div>
<div class="verde" id="verdeInicial"><div class="historico" id="listaInicial"></div></div>
<div class="boxHist" id="boxH"></div>
<div class="vermelho" id="vermelho"><div class="grid" id="grid"></div><div class="doisparaum"><div>1</div><div>2</div><div>3</div></div></div>
<div class="azulBox"><div class="azul" id="azulA"><div id="leftA">A: -</div><div id="placarA">0 X 0</div></div><div class="azul" id="azulB"><div id="leftB">B: -</div><div id="placarB">0 X 0</div></div></div>
<div class="btns"><button onclick="corr()">CORRIGIR</button><button onclick="if(confirm('Zerar?')){localStorage.clear();location.reload()}">LIMPAR</button></div>
</div><script>
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};
const TAB={0:"ZERO",1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2"};
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const NOMES=["RAFIGASP GERAL","RAFIGASP 123 GERAL (A+B)","RAFIGASP 123 A","RAFIGASP 123 B"];const MODOS=["GERAL","123_GERAL","123_A","123_B"];
let modoIdx=parseInt(localStorage.getItem('modoIdx')||'0');if(modoIdx>=4)modoIdx=0;let modo=MODOS[modoIdx];
let countsA=JSON.parse(localStorage.getItem('cntA')||'{}');let countsB=JSON.parse(localStorage.getItem('cntB')||'{}');
let histA=JSON.parse(localStorage.getItem('histA')||'[]');let histB=JSON.parse(localStorage.getItem('histB')||'[]');
let hist123A=JSON.parse(localStorage.getItem('hist123A')||'[]');let hist123B=JSON.parse(localStorage.getItem('hist123B')||'[]');
let ultimo123A=localStorage.getItem('ultimo123A')?parseInt(localStorage.getItem('ultimo123A')):null;let ultimo123B=localStorage.getItem('ultimo123B')?parseInt(localStorage.getItem('ultimo123B')):null;
let acertoA=parseInt(localStorage.getItem('placarAcertoA')||'0'),erroA=parseInt(localStorage.getItem('placarErroA')||'0');let acertoB=parseInt(localStorage.getItem('placarAcertoB')||'0'),erroB=parseInt(localStorage.getItem('placarErroB')||'0');
let acerto123A=parseInt(localStorage.getItem('acerto123A')||'0'),erro123A=parseInt(localStorage.getItem('erro123A')||'0');let acerto123B=parseInt(localStorage.getItem('acerto123B')||'0'),erro123B=parseInt(localStorage.getItem('erro123B')||'0');
let gridEl=document.getElementById('grid');for(let i=1;i<=36;i++){let d=document.createElement('div');d.className='cell '+(REDS.includes(i)?'red':'black');d.id='c'+i;d.onclick=()=>pick(i);d.innerHTML='<span>'+i+'</span><span class="badgeG" id="cnt'+i+'"></span>';gridEl.appendChild(d);}
function atualiza(){for(let i=0;i<=36;i++){let ca=countsA[i]||0,cb=countsB[i]||0;let el=document.getElementById('cnt'+i);let b=document.getElementById('c'+i);if(b){if(modo.startsWith('123')){b.className='cell '+(REDS.includes(i)?'red':'black');if(el)el.textContent='';}else{let tot=ca+cb;if(el)el.textContent=tot>0?tot+'x':'';let cls='cell '+(REDS.includes(i)?'red':'black');if(ca>0&&cb>0)cls='cell marcadoAB';else if(ca>0)cls='cell marcadoA';else if(cb>0)cls='cell marcadoB';b.className=cls;}}}}
function calcAlerta(arr){if(arr.length<2)return false;for(let i=0;i<arr.length-1;i++){let c=arr[i],n=arr[i+1];if(c&&n&&!c.ok&&!n.ok){let tem=false;for(let j=0;j<i;j++){if(arr[j]&&arr[j].ok)tem=true;}if(!tem)return true;}}return false;}
function calcAlerta123(arr){if(arr.length<2)return false;let v=0;for(let h of arr){if(!h.ok)v++;else break;}return v>=2;}
function mudaModo(){modoIdx=(modoIdx+1)%4;modo=MODOS[modoIdx];localStorage.setItem('modoIdx',modoIdx);render();}
function render(){
 document.getElementById('tituloTopo').textContent=NOMES[modoIdx];
 let ini=document.getElementById('verdeInicial'),bH=document.getElementById('boxH'),vm=document.getElementById('vermelho');ini.classList.remove('ativa');bH.classList.remove('ativa');vm.classList.remove('ativa');
 if(modo==='GERAL'){ini.classList.add('ativa');vm.classList.add('ativa');}else{bH.classList.add('ativa');vm.classList.add('ativa');}
 let lIni=document.getElementById('listaInicial');lIni.innerHTML="";let max=Math.max(histA.length,histB.length);
 for(let i=0;i<max;i++){let col=document.createElement('div');col.className='coluna';let a=histA[i],b=histB[i];if(a){let d=document.createElement('div');let ok=(typeof a==='object')?a.ok:true;let num=(typeof a==='object')?a.num:a;d.className='hist '+(ok?'C':'E');d.textContent=num;col.appendChild(d);}if(b){let d=document.createElement('div');let ok=(typeof b==='object')?b.ok:true;let num=(typeof b==='object')?b.num:b;d.className='hist '+(ok?'C':'E');d.textContent=num;col.appendChild(d);}if(col.children.length) lIni.appendChild(col);}
 if(modo==='123_A'){let t='A: -';if(hist123A.length) t='A: '+hist123A[0].prev+'> '+hist123A[0].tab;document.getElementById('leftA').textContent=t;document.getElementById('placarA').innerHTML='ACERTO <span>'+acerto123A+' X '+erro123A+'</span> ERRO';document.getElementById('leftB').textContent='B: -';document.getElementById('placarB').textContent='LINHA A';document.getElementById('azulA').classList.toggle('alerta',calcAlerta123(hist123A));document.getElementById('azulB').classList.remove('alerta');}
 else if(modo==='123_B'){let t='B: -';if(hist123B.length) t='B: '+hist123B[0].prev+'> '+hist123B[0].tab;document.getElementById('leftA').textContent='A: -';document.getElementById('placarA').textContent='LINHA B';document.getElementById('leftB').textContent=t;document.getElementById('placarB').innerHTML='ACERTO <span>'+acerto123B+' X '+erro123B+'</span> ERRO';document.getElementById('azulA').classList.remove('alerta');document.getElementById('azulB').classList.toggle('alerta',calcAlerta123(hist123B));}
 else if(modo==='123_GERAL'){let junto=[...hist123A,...hist123B];let acertoG=acerto123A+acerto123B;let erroG=erro123A+erro123B;let tA='A+B: '+junto.length+' JOGADAS';if(junto.length) tA='A+B: '+acertoG+' ACERTOS';document.getElementById('leftA').textContent=tA;document.getElementById('leftB').textContent='TOTAL A+B';document.getElementById('placarA').innerHTML='ACERTO <span>'+acertoG+' X '+erroG+'</span> ERRO';document.getElementById('placarB').innerHTML='A:'+acerto123A+'/'+erro123A+' B:'+acerto123B+'/'+erro123B;document.getElementById('azulA').classList.toggle('alerta',calcAlerta123(junto));document.getElementById('azulB').classList.remove('alerta');}
 else{document.getElementById('placarA').innerHTML='ACERTO <span>'+acertoA+' X '+erroA+'</span> ERRO';document.getElementById('placarB').innerHTML='ACERTO <span>'+acertoB+' X '+erroB+'</span> ERRO';let alA=calcAlerta(histA),alB=calcAlerta(histB);document.getElementById('azulA').classList.toggle('alerta',alA&&(histA.length<=histB.length));document.getElementById('azulB').classList.toggle('alerta',alB&&(histA.length>histB.length));if(histA.length){let n=(typeof histA[0]==='object')?histA[0].num:histA[0];document.getElementById('leftA').innerHTML='A: '+n+'> <span>'+TAB[n]+'</span>';}else document.getElementById('leftA').textContent='A: -';if(histB.length){let n=(typeof histB[0]==='object')?histB[0].num:histB[0];document.getElementById('leftB').innerHTML='B: '+n+'> <span>'+TAB[n]+'</span>';}else document.getElementById('leftB').textContent='B: -';}
 let boxH=document.getElementById('boxH');boxH.innerHTML="";if(modo==='123_GERAL'){boxH.innerHTML='<div class="linhaH"><h3>1/2 🟩🟥 GERAL (A+B)</h3><div class="faixa" id="f12"></div></div><div class="linhaH"><h3>1/3 🟩🟥 GERAL (A+B)</h3><div class="faixa" id="f13"></div></div><div class="linhaH"><h3>2/3 🟩🟥 GERAL (A+B)</h3><div class="faixa" id="f23"></div></div>';}else if(modo==='123_A')boxH.innerHTML='<div class="linhaH"><h3>1/2 🟥🟩 SÓ LINHA A</h3><div class="faixa" id="f12"></div></div><div class="linhaH"><h3>1/3 🟥🟩 SÓ LINHA A</h3><div class="faixa" id="f13"></div></div><div class="linhaH"><h3>2/3 🟥🟩 SÓ LINHA A</h3><div class="faixa" id="f23"></div></div>';else if(modo==='123_B')boxH.innerHTML='<div class="linhaH"><h3>1/2 🟥🟩 SÓ LINHA B</h3><div class="faixa" id="f12"></div></div><div class="linhaH"><h3>1/3 🟥🟩 SÓ LINHA B</h3><div class="faixa" id="f13"></div></div><div class="linhaH"><h3>2/3 🟥🟩 SÓ LINHA B</h3><div class="faixa" id="f23"></div></div>';let f12=document.getElementById('f12'),f13=document.getElementById('f13'),f23=document.getElementById('f23');if(f12){f12.innerHTML="";f13.innerHTML="";f23.innerHTML="";let f=[];if(modo==='123_A')f=hist123A;else if(modo==='123_B')f=hist123B;else if(modo==='123_GERAL')f=[...hist123A,...hist123B];else f=[];f.forEach(h=>{let q=document.createElement('div');q.className='q '+(h.ok?'C':'E');q.textContent=h.ok?'🟩':'🟥';if(h.tab==='1/2')f12.appendChild(q);if(h.tab==='1/3')f13.appendChild(q);if(h.tab==='2/3')f23.appendChild(q);});}atualiza();
}render();
function corr(){if(modo==='123_A'&&hist123A.length){let r=hist123A.shift();ultimo123A=r.prev;if(r.ok)acerto123A=Math.max(0,acerto123A-1);else erro123A=Math.max(0,erro123A-1);localStorage.setItem('hist123A',JSON.stringify(hist123A));localStorage.setItem('ultimo123A',ultimo123A);localStorage.setItem('acerto123A',acerto123A);localStorage.setItem('erro123A',erro123A);render();return;}if(modo==='123_B'&&hist123B.length){let r=hist123B.shift();ultimo123B=r.prev;if(r.ok)acerto123B=Math.max(0,acerto123B-1);else erro123B=Math.max(0,erro123B-1);localStorage.setItem('hist123B',JSON.stringify(hist123B));localStorage.setItem('ultimo123B',ultimo123B);localStorage.setItem('acerto123B',acerto123B);localStorage.setItem('erro123B',erro123B);render();return;}if(modo==='123_GERAL'&&(hist123A.length||hist123B.length)){if(hist123A.length){let r=hist123A.shift();ultimo123A=r.prev;if(r.ok)acerto123A=Math.max(0,acerto123A-1);else erro123A=Math.max(0,erro123A-1);}else if(hist123B.length){let r=hist123B.shift();ultimo123B=r.prev;if(r.ok)acerto123B=Math.max(0,acerto123B-1);else erro123B=Math.max(0,erro123B-1);}localStorage.setItem('hist123A',JSON.stringify(hist123A));localStorage.setItem('hist123B',JSON.stringify(hist123B));localStorage.setItem('ultimo123A',ultimo123A);localStorage.setItem('ultimo123B',ultimo123B);localStorage.setItem('acerto123A',acerto123A);localStorage.setItem('erro123A',erro123A);localStorage.setItem('acerto123B',acerto123B);localStorage.setItem('erro123B',erro123B);render();return;}if(histA.length>histB.length){let r=histA.shift();let num=(typeof r==='object')?r.num:r;countsA[num]=Math.max(0,(countsA[num]||0)-1);if(r.foiAposta){if(r.ok)acertoA=Math.max(0,acertoA-1);else erroA=Math.max(0,erroA-1);}}else if(histB.length){let r=histB.shift();let num=(typeof r==='object')?r.num:r;countsB[num]=Math.max(0,(countsB[num]||0)-1);if(r.foiAposta){if(r.ok)acertoB=Math.max(0,acertoB-1);else erroB=Math.max(0,erroB-1);}}else if(histA.length){let r=histA.shift();let num=(typeof r==='object')?r.num:r;countsA[num]=Math.max(0,(countsA[num]||0)-1);}localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));localStorage.setItem('cntA',JSON.stringify(countsA));localStorage.setItem('cntB',JSON.stringify(countsB));localStorage.setItem('placarAcertoA',acertoA);localStorage.setItem('placarErroA',erroA);localStorage.setItem('placarAcertoB',acertoB);localStorage.setItem('placarErroB',erroB);render();}
function goNum(num){let vaiA = histA.length <= histB.length;if(vaiA){if(ultimo123A===null){ultimo123A=num;}else{let tab=TAB[ultimo123A];if(tab!=="ZERO"){let ok=tab.split('/').map(Number).includes(COL[num]);hist123A.unshift({prev:ultimo123A,tab:tab,curr:num,ok:ok});if(ok)acerto123A++;else{let ta=calcAlerta123(hist123A.slice(1));if(ta)erro123A++;}}ultimo123A=num;}}else{if(ultimo123B===null){ultimo123B=num;}else{let tab=TAB[ultimo123B];if(tab!=="ZERO"){let ok=tab.split('/').map(Number).includes(COL[num]);hist123B.unshift({prev:ultimo123B,tab:tab,curr:num,ok:ok});if(ok)acerto123B++;else{let ta=calcAlerta123(hist123B.slice(1));if(ta)erro123B++;}}ultimo123B=num;}}localStorage.setItem('hist123A',JSON.stringify(hist123A));localStorage.setItem('hist123B',JSON.stringify(hist123B));localStorage.setItem('ultimo123A',ultimo123A);localStorage.setItem('ultimo123B',ultimo123B);localStorage.setItem('acerto123A',acerto123A);localStorage.setItem('erro123A',erro123A);localStorage.setItem('acerto123B',acerto123B);localStorage.setItem('erro123B',erro123B);let okA=true,okB=true;if(histA.length){let alvo=TAB[(typeof histA[0]==='object')?histA[0].num:histA[0]].split('/').map(Number);if(num!==0)okA=alvo.includes(COL[num]);}if(histB.length){let alvo=TAB[(typeof histB[0]==='object')?histB[0].num:histB[0]].split('/').map(Number);if(num!==0)okB=alvo.includes(COL[num]);}if(vaiA){let al=calcAlerta(histA);let foi=false;if(al){foi=true;if(okA)acertoA++;else erroA++;}histA.unshift({num:num,ok:okA,foiAposta:foi});countsA[num]=(countsA[num]||0)+1;}else{let al=calcAlerta(histB);let foi=false;if(al){foi=true;if(okB)acertoB++;else erroB++;}histB.unshift({num:num,ok:okB,foiAposta:foi});countsB[num]=(countsB[num]||0)+1;}localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));localStorage.setItem('cntA',JSON.stringify(countsA));localStorage.setItem('cntB',JSON.stringify(countsB));localStorage.setItem('placarAcertoA',acertoA);localStorage.setItem('placarErroA',erroA);localStorage.setItem('placarAcertoB',acertoB);localStorage.setItem('placarErroB',erroB);render();}
function pick(n){goNum(n);}
</script></body></html>
