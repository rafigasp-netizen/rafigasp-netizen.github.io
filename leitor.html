<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RAFIGASP - LEITOR</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black}body{background:#000;color:#ffcc00;display:flex;justify-content:center;padding:10px;min-height:100vh}#app{width:100%;max-width:460px;background:#0a2e1e;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px}.topo{background:#ffcc00;color:#000;text-align:center;padding:12px;border-radius:8px;font-size:16px}.btn{padding:14px;border:0;border-radius:8px;font-weight:900;font-size:14px;background:#ffcc00;color:#000}.btn2{background:#0066ff;color:#fff;margin-top:4px}.placar{background:#000;border-radius:8px;padding:10px;font-size:14px;line-height:22px;white-space:pre-line;min-height:120px}.preview{width:100%;border-radius:8px;display:none;max-height:300px;object-fit:contain;background:#000}.info{font-size:11px;color:#fff;text-align:center}.lista{font-size:10px;color:#aaa;background:#001a0a;padding:6px;border-radius:6px;max-height:80px;overflow:auto}</style></head><body><div id="app"><div class="topo"><b>RAFIGASP - LEITOR DE FOTO</b><br><span style="font-size:11px">LÊ O PRINT DOS ÚLTIMOS 500</span></div><button class="btn" onclick="document.getElementById('inputFoto').click()">📷 ESCOLHER FOTO</button><img id="preview" class="preview"><div id="placar" class="placar">Aguardando foto...

A 1/2 🟩 [0] 🟥 [0]
B 1/3 🟩 [0] 🟥 [0]
C 2/3 🟩 [0] 🟥 [0]</div><div id="info" class="info"></div><div id="listaNum" class="lista" style="display:none"></div><button class="btn btn2" onclick="location.href='index.html'">VOLTAR PARA RAFIGASP</button><input type="file" id="inputFoto" accept="image/*" style="display:none" onchange="lerFoto(this)"></div><script>
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};
const TAB={0:"ZERO",1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2"};
async function lerFoto(input){let file=input.files[0];if(!file)return;let prev=document.getElementById('preview');prev.src=URL.createObjectURL(file);prev.style.display='block';let box=document.getElementById('placar');box.textContent='📷 LENDO... AGUARDE 5s';try{let r=await Tesseract.recognize(file,'eng');let t=r.data.text;let nums=t.match(/\b([0-9]|[12][0-9]|3[0-6])\b/g);if(!nums){box.textContent='❌ NÃO ACHOU NÚMEROS';return;}let list=nums.map(n=>parseInt(n)).filter(n=>n>=0&&n<=36);if(list.length>500)list=list.slice(0,500);let ordem=list.slice().reverse();let stats={"1/2":{g:0,r:0},"1/3":{g:0,r:0},"2/3":{g:0,r:0}};let alerta={"1/2":{g:0,r:0},"1/3":{g:0,r:0},"2/3":{g:0,r:0}};let last={"1/2":[],"1/3":[],"2/3":[]};for(let i=0;i<ordem.length-1;i++){let p=ordem[i],c=ordem[i+1];if(p==0||c==0)continue;let tab=TAB[p];let ok=tab.split('/').map(Number).includes(COL[c]);if(ok)stats[tab].g++;else stats[tab].r++;let arr=last[tab];if(arr.length>=2&&!arr[arr.length-1]&&!arr[arr.length-2]){if(ok)alerta[tab].g++;else alerta[tab].r++;}arr.push(ok);}box.textContent=`📸 ${list.length} NÚMEROS LIDOS
A 1/2 🟩 [${stats["1/2"].g}] 🟥 [${stats["1/2"].r}]
B 1/3 🟩 [${stats["1/3"].g}] 🟥 [${stats["1/3"].r}]
C 2/3 🟩 [${stats["2/3"].g}] 🟥 [${stats["2/3"].r}]
NOVO (depois 2 red):
A 1/2 🟩 [${alerta["1/2"].g}] 🟥 [${alerta["1/2"].r}]
B 1/3 🟩 [${alerta["1/3"].g}] 🟥 [${alerta["1/3"].r}]
C 2/3 🟩 [${alerta["2/3"].g}] 🟥 [${alerta["2/3"].r}]`;document.getElementById('listaNum').style.display='block';document.getElementById('listaNum').textContent=ordem.slice(0,100).join(', ');}catch(e){document.getElementById('placar').textContent='❌ ERRO: '+e.message;}}
</script></body></html>
