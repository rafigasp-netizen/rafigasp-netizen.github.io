<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0d2818}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:3px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:12px;text-align:center}
.topo h1{color:#000;font-size:17px;font-weight:900}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#0f2e1f}
.slot{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;border:2px dashed #d4af37;color:#d4af37}
.slot.yellow{background:#d4af37;color:#000;border:2px solid #d4af37}
.slot.green{background:#16a34a;color:#fff;border:2px solid #16a34a}
.slot.red{background:#dc2626;color:#fff;border:2px solid #dc2626}
.historyBox{background:#0a2a1a;margin:6px 8px;border:2px solid #3b82f6;border-radius:10px;padding:6px;flex:0 200px;overflow-y:auto;display:flex;gap:6px}
.colBox{flex:1;background:#0f2e1f;border-radius:8px;padding:4px}
.colTitle{color:#fff;background:#000;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:900;text-align:center;margin-bottom:6px}
.colTitle.duzia{background:#fff;color:#000}
.squares{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sq{height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#fff}
.sq.green{background:#16a34a}.sq.red{background:#dc2626}
.bottom{flex:1;display:flex;flex-direction:column;padding:8px}
.keypad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{width:100%;height:100%;min-height:62px;border-radius:14px;border:none;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:13px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP COACH DA ROLETA</h1></div>
<div class="top2">
<div class="slot" id="slotY">VAZIO</div>
<div class="slot" id="slotR">VAZIO</div>
</div>
<div class="historyBox">
<div class="colBox">
<div class="colTitle">COLUNA</div>
<div class="squares" id="sqCol"></div>
</div>
<div class="colBox">
<div class="colTitle duzia">DUZIA</div>
<div class="squares" id="sqDuz"></div>
</div>
</div>
<div class="bottom">
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
</div>
<script>
let history=[],cur='',colSquares=[],duzSquares=[];
const gC23=[6,9,11,14,16,17,19,21,26,29,33,36];
const gC13=[2,3,5,8,10,13,20,25,28,31,32,35];
const gC12=[1,4,7,12,15,18,22,23,24,27,30,34];
function getAlvo(n){if(gC23.includes(n))return "C2/3";if(gC13.includes(n))return "C1/3";if(gC12.includes(n))return "C1/2";return "";}
function getColunaReal(n){if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;return 0;}
function getDuziaReal(n){if(n>=1&&n<=12)return 1;if(n>=13&&n<=24)return 2;if(n>=25&&n<=36)return 3;return 0;}
function getAlvos(a){if(a=="C1/3")return [1,3];if(a=="C2/3")return [2,3];if(a=="C1/2")return [1,2];return [];}
const slotY=document.getElementById('slotY');
const slotR=document.getElementById('slotR');
const sqCol=document.getElementById('sqCol');
const sqDuz=document.getElementById('sqDuz');

function render(preview){
if(history.length===0 && !preview){
slotY.className='slot'; slotY.textContent='VAZIO';
slotR.className='slot'; slotR.textContent='VAZIO';
}else if(preview){
let isYellowNext = history.length%2===0;
if(isYellowNext){
slotY.className='slot yellow'; slotY.textContent=preview.num+' '+preview.alvo;
slotR.className='slot'; slotR.textContent='...';
}else{
let header=history[history.length-1];
slotY.className='slot yellow'; slotY.textContent=header.num+' '+header.alvo;
let cr=getColunaReal(preview.num);
let ca=getAlvos(header.alvo);
slotR.className='slot '+(ca.includes(cr)?'green':'red'); slotR.textContent=preview.num;
}
}else{
let lastY = history.length%2===1 ? history[history.length-1] : (history.length>=2?history[history.length-2]:null);
if(lastY){slotY.className='slot yellow'; slotY.textContent=lastY.num+' '+lastY.alvo;}
if(history.length>=2 && history.length%2===0){
let lastR = history[history.length-1];
let header = history[history.length-2];
let cr=getColunaReal(lastR.num);
let ca=getAlvos(header.alvo);
slotR.className='slot '+(ca.includes(cr)?'green':'red'); slotR.textContent=lastR.num;
}
}
sqCol.innerHTML='';
sqDuz.innerHTML='';
for(let s of colSquares){
let d=document.createElement('div'); d.className='sq '+s.color; d.textContent=s.num; sqCol.appendChild(d);
}
for(let s of duzSquares){
let d=document.createElement('div'); d.className='sq '+s.color; d.textContent=s.num; sqDuz.appendChild(d);
}
}

function addN(n){
if(cur.length>=2) return;
if(cur==="0" && n===0){cur="00";render({num:"00",alvo:""});return;}
cur+=n.toString();
if(cur==="00"){render({num:"00",alvo:""});return;}
let v=parseInt(cur);
if(isNaN(v)) return;
render({num:v, alvo:getAlvo(v)});
}

function enterN(){
if(cur==='') return;
if(cur==="00"){history=[];colSquares=[];duzSquares=[];cur='';render();return;}
let v=parseInt(cur);
if(isNaN(v) || v>36){cur='';render();return;}
if(v===0){history=[];colSquares=[];duzSquares=[];cur='';render();return;}
let alvo=getAlvo(v);
if(history.length%2===0){
history.push({num:v, alvo:alvo});
}else{
history.push({num:v, alvo:""});
let y=history[history.length-2];
// COLUNA
let colReal=getColunaReal(v);
let colAlvos=getAlvos(y.alvo);
let winCol=colAlvos.includes(colReal);
colSquares.push({num:v, color: winCol?'green':'red'});
// DUZIA - mesma logica C1/2 = duzia 1 ou 2 verde, 3 vermelho
let duzReal=getDuziaReal(v);
let winDuz=colAlvos.includes(duzReal);
duzSquares.push({num:v, color: winDuz?'green':'red'});
// AUTO AMARELO
let autoAlvo=getAlvo(v);
history.push({num:v, alvo:autoAlvo});
}
cur='';render();
}

function corrige(){
if(cur!==''){cur=cur.slice(0,-1);render(cur?{num:parseInt(cur),alvo:getAlvo(parseInt(cur))}:null);}
else if(history.length>0){
let wasAuto = history.length%2===1;
history.pop();
if(wasAuto){
if(colSquares.length>0){colSquares.pop(); duzSquares.pop();}
if(history.length>0) history.pop();
}
render();
}
}
render();
</script>
</body>
</html>
