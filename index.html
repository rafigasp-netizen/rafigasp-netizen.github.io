<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>RAFIGASP</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black}body{background:#000;min-height:100dvh;display:flex;justify-content:center;overflow-y:auto} #app{width:98%;max-width:380px;background:#0a2e1e;display:flex;flex-direction:column;gap:1px;margin:0 auto;min-height:100dvh;padding-bottom:8px} .topo{background:#ffcc00;text-align:center;padding:5px;font-size:13px}
.verde{margin:1px 3px;background:#0a5a2e;border-radius:8px;padding:5px;min-height:58px;overflow-x:auto;display:flex;align-items:center;gap:4px}.historico{display:flex;gap:4px}.coluna{display:flex;flex-direction:column;gap:3px}.hist{width:44px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;border:1.5px solid #fff}.C{background:#00a000}.E{background:#c00000}
.vermelho{margin:1px 3px;background:#0a3d1f;border-radius:8px;padding:4px}.grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.cell{border:1.5px solid #d4af37;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:19px;min-height:38px;position:relative}.cell.red{background:#b50000}.cell.black{background:#111}.cell.marcado{background:#ffea00!important;color:#000!important}.cell .badge{position:absolute;top:-6px;right:-4px;background:#000;color:#ffcc00;font-size:10px;padding:1px 4px;border-radius:10px;border:1px solid #ffcc00}
.doisparaum{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:4px}.doisparaum div{background:#0a5a2e;border:1px solid #d4af37;color:#d4d46a;text-align:center;padding:7px 0;font-size:16px;font-weight:900;border-radius:4px}
.azul{margin:1px 3px;background:#001a8a;border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:15px;font-weight:900}.azul span{color:#ffcc00}.azul.alerta-total{background:#cc0000!important;box-shadow:0 0 20px #ff0000;animation:pisca .5s infinite alternate}@keyframes pisca{from{background:#cc0000}to{background:#ff0000}}
.btns{display:flex;gap:3px;padding:3px 3px 8px 3px}.btns button{flex:1;padding:12px;border:0;border-radius:6px;font-weight:900;font-size:14px;background:#ffcc00}

/* SO NO COMPUTADOR - DEIXA MENOR SEM MEXER NO CELULAR */
@media (min-width:600px){
  #app{max-width:300px; min-height:auto; margin-top:10px; margin-bottom:10px; border-radius:8px; overflow:hidden}
  .cell{min-height:30px; font-size:16px}
  .doisparaum div{padding:5px 0; font-size:14px}
  .verde{min-height:48px}
  .hist{width:38px;height:24px;font-size:11px}
  .azul{padding:7px 8px; font-size:13px}
  .btns button{padding:9px; font-size:13px}
}
</style></head><body><div id="app">
<div class="topo"><b>RAFIGASP COACH DA ROLETA</b></div>
<div class="verde"><div class="historico" id="lista"></div></div>
<div class="vermelho"><div class="grid" id="grid"></div><div class="doisparaum"><div>1</div><div>2</div><div>3</div></div></div>
<div class="azul" id="boxAzul"><div id="left">-</div><div id="placar">ACERTO 0 X 0 ERRO</div></div>
<div class="btns"><button onclick="corr()">CORRIGIR</button><button onclick="if(confirm('Zerar tudo?')){localStorage.clear();location.reload()}">LIMPAR</button></div>
</div><script>
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};const TAB={0:"ZERO",1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2"};const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
let counts=JSON.parse(localStorage.getItem('cnt36')||'{}');let grid=document.getElementById('grid');
for(let i=1;i<=36;i++){let d=document.createElement('div');d.className='cell '+(REDS.includes(i)?'red':'black');d.id='c'+i;d.onclick=()=>pick(i);d.innerHTML='<span>'+i+'</span><span class="badge" id="cnt'+i+'"></span>';grid.appendChild(d);}
function atualiza(){for(let i=0;i<=36;i++){let c=counts[i]||0;let el=document.getElementById('cnt'+i);let b=document.getElementById('c'+i);if(el)el.textContent=c>0?c+'x':'';if(b){if(c>0)b.classList.add('marcado');else b.classList.remove('marcado');}}}
atualiza();
let geral=JSON.parse(localStorage.getItem('g')||'[]');
let acertoPlacar=parseInt(localStorage.getItem('placarAcerto')||'0');
let erroPlacar=parseInt(localStorage.getItem('placarErro')||'0');
function calculaAlerta(geralArr){
  if(geralArr.length<2) return false;
  let cron=[...geralArr].reverse();let pares=[];for(let i=0;i<cron.length;i+=2) pares.push([cron[i],cron[i+1]]);
  pares.reverse();
  let linhaA=[],linhaB=[];
  pares.forEach(par=>{
    if(par[0]) linhaA.push(par[0]); else linhaA.push(null);
    if(par[1]) linhaB.push(par[1]); else linhaB.push(null);
  });
  let proximoEhA = (geralArr.length % 2 === 0);
  let temValidoA=false,temValidoB=false;
  for(let i=0;i<linhaA.length-1;i++){
    let c=linhaA[i],n=linhaA[i+1];
    if(c&&n&&!c.ok&&!n.ok){
      let temVerdeNovo=false;
      for(let j=0;j<i;j++){if(linhaA[j]&&linhaA[j].ok) temVerdeNovo=true;}
      if(!temVerdeNovo) temValidoA=true;
    }
  }
  for(let i=0;i<linhaB.length-1;i++){
    let c=linhaB[i],n=linhaB[i+1];
    if(c&&n&&!c.ok&&!n.ok){
      let temVerdeNovo=false;
      for(let j=0;j<i;j++){if(linhaB[j]&&linhaB[j].ok) temVerdeNovo=true;}
      if(!temVerdeNovo) temValidoB=true;
    }
  }
  if(proximoEhA && temValidoA) return true;
  if(!proximoEhA && temValidoB) return true;
  return false;
}
function render(){
  let l=document.getElementById('lista');l.innerHTML="";
  document.getElementById('placar').innerHTML='ACERTO <span>'+acertoPlacar+' X '+erroPlacar+'</span> ERRO';
  let cron=[...geral].reverse();
  let pares=[];for(let i=0;i<cron.length;i+=2) pares.push([cron[i],cron[i+1]]);
  pares.reverse();
  pares.forEach(par=>{
    let col=document.createElement('div');col.className='coluna';
    if(par[0]){let d=document.createElement('div');d.className='hist '+(par[0].ok?'C':'E');d.textContent=par[0].num;col.appendChild(d);} 
    if(par[1]){let d=document.createElement('div');d.className='hist '+(par[1].ok?'C':'E');d.textContent=par[1].num;col.appendChild(d);}
    l.appendChild(col);
  });
  let boxAzul=document.getElementById('boxAzul');
  if(calculaAlerta(geral)) boxAzul.classList.add('alerta-total'); else boxAzul.classList.remove('alerta-total');
}
render();
if(geral.length)document.getElementById('left').innerHTML=geral[0].num+'> <span>'+TAB[geral[0].num]+'</span>';
function corr(){
  if(geral.length){
    let r=geral.shift();
    if(counts[r.num])counts[r.num]=Math.max(0,counts[r.num]-1);
    if(r.foiAposta){
      if(r.ok) acertoPlacar=Math.max(0,acertoPlacar-1); else erroPlacar=Math.max(0,erroPlacar-1);
      localStorage.setItem('placarAcerto',acertoPlacar);
      localStorage.setItem('placarErro',erroPlacar);
    }
    localStorage.setItem('g',JSON.stringify(geral));
    localStorage.setItem('cnt36',JSON.stringify(counts));
    render();atualiza();
    if(geral.length)document.getElementById('left').innerHTML=geral[0].num+'> <span>'+TAB[geral[0].num]+'</span>';else document.getElementById('left').innerText="-";
  }
}
function goNum(num){
  let ok=true;
  if(geral.length){let alvo=TAB[geral[0].num].split('/').map(Number);if(num===0)ok=true;else ok=alvo.includes(COL[num]);}
  let alertaAntes = calculaAlerta(geral);
  let foiAposta = false;
  if(alertaAntes){
    foiAposta = true;
    if(ok) acertoPlacar++; else erroPlacar++;
    localStorage.setItem('placarAcerto',acertoPlacar);
    localStorage.setItem('placarErro',erroPlacar);
  }
  geral.unshift({num:num,ok:ok,foiAposta:foiAposta});counts[num]=(counts[num]||0)+1;
  localStorage.setItem('g',JSON.stringify(geral));localStorage.setItem('cnt36',JSON.stringify(counts));
  document.getElementById('left').innerHTML=num+'> <span>'+TAB[num]+'</span>';
  render();atualiza();
}
function pick(n){goNum(n);}
</script></body></html>
