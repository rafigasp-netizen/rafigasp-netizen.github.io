<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{height:100%;overflow:hidden}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:400px;background:#000;height:100dvh;display:flex;flex-direction:column}
.topo{height:38px;background:linear-gradient(180deg,#f7e8a5,#d4af37);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.topo h1{font-size:18px;font-weight:900}.topo span{font-size:7px;letter-spacing:2px}
.menu{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:3px;padding:3px;flex-shrink:0}
.menu button{height:28px;border-radius:5px;border:1px solid #d4af37;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:9px;font-weight:800}
.barra-verm{background:#ffff00;border:1px solid gold;text-align:center;color:#000;font-weight:900;padding:2px;margin:0 3px;border-radius:5px;min-height:30px;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hist{display:flex;gap:3px;padding:3px;overflow-x:auto;background:#111;min-height:34px;flex-shrink:0}
.chip{min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:1px solid gold;font-size:12px;flex-shrink:0}
.chip.C{background:#00c800}.chip.E{background:#c80000}
.card-verm{margin:3px;background:linear-gradient(180deg,#ff4444,#cc0000);border:1px solid #d4af37;border-radius:8px;padding:5px;text-align:center;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.big{color:#ffff00;font-size:32px;font-weight:900;line-height:1}
.placar{display:flex;justify-content:space-between;background:#000;border-radius:5px;padding:3px 8px;margin-top:3px}
.verde{color:#00ff00;font-size:18px;font-weight:900}.verm{color:#ff3333;font-size:18px;font-weight:900}
.hist-result{background:#000;border-radius:5px;padding:3px;display:flex;gap:3px;overflow-x:auto;min-height:32px;border:1px solid #333;flex-wrap:wrap;margin-top:3px;flex:1}
.hr-quad{min-width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;border:1px solid #fff}
.hr-quad.C{background:#00c800}.hr-quad.E{background:#c80000}
.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:3px;background:#1a1a0a;border-top:1px solid #d4af37;flex-shrink:0;padding-bottom:6px}
.b{height:38px;border-radius:6px;border:1px solid #8a6a1a;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:18px;font-weight:900}
.pagina{display:none;flex:1;min-height:0}.pagina.ativa{display:flex;flex-direction:column}
#lista-geral{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div>
<div class="menu"><button onclick="irPara(1)">🏠 INICIO</button><button onclick="apagar()">⬅️ APAGAR</button><button onclick="limpar()">🗑️ LIMPAR</button><button onclick="proximaPagina()">➡️ PROX</button></div>
<div id="pag1" class="pagina ativa"><div class="barra-verm" id="barra"></div><div class="hist" id="hist-top"></div>
<div class="card-verm"><div style="color:#fff;font-size:10px;font-weight:900">VEM COLUNA</div><div class="big" id="sinal">2/3</div>
<div class="placar"><div><b style="font-size:8px;color:gold">✅ ACERTOU</b><div class="verde" id="ac">0</div></div><div><b style="font-size:8px;color:gold">❌ ERROU</b><div class="verm" id="er">0</div></div></div>
<div class="hist-result" id="hist-result"></div></div></div>
<div id="pag3" class="pagina"><h2 style="color:gold;text-align:center;font-size:12px">PAGINA 3 - GERAL</h2><div id="lista-geral"></div><button onclick="limparGeral()" style="margin-top:6px;height:28px;background:#333;color:#fff;border:1px solid gold;border-radius:5px;font-size:11px">🗑️ LIMPAR</button></div>
<div class="teclado">
<button class="b" onclick="dig(1)">1</button><button class="b" onclick="dig(2)">2</button><button class="b" onclick="dig(3)">3</button>
<button class="b" onclick="dig(4)">4</button><button class="b" onclick="dig(5)">5</button><button class="b" onclick="dig(6)">6</button>
<button class="b" onclick="dig(7)">7</button><button class="b" onclick="dig(8)">8</button><button class="b" onclick="dig(9)">9</button>
<button class="b" style="font-size:12px" onclick="enter()">ENTER</button><button class="b" onclick="dig(0)">0</button><button class="b" style="font-size:12px" onclick="corrigir()">CORRIGIR</button>
</div>
</div>
<script>
let buf="";let ac=0,er=0;let colunaAlvo="2/3";let paginaAtual=1;
let geral=JSON.parse(localStorage.getItem('rafigasp_geral')||'[]');
let historicoNumeros=[];
function getColuna(n){if(n==0)return 0; if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1; if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2; return 3;}
function irPara(n){document.querySelectorAll('.pagina').forEach(p=>p.classList.remove('ativa')); document.getElementById('pag'+n).classList.add('ativa'); paginaAtual=n; if(n==3)renderGeral();}
function proximaPagina(){irPara(paginaAtual>=3?1:paginaAtual+1);}
function atualizaSinal(){if(historicoNumeros.length>0){let last=historicoNumeros[historicoNumeros.length-1];let c=getColuna(last);if(c==1)colunaAlvo="2/3";else if(c==2)colunaAlvo="1/3";else if(c==3)colunaAlvo="1/2";else colunaAlvo="2/3";} document.getElementById('sinal').innerText=colunaAlvo;}
function atualizaBarra(){let el=document.getElementById('barra'); if(buf.length>0){el.innerText=buf;el.style.background="#ffff00";el.style.color="#000";}else{el.innerHTML="VEM COLUNA "+colunaAlvo;el.style.background="linear-gradient(180deg,#ff3333,#991111)";el.style.color="#fff";el.style.fontSize="14px";}}
function dig(n){if(buf.length<2)buf+=n; atualizaBarra();}
function corrigir(){buf=buf.slice(0,-1); atualizaBarra();}
function apagar(){buf=""; atualizaBarra();}
function limpar(){document.getElementById('hist-top').innerHTML='';document.getElementById('hist-result').innerHTML='';ac=0;er=0;historicoNumeros=[];document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;atualizaSinal();atualizaBarra();}
function limparGeral(){geral=[];localStorage.setItem('rafigasp_geral',JSON.stringify(geral));renderGeral();}
function renderGeral(){let div=document.getElementById('lista-geral');div.innerHTML='';geral.forEach(item=>{let q=document.createElement('div');q.className='hr-quad '+(item.acertou?'C':'E');q.textContent=item.num;div.appendChild(q);});}
function enter(){if(!buf)return;let num=parseInt(buf);if(num<0||num>36){buf="";atualizaBarra();return;}let col=getColuna(num);let alvo=colunaAlvo.split('/').map(Number);let acertou=alvo.includes(col);let h=document.getElementById('hist-top');let d=document.createElement('div');d.className='chip '+(acertou?'C':'E');d.textContent=num;h.appendChild(d);h.scrollLeft=h.scrollWidth;let hr=document.getElementById('hist-result');let quad=document.createElement('div');quad.className='hr-quad '+(acertou?'C':'E');quad.textContent=num;hr.appendChild(quad);if(acertou)ac++;else er++;document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;geral.push({num:num,acertou:acertou});localStorage.setItem('rafigasp_geral',JSON.stringify(geral));historicoNumeros.push(num);buf="";atualizaSinal();atualizaBarra();}
atualizaSinal();atualizaBarra();renderGeral();
</script>
</body>
</html>
