<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0d2818}
body{display:flex;justify-content:center;font-family:Arial,sans-serif}
.app{width:100%;max-width:420px;min-height:100dvh;background:#0d2818;border:2px solid #d4af37;display:flex;flex-direction:column}
.blacks{display:flex;gap:8px;padding:8px;background:#0a1f12}
.bbox{flex:1;background:#000;border:1.5px solid #d4af37;border-radius:12px;height:38px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px}
/* 12 QUADRADOS ANTIGOS - VERMELHO - NÃO MEXER */
.history{background:#123524;padding:6px}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.hslot{height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.hslot.empty{border:1.5px dashed #d4af37;opacity:0.35}
.hslot.yellow{background:#d4af37;color:#000;box-shadow:0 0 8px #d4af37}
.hslot.green{background:#16a34a;color:#fff;border:1.5px solid #fff}
.hslot.red{background:#dc2626;color:#fff;border:1.5px solid #fff}
/* A e B - AZUL - EM CIMA DO TECLADO */
.ab-top{display:grid;grid-template-columns:70px 1fr;gap:6px;padding:6px;background:#0a1f12}
.ab-box{border-radius:8px;border:1.5px solid #d4af37;padding:3px 5px;display:flex;flex-direction:column;min-height:32px}
.ab-box.a{background:#1a1a00}
.ab-box.b{background:#1a0f0f}
.ab-label{font-size:9px;color:#d4af37;font-weight:900}
.ab-content{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px;min-height:14px}
.ab-dot{width:10px;height:10px;border-radius:50%}
.ab-dot.green{background:#16a34a}
.ab-dot.red{background:#dc2626}
.ab-dot.yellow{background:#d4af37}
.ab-chip{font-size:10px;font-weight:800;padding:1px 3px;border-radius:3px;background:#0d2818;border:1px solid #2d5a3a;color:#fff}
/* TECLADO VERDE - DIMINUIDO */
.keypad{padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.k{height:50px;border-radius:10px;border:none;font-weight:900;font-size:19px;cursor:pointer}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;box-shadow:0 2px 0 #7a5d18}
.k.zero{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 2px 0 #7f1d1d}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:10px;box-shadow:0 2px 0 #7a5d18}
.k:active{transform:translateY(2px);box-shadow:none}
</style>
</head>
<body>
<div class="app">
<div class="blacks"><div class="bbox" id="boxUlt">-</div><div class="bbox" id="boxCol">COLUNA</div></div>
<div class="history"><div class="hist-grid" id="grid"></div></div>
<div class="ab-top">
<div class="ab-box a"><span class="ab-label">A - HIST AMARELO</span><div class="ab-content" id="boxA">-</div></div>
<div class="ab-box b"><span class="ab-label">B - CORES</span><div class="ab-content" id="boxB">-</div></div>
</div>
