<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFIGASP - Coach da Roleta</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
body{background:#0a0a0f;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;background:linear-gradient(180deg,#0f0f18 0%,#08080c 100%);padding:16px;display:flex;flex-direction:column;gap:14px}

/* PLACA RAFIGASP PRETO */
.placa-rafigasp{
  background: linear-gradient(180deg,#f9e7a0 0%,#d4af37 50%,#b8962e 100%);
  border:2px solid #c9a227;
  box-shadow:0 4px 20px rgba(212,175,55,.4), inset 0 1px 0 rgba(255,255,255,.6);
  padding:14px 10px;text-align:center;
}
.placa-rafigasp h1{
  font-size:54px;letter-spacing:2px;font-weight:900;color:#000;line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.3);
}
.sub-coach{
  text-align:center;color:#d4af37;font-size:18px;letter-spacing:4px;margin-top:6px;font-weight:600
}

/* ROLETA */
.roleta-box{
  background:radial-gradient(circle at center,#1a1a2a 0%,#000 100%);
  border-radius:12px;padding:10px;display:flex;justify-content:center;
  box-shadow:inset 0 0 30px rgba(0,0,0,.8);
}
.roleta-box img{
  width:100%;max-width:340px;aspect-ratio:1;border-radius:50%;
  border:6px solid #d4af37;box-shadow:0 0 25px rgba(212,175,55,.5);
}

/* VEM COLUNA */
.vem-coluna{
  text-align:center;color:#f0d060;font-size:28px;font-weight:800;letter-spacing:1px;
  text-shadow:0 0 10px rgba(240,208,96,.5);margin-top:4px
}

/* HISTORICO */
.historico-box{
  border:1.5px solid #d4af37;border-radius:12px;padding:12px 10px;
  display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;
  background:rgba(0,0,0,.4)
}
.ficha{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;color:#fff;
  border:3px solid #c9a227;box-shadow:0 2px 6px rgba(0,0,0,.6)
}
.ficha.vermelha{background:radial-gradient(circle,#b91c1c,#7f1d1d)}
.ficha.preta{background:radial-gradient(circle,#2a2a2a,#000)}
.ficha.verde{background:radial-gradient(circle,#166534,#052e16)}

/* PLACAR */
.placar{ text-align:center;color:#d4af37;font-size:13px;letter-spacing:2px;opacity:.8 }

/* TECLADO - ZERO EMBAIXO DO 8 */
.teclado{
  background:linear-gradient(180deg,#1e1e24,#101014);
  border:1.5px solid #d4af37;border-radius:16px;padding:12px;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
  box-shadow:0 0 20px rgba(0,0,0,.6)
}
.btn{
  height:62px;background:linear-gradient(180deg,#f5e6a3 0%,#d4af37 50%,#b8962e 100%);
  border:2px solid #a68a24;border-radius:12px;
  font-size:32px;font-weight:800;color:#3a2e00;
  box-shadow:0 4px 0 #7a631c, 0 4px 12px rgba(0,0,0,.4);
  cursor:pointer;transition:.1s
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a631c}
.btn-acao{font-size:18px;letter-spacing:.5px}
</style>
</head>
<body>
<div class="app">

  <div class="placa-rafigasp">
    <h1>RAFIGASP</h1>
  </div>
  <div class="sub-coach">COACH DA ROLETA</div>

  <div class="roleta-box">
    <img src="https://i.imgur.com/8Km9tLL.png" alt="Roleta" id="roleta">
  </div>

  <div class="vem-coluna" id="sinal">VEM COLUNA 2/3</div>

  <div class="historico-box" id="historico">
    <div class="ficha verde">12</div>
    <div class="ficha preta">3</div>
    <div class="ficha vermelha">23</div>
    <div class="ficha preta">7</div>
    <div class="ficha vermelha">18</div>
    <div class="ficha vermelha">32</div>
  </div>

  <div class="placar">ACERTOU 12 &nbsp;•&nbsp; ERROU 3</div>

  <div class="teclado">
    <button class="btn" onclick="digitar(1)">1</button>
    <button class="btn" onclick="digitar(2)">2</button>
    <button class="btn" onclick="digitar(3)">3</button>

    <button class="btn" onclick="digitar(4)">4</button>
    <button class="btn" onclick="digitar(5)">5</button>
    <button class="btn" onclick="digitar(6)">6</button>

    <button class="btn" onclick="digitar(7)">7</button>
    <button class="btn" onclick="digitar(8)">8</button>
    <button class="btn" onclick="digitar(9)">9</button>

    <button class="btn btn-acao" onclick="enter()">ENTER</button>
    <button class="btn" onclick="digitar(0)">0</button>
    <button class="btn btn-acao" onclick="corrigir()">CORRIGIR</button>
  </div>

</div>

<script>
let buffer = "";
function digitar(n){
  buffer += n;
  console.log("Digitado:", buffer);
}
function enter(){
  if(!buffer) return;
  const num = parseInt(buffer);
  // adiciona no histórico organizado
  const box = document.getElementById('historico');
  const f = document.createElement('div');
  f.className = 'ficha ' + (num==0?'verde':num%2==0?'preta':'vermelha');
  f.textContent = num;
  box.appendChild(f);
  if(box.children.length>6) box.removeChild(box.firstChild);
  buffer="";
}
function corrigir(){ buffer = buffer.slice(0,-1); }
</script>
</body>
</html>
