<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d2818}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:3px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:8px;text-align:center}
.topo h1{color:#000;font-size:15px;font-weight:900}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:#0f2e1f}
.slot{height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;border:2px dashed #d4af37;color:#d4af37;background:#0a2a1a}
.slot.yellow{background:#d4af37;color:#000;border-color:#d4af37}
.slot.green{background:#16a34a;color:#fff;border-color:#16a34a}
.slot.red{background:#dc2626;color:#fff;border-color:#dc2626}
/* QUADRADO VERMELHO DIMINUIDO */
.historyBox{background:#0a2a1a;margin:4px 6px;border:2px solid #3b82f6;border-radius:10px;padding:5px;flex:0 130px;overflow-y:auto;display:flex;gap:5px}
.colBox{flex:1;background:#0f2e1f;border-radius:6px;padding:3px;overflow-y:auto}
/* TITULO COLUNA/DUZIA DIMINUIDO - VERDE QUE VOCE MARCOU */
.colTitle{color:#fff;background:#000;border-radius:8px;padding:1px 6px;font-size:9px;font-weight:900;text-align:center;margin-bottom:4px}
.colTitle.duzia{background:#fff;color:#000}
/* GRUPOS COM 5 QUADRADINHOS */
.group{background:#112e20;border:1px solid #2a5a3a;border-radius:6px;padding:3px;margin-bottom:4px}
.group.active{border-color:#16a34a;background:#0f3d25}
.groupHead{font-size:8px;color:#d4af37;font-weight:900;text-align:center;margin-bottom:2px}
.squares5{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.sq{height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;color:#fff}
.sq.empty{background:#1a3d2a;border:1px dashed #2a5a3a}
.sq.green{background:#16a34a}
.sq.red{background:#dc2626}
.bottom{flex:1;display:flex;flex-direction:column;padding:6px}
.keypad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{width:100%;height:100%;min-height:58px;border-radius:12px;border:none;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.k:active{transform:scale(0.95)}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:13px;font-weight:900}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP COACH DA ROLETA</h1></div>
<div class="top2"><div class="slot" id="slotY">VAZIO</div><div class="slot" id="slotR">VAZIO</div></div>
<div class="historyBox">
<div class="colBox"><div class="colTitle">COLUNA</div><div id="colGroups"></div></div>
<div class="colBox"><div class="colTitle duzia">DUZIA</div><div id="duzGroups"></div></div>
</div>
<div class="bottom">
<div class="keypad">
<button type="button" class="k num" onclick="addN('1')">1</button>
<button type="button" class="k num" onclick="addN('2')">2</button>
<button type="button" class="k num" onclick="addN('3')">3</button>
<button type="button" class="k num" onclick="addN('4')">4</button>
<button type="button" class="k num" onclick="addN('5')">5</button>
<button type="button" class="k num" onclick="addN('6')">6</button>
<button type="button" class="k num" onclick="addN('7')">7</button>
<button type="button" class="k num" onclick="addN('8')">8</button>
<button type="button" class="k num" onclick="addN('9')">9</button>
<button type="button" class="k act" onclick="enterN()">ENTER</button>
<button type="button" class="k zero" onclick="addN('0')">0</button>
<button type="button" class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
</div>
<script>
let cur='', colGroups=[], duzGroups=[], curGroupIdx=-1;
const tabela={1:"C2/3",2:"C1/2",3:"C1/2",4:"C3",5:"C2/3",6:"C1/2",7:"C2/3",8:"C1/2",9:"C1",10:"C2/3",11:"C1/3",12:"C2/3",13:"C2",14:"C1",15:"C1/3",16:"C1/3",17:"C1/3",18:"C2/3",19:"C1/2",20:"C1/2",21:"C1",22:"C3",23:"C3",24:"C2/3",25:"C2",26:"C1",27:"C1/3",28:"C2/3",29:"C1/3",30:"C2/3",31:"C2",32:"C1/2",33:"C1",34:"C3",35:"C2/3",36:"C1/2"};
function getAlvo(n){return tabela[n]||"";}
function getColReal(n){if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;return 0;}
function getDuzReal(n){if(n>=1&&n<=12)return 1;if(n>=13&&n<=24)return 2;if(n>=25&&n<=36)return 3;return 0;}
function getAlvos(a){if(!a)return[];let t=a.replace('C','');if(t.includes('/'))return t.split('/').map(x=>parseInt(x));return[parseInt(t)];}
const slotY=document.getElementById('slotY'),slotR=document.getElementById('slotR'),elCol=document.getElementById('colGroups'),elDuz=document.getElementById('duzGroups');

function render(preview){
if(preview){
 if(curGroupIdx===-1 || colGroups[curGroupIdx].results.length>=5){
   slotY.className='slot yellow'; slotY.textContent=preview.num+' '+preview.alvo; slotR.className='slot'; slotR.textContent='NOVO SINAL';
 }else{
   let g=colGroups[curGroupIdx];
   slotY.className='slot yellow'; slotY.textContent=g.num+' '+g.alvo;
   let cr=getColReal(preview.num), ca=getAlvos(g.alvo);
   slotR.className='slot '+(ca.includes(cr)?'green':'red'); slotR.textContent=preview.num;
 }
}else{
 if(colGroups.length===0){slotY.className='slot';slotY.textContent='VAZIO';slotR.className='slot';slotR.textContent='VAZIO';}
 else{
   let g=colGroups[colGroups.length-1];
   if(curGroupIdx===-1 || colGroups[curGroupIdx].results.length>=5){
     slotY.className='slot yellow'; slotY.textContent=g.num+' '+g.alvo; slotR.className='slot'; slotR.textContent='AGUARDE';
   }else{
     slotY.className='slot yellow'; slotY.textContent=g.num+' '+g.alvo;
     if(g.results.length>0){
       let last=g.results[g.results.length-1];
       slotR.className='slot '+last.color; slotR.textContent=last.num;
     }else{slotR.className='slot'; slotR.textContent='...';}
   }
 }
}
elCol.innerHTML=''; elDuz.innerHTML='';
colGroups.forEach((g,idx)=>{
 let div=document.createElement('div'); div.className='group '+(idx===curGroupIdx && g.results.length<5 ? 'active':'');
 let head=document.createElement('div'); head.className='groupHead'; head.textContent=g.num+' '+g.alvo; div.appendChild(head);
 let grid=document.createElement('div'); grid.className='squares5';
 for(let i=0;i<5;i++){
   let sq=document.createElement('div');
   if(g.results[i]){sq.className='sq '+g.results[i].color; sq.textContent=g.results[i].num;}
   else{sq.className='sq empty'; sq.textContent='';}
   grid.appendChild(sq);
 }
 div.appendChild(grid); elCol.appendChild(div);
});
duzGroups.forEach((g,idx)=>{
 let div=document.createElement('div'); div.className='group '+(idx===curGroupIdx && g.results.length<5 ? 'active':'');
 let head=document.createElement('div'); head.className='groupHead'; head.textContent=g.num+' '+g.alvo; div.appendChild(head);
 let grid=document.createElement('div'); grid.className='squares5';
 for(let i=0;i<5;i++){
   let sq=document.createElement('div');
   if(g.results[i]){sq.className='sq '+g.results[i].color; sq.textContent=g.results[i].num;}
   else{sq.className='sq empty'; sq.textContent='';}
   grid.appendChild(sq);
 }
 div.appendChild(grid); elDuz.appendChild(div);
});
}

function addN(d){
if(cur.length>=2) return; cur+=d;
if(cur==="0"||cur==="00"){render({num:cur,alvo:""});return;}
let v=parseInt(cur); if(isNaN(v)) return; if(v>36){cur=d; v=parseInt(cur);} render({num:v,alvo:getAlvo(v)});
}
function enterN(){
if(cur==='') return;
if(cur==="0"||cur==="00"){colGroups=[];duzGroups=[];curGroupIdx=-1;cur='';render();return;}
let v=parseInt(cur); if(isNaN(v)||v<1||v>36){cur='';render();return;}
if(curGroupIdx===-1 || colGroups[curGroupIdx].results.length>=5){
 // NOVO SINAL - CRIA QUADRADO COM 5 VAZIOS
 colGroups.push({num:v,alvo:getAlvo(v),results:[]});
 duzGroups.push({num:v,alvo:getAlvo(v),results:[]});
 curGroupIdx=colGroups.length-1;
}else{
 // RESULTADO - MARCA VERDE/VERMELHO DENTRO DOS 5 QUADRADINHOS
 let g=colGroups[curGroupIdx]; let alvo=g.alvo; let ca=getAlvos(alvo);
 let cr=getColReal(v); let dr=getDuzReal(v);
 colGroups[curGroupIdx].results.push({num:v,color:ca.includes(cr)?'green':'red'});
 duzGroups[curGroupIdx].results.push({num:v,color:ca.includes(dr)?'green':'red'});
}
cur='';render();
}
function corrige(){
if(cur!==''){cur=cur.slice(0,-1); render(cur?{num:parseInt(cur),alvo:getAlvo(parseInt(cur))}:null); return;}
if(curGroupIdx===-1) return;
let g=colGroups[curGroupIdx];
if(g.results.length>0){g.results.pop(); duzGroups[curGroupIdx].results.pop();}
else{colGroups.pop(); duzGroups.pop(); curGroupIdx=colGroups.length-1;}
render();
}
render();
</script>
</body>
</html>
