<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>RAFIGASP</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}html,body{height:100%;overflow:hidden}::-webkit-scrollbar{display:none}body{background:#000;display:flex;justify-content:center}.app{width:100%;max-width:400px;background:#000;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.topo{height:36px;background:linear-gradient(180deg,#f7e8a5,#d4af37);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}.topo h1{font-size:18px;font-weight:900}.topo span{font-size:7px;letter-spacing:2px}.menu{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px;padding:3px;flex-shrink:0}.menu button{height:28px;border-radius:5px;border:1px solid #d4af37;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:9px;font-weight:800}.barra-verm{background:linear-gradient(180deg,#ff3333,#991111);border:1px solid gold;text-align:center;color:#fff;font-weight:900;padding:2px;margin:0 3px;border-radius:5px;min-height:32px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.barra-dig{display:grid;grid-template-columns:1fr 98px;gap:3px;margin:4px 3px;min-height:44px;flex-shrink:0}.barra-dig .esq{background:#ffff00;border:2px solid gold;color:#000;font-weight:900;border-radius:8px;display:flex;align-items:center;justify-content:flex-start;padding:0 8px;gap:6px;font-size:20px;overflow:hidden}.barra-dig .esq .chips-mini{display:flex;gap:3px;align-items:center;flex-wrap:nowrap}.mini-chip{width:22px;height:22px;min-width:22px;border-radius:4px;border:1px solid #000;display:flex;align-items:center;justify-content:center}.mini-chip.C{background:#00aa00}.mini-chip.E{background:#ff0000}.barra-dig .dir-black{background:#111;border:2px solid #fff;color:#fff;font-weight:900;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}.hist{display:flex;gap:4px;padding:4px;overflow-x:auto;background:#111;min-height:36px;align-items:center;flex-shrink:0}.chip{min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:1px solid gold;font-size:12px;flex-shrink:0}.chip.C{background:#00c800}.chip.E{background:#c80000}.chip.zero{background:#00aa00;border:2px solid gold}.chip-sep{min-width:10px;flex-shrink:0}.card-verm{margin:2px 3px;background:linear-gradient(180deg,#ff4444,#cc0000);border:1px solid #d4af37;border-radius:8px;padding:4px;text-align:center;flex-shrink:0}.big{color:#ffff00;font-size:32px;font-weight:900;line-height:1}.placar{display:flex;justify-content:space-between;background:#000;border-radius:4px;padding:2px 8px;margin-top:2px}.verde{color:#00ff00;font-size:18px;font-weight:900}.verm{color:#ff3333;font-size:18px;font-weight:900}.hist-result{background:#000;border-radius:4px;padding:4px;display:flex;gap:4px;overflow-x:auto;min-height:34px;border:1px solid #333;margin-top:3px;align-items:center;flex-shrink:0}.hr-quad{width:calc((100% - 80px)/10);height:32px;margin-right:4px;margin-bottom:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#fff;border:1px solid #fff;flex-shrink:0;box-sizing:border-box}.hr-quad.C{background:#00c800}.hr-quad.E{background:#c80000}.hr-quad.zero{background:#00aa00}.linha-num{display:grid;grid-template-columns:70px 1fr;gap:4px;padding:5px 8px;border-bottom:1px solid #222;align-items:center}.linha-num b{color:#fff;font-size:13px}.linha-num .seq{display:flex;gap:3px;flex-wrap:wrap}.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:4px;background:#1a1a0a;border-top:1px solid #d4af37;flex-shrink:0}.b{border-radius:8px;border:1px solid #8a6a1a;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:24px;font-weight:900;min-height:50px}.b:active{transform:scale(0.96)}.pagina{display:none;flex:1;flex-direction:column;overflow:hidden}.pagina.ativa{display:flex}.boasorte{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background-image:url('capa.jpg');background-size:cover;background-position:center top;padding:20px;padding-bottom:80px;position:relative;background-color:#000}.boasorte::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(0,0,0,0.1),rgba(0,0,0,0.5))}.btn-jogar{position:relative;z-index:2;width:90%;height:54px;background:linear-gradient(180deg,#f7e8a5,#d4af37);border:2px solid gold;border-radius:12px;font-size:20px;font-weight:900}
.tapete-wrap{flex:1;overflow-y:auto;background:#0a5a0a;padding:4px;display:flex;justify-content:center}
.tapete{display:grid;grid-template-columns:48px 48px 1fr 1fr 1fr;grid-template-rows:36px repeat(12,30px) 32px;gap:2px;width:100%;max-width:360px;background:#fff;padding:2px;border:2px solid gold}
.cell{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;border:1px solid #fff;position:relative}
.cell.green{background:#1a8a1a;color:#fff;font-size:10px}.cell.red{background:#cc0000;color:#fff}.cell.black{background:#111;color:#fff}.cell.zero{grid-column:3/6;background:#1a8a1a;color:#fff;font-size:18px}.cell.doz{font-size:9px}
.cell.marcado{outline:3px solid gold;outline-offset:-2px;background:#ffff00!important;color:#000!important;box-shadow:0 0 10px gold;z-index:2}
.cell.marcado::after{content:attr(data-vezes);position:absolute;top:-6px;right:-6px;background:gold;color:#000;font-size:9px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #000}
.cell.ultimo{animation:pulse 0.6s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.bloco10{display:flex;flex-wrap:wrap;padding:6px 3px;width:100%;border-bottom:1px solid #222;align-items:center;box-sizing:border-box;justify-content:flex-start}
.bloco10 .hr-quad:nth-child(2n){margin-right:10px}
.bloco10 .hr-quad:nth-child(10n){margin-right:0}
</style></head><body><div class="app"><div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div><div class="menu"><button onclick="irPara(1)">🏠 INICIO</button><button onclick="apagar()">⬅️ APAGAR</button><button onclick="limparTudoGeral()">🗑️ LIMPAR</button><button onclick="proximaPagina()">➡️ PROX</button></div><div id="pag1" class="pagina ativa"><div class="boasorte"><button class="btn-jogar" onclick="irPara(2)">Começar a jogar</button></div></div><div id="pag2" class="pagina"><div class="barra-verm" id="barra">BOA SORTE</div><div class="hist" id="hist-top"></div><div class="card-verm"><div style="color:#fff;font-size:9px;font-weight:900">VEM COLUNA</div><div class="big" id="sinal">BOA SORTE</div><div class="placar"><div><b style="font-size:8px;color:gold">✅ ACERTOU</b><div class="verde" id="ac">0</div></div><div><b style="font-size:8px;color:gold">❌ ERROU</b><div class="verm" id="er">0</div></div></div><div class="hist-result" id="hist-result"></div></div><div class="teclado">

</div></div><div id="pag3" class="pagina"><h2 style="color:gold;text-align:center;font-size:13px;padding:6px;flex-shrink:0">GERAL - 10 POR LINHA</h2><div id="lista-geral" style="display:flex;flex-direction:column;padding:0;flex:1;overflow-y:auto;background:#000"></div><div class="barra-dig"><div class="esq" id="num-col"><span id="txt-col">_</span><div class="chips-mini" id="chips-col"></div></div><div class="dir-black" id="mkt-val">R$: 0,10</div></div><div class="teclado">
<button class="b" onclick="dig(1)">1</button><button class="b" onclick="dig(2)">2</button><button class="b" onclick="dig(3)">3</button>

<button class="b" onclick="dig(7)">7</button><button class="b" onclick="dig(8)">8</button><button class="b" onclick="dig(9)">9</button>

</div></div><div id="pag4" class="pagina"><h2 style="color:gold;text-align:center;font-size:11px;padding:6px;flex-shrink:0">POR NÚMERO - MKT COM ERRO</h2><div id="lista-numeros" style="flex:1;overflow-y:auto;background:#0a0a0a;padding-bottom:4px"></div><div class="barra-dig"><div class="esq" id="num-col-4"><span id="txt-col-4">_</span><div class="chips-mini" id="chips-col-4"></div></div><div class="dir-black" id="mkt-val-4">R$: 0,10</div></div><div class="teclado">

<button class="b" onclick="dig(4)">4</button><button class="b" onclick="dig(5)">5</button><button class="b" onclick="dig(6)">6</button>

</div></div><div id="pag5" class="pagina"><h2 style="color:gold;text-align:center;font-size:12px;padding:5px;flex-shrink:0">TAPETE - MARCA AUTOMÁTICA</h2><div class="tapete-wrap"><div class="tapete" id="tapete">
<div class="cell green" style="grid-column:1;grid-row:2/4">1-18</div><div class="cell green" style="grid-column:1;grid-row:4/6">EVEN</div><div class="cell green" style="grid-column:1;grid-row:6/8">♦️</div><div class="cell green" style="grid-column:1;grid-row:8/10">♠️</div><div class="cell green" style="grid-column:1;grid-row:10/12">ODD</div><div class="cell green" style="grid-column:1;grid-row:12/14">19-36</div>
<div class="cell green doz" style="grid-column:2;grid-row:2/6">1st 12</div><div class="cell green doz" style="grid-column:2;grid-row:6/10">2nd 12</div><div class="cell green doz" style="grid-column:2;grid-row:10/14">3rd 12</div>
<div class="cell zero" id="cell-0">0</div><div class="cell green" style="grid-column:3;grid-row:14">2-1</div><div class="cell green" style="grid-column:4;grid-row:14">2-1</div><div class="cell green" style="grid-column:5;grid-row:14">2-1</div>
</div></div><div class="barra-dig"><div class="esq" id="num-col-5"><span id="txt-col-5">_</span><div class="chips-mini" id="chips-col-5"></div></div><div class="dir-black" id="mkt-val-5">R$: 0,10</div></div><div class="teclado">
<button class="b" onclick="dig(1)">1</button><button class="b" onclick="dig(2)">2</button><button class="b" onclick="dig(3)">3</button>
<button class="b" onclick="dig(4)">4</button><button class="b" onclick="dig(5)">5</button><button class="b" onclick="dig(6)">6</button>
<button class="b" onclick="dig(7)">7</button><button class="b" onclick="dig(8)">8</button><button class="b" onclick="dig(9)">9</button>

</div></div></div><script>
const TABELA={1:"2/3",2:"1/2",3:"1/2",4:"1/2",5:"2/3",6:"1/2",7:"2/3",8:"1/2",9:"2/3",10:"2/3",11:"1/3",12:"2/3",13:"1/3",14:"2/3",15:"1/3",16:"1/3",17:"1/3",18:"2/3",19:"1/2",20:"1/2",21:"2/3",22:"1/2",23:"1/2",24:"2/3",25:"1/3",26:"2/3",27:"1/3",28:"2/3",29:"1/3",30:"2/3",31:"1/3",32:"1/2",33:"2/3",34:"1/2",35:"2/3",36:"1/2",0:"ZERO"};
const CORES={1:'black',2:'red',3:'black',4:'red',5:'black',6:'red',7:'black',8:'red',9:'black',10:'red',11:'black',12:'red',13:'black',14:'red',15:'black',16:'red',17:'black',18:'red',19:'black',20:'red',21:'black',22:'black',23:'red',24:'black',25:'red',26:'black',27:'red',28:'black',29:'black',30:'red',31:'black',32:'red',33:'black',34:'red',35:'black',36:'red'};
let buf="";let ac=0,er=0;let colunaAlvo="BOA SORTE";let paginaAtual=1;let geral=JSON.parse(localStorage.getItem('rafigasp_geral')||'[]');let historicoNumeros=[];let historicoDetalhes=[];let ultimoNum="_";let ultimoNumInt=null;let marketing=0.10;let stats=JSON.parse(localStorage.getItem('rafigasp_stats')||'{}');let contagem=JSON.parse(localStorage.getItem('rafigasp_contagem')||'{}');
function getColunaReal(n){if(n==0)return 0;const c1=[1,4,7,10,13,16,19,22,25,28,31,34];const c2=[2,5,8,11,14,17,20,23,26,29,32,35];if(c1.includes(n))return 1;if(c2.includes(n))return 2;return 3;}
function calcularMarketing(){let streak=0;for(let it of historicoDetalhes){if(it.num===0) continue; if(it.acertou) break; streak++;}let vals=[0.10,0.20,0.40,0.80,1.60];marketing=vals[Math.min(streak,4)];if(historicoDetalhes.length==0)marketing=0.10;let vTxt="R$: "+marketing.toFixed(2).replace('.',',');['mkt-val','mkt-val-4','mkt-val-5'].forEach(id=>{let el=document.getElementById(id);if(el)el.innerText=vTxt});}
function irPara(n){document.querySelectorAll('.pagina').forEach(p=>p.classList.remove('ativa'));document.getElementById('pag'+n).classList.add('ativa');paginaAtual=n;if(n==3)renderGeral();if(n==4)renderNumeros();if(n==5)renderTapete();}
function proximaPagina(){irPara(paginaAtual>=5?1:paginaAtual+1);}
function recalcular(){ac=0;er=0;historicoDetalhes.forEach((it,i)=>{if(i==historicoDetalhes.length-1) return; if(it.num===0) return; if(it.acertou) ac++; else er++;});document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;}
function renderHist(){let h=document.getElementById('hist-top');h.innerHTML='';let hr=document.getElementById('hist-result');hr.innerHTML='';let total=historicoDetalhes.length;for(let i=total-1;i>=0;i--){let it=historicoDetalhes[i];let cls='chip ';if(it.num===0)cls+='zero';else cls+=(i==total-1?'C':(it.acertou?'C':'E'));let d=document.createElement('div');d.className=cls;d.textContent=it.num;h.prepend(d);let cls2='hr-quad ';if(it.num===0)cls2+='zero';else cls2+=(i==total-1?'C':(it.acertou?'C':'E'));let q=document.createElement('div');q.className=cls2;q.style.width='28px';q.style.minWidth='auto';q.style.marginRight='0';q.style.marginBottom='0';q.textContent=it.num;hr.prepend(q);let posFromStart=total-1-i;if((posFromStart+1)%2==0 && i!=0){let sep=document.createElement('div');sep.className='chip-sep';h.prepend(sep);let sep2=document.createElement('div');sep2.className='chip-sep';hr.prepend(sep2);}}}
function atualizaSinal(){if(historicoNumeros.length>0 && historicoNumeros[0]!==0){colunaAlvo=TABELA[historicoNumeros[0]]||"BOA SORTE";}else if(historicoNumeros[0]===0){colunaAlvo="ZERO";}else{colunaAlvo="BOA SORTE";}let sinalEl=document.getElementById('sinal');if(colunaAlvo==="ZERO"){sinalEl.innerText="ZERO";sinalEl.style.color="#00ff00";}else{sinalEl.innerText=colunaAlvo;sinalEl.style.color="#ffff00";}document.getElementById('barra').innerText=colunaAlvo=="BOA SORTE"?"BOA SORTE":colunaAlvo=="ZERO"?"ZERO":"VEM COLUNA "+colunaAlvo;}
function renderChipsForNum(num){let ids=['chips-col','chips-col-4','chips-col-5'];let hist=stats[num]||[];ids.forEach(id=>{let el=document.getElementById(id);if(!el)return;el.innerHTML='';hist.slice(-6).forEach(v=>{let d=document.createElement('div');d.className='mini-chip '+(v?'C':'E');el.appendChild(d);});});}
function atualizaBarra(){let el=document.getElementById('barra');let txtIds=['txt-col','txt-col-4','txt-col-5'];if(buf.length>0){let n=parseInt(buf);if(isNaN(n)) n=null;let txt=buf;if(n!==null && TABELA[n]!==undefined){txt=n+"> "+TABELA[n];}el.innerHTML=txt;if(txtIds[0]){txtIds.forEach(id=>{let e=document.getElementById(id);if(e)e.innerText=txt});}if(n!==null){renderChipsForNum(n);}}else{txtIds.forEach(id=>{let e=document.getElementById(id);if(e)e.innerText=ultimoNum});if(ultimoNumInt!==null){renderChipsForNum(ultimoNumInt);}} }
function dig(n){if(buf.length<2)buf+=n;let v=parseInt(buf);if(!isNaN(v)&&v>36){buf=buf.slice(0,-1);}atualizaBarra();}
function apagar(){if(buf.length>0){buf=buf.slice(0,-1);if(buf.length>0)atualizaBarra();else{let u=ultimoNum;['txt-col','txt-col-4','txt-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerText=u});if(ultimoNumInt!==null)renderChipsForNum(ultimoNumInt);}}}
function limpar(){document.getElementById('hist-top').innerHTML='';document.getElementById('hist-result').innerHTML='';ac=0;er=0;historicoNumeros=[];historicoDetalhes=[];buf="";ultimoNum="_";ultimoNumInt=null;marketing=0.10;document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;colunaAlvo="BOA SORTE";atualizaSinal();renderChipsForNum(null);calcularMarketing();}
function limparGeral(){geral=[];stats={};contagem={};localStorage.setItem('rafigasp_geral',JSON.stringify(geral));localStorage.setItem('rafigasp_stats',JSON.stringify(stats));localStorage.setItem('rafigasp_contagem',JSON.stringify(contagem));renderGeral();renderNumeros();renderTapete();['txt-col','txt-col-4','txt-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerText="_"});['chips-col','chips-col-4','chips-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerHTML=""});}
function limparTudoGeral(){limpar();limparGeral();['txt-col','txt-col-4','txt-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerText="_"});['chips-col','chips-col-4','chips-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerHTML=""});}
function renderGeral(){
let div=document.getElementById('lista-geral');
div.innerHTML='';
if(geral.length==0)return;
let bloco=null;
geral.forEach((item, idx)=>{
if(idx%10==0){
bloco=document.createElement('div');
bloco.className='bloco10';
div.appendChild(bloco);
}
let cls='hr-quad '+(item.num===0?'zero':(item.acertou?'C':'E'));
let q=document.createElement('div');
q.className=cls;
q.textContent=item.num;
bloco.appendChild(q);
});
}
function renderNumeros(){let div=document.getElementById('lista-numeros');if(!div) return;div.innerHTML='';for(let n=1;n<=36;n++){let col=TABELA[n];let hist=stats[n]||[];let row=document.createElement('div');row.className='linha-num';let b=document.createElement('b');b.textContent=n+"> "+col;let seqDiv=document.createElement('div');seqDiv.className='seq';hist.slice(-8).forEach(v=>{let s=document.createElement('div');s.className='hr-quad '+(v?'C':'E');s.textContent=v?'✔':'✖';s.style.width='22px';s.style.minWidth='22px';s.style.height='22px';s.style.marginRight='0';s.style.marginBottom='0';s.style.fontSize='10px';seqDiv.appendChild(s);});row.appendChild(b);row.appendChild(seqDiv);div.appendChild(row);}}
function renderTapete(){let tapete=document.getElementById('tapete');if(!tapete) return;let existentes=document.querySelectorAll('.cell.num');existentes.forEach(e=>e.remove());for(let r=0;r<12;r++){for(let c=0;c<3;c++){let num=r*3 + c + 1;let div=document.createElement('div');div.className='cell num '+CORES[num];div.id='cell-'+num;div.textContent=num;div.style.gridColumn=(3+c);div.style.gridRow=(2+r);if(contagem[num]){div.classList.add('marcado');div.setAttribute('data-vezes',contagem[num]);}if(historicoNumeros[0]==num)div.classList.add('ultimo');tapete.appendChild(div);}}let cell0=document.getElementById('cell-0');if(cell0){if(contagem[0]){cell0.classList.add('marcado');cell0.setAttribute('data-vezes',contagem[0]);}else{cell0.classList.remove('marcado');}if(historicoNumeros[0]==0)cell0.classList.add('ultimo');else cell0.classList.remove('ultimo');}}
function corrigir(){if(buf.length>0){buf=buf.slice(0,-1);if(buf.length>0)atualizaBarra();else{let u=ultimoNum;['txt-col','txt-col-4','txt-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerText=u});if(ultimoNumInt!==null)renderChipsForNum(ultimoNumInt);}return;}if(historicoDetalhes.length>0){let prevNum=historicoNumeros[1];if(prevNum!==undefined && stats[prevNum]){stats[prevNum].pop();localStorage.setItem('rafigasp_stats',JSON.stringify(stats));}let numRem=historicoNumeros[0];if(contagem[numRem]){contagem[numRem]--;if(contagem[numRem]<=0)delete contagem[numRem];localStorage.setItem('rafigasp_contagem',JSON.stringify(contagem));}historicoDetalhes.shift();historicoNumeros.shift();geral.shift();localStorage.setItem('rafigasp_geral',JSON.stringify(geral));localStorage.setItem('rafigasp_stats',JSON.stringify(stats));if(historicoNumeros.length>0){ultimoNumInt=historicoNumeros[0];ultimoNum=ultimoNumInt+"> "+(TABELA[ultimoNumInt]||"");}else{ultimoNumInt=null;ultimoNum="_";}['txt-col','txt-col-4','txt-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerText=ultimoNum});if(ultimoNumInt!==null)renderChipsForNum(ultimoNumInt);else{['chips-col','chips-col-4','chips-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerHTML=""});}renderHist();recalcular();atualizaSinal();renderGeral();renderNumeros();renderTapete();calcularMarketing();}}
function enter(){if(buf==="")return;let num=parseInt(buf);if(isNaN(num)||num<0||num>36){buf="";atualizaBarra();return;}let colReal=getColunaReal(num);let acertou=false;if(historicoNumeros.length>0 && colunaAlvo!=="ZERO" && colunaAlvo!=="BOA SORTE"){let alvoAnterior=colunaAlvo.split('/').map(Number);if(!isNaN(alvoAnterior[0]))acertou=alvoAnterior.includes(colReal);}let txt=num+"> "+(TABELA[num]||"ZERO");ultimoNum=txt;ultimoNumInt=num;['txt-col','txt-col-4','txt-col-5'].forEach(id=>{let e=document.getElementById(id);if(e)e.innerText=txt});if(historicoNumeros.length>0){let trigger=historicoNumeros[0];if(!stats[trigger])stats[trigger]=[];stats[trigger].push(acertou);localStorage.setItem('rafigasp_stats',JSON.stringify(stats));}contagem[num]=(contagem[num]||0)+1;localStorage.setItem('rafigasp_contagem',JSON.stringify(contagem));historicoNumeros.unshift(num);historicoDetalhes.unshift({num:num,acertou:acertou,col:colReal});geral.unshift({num:num,acertou:acertou});localStorage.setItem('rafigasp_geral',JSON.stringify(geral));renderHist();if(historicoDetalhes.length>1){if(acertou)ac++;else if(num!==0 || historicoNumeros.length>1)er++;}document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;buf="";atualizaSinal();renderGeral();renderNumeros();renderTapete();renderChipsForNum(num);calcularMarketing();if(navigator.vibrate)navigator.vibrate(50);}
(function initTapete(){let tapete=document.getElementById('tapete');for(let r=0;r<12;r++){for(let c=0;c<3;c++){let num=r*3 + c + 1;let div=document.createElement('div');div.className='cell num '+CORES[num];div.id='cell-'+num;div.textContent=num;div.style.gridColumn=(3+c);div.style.gridRow=(2+r);tapete.appendChild(div);}}})();
atualizaSinal();renderGeral();renderNumeros();renderTapete();calcularMarketing();
</script></body></html>
