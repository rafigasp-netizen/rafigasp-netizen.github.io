<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d2818;display:flex;justify-content:center;font-family:Arial}
.app{width:100%;max-width:420px;min-height:100dvh;background:#0d2818;border:2px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:10px;text-align:center}
.topo h1{color:#000;font-size:20px;font-weight:900}
.topo span{font-size:11px;color:#4a3410;font-weight:800;display:block}
.history{background:#0f2e1f;padding:10px}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hslot{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}
.hslot.empty{border:2px dashed #d4af37;background:rgba(212,175,55,0.1)}
.hslot.empty.next{border:3px solid #fff;background:rgba(255,255,255,0.25)}
.hslot.yellow{background:#d4af37!important;color:#000!important}
.hslot.green{background:#16a34a!important;color:#fff!important}
.hslot.red{background:#dc2626!important;color:#fff!important}
.hslot.preview{outline:3px solid #fff}
.bottom{padding:10px;display:flex;flex-direction:column;gap:8px}
.blue-box{border:3px solid #3b82f6;border-radius:14px;padding:8px;background:#0a2a1a;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:90px}
.blue-card{background:#123524;border-radius:10px;padding:6px;display:flex;align-items:center;gap:4px;min-height:44px;flex-wrap:wrap;opacity:0}
.blue-card.hasData{opacity:1}
.blue-card.active{opacity:1;border:2px solid #d4af37;background:#1a3d26}
.blue-card .label{color:#d4af37;font-weight:900;font-size:10px}
.blue-card .b{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900}
.b.green{background:#16a34a}.b.red{background:#dc2626}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{height:58px;border-radius:14px;border:none;font-weight:900;font-size:20px}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:11px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP</h1><span>AUTO - RESULTADO VIRA AMARELO</span><span id="nextInfo">DIGITE 1º AMARELO</span></div>
<div class="history"><div class="hist-grid" id="grid"></div></div>
<div class="bottom">
<div class="blue-box" id="blueBox"></div>
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
</div>
<script>
let history=[],cur='';
const SEQ=[0,4,1,5,2,6,3,7,8,12,9,13,10,14,11,15];
const grid=document.getElementById('grid');
const blueBox=document.getElementById('blueBox');
const nextInfo=document.getElementById('nextInfo');
const gC23=[6,9,11,14,16,17,19,21,26,29,33,36];
const gC13=[2,3,5,8,10,13,20,25,28,31,32,35];
const gC12=[1,4,7,12,15,18,22,23,24,27,30,34];
function getAlvo(n){if(gC23.includes(n))return "C2/3";if(gC13.includes(n))return "C1/3";if(gC12.includes(n))return "C1/2";return "";}
function getColunaReal(n){if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;return 0;}
function getColunasDoAlvo(a){if(a=="C1/3")return [1,3];if(a=="C2/3")return [2,3];if(a=="C1/2")return [1,2];return [];}
function getBadge(h, alvo){
let cr=getColunaReal(h.num);
let ca=getColunasDoAlvo(alvo);
let cls=ca.includes(cr)?'green':'red';
return '<div class="b '+cls+'">'+h.num+'</div>';
}
function render(preview){
if(!preview) preview=null;
grid.innerHTML='';
let posToLog={};
SEQ.forEach(function(p,i){posToLog[p]=i;});
let isYellowNext = history.length%2===0;
nextInfo.textContent = history.length==0 ? "DIGITE 1º AMARELO (ex: 1)" : (isYellowNext ? "PROXIMO: AMARELO AUTO" : "DIGITE RESULTADO VERDE (ex: 2) + ENTER");
for(let phys=0;phys<16;phys++){
let d=document.createElement('div');
let logIdx=posToLog[phys];
let isYellowPhys=(phys<4 || (phys>=8 && phys<12));
let isNext=history.length<16 && SEQ[history.length]==phys;
if(isNext && preview){
let v=preview.num;
if(v==="00"){d.className='hslot yellow preview';d.textContent='00';}
else if(isYellowPhys){d.className='hslot yellow preview';d.textContent=v+' '+preview.alvo;}
else{
let header=history[logIdx-1];
let cr=getColunaReal(v);
let ca=getColunasDoAlvo(header.alvo);
d.textContent=v;
d.className='hslot '+(ca.includes(cr)?'green':'red')+' preview';
}
grid.appendChild(d);continue;
}
if(logIdx<history.length){
let h=history[logIdx];
if(isYellowPhys){d.className='hslot yellow';d.textContent=h.num+' '+h.alvo;}
else{
let header=history[logIdx-1];
let cr=getColunaReal(h.num);
let ca=getColunasDoAlvo(header.alvo);
d.textContent=h.num;
d.className='hslot '+(ca.includes(cr)?'green':'red');
}
}else{
d.className=isNext?'hslot empty next':'hslot empty';
}
grid.appendChild(d);
}
blueBox.innerHTML='';
let nextPhys=history.length<16?SEQ[history.length]:-1;
for(let col=0;col<4;col++){
let card=document.createElement('div');card.className='blue-card';
let yellowPhys=col;
let resultPhys=col+4;
if(history.length>=8){yellowPhys=8+col; resultPhys=12+col;}
let jy=posToLog[yellowPhys];
let jr=posToLog[resultPhys];
let h=null,r=null;
if(jy<history.length) h=history[jy];
if(jr<history.length) r=history[jr];
let isActive=nextPhys==yellowPhys || nextPhys==resultPhys;
if(isActive && preview){
card.classList.add('active','hasData');
if(preview.num==="00"){card.innerHTML='<span class="label">00 ZERAR</span>';}
else if(nextPhys==yellowPhys){
card.innerHTML='<span class="label">'+preview.num+' '+preview.alvo+'</span>';
}else{
let cr=getColunaReal(preview.num);
let ca=getColunasDoAlvo(h.alvo);
let cls=ca.includes(cr)?'green':'red';
card.innerHTML='<span class="label">'+h.num+' '+h.alvo+'</span><div class="b '+cls+'">'+preview.num+'</div>';
}
}else{
if(h){
card.classList.add('hasData');
let html='<span class="label">'+h.num+' '+h.alvo+'</span>';
if(r) html+=getBadge(r, h.alvo);
card.innerHTML=html;
}
}
blueBox.appendChild(card);
}
}
function addN(n){
if(cur==="0" && n===0){cur="00";render({num:"00",alvo:""});return;}
if(cur==="00"){cur=n.toString();let v=parseInt(cur);render({num:v,alvo:getAlvo(v)});return;}
if(cur.length>=2)return;
cur+=n.toString();
if(cur==="00"){render({num:"00",alvo:""});return;}
let v=parseInt(cur);
render({num:v,alvo:getAlvo(v)});
}
function enterN(){
if(cur==='')return;
if(cur==="00"){history=[];cur='';render();return;}
let v=parseInt(cur);
if(v>36){cur='';render();return;}
if(v===0){history=[];cur='';render();return;}
let alvo=getAlvo(v);
history.push({num:v,alvo:alvo});
// SE ACABOU DE DIGITAR VERDE, JÁ CRIA AMARELO AUTOMATICO COM MESMO NUMERO
if(history.length%2===0 && history.length<16){
let autoNum=v;
let autoAlvo=getAlvo(autoNum);
history.push({num:autoNum, alvo:autoAlvo});
}
cur='';render();
if(history.length>=16){setTimeout(function(){history=[];render();},1500);}
}
function corrige(){
if(cur!=''){cur=cur.slice(0,-1);if(cur==''){render();}else if(cur==="00"){render({num:"00",alvo:""});}else{let v=parseInt(cur);render({num:v,alvo:getAlvo(v)});}}
else if(history.length>0){
history.pop();
// se tirou amarelo auto, tira o verde antes tambem
if(history.length%2===1 && history.length>0){
let last=history[history.length-1];
let prev=history[history.length-2];
if(prev && last && prev.num===last.num && history.length%2===1){
history.pop();
}
}
render();
}
}
render();
</script>
</body>
</html>
