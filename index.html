<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;overflow-x:hidden}
.topo{background:linear-gradient(#ffd700,#b8860b);color:#000;text-align:center;padding:6px}
.topo b{font-size:22px;display:block}.topo span{font-size:10px;letter-spacing:2px}
.botoes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;padding:5px}
.botoes button{background:linear-gradient(#ffe27a,#c89a00);border:none;border-radius:8px;padding:10px 2px;font-weight:bold;font-size:12px}
.barra-vermelha{background:#c00000;color:#fff;text-align:center;padding:6px;font-weight:bold;margin:5px;border-radius:5px}
.hist-top{display:flex;flex-wrap:wrap;gap:2px;padding:5px;min-height:30px}
.chip{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:1px solid #fff}
.chip.C{background:#00b050}.chip.E{background:#c00000}.chip.zero{background:#00b050;border:1px solid yellow}
.chip-sep{width:6px}
.sinal-area{background:#c00000;margin:5px;border-radius:8px;padding:5px;text-align:center}
#sinal{font-size:36px;font-weight:bold;color:#ffff00}
.info{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px;font-size:12px}
#lista-geral{display:flex;flex-direction:column;gap:4px;padding:4px;overflow-x:hidden}
.titulo-geral{text-align:center;color:#ffff00;font-weight:bold;padding:4px;font-size:14px;letter-spacing:1px}
.bloco10{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  width:100%;
  padding:2px 0;
}
.bloco10 .par{
  display:flex;
  gap:2px;
  border:1.5px solid #ffcc00;
  border-radius:7px;
  padding:2px;
  background:rgba(255,255,0,0.05);
}
.hr-quad{
  width:32px !important;
  min-width:32px !important;
  height:30px !important;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:13px;
  margin:0 !important;
  border:1px solid #fff;
}
.hr-quad.C{background:#00b050;color:#fff}
.hr-quad.E{background:#c00000;color:#fff}
.hr-quad.zero{background:#00b050}
.barra-amarela{display:grid;grid-template-columns:1fr auto;gap:5px;margin:5px}
.barra-amarela .txt{background:#ffeb00;color:#000;padding:10px;border-radius:8px;font-weight:bold;font-size:15px;display:flex;gap:4px;align-items:center}
.mini-chip{width:20px;height:14px;border-radius:3px;display:inline-block}
.mini-chip.C{background:#00b050}.mini-chip.E{background:#c00000}
.mkt{background:#000;border:2px solid #fff;color:#fff;border-radius:8px;padding:8px;font-weight:bold;min-width:85px;text-align:center}
.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px}
.teclado button{background:linear-gradient(#ffe27a,#c89a00);border:none;border-radius:8px;padding:16px;font-weight:bold;font-size:20px}
.teclado button.verde{background:linear-gradient(#00d000,#006000);color:#fff}
.pagina{display:none}.pagina.ativa{display:block}
@media (max-width:380px){
  .hr-quad{width:28px !important; min-width:28px !important; height:26px !important; font-size:11px}
  .bloco10{gap:2px}
  .bloco10 .par{gap:1px; padding:1px}
}
</style>
</head>
<body>
<div class="topo"><b>RAFIGASP</b><span>COACH DA ROLETA</span></div>
<div class="botoes"><button onclick="irPara(1)">🏠 INICIO</button><button onclick="apagar()">⬅️ APAGAR</button><button onclick="limpar()">🗑️ LIMPAR</button><button onclick="proximaPagina()">➡️ PROX</button></div>

<div id="pag1" class="pagina ativa">
<div class="barra-vermelha" id="barra">BOA SORTE</div>
<div class="hist-top" id="hist-top"></div>
<div class="sinal-area"><div style="font-size:11px">VEM COLUNA</div><div id="sinal">BOA SORTE</div><div class="info"><div>✔ <b id="ac">0</b></div><div>✖ <b id="er" style="color:#ff0000">0</b></div></div><div class="hist-top" id="hist-result"></div><div style="display:flex;gap:4px;padding:4px"><div id="chips-col"></div><div id="txt-col">_</div></div></div>
</div>

<div id="pag2" class="pagina"><div id="lista-numeros"></div></div>

<div id="pag3" class="pagina">
<!-- TIREI O NOME E COLOQUEI BOA SORTE -->
<div class="titulo-geral" id="titulo-geral">BOA SORTE</div>
<div id="lista-geral"></div>
</div>

<div id="pag4" class="pagina"><div id="tapete"></div></div>
<div id="pag5" class="pagina"><div class="titulo-geral">BOA SORTE</div></div>

<div class="barra-amarela">
<div class="txt"><span id="txt-real">_</span><div id="chips-col-real" style="display:flex;gap:2px"></div></div>
<div class="mkt" id="mkt-val">R$: 0,10</div>
</div>

<div class="teclado">
<button onclick="dig(1)">1</button><button onclick="dig(2)">2</button><button onclick="dig(3)">3</button>
<button onclick="dig(4)">4</button><button onclick="dig(5)">5</button><button onclick="dig(6)">6</button>
<button onclick="dig(7)">7</button><button onclick="dig(8)">8</button><button onclick="dig(9)">9</button>
<button onclick="enter()">ENTER</button><button class="verde" onclick="dig(0)">0</button><button onclick="corrigir()">CORRIGIR</button>
</div>

<script>
const TABELA={1:"2/3",2:"1/2",3:"1/2",4:"1/2",5:"2/3",6:"1/2",7:"2/3",8:"1/2",9:"2/3",10:"2/3",11:"1/3",12:"2/3",13:"1/3",14:"2/3",15:"1/3",16:"1/3",17:"1/3",18:"2/3",19:"1/2",20:"1/2",21:"2/3",22:"1/2",23:"1/2",24:"2/3",25:"1/3",26:"2/3",27:"1/3",28:"2/3",29:"1/3",30:"2/3",31:"1/3",32:"1/2",33:"2/3",34:"1/2",35:"2/3",36:"1/2",0:"ZERO"};
let buf="",ac=0,er=0,colunaAlvo="BOA SORTE",paginaAtual=1,geral=JSON.parse(localStorage.getItem('rafigasp_geral')||'[]'),historicoNumeros=[],historicoDetalhes=[],ultimoNum="_",ultimoNumInt=null,marketing=0.10,stats=JSON.parse(localStorage.getItem('rafigasp_stats')||'{}'),contagem=JSON.parse(localStorage.getItem('rafigasp_contagem')||'{}');
function getColunaReal(n){if(n==0)return 0;const c1=[1,4,7,10,13,16,19,22,25,28,31,34],c2=[2,5,8,11,14,17,20,23,26,29,32,35];if(c1.includes(n))return 1;if(c2.includes(n))return 2;return 3;}
function calcularMarketing(){
  let streak=0;for(let it of historicoDetalhes){if(it.num===0)continue;if(it.acertou)break;streak++;}
  if(streak==0)marketing=0.10;else if(streak==1)marketing=0.50;else marketing=0.10;
  if(historicoDetalhes.length==0)marketing=0.10;
  document.getElementById('mkt-val').innerText="R$: "+marketing.toFixed(2).replace('.',',');
}
function irPara(n){document.querySelectorAll('.pagina').forEach(p=>p.classList.remove('ativa'));document.getElementById('pag'+n).classList.add('ativa');paginaAtual=n;if(n==3)renderGeral();}
function proximaPagina(){irPara(paginaAtual>=5?1:paginaAtual+1);}
function recalcular(){ac=0;er=0;historicoDetalhes.forEach((it,i)=>{if(i==historicoDetalhes.length-1)return;if(it.num===0)return;if(it.acertou)ac++;else er++;});document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;}
function renderHist(){let h=document.getElementById('hist-top'),hr=document.getElementById('hist-result');h.innerHTML='';hr.innerHTML='';let total=historicoDetalhes.length;for(let i=total-1;i>=0;i--){let it=historicoDetalhes[i],cls='chip '+(it.num===0?'zero':(i==total-1?'C':(it.acertou?'C':'E'))),d=document.createElement('div');d.className=cls;d.textContent=it.num;h.prepend(d);let cls2='hr-quad '+(it.num===0?'zero':(i==total-1?'C':(it.acertou?'C':'E'))),q=document.createElement('div');q.className=cls2;q.textContent=it.num;hr.prepend(q);if((total-1-i+1)%2==0&&i!=0){let s=document.createElement('div');s.className='chip-sep';h.prepend(s);let s2=document.createElement('div');s2.className='chip-sep';hr.prepend(s2);}}}
function atualizaSinal(){if(historicoNumeros.length>0&&historicoNumeros[0]!==0)colunaAlvo=TABELA[historicoNumeros[0]]||"BOA SORTE";else if(historicoNumeros[0]===0)colunaAlvo="ZERO";else colunaAlvo="BOA SORTE";let s=document.getElementById('sinal');s.innerText=colunaAlvo;document.getElementById('barra').innerText=colunaAlvo=="BOA SORTE"?"BOA SORTE":colunaAlvo=="ZERO"?"ZERO":"VEM COLUNA "+colunaAlvo;let tit=document.getElementById('titulo-geral');if(tit) tit.innerText=colunaAlvo=="BOA SORTE"?"BOA SORTE":colunaAlvo=="ZERO"?"ZERO":"VEM COLUNA "+colunaAlvo;}
function renderChipsForNum(num){let el=document.getElementById('chips-col-real');if(!el)return;el.innerHTML='';let hist=stats[num]||[];hist.slice(-6).forEach(v=>{let d=document.createElement('div');d.className='mini-chip '+(v?'C':'E');el.appendChild(d);});}
function atualizaBarra(){let el=document.getElementById('txt-real');if(buf.length>0){let n=parseInt(buf),txt=buf;if(!isNaN(n)&&TABELA[n]!==undefined)txt=n+"> "+TABELA[n];el.innerText=txt;if(!isNaN(n))renderChipsForNum(n);}else{el.innerText=ultimoNum;if(ultimoNumInt!==null)renderChipsForNum(ultimoNumInt);}}
function dig(n){if(buf.length<2)buf+=n;let v=parseInt(buf);if(!isNaN(v)&&v>36)buf=buf.slice(0,-1);atualizaBarra();}
function apagar(){if(buf.length>0){buf=buf.slice(0,-1);atualizaBarra();}}
function limpar(){document.getElementById('hist-top').innerHTML='';document.getElementById('hist-result').innerHTML='';ac=0;er=0;historicoNumeros=[];historicoDetalhes=[];buf="";ultimoNum="_";ultimoNumInt=null;marketing=0.10;document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;colunaAlvo="BOA SORTE";atualizaSinal();calcularMarketing();}
function renderGeral(){
let div=document.getElementById('lista-geral');div.innerHTML='';if(geral.length==0)return;
let ordered=[...geral].reverse(),chunks=[];for(let i=0;i<ordered.length;i+=10)chunks.push(ordered.slice(i,i+10));
for(let c=chunks.length-1;c>=0;c--){
let chunk=chunks[c],pares=[];for(let i=0;i<chunk.length;i+=2)pares.push(chunk.slice(i,i+2));
pares=pares.reverse().map(p=>[...p].reverse());
let bloco=document.createElement('div');bloco.className='bloco10';
pares.forEach(par=>{let parDiv=document.createElement('div');parDiv.className='par';par.forEach(item=>{let cls='hr-quad '+(item.num===0?'zero':(item.acertou?'C':'E')),q=document.createElement('div');q.className=cls;q.textContent=item.num;parDiv.appendChild(q);});bloco.appendChild(parDiv);});
div.appendChild(bloco);
}
}
function corrigir(){if(buf.length>0){buf=buf.slice(0,-1);atualizaBarra();return;}if(historicoDetalhes.length>0){let prevNum=historicoNumeros[1];if(prevNum!==undefined&&stats[prevNum]){stats[prevNum].pop();localStorage.setItem('rafigasp_stats',JSON.stringify(stats));}historicoDetalhes.shift();historicoNumeros.shift();geral.shift();localStorage.setItem('rafigasp_geral',JSON.stringify(geral));if(historicoNumeros.length>0){ultimoNumInt=historicoNumeros[0];ultimoNum=ultimoNumInt+"> "+(TABELA[ultimoNumInt]||"");}else{ultimoNumInt=null;ultimoNum="_";}document.getElementById('txt-real').innerText=ultimoNum;renderHist();recalcular();atualizaSinal();renderGeral();calcularMarketing();}}
function enter(){if(buf==="")return;let num=parseInt(buf);if(isNaN(num)||num<0||num>36){buf="";atualizaBarra();return;}let colReal=getColunaReal(num),acertou=false;if(historicoNumeros.length>0&&colunaAlvo!=="ZERO"&&colunaAlvo!=="BOA SORTE"){let alvoAnterior=colunaAlvo.split('/').map(Number);if(!isNaN(alvoAnterior[0]))acertou=alvoAnterior.includes(colReal);}let txt=num+"> "+(TABELA[num]||"ZERO");ultimoNum=txt;ultimoNumInt=num;if(historicoNumeros.length>0){let trigger=historicoNumeros[0];if(!stats[trigger])stats[trigger]=[];stats[trigger].push(acertou);localStorage.setItem('rafigasp_stats',JSON.stringify(stats));}contagem[num]=(contagem[num]||0)+1;localStorage.setItem('rafigasp_contagem',JSON.stringify(contagem));historicoNumeros.unshift(num);historicoDetalhes.unshift({num:num,acertou:acertou,col:colReal});geral.unshift({num:num,acertou:acertou});localStorage.setItem('rafigasp_geral',JSON.stringify(geral));renderHist();if(historicoDetalhes.length>1){if(acertou)ac++;else er++;}document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;buf="";atualizaSinal();renderGeral();renderChipsForNum(num);calcularMarketing();document.getElementById('txt-real').innerText=txt;}
atualizaSinal();renderGeral();calcularMarketing();
</script>
</body>
</html>
