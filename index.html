<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP - A B C D E F - FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#001a00;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:100%;max-width:400px;height:100dvh;background:#001a00;display:flex;flex-direction:column;border:2px solid #d4af37}
.topo{text-align:center;background:linear-gradient(180deg,#e8c76a,#b8941f);padding:6px 0 4px;flex-shrink:0}
.topoR{font-weight:900;font-size:28px;color:#111;letter-spacing:1px;line-height:1}
.topoS{font-size:9px;letter-spacing:4px;color:#333;font-weight:800}
.display{margin:5px 6px;background:#000;border:2.5px solid #d4af37;border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;color:#0f8a1f;font-weight:900;font-size:14px;flex-shrink:0}
.display.sinal{background:#ffaa00;color:#000;border-color:#fff;font-size:12px}
.display.vermelho{background:#cc0000;color:#fff;border-color:#ff0000;animation:pisca 0.5s infinite alternate}
@keyframes pisca{0%{background:#cc0000}100%{background:#660000}}
.topHistBar{background:#000;border:1.5px solid #1a4a1a;border-radius:6px;margin:0 4px;padding:4px;display:flex;gap:2px;flex-wrap:wrap;min-height:32px;flex-shrink:0}
.nBox{height:22px;min-width:22px;padding:0 5px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:#fff}
.nBox.green{background:#0f8a2a}
.nBox.red{background:#cc0000}
.nBox.blue{background:#1e40af}
.histContainer{flex:1;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:4px;background:#001a00}
.hCard{background:#0a2a0a;border:1.5px solid #2a5a2a;border-radius:6px;padding:4px}
.hTitle{font-size:10px;font-weight:900;color:#d4af37;margin-bottom:3px;display:flex;gap:4px;align-items:center}
.hTitle b{color:#ffaa00}
.icons{display:flex;gap:1px}
.iconB{width:10px;height:8px;background:#1e40af;border:1px solid #fff;border-radius:1px}
.iconW{width:10px;height:8px;background:#fff;border:1px solid #999;border-radius:1px}
.numRow{display:flex;gap:2px;flex-wrap:wrap;min-height:22px}
.numRow .nBox{height:20px;min-width:20px;padding:0 4px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#fff}
.jogarBar{background:linear-gradient(180deg,#4a0000,#8a0000);border:2px solid #ff4444;border-radius:8px;padding:6px;text-align:center;color:#fff;font-weight:900;font-size:15px;flex-shrink:0;margin:4px}
.kb{background:linear-gradient(180deg,#e8c76a,#b8941f);border-top:2px solid #d4af37;padding:5px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;height:38%;min-height:200px}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.k{border-radius:8px;border:1.5px solid #8a6d1b;font-weight:900;font-size:18px;background:linear-gradient(180deg,#f9e27a,#b8941f);color:#111;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="app">
<div class="topo"><div class="topoR">RAFIGASP</div><div class="topoS">COACH DA ROLETA</div></div>
<div class="display" id="disp">DIGITE O NÚMERO</div>
<div class="topHistBar" id="topHist"></div>
<div class="histContainer">
<div class="hCard"><div class="hTitle"><b>A HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+1) - QUANDO VERMELHO ENTRA C2/3</div><div class="numRow" id="row-A"></div></div>
<div class="hCard"><div class="hTitle"><b>B HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+2)</div><div class="numRow" id="row-B"></div></div>
<div class="hCard"><div class="hTitle"><b>C HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+3)</div><div class="numRow" id="row-C"></div></div>
<div class="hCard"><div class="hTitle"><b>D HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+4)</div><div class="numRow" id="row-D"></div></div>
<div class="hCard"><div class="hTitle"><b>E HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+5)</div><div class="numRow" id="row-E"></div></div>
<div class="hCard"><div class="hTitle"><b>F HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+6)</div><div class="numRow" id="row-F"></div></div>
</div>
<div class="jogarBar" id="jogarBar">JOGAR NA COLUNA C2/3</div>
<div class="kb">
<div class="kr"><button class="k" onclick="dig('1')">1</button><button class="k" onclick="dig('2')">2</button><button class="k" onclick="dig('3')">3</button></div>
<div class="kr"><button class="k" onclick="dig('4')">4</button><button class="k" onclick="dig('5')">5</button><button class="k" onclick="dig('6')">6</button></div>
<div class="kr"><button class="k" onclick="dig('7')">7</button><button class="k" onclick="dig('8')">8</button><button class="k" onclick="dig('9')">9</button></div>
<div class="kr"><button class="k" onclick="ok()">ENTER</button><button class="k" onclick="dig('0')">0</button><button class="k" onclick="corr()">CORRIGIR</button></div>
</div>
</div>
<script>
var cur="",lista=[];
function getCol(n){
 if(n==0) return 0;
 if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0) return 1;
 if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0) return 2;
 return 3;
}
function getCor(n){
 var col=getCol(n);
 if(col==0) return 'blue';
 if(col==1) return 'red';
 return 'green';
}
function show(){
 var d=document.getElementById('disp');
 if(cur=="") d.textContent="DIGITE O NÚMERO", d.className="display";
 else if(cur=="0") d.textContent="0 = APAGAR ULTIMO + ENTER", d.className="display";
 else if(cur=="00") d.textContent="00 = LIMPAR TUDO + ENTER", d.className="display vermelho";
 else d.textContent="NUM: "+cur, d.className="display";
}
function dig(v){if(cur.length>=2)cur=v;else cur+=v;show();}
function corr(){if(cur!=""){cur=cur.slice(0,-1);show();}else{if(lista.length){lista.pop();upd();}}}
function limpar(){lista=[];cur="";upd();show();}
function ok(){
 if(cur===""){return;}
 if(cur==="00"){limpar();return;}
 if(cur==="0"){if(lista.length)lista.pop();cur="";show();upd();return;}
 var n=parseInt(cur);if(isNaN(n)||n<0||n>36){cur="";show();return;}
 lista.push(n);
 cur="";show();upd();
}
function makeBox(num, cor){
 var e=document.createElement('div');
 e.className='nBox '+cor;
 e.textContent=num;
 return e;
}
function upd(){
 var top=document.getElementById('topHist');
 top.innerHTML="";
 var mostrarTop = lista.length>0 ? lista.slice(-10) : [2,2,3,5,8,4,3,3,4,2];
 var coresTopExemplo=["blue","green","red","green","green","green","red","red","green","green"];
 for(var i=0;i<mostrarTop.length;i++){
  var num=mostrarTop[i];
  var cor;
  if(lista.length==0){cor=coresTopExemplo[i];}
  else{cor=getCor(num);}
  top.appendChild(makeBox(num, cor));
 }
 var letras=["A","B","C","D","E","F"];
 var coresFixas={
  A:["green","blue","red","green","green","green","red","red","red","red","blue","blue","red","green","green","green","blue"],
  B:["green","blue","blue","green","blue","green","green","green","blue","red","blue","red","blue","red","blue","green","blue"],
  C:["green","blue","blue","green","blue","blue","green","green","blue","red","blue","blue","blue","red","blue","green","blue"],
  D:["blue","green","blue","green","blue","red","green","green","blue","red","red","blue","green","red","green","blue","green"],
  E:["green","blue","blue","green","green","green","blue","red","blue","red","blue","green","blue","green","red","blue","green"],
  F:["green","blue","green","blue","blue","green","blue","blue","blue","red","green","blue","blue","green","red","green","blue"]
 };
 var exemploNums=[8,2,1,7,8,5,3,3,31,9,3,3,2,3,2,1,11];
 for(var idx=0; idx<letras.length; idx++){
  var letra=letras[idx];
  var row=document.getElementById('row-'+letra);
  row.innerHTML="";
  var nums = lista.length>0 ? lista.slice(-17) : exemploNums;
  for(var j=0;j<nums.length;j++){
   var n=nums[j];
   var cor;
   if(lista.length==0){cor=coresFixas[letra][j]||'green';}
   else{cor=getCor(n);}
   row.appendChild(makeBox(n, cor));
  }
 }
 var bar=document.getElementById('jogarBar');
 var disp=document.getElementById('disp');
 if(lista.length==0){
  bar.textContent="JOGAR NA COLUNA C2/3";
  bar.style.background="linear-gradient(180deg,#4a0000,#8a0000)";
 }else{
  var ultimo=lista[lista.length-1];
  var col=getCol(ultimo);
  if(col==1){
   bar.textContent="🔴 SAIU C1 ("+ultimo+") - VERMELHO! JOGAR NA COLUNA C2/3 AGORA!";
   bar.style.background="linear-gradient(180deg,#ffaa00,#ff6600)";
   bar.style.color="#000";
   if(cur==""){
    disp.textContent="🔴 VERMELHO SAIU ("+ultimo+") - ENTRAR C2/3!";
    disp.className="display sinal";
   }
  }else if(col==2 || col==3){
   bar.textContent="🟢 ACERTOU C2/3 ("+ultimo+") - GANHOU! AGUARDANDO VERMELHO";
   bar.style.background="linear-gradient(180deg,#004400,#00aa00)";
  }else{
   bar.textContent="🔵 ZERO (0) - AGUARDANDO";
   bar.style.background="linear-gradient(180deg,#001a44,#0044aa)";
  }
 }
}
show();upd();
</script>
</body>
</html>
