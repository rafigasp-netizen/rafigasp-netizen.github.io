<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{height:100%;overflow:hidden}
body{background:#000;display:flex;justify-content:center}
.app{width:100%;max-width:400px;background:#000;height:100dvh;display:flex;flex-direction:column}
.topo{height:38px;background:linear-gradient(180deg,#f7e8a5,#d4af37);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.topo h1{font-size:18px;font-weight:900}.topo span{font-size:7px;letter-spacing:2px}
.menu{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:3px;padding:3px;flex-shrink:0}
.menu button{height:28px;border-radius:5px;border:1px solid #d4af37;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:9px;font-weight:800}
.barra-verm{background:linear-gradient(180deg,#ff3333,#991111);border:1px solid gold;text-align:center;color:#fff;font-weight:900;padding:2px;margin:0 3px;border-radius:5px;min-height:32px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hist{display:flex;gap:4px;padding:4px;overflow-x:auto;overflow-y:hidden;background:#111;min-height:36px;flex-shrink:0;flex-wrap:nowrap;white-space:nowrap}
.chip{min-width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:1px solid gold;font-size:12px;flex-shrink:0}
.chip.C{background:#00c800}.chip.E{background:#c80000}
.card-verm{margin:3px;background:linear-gradient(180deg,#ff4444,#cc0000);border:1px solid #d4af37;border-radius:8px;padding:5px;text-align:center;flex-shrink:0}
.big{color:#ffff00;font-size:32px;font-weight:900;line-height:1}
.placar{display:flex;justify-content:space-between;background:#000;border-radius:5px;padding:3px 8px;margin-top:3px}
.verde{color:#00ff00;font-size:18px;font-weight:900}.verm{color:#ff3333;font-size:18px;font-weight:900}
.hist-result{background:#000;border-radius:5px;padding:4px;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;min-height:36px;border:1px solid #333;flex-wrap:nowrap;white-space:nowrap;margin-top:4px}
.hr-quad{min-width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;border:1px solid #fff;flex-shrink:0}
.hr-quad.C{background:#00c800}.hr-quad.E{background:#c80000}
.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px;background:#1a1a0a;border-top:1px solid #d4af37;flex:1;min-height:0}
.b{border-radius:8px;border:1px solid #8a6a1a;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:22px;font-weight:900;height:100%;min-height:40px}
.pagina{display:none;flex:1;min-height:0;flex-shrink:0}.pagina.ativa{display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div>
<div class="menu"><button onclick="irPara(1)">🏠 INICIO</button><button onclick="apagar()">⬅️ APAGAR</button><button onclick="limpar()">🗑️ LIMPAR</button><button onclick="proximaPagina()">➡️ PROX</button></div>
<div id="pag1" class="pagina ativa"><div class="barra-verm" id="barra">VEM COLUNA 2/3</div><div class="hist" id="hist-top"></div>
<div class="card-verm"><div style="color:#fff;font-size:10px;font-weight:900">VEM COLUNA</div><div class="big" id="sinal">2/3</div>
<div class="placar"><div><b style="font-size:8px;color:gold">✅ ACERTOU</b><div class="verde" id="ac">0</div></div><div><b style="font-size:8px;color:gold">❌ ERROU</b><div class="verm" id="er">0</div></div></div>
<div class="hist-result" id="hist-result"></div></div>
<div class="teclado">
<button class="b" onclick="dig(1)">1</button><button class="b" onclick="dig(2)">2</button><button class="b" onclick="dig(3)">3</button>
<button class="b" onclick="dig(4)">4</button><button class="b" onclick="dig(5)">5</button><button class="b" onclick="dig(6)">6</button>
<button class="b" onclick="dig(7)">7</button><button class="b" onclick="dig(8)">8</button><button class="b" onclick="dig(9)">9</button>
<button class="b" style="font-size:13px" onclick="enter()">ENTER</button><button class="b" onclick="dig(0)">0</button><button class="b" style="font-size:13px" onclick="corrigir()">CORRIGIR</button>
</div>
</div>
<div id="pag3" class="pagina"><h2 style="color:gold;text-align:center;font-size:12px">PAGINA 3</h2><div id="lista-geral" style="display:flex;gap:4px;flex-wrap:wrap"></div><button onclick="limparGeral()" style="margin-top:6px;height:28px;background:#333;color:#fff;border:1px solid gold;border-radius:5px">LIMPAR</button></div>
</div>
<script>
// SUA TABELA EXATA QUE VOCE MANDOU
const TABELA = {
  1:"2/3", 2:"1/2", 3:"1/2", 4:"1/2", 5:"2/3", 6:"1/2", 7:"2/3", 8:"1/2", 9:"2/3", 10:"2/3",
  11:"1/3", 12:"2/3", 13:"1/3", 14:"2/3", 15:"1/3", 16:"1/3", 17:"1/3", 18:"2/3", 19:"1/2", 20:"1/2",
  21:"2/3", 22:"1/2", 23:"1/2", 24:"2/3", 25:"1/3", 26:"2/3", 27:"1/3", 28:"2/3", 29:"1/3", 30:"2/3",
  31:"1/3", 32:"1/2", 33:"2/3", 34:"1/2", 35:"2/3", 36:"1/2", 0:"2/3"
};

let buf="";let ac=0,er=0;let colunaAlvo="2/3";let paginaAtual=1;
let geral=JSON.parse(localStorage.getItem('rafigasp_geral')||'[]');
let historicoNumeros=[];

function getColunaReal(n){ if(n==0) return 0; if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n)) return 1; if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n)) return 2; return 3; }

function irPara(n){document.querySelectorAll('.pagina').forEach(p=>p.classList.remove('ativa')); document.getElementById('pag'+n).classList.add('ativa'); paginaAtual=n;}
function proximaPagina(){irPara(paginaAtual>=3?1:paginaAtual+1);}

function atualizaSinal(){
  if(historicoNumeros.length>0){
    let last=historicoNumeros[0];
    colunaAlvo = TABELA[last] || "2/3";
  }
  document.getElementById('sinal').innerText=colunaAlvo;
}

function atualizaBarra(){
  let el=document.getElementById('barra'); 
  if(buf.length>0){
    let num=parseInt(buf);
    if(!isNaN(num) && TABELA[num]){
      // MOSTRA A COLUNA DA SUA TABELA ENQUANTO DIGITA
      el.innerHTML = num + " > " + TABELA[num];
    } else {
      el.innerHTML = buf;
    }
    el.style.background="#ffff00";el.style.color="#000";el.style.fontSize="20px";
  }else{
    el.innerHTML="VEM COLUNA "+colunaAlvo;
    el.style.background="linear-gradient(180deg,#ff3333,#991111)";el.style.color="#fff";el.style.fontSize="14px";
  }
}

function dig(n){if(buf.length<2)buf+=n; atualizaBarra();}
function corrigir(){buf=buf.slice(0,-1); atualizaBarra();}
function apagar(){buf=""; atualizaBarra();}
function limpar(){document.getElementById('hist-top').innerHTML='';document.getElementById('hist-result').innerHTML='';ac=0;er=0;historicoNumeros=[];document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;colunaAlvo="2/3";atualizaSinal();atualizaBarra();}
function limparGeral(){geral=[];localStorage.setItem('rafigasp_geral',JSON.stringify(geral));}
function enter(){
  if(!buf)return;let num=parseInt(buf);if(num<0||num>36){buf="";atualizaBarra();return;}
  let alvoAnterior = colunaAlvo.split('/').map(Number);
  let colReal = getColunaReal(num);
  let acertou = alvoAnterior.includes(colReal);
  
  let h=document.getElementById('hist-top');let d=document.createElement('div');d.className='chip '+(acertou?'C':'E');d.textContent=num;h.prepend(d);
  let hr=document.getElementById('hist-result');let quad=document.createElement('div');quad.className='hr-quad '+(acertou?'C':'E');quad.textContent=num;hr.prepend(quad);
  
  if(historicoNumeros.length>0){ if(acertou)ac++;else er++; }
  document.getElementById('ac').innerText=ac;document.getElementById('er').innerText=er;
  geral.unshift({num:num,acertou:acertou});localStorage.setItem('rafigasp_geral',JSON.stringify(geral));
  historicoNumeros.unshift(num);buf="";atualizaSinal();atualizaBarra();
}
atualizaSinal();atualizaBarra();
</script>
</body>
</html>
