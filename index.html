<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d2818}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100dvh;background:#0d2818;border:3px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:5px;text-align:center}
.topo h1{color:#000;font-size:11px;font-weight:900}
.topArea{background:#0f2e1f;padding:4px;display:flex;flex-direction:column;gap:4px}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.slot{height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;border:2px solid #d4af37;color:#d4af37;background:#0a2a1a}
.slot.yellow{background:#d4af37;color:#000;border-color:#d4af37}
.slot.green{background:#16a34a;color:#fff;border-color:#16a34a}
.slot.red{background:#dc2626;color:#fff;border-color:#dc2626}
.blueBox{background:#0a2a1a;border:1.5px solid #2563eb;border-radius:7px;padding:3px;display:flex;gap:4px}
.colBox{flex:1;background:#0f2e1f;border-radius:5px;padding:2px}
.colTitle{color:#fff;background:#000;border-radius:5px;padding:1px;font-size:7px;font-weight:900;text-align:center}
.colTitle.duzia{background:#fff;color:#000}
.groupHead{font-size:7px;color:#d4af37;font-weight:900;text-align:center}
.squares5{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin-top:1px}
.sq{height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:8px;color:#fff}
.sq.empty{background:#1a3d2a;border:1px dashed #2a5a3a}
.sq.green{background:#16a34a}.sq.red{background:#dc2626}
.histBox{background:#0a1f14;border:1px solid #1e4d2b;border-radius:5px;padding:3px 4px;display:flex;align-items:center;gap:4px;height:28px;overflow:hidden}
.histTitle{font-size:7px;color:#4ade80;font-weight:900}
.logGrid{display:flex;gap:2px;overflow-x:auto}
.logNum{min-width:22px;height:18px;border-radius:3px;background:#1e3a2a;color:#a7f3d0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;border:1px solid #2a5a3a;flex-shrink:0}
.logNum.greenLog{background:#16a34a;color:#fff}.logNum.redLog{background:#dc2626;color:#fff}
/* TECLADO TODO DENTRO DO QUADRADO VERMELHO - SEM ESPAÇO VAZIO */
.krow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.k{height:52px;border-radius:11px;border:none;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.k:active{transform:scale(0.96)}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:12px}
.bottom{padding:4px;display:flex;flex-direction:column;gap:5px;background:#0d2818}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP COACH DA ROLETA</h1></div>
<div class="topArea">
<div class="top2"><div class="slot" id="slotY">VAZIO</div><div class="slot" id="slotR">VAZIO</div></div>
<div class="blueBox"><div class="colBox"><div class="colTitle">COLUNA</div><div id="colActive"></div></div><div class="colBox"><div class="colTitle duzia">DUZIA</div><div id="duzActive"></div></div></div>
<div class="histBox"><div class="histTitle">HIST:</div><div class="logGrid" id="logGrid"></div></div>
<div class="krow">
<button type="button" class="k num" onclick="addN('1')">1</button>
<button type="button" class="k num" onclick="addN('2')">2</button>
<button type="button" class="k num" onclick="addN('3')">3</button>
</div>
<div class="krow">
<button type="button" class="k num" onclick="addN('4')">4</button>
<button type="button" class="k num" onclick="addN('5')">5</button>
<button type="button" class="k num" onclick="addN('6')">6</button>
</div>
</div>
<div class="bottom">
<div class="krow"><button type="button" class="k num" onclick="addN('7')">7</button><button type="button" class="k num" onclick="addN('8')">8</button><button type="button" class="k num" onclick="addN('9')">9</button></div>
<div class="krow"><button type="button" class="k act" onclick="enterN()">ENTER</button><button type="button" class="k zero" onclick="addN('0')">0</button><button type="button" class="k act" onclick="corrige()">CORRIGIR</button></div>
</div>
</div>
<script>
let cur='', currentSignal=null, activeResults=[], logNums=[], isWaitingSignal=true;
const tabela={1:"C2/3",2:"C1/2",3:"C1/2",4:"C3",5:"C2/3",6:"C1/2",7:"C2/3",8:"C1/2",9:"C1",10:"C2/3",11:"C1/3",12:"C2/3",13:"C2",14:"C1",15:"C1/3",16:"C1/3",17:"C1/3",18:"C2/3",19:"C1/2",20:"C1/2",21:"C1",22:"C3",23:"C3",24:"C2/3",25:"C2",26:"C1",27:"C1/3",28:"C2/3",29:"C1/3",30:"C2/3",31:"C2",32:"C1/2",33:"C1",34:"C3",35:"C2/3",36:"C1/2"};
function getAlvo(n){return tabela[n]||"";}
function getColReal(n){if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;return 0;}
function getDuzReal(n){if(n>=1&&n<=12)return 1;if(n>=13&&n<=24)return 2;if(n>=25&&n<=36)return 3;return 0;}
function getAlvos(a){if(!a)return[];let t=a.replace('C','');if(t.includes('/'))return t.split('/').map(x=>parseInt(x));return[parseInt(t)];}
function isDupla(a){return a && a.includes('/');}
const slotY=document.getElementById('slotY'),slotR=document.getElementById('slotR'),colActive=document.getElementById('colActive'),duzActive=document.getElementById('duzActive'),logGrid=document.getElementById('logGrid');
function render(preview){
if(preview){
 if(isWaitingSignal){slotY.className='slot yellow'; slotY.textContent=preview.num+' '+preview.alvo; slotR.className='slot'; slotR.textContent='CONFIRMAR?';}
 else{slotY.className='slot yellow'; slotY.textContent=currentSignal.num+' '+currentSignal.alvo; let cr=getColReal(preview.num), ca=getAlvos(currentSignal.alvo); slotR.className='slot '+(ca.includes(cr)?'green':'red'); slotR.textContent=preview.num;}
}else{
 if(!currentSignal){slotY.className='slot';slotY.textContent='VAZIO';slotR.className='slot';slotR.textContent='VAZIO';}
 else{slotY.className='slot yellow';slotY.textContent=currentSignal.num+' '+currentSignal.alvo; if(activeResults.length>0){let last=activeResults[activeResults.length-1];slotR.className='slot '+last.colColor;slotR.textContent=last.num;}else{slotR.className='slot';slotR.textContent=isWaitingSignal?'PRONTO':'JOGANDO...';}}
}
colActive.innerHTML=''; duzActive.innerHTML='';
if(!currentSignal || !isDupla(currentSignal.alvo)){
 colActive.innerHTML='<div style="color:#4a5a4a;font-size:7px;text-align:center;margin-top:6px">AGUARDE DUPLA</div>';
 duzActive.innerHTML='<div style="color:#4a5a4a;font-size:7px;text-align:center;margin-top:6px">AGUARDE DUPLA</div>';
}else{
 let hC=document.createElement('div');hC.className='groupHead';hC.textContent=currentSignal.num+' '+currentSignal.alvo;colActive.appendChild(hC);
 let gC=document.createElement('div');gC.className='squares5';for(let i=0;i<5;i++){let d=document.createElement('div');if(activeResults[i]){d.className='sq '+activeResults[i].colColor;d.textContent=activeResults[i].num;}else{d.className='sq empty';}gC.appendChild(d);}colActive.appendChild(gC);
 let hD=document.createElement('div');hD.className='groupHead';hD.textContent=currentSignal.num+' '+currentSignal.alvo;duzActive.appendChild(hD);
 let gD=document.createElement('div');gD.className='squares5';for(let i=0;i<5;i++){let d=document.createElement('div');if(activeResults[i]){d.className='sq '+activeResults[i].duzColor;d.textContent=activeResults[i].num;}else{d.className='sq empty';}gD.appendChild(d);}duzActive.appendChild(gD);
}
logGrid.innerHTML=''; logNums.forEach(l=>{let d=document.createElement('div');d.className='logNum '+(l.win===true?'greenLog':l.win===false?'redLog':'');d.textContent=l.num;logGrid.appendChild(d);});
}
function addN(d){if(cur.length>=2)return;cur+=d;if(cur==="0"||cur==="00"){render({num:cur,alvo:""});return;}let v=parseInt(cur);if(isNaN(v))return;if(v>36){cur=d;v=parseInt(cur);}render({num:v,alvo:getAlvo(v)});}
function enterN(){
if(cur==='')return;
if(cur==="0"||cur==="00"){currentSignal=null;activeResults=[];logNums=[];isWaitingSignal=true;cur='';render();return;}
let v=parseInt(cur);if(isNaN(v)||v<1||v>36){cur='';render();return;}
if(isWaitingSignal){
 currentSignal={num:v,alvo:getAlvo(v)};activeResults=[];isWaitingSignal=false;logNums.unshift({num:v,win:null});
}else{
 let ca=getAlvos(currentSignal.alvo);let cr=getColReal(v),dr=getDuzReal(v);
 let colWin=ca.includes(cr),duzWin=ca.includes(dr);
 if(isDupla(currentSignal.alvo)){
   activeResults.push({num:v,colColor:colWin?'green':'red',duzColor:duzWin?'green':'red'});
   if(colWin){
     // AMARELO NAO CONGELA - JA LIBERA PARA NOVO SINAL
     isWaitingSignal=true;
     activeResults=[];
   }else if(activeResults.length>=5){
     isWaitingSignal=true;
     activeResults=[];
   }
 }
 logNums.unshift({num:v,win:colWin});
}
cur='';render();
}
function corrige(){if(cur!==''){cur=cur.slice(0,-1);if(cur===''){render();}else{let v=parseInt(cur);render({num:v,alvo:getAlvo(v)});}return;} if(logNums.length>0)logNums.shift(); if(activeResults.length>0)activeResults.pop(); render();}
render();
</script>
</body>
</html>
