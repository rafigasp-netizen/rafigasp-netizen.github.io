<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP - EXATAMENTE IGUAL A FOTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0e2f1c;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:100%;max-width:400px;height:100dvh;background:#0a2210;display:flex;flex-direction:column;border:2px solid #d4af37;box-shadow:0 0 30px rgba(0,0,0,0.8)}
.topo{text-align:center;background:linear-gradient(180deg,#f5e6a0 0%,#d4af37 20%,#b8941f 50%,#d4af37 80%,#8a6d1b 100%);padding:14px 0 10px;flex-shrink:0;border-bottom:3px solid #000;position:relative}
.topoR{font-weight:900;font-size:36px;color:#0a2210;letter-spacing:4px;line-height:1;text-shadow:0 1px 0 #fff, 0 2px 4px rgba(0,0,0,0.5);font-family:serif}
.topoS{font-size:10px;letter-spacing:6px;color:#0a2210;font-weight:900;margin-top:2px;opacity:0.8}
.nav2{display:flex;gap:4px;padding:6px;background:#0f1a0f;flex-shrink:0;border-bottom:2px solid #d4af37}
.nav2 button{flex:1;height:36px;border-radius:8px;border:2px solid #d4af37;font-weight:900;font-size:9px;background:linear-gradient(180deg,#1a2a1a,#0f1a0f);color:#d4af37;display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 1px 0 rgba(212,175,55,0.3), 0 2px 4px rgba(0,0,0,0.5)}
.nav2 button.home{background:linear-gradient(180deg,#f5e6a0,#d4af37);color:#111;border-color:#fff}
.nav2 button.limpar{background:linear-gradient(180deg,#4a1a1a,#2a0f0f);color:#ffaaaa;border-color:#ff6666}
.display{margin:5px;background:linear-gradient(180deg,#0a0a0a,#000);border:2px solid #d4af37;border-radius:12px;height:48px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;text-align:center;padding:2px;transition:all 0.3s;color:#00ff00;box-shadow:inset 0 2px 8px rgba(0,0,0,0.8)}
.display.alerta{background:linear-gradient(180deg,#ff3333,#cc0000);color:#fff;border:3px solid #ffff00;animation:piscaAlerta 0.6s infinite alternate}
@keyframes piscaAlerta{0%{background:#ff0000}100%{background:#cc0000}}
.page{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(ellipse at center,#0f2f1a 0%,#0a2210 100%)}
.topBar{background:linear-gradient(180deg,#0a1a0a,#000);border:2px solid #d4af37;border-radius:14px;padding:12px;display:flex;gap:5px;flex-wrap:wrap;min-height:90px;align-items:center;box-shadow:inset 0 2px 10px rgba(0,0,0,0.9)}
.topBar::before{content:'HISTÓRICO';position:absolute;top:-8px;left:12px;background:#d4af37;color:#000;font-size:8px;font-weight:900;padding:2px 8px;border-radius:4px;letter-spacing:1px}
.nBox{height:38px;min-width:38px;padding:0 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;border:2px solid #333;box-shadow:0 3px 6px rgba(0,0,0,0.5)}
.nBox.green{background:linear-gradient(180deg,#1f9f3a,#0f8a2a);border-color:#00ff00}
.nBox.red{background:linear-gradient(180deg,#ff2a2a,#d80f0f);border-color:#ffaaaa}
.nBox.blue{background:linear-gradient(180deg,#3a6aef,#1e40af);border-color:#fff}
.nBox.new{animation:novo 0.6s;border:2px solid #fff;box-shadow:0 0 15px #fff}
@keyframes novo{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.alertaGrande{background:linear-gradient(180deg,#1fbf3f 0%,#0f8a2a 30%,#065a18 100%);border:3px solid #ffd700;border-radius:20px;padding:20px;text-align:center;font-weight:900;color:#fff;box-shadow:0 0 30px rgba(0,255,0,0.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:180px;transition:all 0.5s;flex:1;position:relative}
.alertaGrande.vermelho{background:linear-gradient(180deg,#ff4444 0%,#ff0000 30%,#990000 100%);border:3px solid #ffff00;box-shadow:0 0 40px #ff0000;animation:piscaAlertaGrande 0.6s infinite alternate}
.alertaGrande.verde{background:linear-gradient(180deg,#1fbf3f 0%,#0f8a2a 30%,#065a18 100%);border:3px solid #00ff00}
.alertaGrande.acertou{background:linear-gradient(180deg,#2aff5a 0%,#00cc00 30%,#006600 100%);border:4px solid #00ff00;box-shadow:0 0 60px #00ff00;animation:piscaAcertou 0.5s infinite alternate}
.alertaGrande.errou{background:linear-gradient(180deg,#ff5555 0%,#cc0000 30%,#660000 100%);border:4px solid #ff4444;box-shadow:0 0 60px #ff0000;animation:piscaErrou 0.5s infinite alternate}
@keyframes piscaAlertaGrande{0%{transform:scale(1)}100%{transform:scale(1.02)}}
@keyframes piscaAcertou{0%{transform:scale(1)}100%{transform:scale(1.04)}}
@keyframes piscaErrou{0%{transform:scale(1)}100%{transform:scale(1.04)}}
.colunaGrande{font-size:28px;letter-spacing:2px;text-shadow:0 2px 4px #000, 0 0 15px rgba(255,255,255,0.8);line-height:1.1;font-weight:900;display:flex;align-items:center;gap:10px;justify-content:center}
.colunaGrande .checkIcon{width:36px;height:36px;background:linear-gradient(180deg,#ffd700,#b8941f);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#0a2210;box-shadow:0 2px 6px rgba(0,0,0,0.5)}
.colunaNumero{font-size:52px;font-weight:900;color:#fff;text-shadow:0 3px 6px #000, 0 0 20px rgba(255,255,255,0.8);line-height:1.1}
.placarSimples{background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #d4af37;border-radius:12px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;min-height:56px;width:100%;box-shadow:inset 0 2px 8px rgba(0,0,0,0.9)}
.placarSimples::before{content:'PLACAR';position:absolute;top:-8px;left:12px;background:#d4af37;color:#000;font-size:8px;font-weight:900;padding:2px 8px;border-radius:4px;letter-spacing:1px}
.placarItemSimples{display:flex;align-items:center;gap:8px;min-width:80px}
.placarLabelSimples{font-size:10px;color:#d4af37;font-weight:900}
.placarValorSimples{font-size:28px;font-weight:900}
.kb{background:linear-gradient(180deg,#e8c76a 0%,#d4af37 20%,#b8941f 50%,#9a7a1a 100%);border-top:3px solid #d4af37;padding:8px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;height:38%;min-height:240px;box-shadow:inset 0 3px 0 rgba(255,255,255,0.4)}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.k{border-radius:12px;border:2px solid #8a6d1b;font-weight:900;font-size:22px;background:linear-gradient(180deg,#f9e27a 0%,#e8c86a 30%,#d4af37 60%,#b8941f 100%);color:#1a1000;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,0.4), inset 0 2px 0 rgba(255,255,255,0.6)}
.k:active{transform:scale(0.96) translateY(2px);background:linear-gradient(180deg,#fff,#e8c86a)}
.paginasEscondidas{display:none !important}
</style>
</head>
<body>
<div class="app">
<div class="topo"><div class="topoR">RAFIGASP</div><div class="topoS">COACH DA ROLETA</div></div>
<div class="nav2">
<button class="home" onclick="limparTudo()">🏠 INICIO</button>
<button onclick="apagarUltimo()">⬅️ APAGAR</button>
<button class="limpar" onclick="limparTudo()">🗑️ LIMPAR</button>
<button onclick="irPara(1)">➡️ PRÓX</button>
</div>
<div class="display inicial" id="disp">PÁG 1 - TABELA COLUNA</div>
<div class="page" id="page1">
<div class="topBar" id="topBar1"></div>
<div class="alertaGrande verde" id="alertaGrande1">
<div class="colunaGrande" id="colunaGrandeTexto1">AGUARDANDO<br>SINAL...</div>
<div class="placarSimples" id="placarBox1">
<div class="placarItemSimples"><div class="placarLabelSimples">✅ ACERTOU</div><div class="placarValorSimples" style="color:#00ff00" id="placarAcertou1">0</div></div>
<div class="placarItemSimples"><div class="placarLabelSimples">❌ ERROU</div><div class="placarValorSimples" style="color:#ff4444" id="placarErrou1">0</div></div>
</div>
</div>
</div>
<div class="paginasEscondidas">
<div id="conjuntosP2"></div><div id="conjuntosP3"></div>
<div id="alertaGrande2"></div><div id="colunaGrandeTexto2"></div><div id="placarAcertou2">0</div><div id="placarErrou2">0</div>
<div id="alertaGrande3"></div><div id="colunaGrandeTexto3"></div><div id="placarAcertou3">0</div><div id="placarErrou3">0</div>
</div>
<div class="kb">
<div class="kr"><button class="k" onclick="dig('1')">1</button><button class="k" onclick="dig('2')">2</button><button class="k" onclick="dig('3')">3</button></div>
<div class="kr"><button class="k" onclick="dig('4')">4</button><button class="k" onclick="dig('5')">5</button><button class="k" onclick="dig('6')">6</button></div>
<div class="kr"><button class="k" onclick="dig('7')">7</button><button class="k" onclick="dig('8')">8</button><button class="k" onclick="dig('9')">9</button></div>
<div class="kr"><button class="k" onclick="ok()">ENTER</button><button class="k" onclick="dig('0')">0</button><button class="k" onclick="corr()">CORRIGIR</button></div>
</div>
</div>
<script>
var cur="",lista=[],paginaAtual=1;
var green=0,red=0;
var esperandoP2=false, esperandoP3=false;
var colunaP2=null, colunaP3=null;
var numeroAzulP2=null, numeroAzulP3=null;
var linhasP2 = []; var linhasP3 = [];
var tabelaColunas = {
 1:"2/3", 2:"1/2", 3:"1/2", 4:"1/2", 5:"2/3", 6:"1/2", 7:"2/3", 8:"1/2", 9:"2/3", 10:"2/3",
 11:"1/3", 12:"2/3", 13:"1/3", 14:"2/3", 15:"1/3", 16:"1/3", 17:"1/3", 18:"2/3", 19:"1/2", 20:"1/2",
 21:"2/3", 22:"1/2", 23:"1/2", 24:"2/3", 25:"1/3", 26:"2/3", 27:"1/3", 28:"2/3", 29:"1/3", 30:"2/3",
 31:"1/3", 32:"1/2", 33:"2/3", 34:"1/2", 35:"2/3", 36:"1/2", 0:"0"
};
function salvarTudo(){
 try{
  localStorage.setItem('rafigasp_lista', JSON.stringify(lista));
  localStorage.setItem('rafigasp_green', String(green));
  localStorage.setItem('rafigasp_red', String(red));
  localStorage.setItem('rafigasp_esperandoP2', String(esperandoP2));
  localStorage.setItem('rafigasp_esperandoP3', String(esperandoP3));
  localStorage.setItem('rafigasp_colunaP2', colunaP2||'');
  localStorage.setItem('rafigasp_colunaP3', colunaP3||'');
  localStorage.setItem('rafigasp_numeroAzulP2', String(numeroAzulP2||''));
  localStorage.setItem('rafigasp_numeroAzulP3', String(numeroAzulP3||''));
 }catch(e){}
}
function carregarTudo(){
 try{
  var l = localStorage.getItem('rafigasp_lista'); if(l){ lista = JSON.parse(l); }
  var g = localStorage.getItem('rafigasp_green'); if(g!==null){ green = parseInt(g)||0; }
  var r = localStorage.getItem('rafigasp_red'); if(r!==null){ red = parseInt(r)||0; }
  var ep2 = localStorage.getItem('rafigasp_esperandoP2'); if(ep2!==null){ esperandoP2 = (ep2==='true'); }
  var ep3 = localStorage.getItem('rafigasp_esperandoP3'); if(ep3!==null){ esperandoP3 = (ep3==='true'); }
  var c2 = localStorage.getItem('rafigasp_colunaP2'); if(c2){ colunaP2 = c2; }
  var c3 = localStorage.getItem('rafigasp_colunaP3'); if(c3){ colunaP3 = c3; }
  var n2 = localStorage.getItem('rafigasp_numeroAzulP2'); if(n2){ numeroAzulP2 = n2 ? parseInt(n2) : null; }
  var n3 = localStorage.getItem('rafigasp_numeroAzulP3'); if(n3){ numeroAzulP3 = n3 ? parseInt(n3) : null; }
 }catch(e){}
}
function getCol(n){
 if(n==0) return 0;
 if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0) return 1;
 if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0) return 2;
 return 3;
}
function getColunasParaJogar(numeroAzul){ return tabelaColunas[numeroAzul] || "-"; }
function inicializar(){
 var divP2=document.getElementById('conjuntosP2'); var divP3=document.getElementById('conjuntosP3');
 if(divP2) divP2.innerHTML=""; if(divP3) divP3.innerHTML=""; linhasP2=[];linhasP3=[];
 var brancosPorLinha = [1,2,3,4,5];
 for(var r=0;r<5;r++){
  linhasP2.push({div:document.createElement('div'), itens:[], brancos:brancosPorLinha[r]});
  linhasP3.push({div:document.createElement('div'), itens:[], brancos:brancosPorLinha[r]});
 }
}
function setEstadoQuadrado(id, estado, textoGrande){
 var el=document.getElementById(id); var txt=document.getElementById(id.replace('alertaGrande','colunaGrandeTexto'));
 if(el){ el.className='alertaGrande '+estado; if(txt) txt.innerHTML=textoGrande; }
}
function irPara(p){ paginaAtual=1; show();upd(); }
function show(){
 var d=document.getElementById('disp');
 if(cur!=""){
  if(cur=="0"){d.textContent="0 = APAGAR";d.className="display vermelho";}
  else if(cur=="00"){d.textContent="00 = LIMPAR TUDO";d.className="display vermelho";}
  else{
   if(esperandoP2 || esperandoP3){
    var col = esperandoP3 ? colunaP3 : colunaP2; var pag = esperandoP3 ? "P1" : "P2";
    d.textContent="NUM: "+cur+" - RESULTADO "+pag+" COLUNA "+col; d.className="display sinal";
   }else{ d.textContent="NUM: "+cur+" - ENTER"; d.className="display inicial"; }
  }
  return;
 }
 if(esperandoP3){ d.innerHTML="🔴 P1 SINAL 🟦🟥🟥 - COLUNA "+colunaP3; d.className="display alerta"; }
 else if(esperandoP2){ d.innerHTML="🔵 P2 SINAL 🟦🟥 - COLUNA "+colunaP2; d.className="display alerta"; }
 else{ d.textContent="PÁG 1 - TABELA COLUNA - ✅:"+green+" ❌:"+red; d.className="display inicial"; }
}
function dig(v){if(cur=="0"||cur=="00"){cur=v;}else if(cur.length>=2){cur=v;}else{cur+=v;}show();}
function corr(){if(cur=="0"){apagarUltimo();return;}if(cur=="00"){limparTudo();return;}if(cur!=""){cur=cur.slice(0,-1);show();}else{apagarUltimo();}}
function apagarUltimo(){ if(lista.length>0){ lista.pop(); reconstruirTudo(); show();upd(); salvarTudo(); } }
function limparTudo(){
 if(!confirm("LIMPAR TUDO? Só apaga se clicar LIMPAR!")) return;
 cur="";lista=[];colunaP2=null;colunaP3=null;numeroAzulP2=null;numeroAzulP3=null;green=0;red=0;esperandoP2=false;esperandoP3=false;
 try{
  localStorage.removeItem('rafigasp_lista'); localStorage.removeItem('rafigasp_green'); localStorage.removeItem('rafigasp_red');
  localStorage.removeItem('rafigasp_esperandoP2'); localStorage.removeItem('rafigasp_esperandoP3');
  localStorage.removeItem('rafigasp_colunaP2'); localStorage.removeItem('rafigasp_colunaP3');
  localStorage.removeItem('rafigasp_numeroAzulP2'); localStorage.removeItem('rafigasp_numeroAzulP3');
 }catch(e){}
 inicializar(); setEstadoQuadrado('alertaGrande1','verde','AGUARDANDO<br>SINAL...'); show();upd();
}
function reconstruirTudo(){
 inicializar(); var temp=lista.slice(); lista=[];green=0;red=0;
 var ep2=esperandoP2, ep3=esperandoP3, c2=colunaP2, c3=colunaP3, n2=numeroAzulP2, n3=numeroAzulP3;
 temp.forEach(function(n){ aplicarNumero(n,false); }); checarSinais();
 if(ep2 && !esperandoP2 && !esperandoP3){ esperandoP2=true; colunaP2=c2; numeroAzulP2=n2; }
 if(ep3){ esperandoP3=true; colunaP3=c3; numeroAzulP3=n3; }
 lista=temp.slice();
 if(esperandoP2){ setEstadoQuadrado('alertaGrande1','vermelho','P2<br>COLUNA<br><div class="colunaNumero">'+colunaP2+'</div>'); }
 if(esperandoP3){ setEstadoQuadrado('alertaGrande1','vermelho','P1<br>COLUNA<br><div class="colunaNumero">'+colunaP3+'</div>'); }
}
function aplicarNumero(n, adicionarNaLista){
 for(var r=0;r<linhasP2.length;r++){ var linha=linhasP2[r]; var pos=linha.itens.length; var ciclo = linha.brancos + 1; var isAzul = (pos % ciclo == 0); linha.itens.push({valor:n, isAzul:isAzul}); }
 for(var r=0;r<linhasP3.length;r++){ var linha=linhasP3[r]; var pos=linha.itens.length; var ciclo = linha.brancos + 1; var isAzul = (pos % ciclo == 0); linha.itens.push({valor:n, isAzul:isAzul}); }
 if(adicionarNaLista){ lista.push(n); }
}
function checarSinais(){ checarSinalP3(); checarSinalP2(); }
function checarSinalP2(){
 if(esperandoP2 || esperandoP3) return false;
 for(var r=0;r<linhasP2.length;r++){
  var linha=linhasP2[r];
  for(var i=0;i<linha.itens.length-1;i++){
   var itAzul=linha.itens[i]; var itVerm=linha.itens[i+1];
   if(itAzul.isAzul && !itVerm.isAzul){ if(getCol(itVerm.valor)==1){
     colunaP2=getColunasParaJogar(itAzul.valor); numeroAzulP2=itAzul.valor; esperandoP2=true;
     setEstadoQuadrado('alertaGrande1','vermelho','<div class="colunaGrande"><div class="checkIcon">✓</div>P2 COLUNA</div><div class="colunaNumero">'+colunaP2+'</div>'); salvarTudo(); return true;
   }}
  }
 }
 return false;
}
function checarSinalP3(){
 if(esperandoP3) return true;
 for(var r=0;r<linhasP3.length;r++){
  var linha=linhasP3[r];
  for(var i=0;i<linha.itens.length-2;i++){
   var itAzul=linha.itens[i]; var itV1=linha.itens[i+1]; var itV2=linha.itens[i+2];
   if(itAzul.isAzul && !itV1.isAzul && !itV2.isAzul){
    if(getCol(itV1.valor)==1 && getCol(itV2.valor)==1){
     colunaP3=getColunasParaJogar(itAzul.valor); numeroAzulP3=itAzul.valor; esperandoP3=true;
     setEstadoQuadrado('alertaGrande1','vermelho','<div class="colunaGrande"><div class="checkIcon">✓</div>P1 COLUNA</div><div class="colunaNumero">'+colunaP3+'</div>'); salvarTudo(); return true;
    }
   }
  }
 }
 if(!esperandoP3 && !esperandoP2){
  var el=document.getElementById('alertaGrande1');
  if(el && !el.classList.contains('acertou') && !el.classList.contains('errou')){
   setEstadoQuadrado('alertaGrande1','verde','AGUARDANDO<br>SINAL...');
  }
 }
 return false;
}
function ok(){
 if(cur===""){return;} if(cur==="00"){limparTudo();return;} if(cur==="0"){apagarUltimo();return;}
 var n=parseInt(cur);if(isNaN(n)||n<0||n>36){cur="";show();return;}
 if(esperandoP3){
  var colResultado=getCol(n); var colunasPermitidas = colunaP3.split('/'); var acertou = colunasPermitidas.indexOf(String(colResultado)) >= 0;
  if(acertou){ green++; setEstadoQuadrado('alertaGrande1','acertou','<div class="colunaGrande"><div class="checkIcon">✓</div>P1 ACERTOU</div><div class="colunaNumero">COLUNA '+colunaP3+'</div>'); }
  else{ red++; setEstadoQuadrado('alertaGrande1','errou','<div class="colunaGrande">✕ P1 ERROU</div><div class="colunaNumero">COLUNA '+colunaP3+'</div>'); }
  document.getElementById('placarAcertou1').textContent=green; document.getElementById('placarErrou1').textContent=red; esperandoP3=false; colunaP3=null; numeroAzulP3=null; salvarTudo();
  setTimeout(function(){ if(!esperandoP2){ setEstadoQuadrado('alertaGrande1','verde','AGUARDANDO<br>SINAL...'); } show(); salvarTudo(); },3000);
  aplicarNumero(n,true); cur="";show();upd(); salvarTudo(); return;
 }
 if(esperandoP2){
  var colResultado=getCol(n); var colunasPermitidas = colunaP2.split('/'); var acertou = colunasPermitidas.indexOf(String(colResultado)) >= 0;
  if(acertou){ green++; setEstadoQuadrado('alertaGrande1','acertou','<div class="colunaGrande"><div class="checkIcon">✓</div>P2 ACERTOU</div><div class="colunaNumero">COLUNA '+colunaP2+'</div>'); }
  else{ red++; setEstadoQuadrado('alertaGrande1','errou','<div class="colunaGrande">✕ P2 ERROU</div><div class="colunaNumero">COLUNA '+colunaP2+'</div>'); }
  document.getElementById('placarAcertou1').textContent=green; document.getElementById('placarErrou1').textContent=red; esperandoP2=false; colunaP2=null; numeroAzulP2=null; salvarTudo();
  setTimeout(function(){ setEstadoQuadrado('alertaGrande1','verde','AGUARDANDO<br>SINAL...'); show(); salvarTudo(); },3000);
  aplicarNumero(n,true); cur="";show();upd(); salvarTudo(); return;
 }
 aplicarNumero(n,true); cur="";show();upd(); checarSinais(); salvarTudo();
}
function upd(){
 var topBar1=document.getElementById('topBar1');
 if(topBar1){
  topBar1.innerHTML="";
  if(lista.length==0){
   var e=document.createElement('div');e.style.cssText="font-size:11px;color:#1a5a1a;padding:8px;text-align:center;width:100%";e.textContent="HISTÓRICO VAZIO - DIGITE OS NÚMEROS - 🟦🟥=P2 🟦🟥🟥=P1";
   topBar1.appendChild(e);
  }else{
   var rev=lista.slice();
