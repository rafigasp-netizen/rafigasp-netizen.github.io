</div><script>
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};
const TAB={0:"ZERO",1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2"};
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const NOMES=["RAFIGASP COACH DA ROLETA","RAFIGASP COACH DA ROLETA","RAFIGASP COACH DA ROLETA - A","RAFIGASP COACH DA ROLETA - B"];
const MODOS=["GERAL","123_GERAL","123_A","123_B"];
let modoIdx=parseInt(localStorage.getItem('modoIdx')||'1');if(modoIdx>=4)modoIdx=1;let modo=MODOS[modoIdx];
let countsA=JSON.parse(localStorage.getItem('cntA')||'{}');let countsB=JSON.parse(localStorage.getItem('cntB')||'{}');

let acerto123A=parseInt(localStorage.getItem('acerto123A')||'0'),erro123A=parseInt(localStorage.getItem('erro123A')||'0');let acerto123B=parseInt(localStorage.getItem('acerto123B')||'0'),erro123B=parseInt(localStorage.getItem('erro123B')||'0');
let gridEl=document.getElementById('grid');for(let i=1;i<=36;i++){let d=document.createElement('div');d.className='cell '+(REDS.includes(i)?'red':'black');d.id='c'+i;d.onclick=()=>pick(i);d.innerHTML='<span>'+i+'</span><span class="badgeG" id="cnt'+i+'"></span>';gridEl.appendChild(d);}
function atualiza(){for(let i=1;i<=36;i++){let el=document.getElementById('cnt'+i);let b=document.getElementById('c'+i);if(!b)continue;let ca=countsA[i]||0,cb=countsB[i]||0;let base='cell '+(REDS.includes(i)?'red':'black');let tot=0;if(modo==='123_A'){tot=ca;if(ca>0)base='cell marcadoA';}else if(modo==='123_B'){tot=cb;if(cb>0)base='cell marcadoB';}else{tot=ca+cb;if(ca>0&&cb>0)base='cell marcadoAB';else if(ca>0)base='cell marcadoA';else if(cb>0)base='cell marcadoB';}if(el)el.textContent=tot>0?tot+'x':'';b.className=base;}}
function calcAlerta(arr){if(!arr||arr.length<2)return false;let ult=arr[0],pen=arr[1];if(ult&&ult.ok)return false;if(ult&&pen&&!ult.ok&&!pen.ok)return true;return false;}
function mudaModo(){modoIdx=(modoIdx+1)%4;modo=MODOS[modoIdx];localStorage.setItem('modoIdx',modoIdx);render();}
function marcaOndeJogar(tab,vezAmarela){
 document.querySelectorAll('.cell').forEach(c=>{c.classList.remove('jogarA','jogarB');});
 document.getElementById('d1').className='';document.getElementById('d2').className='';document.getElementById('d3').className='';
 if(!tab) return;
 let cols=tab.split('/').map(Number);
 cols.forEach(col=>{let el=document.getElementById('d'+col);if(el)el.classList.add(vezAmarela?'ativoA':'ativoB');});
 for(let i=1;i<=36;i++){if(cols.includes(COL[i])){let el=document.getElementById('c'+i);if(el)el.classList.add(vezAmarela?'jogarA':'jogarB');}}
}
function render(){
 document.getElementById('tituloTopo').textContent=NOMES[modoIdx];
 let ini=document.getElementById('verdeInicial'),bH=document.getElementById('boxH');if(modo==='GERAL'){ini.classList.add('ativa');bH.style.display='none';}else{ini.classList.remove('ativa');bH.style.display='block';}
 let verdeEl=document.getElementById('verdeInicial');verdeEl.innerHTML="";
 function criaLinha4(titulo, arr){
   let linha=document.createElement('div');linha.className='linha4';
   let t=document.createElement('div');t.className='titulo4';t.textContent=titulo;linha.appendChild(t);
   // v298 CORREÇÃO: conjunto fixo de 4, mais novo na frente do 5 -> [5,3,1] -> [7,5,3,1]
   let oldest = arr.slice().reverse(); // mais velho primeiro para montar blocos fixos
   let grupos=[];
   for(let i=0;i<oldest.length;i+=4){
     grupos.push(oldest.slice(i,i+4));
   }
   grupos.reverse(); // mais novo na esquerda
   grupos.forEach((gArr, idx)=>{
     let g=document.createElement('div');g.className='grupo4'+(gArr.length===4?' completo':'')+(idx===0?' novo':'');
     let invertido = gArr.slice().reverse(); // mais novo na frente dentro do grupo: 5,3,1 e depois 7,5,3,1
     invertido.forEach(item=>{
       let num=(typeof item==='object')?item.num:item;
       let ok=(typeof item==='object')?item.ok:true;
       let d=document.createElement('div');d.className='num4 '+(ok?'C':'E');d.textContent=num;g.appendChild(d);
     });
     linha.appendChild(g);
   });
   return linha;
 }
 if(histA.length>0) verdeEl.appendChild(criaLinha4('A:',histA));
 if(histB.length>0) verdeEl.appendChild(criaLinha4('B:',histB));
 if(histA.length===0&&histB.length===0){verdeEl.innerHTML='<span style="color:#888;font-size:10px">sem números ainda</span>';}

 histGeralCron.slice().forEach((h,idx)=>{

 });
 let azulAEl=document.getElementById('azulA'),azulBEl=document.getElementById('azulB');azulAEl.className='azul';azulBEl.className='azul';
 let tabParaMarcar=null;let vezAmarela=true;
 let vezA_Geral = histA.length <= histB.length;
 if(modo==='123_A'){
   let tabA=pendA!==null?TAB[pendA]:null;
   if(tabA) document.getElementById('leftA').innerHTML='A: <span>'+tabA+'</span> JOGAR'; else document.getElementById('leftA').innerHTML='A: MARCAR NOVO';
   document.getElementById('placarA').innerHTML='ACERTO <span>'+acerto123A+' X '+erro123A+'</span> ERRO';

 }
 else if(modo==='123_B'){

   document.getElementById('placarB').innerHTML='ACERTO <span>'+acerto123B+' X '+erro123B+'</span> ERRO';

 }
 else if(modo==='123_GERAL'){

 }
 else{

   let alA=calcAlerta(histA),alB=calcAlerta(histB);if(alA)azulAEl.classList.add('alerta');if(alB)azulBEl.classList.add('alerta');

   if(histB.length){let n=(typeof histB[0]==='object')?histB[0].num:histB[0];document.getElementById('leftB').innerHTML='B: '+n+'> <span>'+TAB[n]+'</span>';}else document.getElementById('leftB').textContent='B: -';
 }
 let boxH=document.getElementById('boxH');
 if(modo==='123_A' || modo==='123_B' || modo==='123_GERAL'){
   function agrupaHistorico(lista){
     let map={};
     lista.forEach(entry=>{
       if(entry.isPrimeiro) return;
       let key = entry.prev;
       if(!map[key]) map[key]=[];
       map[key].push(entry);
     });
     let chaves = Object.keys(map).map(k=>parseInt(k));
     chaves.sort((a,b)=>{
       let ia = lista.findIndex(e=>e.prev===a);
       let ib = lista.findIndex(e=>e.prev===b);
       return ia - ib;
     });
     return chaves.map(k=>({trigger:k, resultados: map[k]}));
   }
   let html='';

       }
       let gruposTab = grupos.filter(g=> TAB[g.trigger]===tabAtual);

       if(gruposTab.length>0){
