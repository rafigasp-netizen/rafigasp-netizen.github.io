<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d2818;display:flex;justify-content:center;font-family:Arial}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:2px solid #d4af37;display:flex;flex-direction:column}
.blacks{display:flex;gap:8px;padding:8px;background:#0a1f12}
.bbox{flex:1;background:#000;border:1.5px solid #d4af37;border-radius:12px;height:38px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.history{background:#123524;padding:6px}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.hslot{height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.hslot.empty{border:1.5px dashed #d4af37;opacity:.4}
.hslot.yellow{background:#d4af37;color:#000}
.hslot.green{background:#16a34a;color:#fff;border:1.5px solid #fff}
.hslot.red{background:#dc2626;color:#fff;border:1.5px solid #fff}
.ab-top{display:grid;grid-template-columns:70px 1fr;gap:6px;padding:6px;background:#0a1f12}
.ab-box{border-radius:8px;border:1.5px solid #d4af37;padding:4px 6px;min-height:34px;background:#1a1a1a;display:flex;flex-direction:column}
.ab-label{font-size:8px;color:#d4af37;font-weight:900}
.ab-content{display:flex;gap:4px;flex-wrap:wrap;min-height:18px;margin-top:2px}
.ab-chip{font-size:11px;font-weight:800;padding:2px 5px;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;min-width:24px}
.ab-chip.yellow{background:#d4af37;color:#000}
.ab-chip.green{background:#16a34a;border:1px solid #fff}
.ab-chip.red{background:#dc2626;border:1px solid #fff}
.ab-dot{width:12px;height:12px;border-radius:50%}
.keypad{padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0a1f12}
.k{height:48px;border-radius:10px;border:none;font-weight:900;font-size:19px}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:10px}
.bottom-fill{flex:1;background:#0d2818}
</style>
</head>
<body>
<div class="app">
<div class="blacks"><div class="bbox" id="boxUlt">-</div><div class="bbox" id="boxCol">COLUNA</div></div>
<div class="history"><div class="hist-grid" id="grid"></div></div>
<div class="ab-top">
<div class="ab-box"><span class="ab-label">A</span><div class="ab-content" id="boxA">-</div></div>
<div class="ab-box"><span class="ab-label">B - HISTORICO</span><div class="ab-content" id="boxB">-</div></div>
</div>
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
<div class="bottom-fill"></div>
</div>
<script>
let history=[],cur='',colunaTravada=0,lastYellow=null;
const grid=document.getElementById('grid'),boxUlt=document.getElementById('boxUlt'),boxCol=document.getElementById('boxCol'),boxA=document.getElementById('boxA'),boxB=document.getElementById('boxB');
const p1=[6,9,11,14,16,17,19,21,26,29,33,36],p2=[2,3,5,8,10,13,20,25,28,31,32,35],p3=[1,4,7,12,15,18,22,23,24,27,30,34];
function getAlvo(n){if(p1.includes(n))return 1;if(p2.includes(n))return 2;if(p3.includes(n))return 3;return 0}
function getColReal(n){if(n==0)return 0;if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;return 3}
function render(){
grid.innerHTML='';for(let i=0;i<12;i++){let d=document.createElement('div');if(i<history.length){let h=history[i];if(h.result=='win')d.className='hslot green';else if(h.result=='lose')d.className='hslot red';else d.className='hslot yellow';d.textContent=h.num}else{d.className='hslot empty'}grid.appendChild(d)}
}
function renderB(num){
boxB.innerHTML='';
let mesmoCol = history.filter(h=>h.num==num);
if(mesmoCol.length==0){boxB.textContent='-';return}
mesmoCol.slice(-8).forEach(h=>{
let chip=document.createElement('span');
chip.className='ab-chip '+h.result;
if(h.result=='pending')chip.className='ab-chip yellow';
chip.textContent=h.num;
boxB.appendChild(chip);
});
}
function updateA(amareloNum){
boxA.innerHTML='';
let col=getColReal(amareloNum);
let mesmos=history.filter(h=>h.colReal==col).map(h=>h.num);
if(mesmos.length==0){boxA.textContent=amareloNum;return}
mesmos.slice(-6).forEach(n=>{let chip=document.createElement('span');chip.className='ab-chip yellow';chip.textContent=n;boxA.appendChild(chip)});
lastYellow=amareloNum;
}
function addN(n){if(cur.length>=2)return;cur+=n;boxUlt.textContent=cur}
function enterN(){
if(cur=='')return;let v=parseInt(cur);if(v>36)return;
if(v==0){history=[];colunaTravada=0;cur='';boxUlt.textContent='-';boxCol.textContent='COLUNA';boxA.textContent='-';boxB.textContent='-';render();return}
let idx=history.length,colReal=getColReal(v),alvo=getAlvo(v),res;
if(idx%4==0){colunaTravada=alvo;res='pending';boxCol.textContent='COLUNA '+colunaTravada;updateA(v)}else{if(colunaTravada>0)res=(colReal==colunaTravada)?'win':'lose';else res='pending'}
history.push({num:v,colReal:colReal,result:res});
if(history.length>12)history.shift();
cur='';boxUlt.textContent=v;
render();
// SE O NUMERO 2 SAIR, MOSTRA HISTORICO DELE NO B
if(v==2 || history.filter(h=>h.num==v).length>1){
renderB(v);
}
}
function corrige(){if(cur!=''){cur=cur.slice(0,-1);boxUlt.textContent=cur||'-'}else{history.pop();render();boxUlt.textContent=history.length?history[history.length-1].num:'-'}}
render();
</script>
</body>
</html>
