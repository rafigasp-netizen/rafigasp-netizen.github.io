topHist .numBig{color:#fff;font-size:30px;font-weight:900;min-width:36px}.topHist .sqs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.topHist .sqs::-webkit-scrollbar{display:none}.topHist .sqs span{width:36px;min-width:36px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;border:2px solid #fff;flex-shrink:0}.topHist .sqs .g{background:#00a000!important}.topHist .sqs .r{background:#c00000!important}.topHist .sqs .vazio{background:#333!important;color:#888!important;border-color:#555!important}.topHist .lado{color:#ffcc00;font-size:18px;font-weight:900;background:#111;border-radius:8px;padding:4px 10px;border:2px solid #ffcc00;flex-shrink:0;margin-left:8px}.topHist.B{border-color:#00ffff}.topHist.B .lado{color:#00ffff;border-color:#00ffff}.topHist.A{border-color:#ffcc00}.verde{display:none!important}.jogadaBox{background:#000;border:4px solid #00ff00;border-radius:12px;margin:2px;padding:16px;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center}.jogadaBox span{color:#00ff00;font-size:26px;font-weight:900;text-shadow:0 0 10px #00ff00}.jogadaBox.B{border-color:#00ffff}.jogadaBox.B span{color:#00ffff}.faixaEntre{background:#000;border:3px solid #ffcc00;border-radius:10px;margin:2px;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;min-height:46px;align-items:center;scrollbar-width:none;white-space:nowrap}.faixaEntre::-webkit-scrollbar{display:none}.faixaEntre.verdevermelho{border-color:#00ff00}.faixaEntre.verdevermelho h4{color:#00ff00}.faixaEntre.colarBox{border-color:#00ff88!important;background:#001a0f!important;min-height:64px;display:flex;justify-content:center;align-items:center;cursor:pointer}.faixaEntre h4{color:#ffcc00;font-size:12px;white-space:nowrap;flex-shrink:0}.numGeral{min-width:40px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;border:2px solid #fff;flex-shrink:0}.numGeral.A{background:#ffcc00!important;color:#000!important}.numGeral.B{background:#0066ff!important;color:#fff!important}.numGeral.C{background:#00a000!important}.numGeral.E{background:#c00000!important}.numGeral.zeroDuplo{background:linear-gradient(90deg,#c00000 0% 50%,#00a000 50% 100%)!important;color:#fff!important;border-color:#fff!important}.vermelho{margin:0 2px;background:#0a3d1f;border-radius:10px;padding:0;display:flex;flex:1;flex-direction:column;gap:0}.zeroBtn{background:#00a000;color:#fff;text-align:center;padding:14px 0;font-size:22px;font-weight:900;border-radius:10px 10px 0 0;cursor:pointer;border:3px solid #00ff00;border-bottom:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#0a3d1f;border-radius:0 0 10px 10px;overflow:hidden;padding:3px}.cell{border:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;min-height:52px;position:relative;cursor:pointer}.cell.red{background:#b50000}.cell.black{background:#222}.cell.pisca{animation:piscaForte 0.6s infinite;border:4px solid #ffff00!important;box-shadow:0 0 25px #ffff00!important;transform:scale(1.07);z-index:5;border-radius:8px}.cell.pisca.B{border-color:#00ffff!important;box-shadow:0 0 25px #00ffff!important}.badge{position:absolute;top:1px;right:1px;background:#000;color:#fff;font-size:9px;padding:1px 4px;border-radius:10px;border:1px solid #fff;font-weight:900}.badge.A{background:#ffcc00;color:#000}.badge.B{background:#0066ff}.badge.AB{background:#000;color:#ffcc00}.doisparaum{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:3px;background:#0a3d1f;border-radius:10px;overflow:hidden}.doisparaum div{background:#0a5a2e;color:#d4d46a;text-align:center;padding:12px 0;font-size:16px;font-weight:900}.doisparaum div.ativo{background:#ffcc00!important;color:#000!important}.btns{display:flex;gap:4px;padding:8px;padding-bottom:20px}.btns button{flex:1;padding:18px;border:0;border-radius:10px;font-weight:900;font-size:14px;background:#ffcc00;min-height:56px}.btns button.colab{background:#00ff88!important}.zoomInfo{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:2px solid #ffcc00;color:#ffcc00;padding:6px 14px;border-radius:20px;font-size:12px;z-index:100;display:none}.modalColar{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}.modalColar.show{display:flex}.colarBoxInner{background:#0a2e1e;border:3px solid #00ff88;border-radius:15px;padding:20px;max-width:420px;width:100%;text-align:center;color:#fff}.colarBoxInner textarea{width:100%;height:120px;background:#000;color:#ffcc00;border:2px solid #00ff88;border-radius:10px;padding:10px;font-size:14px;margin:10px 0}.colarBoxInner button{margin:5px;padding:12px 20px;border:0;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer}.colarBoxInner .btnOk{background:#00ff88;color:#000}.colarBoxInner .btnCancel{background:#ff4444;color:#fff}@keyframes piscaForte{0%,100%{transform:scale(1.07)}50%{transform:scale(1.14);filter:brightness(1.8)}}</style></head><body><div id="viewport"><div id="app">

<div class="topHist" id="topHist"><div class="esq"><div class="numBig">-</div><div class="sqs"></div></div><div class="lado">-</div></div>
<div class="verde" id="verdeInicial"></div>
<div class="jogadaBox" id="jogadaBox"><span>FALTAM 4</span></div>
<div class="faixaEntre verdevermelho" id="faixaHistColor"><h4>HIST A+B:</h4><div id="listaHistColor" style="display:flex;gap:6px"></div></div>
<div class="faixaEntre colarBox" id="faixaMeio" onclick="abrirColar()"><h4 style="font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;color:#00ff88">📋 COLAR NÚMEROS QUE EU EDITEI PRA VOCÊ</h4></div>

<div class="btns"><button onclick="corr()">↩️ CORRIGIR</button><button onclick="if(confirm('Zerar?')){localStorage.clear();location.reload()}">🗑️ LIMPAR</button><button class="colab" onclick="abrirColar()">📋 COLAR</button></div>
</div></div><div class="zoomInfo" id="zoomInfo"></div><div class="modalColar" id="modalColar"><div class="colarBoxInner"><h3 style="color:#00ff88">📋 COLAR NÚMEROS EDITADOS</h3><p style="font-size:12px;color:#ccc;margin:5px 0">Cole aqui os números que eu editei pra você no chat<br>Ex: 3 6 29 16 34 21...</p><textarea id="inputColar" placeholder="Cole aqui: 3 6 29 16 34 21 8 30 32..."></textarea><div id="previewNums" style="background:#000;border:2px solid #00ff00;border-radius:10px;padding:8px;margin:10px 0;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:30px"></div><div><button class="btnOk" onclick="confirmarColar()">✅ PREENCHER APP</button><button class="btnCancel" onclick="fecharColar()">❌ CANCELAR</button></div></div></div><script>
let zoomLevel=parseFloat(localStorage.getItem('zoomLevel')||'1');
const viewport=document.getElementById('viewport'); const app=document.getElementById('app');
function aplicaZoom(){ app.style.zoom = zoomLevel; app.style.transform = 'none'; if(!app.style.zoom || app.style.zoom===''){ app.style.transform='scale('+zoomLevel+')'; app.style.transformOrigin='top center'; } localStorage.setItem('zoomLevel',zoomLevel); let info=document.getElementById('zoomInfo'); info.textContent='Zoom '+Math.round(zoomLevel*100)+'%'; info.style.display='block'; setTimeout(()=>info.style.display='none',1000); }
function zoomMais(e){if(e){e.stopPropagation();e.preventDefault();}zoomLevel=Math.min(2.5,zoomLevel+0.15);aplicaZoom();}
function zoomMenos(e){if(e){e.stopPropagation();e.preventDefault();}zoomLevel=Math.max(0.35,zoomLevel-0.15);aplicaZoom();}
aplicaZoom();
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
let histA=JSON.parse(localStorage.getItem('histA')||'[]');let histB=JSON.parse(localStorage.getItem('histB')||'[]');
let histGeralCron=JSON.parse(localStorage.getItem('histGeralCron')||'[]');
let histApostas=JSON.parse(localStorage.getItem('histApostas')||'[]');
let activeA=JSON.parse(localStorage.getItem('activeA')||'null');let activeB=JSON.parse(localStorage.getItem('activeB')||'null');
let cntA=JSON.parse(localStorage.getItem('cntA')||'{}');let cntB=JSON.parse(localStorage.getItem('cntB')||'{}');
let acertoA=parseInt(localStorage.getItem('acertoA')||'0'),erroA=parseInt(localStorage.getItem('erroA')||'0');
let acertoB=parseInt(localStorage.getItem('acertoB')||'0'),erroB=parseInt(localStorage.getItem('erroB')||'0');
let gridEl=document.getElementById('grid');
for(let i=1;i<=36;i++){let d=document.createElement('div');d.className='cell '+(REDS.includes(i)?'red':'black');d.id='c'+i;d.innerHTML='<span>'+i+'</span><span class="badge" id="b'+i+'"></span>';d.addEventListener('click',()=>pick(i));gridEl.appendChild(d);}
function calcula(n1,n4){if(n1!==0 && !n1 || n4!==0 && !n4) return null;let c1=COL[n1],c4=COL[n4];if(c1===0||c4===0) return null;if(!c1||!c4) return null;if(c1===c4)return {n1:n1,n4:n4,c1:c1,c4:c4,jogar:[1,2,3].filter(c=>c!==c1)};else return {n1:n1,n4:n4,c1:c1,c4:c4,jogar:[c1,c4].sort((a,b)=>a-b)}}
function marca(jogada,vezA){ document.querySelectorAll('.cell').forEach(c=>{c.classList.remove('pisca','B');}); document.getElementById('zeroBtn').classList.remove('pisca'); document.getElementById('d1').className='';document.getElementById('d2').className='';document.getElementById('d3').className=''; if(!jogada) return; jogada.jogar.forEach(col=>document.getElementById('d'+col).classList.add('ativo')); for(let num=1;num<=36;num++){if(jogada.jogar.includes(COL[num])){let el=document.getElementById('c'+num);if(el){el.classList.add('pisca');if(!vezA)el.classList.add('B');}}} }
function getHistDoNumero(num){ let geral=[...histGeralCron]; let hist=[]; for(let i=0;i<geral.length;i++){if(geral[i].num===num){let proximo=i>0?geral[i-1].num:null;hist.push({proximo:proximo});}} let linha=geral.find(h=>h.num===num)?.linha||'A'; return {hist:hist.filter(h=>h.proximo!==null).slice(0,6), linha:linha}; }
function abrirColar(){document.getElementById('modalColar').classList.add('show'); document.getElementById('inputColar').focus();}
function fecharColar(){document.getElementById('modalColar').classList.remove('show');}
document.getElementById('inputColar').addEventListener('input',function(){
  let txt=this.value; let nums=txt.split(/[^0-9]+/).map(n=>parseInt(n)).filter(n=>!isNaN(n)&&n>=0&&n<=36);
  let div=document.getElementById('previewNums'); div.innerHTML='';
  nums.slice(0,50).forEach(n=>{let s=document.createElement('span'); s.textContent=n; s.style.background='#ffcc00'; s.style.color='#000'; s.style.padding='3px 6px'; s.style.borderRadius='5px'; s.style.fontSize='12px'; if(n===0){s.style.background='#00a000'; s.style.color='#fff';} div.appendChild(s);});
  if(nums.length>50){let m=document.createElement('span'); m.textContent='+'+(nums.length-50)+'...'; m.style.color='#00ff88'; div.appendChild(m);}
});
function confirmarColar(){
  let txt=document.getElementById('inputColar').value;
  let nums=txt.split(/[^0-9]+/).map(n=>parseInt(n)).filter(n=>!isNaN(n)&&n>=0&&n<=36);
  if(nums.length===0){alert('Cole os números! Ex: 3 6 29 16...'); return;}
  if(!confirm('Preencher App com '+nums.length+' números? Começando com: '+nums.slice(0,8).join(' ')+'...')) return;
  preencherComLista(nums);
  fecharColar();
  document.getElementById('inputColar').value='';
  document.getElementById('previewNums').innerHTML='';
}
function preencherComLista(lista){
  localStorage.clear();
  histA=[]; histB=[]; histGeralCron=[]; histApostas=[]; activeA=null; activeB=null; cntA={}; cntB={}; acertoA=0; erroA=0; acertoB=0; erroB=0;
  for(let i=lista.length-1;i>=0;i--){
    let num=lista[i];
    let vaiA=histA.length<=histB.length; let col=COL[num]; let ok=true, foi=false;
    if(num===0){
      let jogar=[];
      if(vaiA){if(activeA){foi=true; jogar=activeA.jogar; erroA++; histApostas.unshift({num:0, col:0, ok:false, jogar:jogar, linha:'A'});} histA.unshift({num:0,ok:false,foiAposta:foi}); cntA[0]=(cntA[0]||0)+1; histGeralCron.unshift({num:0,linha:'A',ok:false,foiAposta:foi});}
      else{if(activeB){foi=true; jogar=activeB.jogar; erroB++; histApostas.unshift({num:0, col:0, ok:false, jogar:jogar, linha:'B'});} histB.unshift({num:0,ok:false,foiAposta:foi}); cntB[0]=(cntB[0]||0)+1; histGeralCron.unshift({num:0,linha:'B',ok:false,foiAposta:foi});}
    } else {
      if(vaiA){
        if(activeA){foi=true; ok=activeA.jogar.includes(col); histApostas.unshift({num:num, col:col, ok:ok, jogar:activeA.jogar.slice(), linha:'A'}); if(ok){acertoA++; activeA=null;}else erroA++;}
        histA.unshift({num:num,ok:ok,foiAposta:foi}); cntA[num]=(cntA[num]||0)+1; histGeralCron.unshift({num:num,linha:'A',ok:ok,foiAposta:foi}); if(!activeA&&histA.length>=4) activeA=calcula(histA[0].num,histA[3].num);
      } else {
        if(activeB){foi=true; ok=activeB.jogar.includes(col); histApostas.unshift({num:num, col:col, ok:ok, jogar:activeB.jogar.slice(), linha:'B'}); if(ok){acertoB++; activeB=null;}else erroB++;}
        histB.unshift({num:num,ok:ok,foiAposta:foi}); cntB[num]=(cntB[num]||0)+1; histGeralCron.unshift({num:num,linha:'B',ok:ok,foiAposta:foi}); if(!activeB&&histB.length>=4) activeB=calcula(histB[0].num,histB[3].num);
      }
    }
  }
  localStorage.setItem('histApostas',JSON.stringify(histApostas));
  localStorage.setItem('cntA',JSON.stringify(cntA));localStorage.setItem('cntB',JSON.stringify(cntB));
  localStorage.setItem('activeA',JSON.stringify(activeA));localStorage.setItem('activeB',JSON.stringify(activeB));
  localStorage.setItem('histGeralCron',JSON.stringify(histGeralCron));localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));
  localStorage.setItem('acertoA',acertoA);localStorage.setItem('erroA',erroA);localStorage.setItem('acertoB',acertoB);localStorage.setItem('erroB',erroB);
  render();
}
function render(){
 let placarEl=document.getElementById('placar');
 let totalA=acertoA+erroA,totalB=acertoB+erroB;
 let percA=totalA>0?Math.round(acertoA/totalA*100):0;
 let percB=totalB>0?Math.round(acertoB/totalB*100):0;
 placarEl.innerHTML='<div class="A"><b>A</b><span class="win">✅ '+acertoA+'</span> <span class="loss">❌ '+erroA+'</span><br>'+percA+'%</div><div class="B"><b>B</b><span class="win">✅ '+acertoB+'</span> <span class="loss">❌ '+erroB+'</span><br>'+percB+'%</div><div style="border-color:#00ff00"><b>TOTAL</b><span class="win">✅ '+(acertoA+acertoB)+'</span> <span class="loss">❌ '+(erroA+erroB)+'</span><br>'+(totalA+totalB>0?Math.round((acertoA+acertoB)/(totalA+totalB)*100):0)+'%</div>';
 let vezA=histA.length<=histB.length;let jog=vezA?activeA:activeB;
 let topHistEl=document.getElementById('topHist');
 if(histGeralCron.length>0){
   let ultimo=histGeralCron[0];let info=getHistDoNumero(ultimo.num);
   topHistEl.className='topHist '+info.linha;
   let numBigEl=topHistEl.querySelector('.numBig');let sqsEl=topHistEl.querySelector('.sqs');let ladoEl=topHistEl.querySelector('.lado');
   numBigEl.textContent=ultimo.num;sqsEl.innerHTML='';
   if(info.hist.length===0){let s=document.createElement('span');s.className='vazio';s.textContent='...';sqsEl.appendChild(s);}
   else{info.hist.slice(0,6).forEach(h=>{let s=document.createElement('span');s.className='vazio';s.textContent=h.proximo;sqsEl.appendChild(s);});}
   ladoEl.textContent=info.linha;
 } else {topHistEl.className='topHist';topHistEl.querySelector('.numBig').textContent='-';topHistEl.querySelector('.sqs').innerHTML='';topHistEl.querySelector('.lado').textContent='-';}
 let box=document.getElementById('jogadaBox');
 if(jog){box.className='jogadaBox '+(vezA?'A':'B');box.innerHTML='<span>'+(vezA?'A':'B')+': JOGAR COLUNA '+jog.jogar.join('/')+'</span>';}
 else{box.className='jogadaBox '+(vezA?'A':'B');box.innerHTML='<span>'+(vezA&&histA.length<4||!vezA&&histB.length<4?'FALTAM '+(4-(vezA?histA.length:histB.length)):'JOGAR COLUNA -')+'</span>';}
 let histColor=document.getElementById('listaHistColor');histColor.innerHTML="";
 histGeralCron.slice(0,50).forEach(h=>{
   let d=document.createElement('div');
   if(h.num===0) d.className='numGeral zeroDuplo';
   else d.className='numGeral '+(h.ok?'C':'E');
   d.textContent=h.num;histColor.appendChild(d);
 });
 let g=document.getElementById('listaGeral');g.innerHTML="";
 histGeralCron.slice(0,60).forEach(h=>{
   let d=document.createElement('div');
   if(h.num===0) d.className='numGeral zeroDuplo';
   else d.className='numGeral '+(h.linha==='A'?'A':h.linha==='B'?'B':'C');
   d.textContent=h.num;g.appendChild(d);
 });
 for(let i=1;i<=36;i++){let tot=(cntA[i]||0)+(cntB[i]||0);let badge=document.getElementById('b'+i);if(tot===0)badge.textContent='';else{badge.textContent=tot+'x';badge.className='badge '+((cntA[i]&&cntB[i])?'AB':cntA[i]?'A':'B');}}
 let totZero=(cntA[0]||0)+(cntB[0]||0);
 if(totZero>0){let zb=document.getElementById('zeroBtn');zb.textContent='0 ('+totZero+'x)';}else{document.getElementById('zeroBtn').textContent='0';}
 marca(jog,vezA);
}
render();
function corr(){
 if(histApostas.length>0){
   let uA = histApostas.shift();
   if(histGeralCron.length>0 && histGeralCron[0].foiAposta) histGeralCron.shift();
   if(uA.linha==='A'){
     if(histA.length){let r=histA.shift();if(r.foiAposta){if(r.ok)acertoA=Math.max(0,acertoA-1);else erroA=Math.max(0,erroA-1);if(r.ok)activeA=null;}}cntA[uA.num]=Math.max(0,(cntA[uA.num]||1)-1);if(cntA[uA.num]===0)delete cntA[uA.num];
   } else {
     if(histB.length){let r=histB.shift();if(r.foiAposta){if(r.ok)acertoB=Math.max(0,acertoB-1);else erroB=Math.max(0,erroB-1);if(r.ok)activeB=null;}}cntB[uA.num]=Math.max(0,(cntB[uA.num]||1)-1);if(cntB[uA.num]===0)delete cntB[uA.num];
