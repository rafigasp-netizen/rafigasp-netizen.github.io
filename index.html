<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{height:100%}body{background:#000;color:#fff;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.topo{background:linear-gradient(#ffd700,#b8860b);color:#000;text-align:center;padding:6px;flex-shrink:0}
.topo b{display:block;font-size:22px}.topo span{font-size:10px;letter-spacing:2px}
.botoes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;padding:5px;flex-shrink:0}
.botoes button{background:linear-gradient(#ffe27a,#c89a00);border:0;border-radius:8px;padding:10px 2px;font-weight:bold;font-size:12px}
.titulo{background:#ffff00;margin:5px;border-radius:6px;border:1px solid gold;padding:10px;text-align:center;display:flex;justify-content:center;align-items:center;gap:10px;flex-shrink:0}
.titulo .fixo{color:#000;font-weight:900;font-size:16px}
.titulo .piscando{color:#c00000;font-weight:900;font-size:16px;display:none}
.titulo .piscando.ativo{display:inline-block;animation:pisca 0.7s infinite}
@keyframes pisca{0%{background:#ffff00;color:#c00000}50%{background:#c00000;color:#ffff00;padding:2px 6px;border-radius:4px}100%{background:#ffff00;color:#c00000}}
#lista-geral{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:4px}
.bloco10{display:flex;flex-wrap:wrap;gap:3px}
.par{display:flex;gap:1px;border:1.5px solid #ffcc00;border-radius:8px;padding:2px}
.q{width:32px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;color:#fff;border:1px solid #fff}
.q.C{background:#00b050}.q.E{background:#c00000}
.barra-amarela{margin:5px;flex-shrink:0}.barra-amarela .txt{background:#ffeb00;color:#000;padding:12px;border-radius:8px;font-weight:bold;font-size:16px}
.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px;flex-shrink:0;background:#000}
.teclado button{background:linear-gradient(#ffe27a,#c89a00);border:0;border-radius:8px;padding:18px;font-size:22px;font-weight:bold}
.teclado button.verde{background:linear-gradient(#00d000,#006000);color:#fff}
</style>
</head>
<body>
<div class="topo"><b>RAFIGASP</b><span>COACH DA ROLETA</span></div>
<div class="botoes"><button>🏠 INICIO</button><button onclick="apagar()">⬅️ APAGAR</button><button onclick="limpar()">🗑️ LIMPAR</button><button>➡️ PROX</button></div>

<div class="titulo" id="titulo">
<span class="fixo">BOA SORTE</span>
<span class="piscando" id="colPisca"></span>
</div>

<div id="lista-geral"></div>
<div class="barra-amarela"><div class="txt" id="txt">_</div></div>
<div class="teclado">
<button onclick="dig(1)">1</button><button onclick="dig(2)">2</button><button onclick="dig(3)">3</button>
<button onclick="dig(4)">4</button><button onclick="dig(5)">5</button><button onclick="dig(6)">6</button>
<button onclick="dig(7)">7</button><button onclick="dig(8)">8</button><button onclick="dig(9)">9</button>
<button onclick="enter()">ENTER</button><button class="verde" onclick="dig(0)">0</button><button onclick="corrigir()">CORRIGIR</button>
</div>
<script>
const TABELA={1:"2/3",2:"1/2",3:"1/2",4:"1/2",5:"2/3",6:"1/2",7:"2/3",8:"1/2",9:"2/3",10:"2/3",11:"1/3",12:"2/3",13:"1/3",14:"2/3",15:"1/3",16:"1/3",17:"1/3",18:"2/3",19:"1/2",20:"1/2",21:"2/3",22:"1/2",23:"1/2",24:"2/3",25:"1/3",26:"2/3",27:"1/3",28:"2/3",29:"1/3",30:"2/3",31:"1/3",32:"1/2",33:"2/3",34:"1/2",35:"2/3",36:"1/2",0:"ZERO"};
let buf="",geral=JSON.parse(localStorage.getItem('g')||'[]'),histN=[],histD=[],ultimo="_";
function render(){
let div=document.getElementById('lista-geral');div.innerHTML='';if(!geral.length)return;
let ord=[...geral].reverse(),chunks=[];for(let i=0;i<ord.length;i+=10)chunks.push(ord.slice(i,i+10));
for(let c=chunks.length-1;c>=0;c--){let chunk=chunks[c],pares=[];for(let i=0;i<chunk.length;i+=2)pares.push(chunk.slice(i,i+2));pares=pares.reverse().map(p=>[...p].reverse());let b=document.createElement('div');b.className='bloco10';pares.forEach(par=>{let pd=document.createElement('div');pd.className='par';par.forEach(it=>{let q=document.createElement('div');q.className='q '+(it.num==0?'zero':(it.ok?'C':'E'));q.textContent=it.num;pd.appendChild(q);});b.appendChild(pd);});div.appendChild(b);}
}
function atualizarTitulo(){
let streak=0;for(let it of histD){if(it.num==0)continue;if(it.ok===false)streak++;else break;}
let el=document.getElementById('colPisca');
if(streak>=2 && histN.length>0){
let col=TABELA[histN[0]]||"";el.textContent="| VEM COLUNA "+col;el.classList.add('ativo');
}else{el.textContent="";el.classList.remove('ativo');}
}
function apagar(){if(buf.length>0){buf=buf.slice(0,-1);document.getElementById('txt').innerText=buf||ultimo;}}
function limpar(){geral=[];histN=[];histD=[];ultimo="_";localStorage.setItem('g','[]');render();document.getElementById('txt').innerText="_";atualizarTitulo();}
function dig(n){if(buf.length<2)buf+=n;if(parseInt(buf)>36)buf=buf.slice(0,-1);document.getElementById('txt').innerText=buf||ultimo;}
function corrigir(){if(buf.length>0){buf=buf.slice(0,-1);document.getElementById('txt').innerText=buf||ultimo;return;}if(histD.length>0){histD.shift();histN.shift();geral.shift();localStorage.setItem('g',JSON.stringify(geral));if(histN.length>0)ultimo=histN[0]+"> "+(TABELA[histN[0]]||"");else ultimo="_";render();document.getElementById('txt').innerText=ultimo;atualizarTitulo();}}
function enter(){if(buf=="")return;let num=parseInt(buf);if(isNaN(num)||num<0||num>36){buf="";return;}let txt=num+"> "+(TABELA[num]||"ZERO");ultimo=txt;histN.unshift(num);histD.unshift({num:num,ok:false});geral.unshift({num:num,ok:false});localStorage.setItem('g',JSON.stringify(geral));buf="";render();document.getElementById('txt').innerText=txt;atualizarTitulo();}
render();atualizarTitulo();
</script>
</body>
</html>
