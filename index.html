<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAFIGASP COACH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a2e1a;display:flex;justify-content:center;padding:10px}
.phone{width:100%;max-width:390px;background:linear-gradient(180deg,#123f25 0%,#0d2e1c 100%);border-radius:28px;border:3px solid #b8963e;overflow:hidden}
.header{text-align:center;padding:16px;background:#1a4d2e}
.header h1{font-size:26px;color:#d4af37;font-weight:900}
.header span{font-size:14px;letter-spacing:3px;display:block;color:#c9a86a}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:#0a2214}
.box{background:#000;border:2px solid #b8963e;border-radius:14px;height:68px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.box.num{font-size:40px;font-weight:900;color:#d4af37}
.box.col{font-size:19px;font-weight:900;color:#d4af37}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
.slot{height:60px;border-radius:12px;border:2px dashed #d4af37;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.slot.empty{opacity:.5}
.slot.trigger{background:#f1c40f;color:#000;border-style:solid}
.slot.win{background:#1a9a3a;color:#fff;border-style:solid}
.slot.lose{background:#c0392b;color:#fff;border-style:solid}
.label{text-align:center;color:#d4af37;font-weight:800;padding:8px}
.keyboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 14px 18px;background:#0a2214}
.kbtn{height:58px;border-radius:12px;border:none;font-size:32px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.gold{background:linear-gradient(180deg,#e8c766,#b8963e);color:#5a4100}
.redbtn{background:linear-gradient(180deg,#e55,#a11);color:#fff}
.func{font-size:16px!important}
</style>
</head>
<body>
<div class="phone">
<div class="header"><h1>RAFIGASP<span>COACH DA ROLETA</span></h1></div>
<div class="top">
<div class="box"><span class="num" id="blueNum">--</span></div>
<div class="box"><span class="col" id="greenCol">COLUNA --</span></div>
</div>
<div class="grid" id="grid"></div>
<div class="label">TOQUE NOS NUMEROS</div>
<div class="keyboard">
<button class="kbtn gold" onclick="press('1')">1</button>
<button class="kbtn gold" onclick="press('2')">2</button>
<button class="kbtn gold" onclick="press('3')">3</button>
<button class="kbtn gold" onclick="press('4')">4</button>
<button class="kbtn gold" onclick="press('5')">5</button>
<button class="kbtn gold" onclick="press('6')">6</button>
<button class="kbtn gold" onclick="press('7')">7</button>
<button class="kbtn gold" onclick="press('8')">8</button>
<button class="kbtn gold" onclick="press('9')">9</button>
<button class="kbtn gold func" onclick="confirmNum()">ENTER</button>
<button class="kbtn redbtn" onclick="clearAll()">0</button>
<button class="kbtn gold func" onclick="corrigir()">CORRIGIR</button>
</div>
</div>
<script>
let buffer="",history=[],triggerCol=null,waiting=0;
function getCol(n){if(n==0)return 0;if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;return 3;}
function press(d){if(buffer.length>=2)return;buffer+=d;let v=parseInt(buffer);if(v>36){buffer=buffer.slice(0,-1);return;}document.getElementById('blueNum').textContent=buffer;let c=getCol(v);document.getElementById('greenCol').textContent=c==0?'ZERO':'COLUNA '+c;if(buffer.length==2)setTimeout(confirmNum,250);}
function confirmNum(){if(!buffer)return;let n=parseInt(buffer);buffer="";if(n===0){clearAll();return;}if(waiting===0){history.push({num:n,type:'trigger'});triggerCol=getCol(n);waiting=1;}else{let isWin=(getCol(n)===triggerCol);history.push({num:n,type:isWin?'win':'lose'});waiting++;if(waiting>3){waiting=0;triggerCol=null;}}render();document.getElementById('blueNum').textContent="--";document.getElementById('greenCol').textContent="COLUNA --";}
function clearAll(){history=[];buffer="";triggerCol=null;waiting=0;document.getElementById('blueNum').textContent="--";document.getElementById('greenCol').textContent="COLUNA --";render();}
function corrigir(){if(buffer.length>0){buffer=buffer.slice(0,-1);document.getElementById('blueNum').textContent=buffer||"--";return;}if(history.length>0){let l=history.pop();if(l.type==='trigger'){waiting=0;triggerCol=null;}else waiting--;render();}}
function render(){let g=document.getElementById('grid');g.innerHTML="";for(let i=0;i<12;i++){let it=history[i];let d=document.createElement('div');d.className='slot '+(it?it.type:'empty');if(it)d.textContent=it.num;g.appendChild(d);}}
render();
</script>
</body>
</html>
