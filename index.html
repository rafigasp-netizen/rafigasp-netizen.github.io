<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP - GATILHO AZUL + VERMELHO = C2/3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#001a00;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:100%;max-width:400px;height:100dvh;background:#001a00;display:flex;flex-direction:column;border:2px solid #d4af37}
.topo{text-align:center;background:linear-gradient(180deg,#e8c76a,#b8941f);padding:6px 0 5px;flex-shrink:0}
.topoR{font-weight:900;font-size:28px;color:#111;letter-spacing:1px;line-height:1}
.topoS{font-size:9px;letter-spacing:4px;color:#333;font-weight:800}
.display{margin:4px 6px;background:#000;border:2.5px solid #d4af37;border-radius:10px;height:42px;display:flex;align-items:center;justify-content:center;color:#0f8a1f;font-weight:900;font-size:13px;flex-shrink:0;text-align:center;padding:2px}
.display.sinal{background:linear-gradient(180deg,#ffaa00,#ff6600);color:#000;border-color:#fff;font-size:12px;animation:pisca 0.6s infinite alternate}
.display.verde{background:#002200;color:#00ff00;border-color:#00ff00}
.display.vermelho{background:#cc0000;color:#fff;border-color:#ff0000}
@keyframes pisca{0%{background:#ffaa00}100%{background:#ff6600}}
.topHistBar{background:#000;border:1.5px solid #1a4a1a;border-radius:6px;margin:0 4px;padding:4px;display:flex;gap:2px;flex-wrap:wrap;min-height:30px;flex-shrink:0}
.nBox{height:22px;min-width:22px;padding:0 5px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:#fff;border:1px solid rgba(0,0,0,0.2)}
.nBox.green{background:#0f8a2a}
.nBox.red{background:#cc0000}
.nBox.blue{background:#1e40af;border:2px solid #fff;box-shadow:0 0 4px #60a5fa}
.histContainer{flex:1;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:4px;background:#001a00}
.hCard{background:#0a2a0a;border:1.5px solid #2a5a2a;border-radius:6px;padding:4px}
.hCard.ativo{border-color:#ffaa00;box-shadow:0 0 6px #ffaa00;background:#1a2a00}
.hTitle{font-size:10px;font-weight:900;color:#d4af37;margin-bottom:3px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.hTitle b{color:#ffaa00}
.icons{display:flex;gap:1px;align-items:center}
.iconB{width:12px;height:10px;background:#1e40af;border:1.5px solid #fff;border-radius:2px;box-shadow:0 0 2px #60a5fa}
.iconW{width:12px;height:10px;background:#fff;border:1px solid #999;border-radius:2px}
.numRow{display:flex;gap:2px;flex-wrap:wrap;min-height:22px}
.numRow .nBox{height:20px;min-width:20px}
.jogarBar{background:linear-gradient(180deg,#4a0000,#8a0000);border:2px solid #ff4444;border-radius:8px;padding:7px;text-align:center;color:#fff;font-weight:900;font-size:14px;flex-shrink:0;margin:4px;line-height:1.2}
.jogarBar.sinal{background:linear-gradient(180deg,#ffaa00,#ff6600);color:#000;border-color:#fff;animation:piscaBar 0.7s infinite alternate}
@keyframes piscaBar{0%{background:#ffaa00}100%{background:#ff8800}}
.kb{background:linear-gradient(180deg,#e8c76a,#b8941f);border-top:2px solid #d4af37;padding:5px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;height:36%;min-height:190px}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.k{border-radius:8px;border:1.5px solid #8a6d1b;font-weight:900;font-size:18px;background:linear-gradient(180deg,#f9e27a,#b8941f);color:#111;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="app">
<div class="topo"><div class="topoR">RAFIGASP</div><div class="topoS">COACH DA ROLETA</div></div>
<div class="display" id="disp">DIGITE O NÚMERO - 🟦 GATILHO AZUL + 🔴 VERMELHO = ENTRA C2/3</div>
<div class="topHistBar" id="topHist"></div>
<div class="histContainer" id="histContainer">
<div class="hCard" id="card-A"><div class="hTitle"><b>A HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+1) - 🟦 GATILHO + 1 🔴 = ENTRA C2/3</div><div class="numRow" id="row-A"></div></div>
<div class="hCard" id="card-B"><div class="hTitle"><b>B HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div><div class="iconW"></div></div> (1+2) - 🟦 + 2 🔴</div><div class="numRow" id="row-B"></div></div>
<div class="hCard" id="card-C"><div class="hTitle"><b>C HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div><div class="iconW"></div></div> (1+3)</div><div class="numRow" id="row-C"></div></div>
<div class="hCard" id="card-D"><div class="hTitle"><b>D HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+4)</div><div class="numRow" id="row-D"></div></div>
<div class="hCard" id="card-E"><div class="hTitle"><b>E HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div><div class="iconW"></div></div> (1+5)</div><div class="numRow" id="row-E"></div></div>
<div class="hCard" id="card-F"><div class="hTitle"><b>F HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div><div class="iconW"></div></div> (1+6)</div><div class="numRow" id="row-F"></div></div>
</div>
<div class="jogarBar" id="jogarBar">JOGAR NA COLUNA C2/3 - AGUARDANDO GATILHO AZUL + VERMELHO</div>
<div class="kb">
<div class="kr"><button class="k" onclick="dig('1')">1</button><button class="k" onclick="dig('2')">2</button><button class="k" onclick="dig('3')">3</button></div>
<div class="kr"><button class="k" onclick="dig('4')">4</button><button class="k" onclick="dig('5')">5</button><button class="k" onclick="dig('6')">6</button></div>
<div class="kr"><button class="k" onclick="dig('7')">7</button><button class="k" onclick="dig('8')">8</button><button class="k" onclick="dig('9')">9</button></div>
<div class="kr"><button class="k" onclick="ok()">ENTER</button><button class="k" onclick="dig('0')">0</button><button class="k" onclick="corr()">CORRIGIR</button></div>
</div>
</div>
<script>
var cur="",lista=[];
function getCol(n){
 if(n==0) return 0;
 if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0) return 1;
 if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0) return 2;
 return 3;
}
function getCor(n, isGatilho){
 if(isGatilho) return 'blue';
 var col=getCol(n);
 if(col==0) return 'blue';
 if(col==1) return 'red';
 return 'green';
}
function isGatilho(n){
 // Gatilho azul = 2 ou 0 ou 11 ou 23 ou 30 - numeros que na estrategia sao gatilho
 // No seu print, o 2 azul foi gatilho
 return n==2 || n==0 || n==11 || n==23 || n==30;
}
function show(){
 var d=document.getElementById('disp');
 if(cur==""){d.textContent="DIGITE O NÚMERO - 🟦=GATILHO AZUL, 🔴=C1, 🟢=C2/3 - VERMELHO DEPOIS DO AZUL = ENTRA C2/3";d.className="display";}
 else if(cur=="0"){d.textContent="0 = APAGAR ULTIMO";d.className="display";}
 else if(cur=="00"){d.textContent="00 = LIMPAR TUDO";d.className="display vermelho";}
 else{d.textContent="NUM: "+cur;d.className="display";}
}
function dig(v){if(cur.length>=2)cur=v;else cur+=v;show();}
function corr(){if(cur!=""){cur=cur.slice(0,-1);show();}else{if(lista.length){lista.pop();upd();}}}
function limpar(){lista=[];cur="";upd();show();}
function ok(){
 if(cur===""){return;}
 if(cur==="00"){limpar();return;}
 if(cur==="0"){if(lista.length)lista.pop();cur="";show();upd();return;}
 var n=parseInt(cur);if(isNaN(n)||n<0||n>36){cur="";show();return;}
 lista.push(n);
 cur="";show();upd();
}
function makeBox(num, cor, isGatilho){
 var e=document.createElement('div');
 e.className='nBox '+cor;
 e.textContent=num;
 if(isGatilho){e.title="GATILHO AZUL";}
 return e;
}
function upd(){
 // Topo
 var top=document.getElementById('topHist');
 top.innerHTML="";
 var mostrarTop = lista.length>0 ? lista.slice(-12) : [5,6,4,5,2,14,1,6,5,4];
 for(var i=0;i<mostrarTop.length;i++){
  var num=mostrarTop[i];
  var isGat=isGatilho(num);
  var cor=getCor(num, isGat);
  top.appendChild(makeBox(num, cor, isGat));
 }

 // Logica Gatilho Azul + Vermelhos
 // Percorre a lista para encontrar gatilhos e contar vermelhos depois
 var letras=["A","B","C","D","E","F"];
 var niveis=[1,2,3,4,5,6];

 // Para cada nivel, vamos simular o historico
 for(var lvlIdx=0; lvlIdx<niveis.length; lvlIdx++){
  var letra=letras[lvlIdx];
  var nivel=niveis[lvlIdx];
  var row=document.getElementById('row-'+letra);
  var card=document.getElementById('card-'+letra);
  row.innerHTML="";
  card.classList.remove('ativo');

  if(lista.length==0){
   // Exemplo fixo igual seu print quando vazio
   var exemploNums=[8,2,1,7,8,5,3,3,31,9,3,3,2,3,2,1,11];
   var coresEx={
    A:["green","blue","red","green","green","green","red","red","red","red","blue","blue","red","green","green","green","blue"],
    B:["green","blue","blue","green","blue","green","green","green","blue","red","blue","red","blue","red","blue","green","blue"],
    C:["green","blue","blue","green","blue","blue","green","green","blue","red","blue","blue","blue","red","blue","green","blue"],
    D:["blue","green","blue","green","blue","red","green","green","blue","red","red","blue","green","red","green","blue","green"],
    E:["green","blue","blue","green","green","green","blue","red","blue","red","blue","green","blue","green","red","blue","green"],
    F:["green","blue","green","blue","blue","green","blue","blue","blue","red","green","blue","blue","green","red","green","blue"]
   };
   for(var j=0;j<exemploNums.length;j++){
    var n=exemploNums[j];
    var cor=coresEx[letra][j]||'green';
    row.appendChild(makeBox(n, cor, cor=='blue'));
   }
   continue;
  }

  // Logica real com gatilho azul
  var historicoVisual=[];
  var gatilhoAtivo=false;
  var vermelhosDepois=0;
  var sinalAtivo=false;

  for(var i=0;i<lista.length;i++){
   var n=lista[i];
   var isGat=isGatilho(n);
   var col=getCol(n);
   var cor=getCor(n, isGat);

   if(isGat){
    // Novo gatilho azul
    gatilhoAtivo=true;
    vermelhosDepois=0;
    historicoVisual.push({n:n, cor:'blue', gatilho:true});
    continue;
   }

   if(gatilhoAtivo){
    if(col==1){
     vermelhosDepois++;
     historicoVisual.push({n:n, cor:'red', gatilho:false});
     if(vermelhosDepois==nivel){
      sinalAtivo=true;
     }else if(vermelhosDepois>nivel){
      // Perdeu nesse nivel, reseta gatilho
      gatilhoAtivo=false;
      vermelhosDepois=0;
     }
    }else if(col==2 || col==3){
     // Verde depois de vermelhos - ganhou
     historicoVisual.push({n:n, cor:'green', gatilho:false});
     if(sinalAtivo){
      // Ganhou no sinal
      gatilhoAtivo=false;
      vermelhosDepois=0;
      sinalAtivo=false;
     }else{
      // Verde fora do sinal, continua contando? Se ja teve vermelhos, reseta?
      if(vermelhosDepois>0 && vermelhosDepois<nivel){
       // Quebrou sequencia de vermelhos antes de atingir nivel
       gatilhoAtivo=false;
       vermelhosDepois=0;
      }
     }
    }else{
     historicoVisual.push({n:n, cor:'blue', gatilho:false});
    }
   }else{
    // Sem gatilho ativo, so mostra como verde/vermelho normal mas sem contar
    historicoVisual.push({n:n, cor:col==1?'red':(col==0?'blue':'green'), gatilho:false});
   }
  }

  // Mostra ultimos 17
  var mostrar = historicoVisual.slice(-17);
  for(var k=0;k<mostrar.length;k++){
   var item=mostrar[k];
   row.appendChild(makeBox(item.n, item.cor, item.gatilho));
  }

  // Se sinal ativo para esse nivel, destaca o card
  if(sinalAtivo){
   card.classList.add('ativo');
  }
 }

 // Barra JOGAR NA COLUNA - verifica se tem algum sinal ativo
 var bar=document.getElementById('jogarBar');
 var disp=document.getElementById('disp');
 var temSinal=false;
 var nivelSinal=0;

 // Verifica do menor para o maior nivel
 for(var lvl=1; lvl<=6; lvl++){
  var gatilhoAtivo=false;
  var vermelhos=0;
  for(var i=0;i<lista.length;i++){
   var n=lista[i];
   if(isGatilho(n)){gatilhoAtivo=true;vermelhos=0;continue;}
   if(gatilhoAtivo){
    if(getCol(n)==1){vermelhos++; if(vermelhos==lvl){temSinal=true;nivelSinal=lvl;}}
    else if(getCol(n)==2 || getCol(n)==3){if(vermelhos==lvl){gatilhoAtivo=false;vermelhos=0;temSinal=false;break;}else if(vermelhos>0 && vermelhos<lvl){gatilhoAtivo=false;vermelhos=0;}}
   }
  }
  if(temSinal) break;
 }

 if(temSinal){
  bar.textContent="🔴 VERMELHO DEPOIS DO 🟦 GATILHO AZUL ("+nivelSinal+"x) - JOGAR NA COLUNA C2/3 AGORA! - SINAL "+String.fromCharCode(64+nivelSinal)+" HIST";
  bar.className="jogarBar sinal";
  if(cur==""){
   disp.textContent="🔴 "+nivelSinal+" VERMELHO(S) DEPOIS DO GATILHO AZUL - ENTRAR C2/3! - "+String.fromCharCode(64+nivelSinal)+" HIST ("+(1+nivelSinal)+")";
   disp.className="display sinal";
  }
 }else{
  if(lista.length==0){
   bar.textContent="JOGAR NA COLUNA C2/3 - AGUARDANDO 🟦 GATILHO AZUL + 🔴 VERMELHO";
   bar.className="jogarBar";
  }else{
   var ultimo=lista[lista.length-1];
   if(isGatilho(ultimo)){
    bar.textContent="🟦 GATILHO AZUL SAIU ("+ultimo+") - AGUARDANDO 🔴 VERMELHO PARA ENTRAR C2/3";
    bar.className="jogarBar sinal";
    bar.style.background="linear-gradient(180deg,#1e40af,#60a5fa)";
    bar.style.borderColor="#fff";
   }else if(getCol(ultimo)==1){
    bar.textContent="🔴 VERMELHO C1 ("+ultimo+") - SE TEVE GATILHO AZUL ANTES, JOGAR C2/3";
    bar.className="jogarBar";
    bar.style.background="linear-gradient(180deg,#4a0000,#8a0000)";
   }else{
    bar.textContent="🟢 VERDE C2/3 ("+ultimo+") - AGUARDANDO NOVO GATILHO AZUL";
    bar.className="jogarBar";
    bar.style.background="linear-gradient(180deg,#004400,#00aa00)";
   }
  }
 }
}
show();upd();
</script>
</body>
</html>
