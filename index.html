<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{height:100%;background:#111;display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#000;display:flex;flex-direction:column}
.topo{background:linear-gradient(#ffd700,#b8860b);color:#000;text-align:center;padding:6px;flex-shrink:0}
.topo b{display:block;font-size:22px}.topo span{font-size:10px;letter-spacing:2px}
.botoes{display:none;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:4px;flex-shrink:0}
.botoes.visivel{display:grid}
.botoes button{background:linear-gradient(#ffe27a,#c89a00);border:0;border-radius:6px;padding:8px 2px;font-weight:bold;font-size:11px}
.titulo-alerta{text-align:center;font-weight:900;padding:8px;font-size:13px;color:#ffd700;letter-spacing:1px;flex-shrink:0}
.titulo-alerta.piscando{color:#ffff00;background:#8b0000;margin:4px;border-radius:6px;border:2px solid gold;animation:pisca .6s infinite}
@keyframes pisca{0%{background:#8b0000;color:#ffff00}50%{background:#ffff00;color:#8b0000}100%{background:#8b0000;color:#ffff00}}
#lista-geral{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:4px}
.bloco10{display:flex;flex-wrap:wrap;gap:4px}
.par{display:flex;gap:1px;border:1.5px solid #ffcc00;border-radius:7px;padding:2px}
.q{width:32px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;color:#fff;border:1px solid #fff}
.q.C{background:#00b050}.q.E{background:#c00000}
.barra{display:flex;gap:4px;margin:4px;flex-shrink:0}
.barra .amarela{flex:1;background:#ffeb00;color:#000;padding:10px 10px;border-radius:6px;font-weight:bold;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.barra .saldo{background:#fff;color:#000;border:2px solid #000;padding:8px 6px;border-radius:6px;font-weight:900;font-size:12px;min-width:95px;text-align:center}
.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:4px;background:#000;flex-shrink:0}
.teclado button{background:linear-gradient(#ffe27a,#c89a00);border:0;border-radius:6px;padding:18px;font-size:22px;font-weight:bold}
.teclado button.verde{background:linear-gradient(#00d000,#006000);color:#fff}
.mini{width:12px;height:12px;border-radius:2px;display:inline-block;border:1px solid #000;margin-left:5px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><b>RAFIGASP</b><span>COACH DA ROLETA</span></div>
<div class="botoes" id="botoes"><button>🏠 INICIO</button><button onclick="apagar()">⬅️ APAGAR</button><button onclick="limpar()">🗑️ LIMPAR</button><button>➡️ PROX</button></div>
<div class="titulo-alerta" id="alerta">GERAL - PAR 2 EM 2</div>
<div id="lista-geral"></div>
<div class="barra">
<div class="amarela"><div><span id="txtLeft">-</span><span id="miniCor" class="mini" style="display:none"></span></div><div style="text-align:right"><div id="txtPlacar">0V | 0X</div><div id="txtStatus" style="font-size:10px">-</div></div></div>
<div class="saldo" id="saldoBox">R$: 0,10<br><span id="placarTotal" style="font-size:10px">0V | 0X</span></div>
</div>
<div class="teclado">
<button onclick="dig(1)">1</button><button onclick="dig(2)">2</button><button onclick="dig(3)">3</button>
<button onclick="dig(4)">4</button><button onclick="dig(5)">5</button><button onclick="dig(6)">6</button>
<button onclick="dig(7)">7</button><button onclick="dig(8)">8</button><button onclick="dig(9)">9</button>
<button onclick="enter()">ENTER</button><button class="verde" onclick="dig(0)">0</button><button onclick="corrigir()">CORRIGIR</button>
</div>
</div>
<script>
const COL={1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3,0:0};
const TAB={1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2",0:"ZERO"};
let buf="",geral=JSON.parse(localStorage.getItem('g')||'[]'),histN=[],histD=[],ultimo="-",sinal=null,perdas=0,saldo=0.10;
function render(){
let div=document.getElementById('lista-geral');div.innerHTML='';
let v=0,x=0;geral.forEach(it=>{if(it.ok)v++;else x++;});
document.getElementById('placarTotal').innerText=v+"V | "+x+"X";
document.getElementById('txtPlacar').innerText=v+"V | "+x+"X";
if(!geral.length)return;
let ord=[...geral].reverse(),chunks=[];for(let i=0;i<ord.length;i+=10)chunks.push(ord.slice(i,i+10));
for(let c=chunks.length-1;c>=0;c--){
let chunk=chunks[c],pares=[];for(let i=0;i<chunk.length;i+=2)pares.push(chunk.slice(i,i+2));
pares=pares.reverse().map(p=>[...p].reverse());
let b=document.createElement('div');b.className='bloco10';
pares.forEach(par=>{let pd=document.createElement('div');pd.className='par';par.forEach(it=>{let q=document.createElement('div');q.className='q '+(it.ok?'C':'E');q.textContent=it.num;pd.appendChild(q);});b.appendChild(pd);});
div.appendChild(b);
}
}
function atualizaAlerta(){
let el=document.getElementById('alerta');
if(perdas>=2 && sinal){el.textContent="VEM COLUNA "+sinal;el.classList.add('piscando');}
else{el.textContent="GERAL - PAR 2 EM 2";el.classList.remove('piscando');}
}
(function init(){
saldo=parseFloat(localStorage.getItem('saldo')||'0.10');
for(let i=geral.length-1;i>=0;i--){histN.unshift(geral[i].num);histD.unshift({num:geral[i].num,ok:geral[i].ok});}
let s=0;for(let it of histD){if(!it.ok)s++;else break;}perdas=s;
if(perdas>=2 && histN.length>0)sinal=TAB[histN[0]];
render();atualizaAlerta();
if(geral.length>0){
let ok=geral[0].ok;ultimo=geral[0].num+"> "+TAB[geral[0].num];
document.getElementById('txtLeft').innerText=ultimo;
document.getElementById('miniCor').style.display='inline-block';document.getElementById('miniCor').style.background=ok?'#00b050':'#c00000';
document.getElementById('txtStatus').innerText=ok?'ACERTOU':'ERROU';
}
})();
function apagar(){if(buf.length>0){buf=buf.slice(0,-1);document.getElementById('txtLeft').innerText=buf||ultimo;}}
function limpar(){geral=[];histN=[];histD=[];ultimo="-";sinal=null;perdas=0;saldo=0.10;localStorage.setItem('g','[]');localStorage.setItem('saldo','0.10');buf="";render();document.getElementById('txtLeft').innerText="-";document.getElementById('miniCor').style.display='none';document.getElementById('txtStatus').innerText="-";document.getElementById('txtPlacar').innerText="0V | 0X";atualizaAlerta();}
function dig(n){
let teste=buf+String(n);
if(teste==="000"){document.getElementById('botoes').classList.toggle('visivel');buf="";document.getElementById('txtLeft').innerText=ultimo;return;}
if(buf.length<2)buf+=String(n);
if(parseInt(buf)>36)buf=buf.slice(0,-1);
document.getElementById('txtLeft').innerText=buf||ultimo;
}
function corrigir(){
if(buf.length>0){buf=buf.slice(0,-1);document.getElementById('txtLeft').innerText=buf||ultimo;return;}
if(histD.length>0){histD.shift();histN.shift();let r=geral.shift();if(r.ok)saldo-=0.10;localStorage.setItem('g',JSON.stringify(geral));localStorage.setItem('saldo',String(saldo));
let s=0;for(let it of histD){if(!it.ok)s++;else break;}perdas=s;if(perdas>=2 && histN.length>0)sinal=TAB[histN[0]];else if(perdas===0)sinal=null;
if(histN.length>0){ultimo=histN[0]+"> "+TAB[histN[0]];document.getElementById('txtLeft').innerText=ultimo;document.getElementById('txtStatus').innerText=histD[0].ok?'ACERTOU':'ERROU';}else{ultimo="-";document.getElementById('txtLeft').innerText="-";document.getElementById('txtStatus').innerText="-";document.getElementById('miniCor').style.display='none';}
render();atualizaAlerta();}
}
function enter(){
if(buf==="")return;
let num=parseInt(buf);if(isNaN(num)||num<0||num>36){buf="";return;}
let ok=true;
if(histN.length>0){
let prev=histN[0];
let alvo=TAB[prev].split('/').map(Number);
let colReal=COL[num];
if(num===0){ok=false;}else{ok=alvo.includes(colReal);}
}else{
// primeiro numero da lista - marca como neutro verde pra não começar já com erro
ok=true;
}
let txt=num+"> "+TAB[num];ultimo=txt;
if(ok){perdas=0;sinal=null;if(histN.length>0)saldo+=0.10;}else{perdas++;sinal=TAB[num];}
histN.unshift(num);histD.unshift({num:num,ok:ok});geral.unshift({num:num,ok:ok});
localStorage.setItem('g',JSON.stringify(geral));localStorage.setItem('saldo',String(saldo));
buf="";render();
document.getElementById('txtLeft').innerText=txt;
document.getElementById('miniCor').style.display='inline-block';document.getElementById('miniCor').style.background=ok?'#00b050':'#c00000';
document.getElementById('txtStatus').innerText=ok?'ACERTOU':'ERROU';
document.getElementById('txtStatus').style.color=ok?'#00b050':'#c00000';
atualizaAlerta();
}
</script>
</body>
</html>
