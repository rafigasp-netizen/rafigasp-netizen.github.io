<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d2818;display:flex;justify-content:center;font-family:Arial}
.app{width:100%;max-width:420px;min-height:100dvh;background:#0d2818;border:2px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:10px;text-align:center}
.topo h1{color:#000;font-size:20px;font-weight:900}
.topo span{font-size:12px;color:#4a3410;font-weight:800;display:block}
.history{background:#0f2e1f;padding:10px}
.hist-grid{display:grid!important;grid-template-columns:repeat(4,1fr);gap:8px}
.hslot{height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.hslot.empty{border:2px dashed #d4af37;background:rgba(212,175,55,0.1)}
.hslot.yellow{background:#d4af37!important;color:#000!important}
.hslot.green{background:#16a34a!important;color:#fff!important}
.hslot.red{background:#dc2626!important;color:#fff!important}
.hslot.preview{outline:3px solid #fff;opacity:.7}
.bottom{padding:10px;display:flex;flex-direction:column;gap:10px}
.blue-box{border:3px solid #3b82f6;border-radius:14px;padding:8px;background:#0a2a1a;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:110px}
.blue-card{background:#123524;border-radius:10px;padding:8px;display:flex;align-items:center;gap:6px;min-height:48px;opacity:.2}
.blue-card.hasData{opacity:1}
.blue-card.active{opacity:1;border:2px solid #d4af37;background:#1a3d26}
.blue-card .label{color:#d4af37;font-weight:900;font-size:12px}
.blue-card .b{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900}
.b.green{background:#16a34a}.b.red{background:#dc2626}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{height:68px;border-radius:16px;border:none;font-weight:900;font-size:24px}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:13px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div>
<div class="history"><div class="hist-grid" id="grid"></div></div>
<div class="bottom">
<div class="blue-box" id="blueBox"></div>
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
</div>
<script>
let history=[],cur='';
const grid=document.getElementById('grid');
const blueBox=document.getElementById('blueBox');
const gC23=[6,9,11,14,16,17,19,21,26,29,33,36];
const gC13=[2,3,5,8,10,13,20,25,28,31,32,35];
const gC12=[1,4,7,12,15,18,22,23,24,27,30,34];
function getAlvo(n){if(gC23.includes(n))return "C2/3";if(gC13.includes(n))return "C1/3";if(gC12.includes(n))return "C1/2";return "";}
function getColunaReal(n){if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;return 0;}
function getColunasDoAlvo(a){if(a=="C1/3")return [1,3];if(a=="C2/3")return [2,3];if(a=="C1/2")return [1,2];return [];}
function render(preview=null){
grid.innerHTML='';
for(let i=0;i<12;i++){
let d=document.createElement('div');
if(preview && i==history.length){
let v=preview.num;
if(v==="00"){d.className='hslot yellow preview';d.textContent='00';}
else if(i<4){d.className='hslot yellow preview';d.textContent=`${v} ${preview.alvo}`;}
else{
let header=history[i%4];
if(!header){d.className='hslot empty';}
else{
let cr=getColunaReal(v);
let ca=getColunasDoAlvo(header.alvo);
d.textContent=v;
d.className='hslot '+(ca.includes(cr)?'green':'red')+' preview';
}
}
grid.appendChild(d);continue;
}
if(i<history.length){let h=history[i];if(i<4){d.className='hslot yellow';d.textContent=`${h.num} ${h.alvo}`;}else{let header=history[i%4];let cr=getColunaReal(h.num);let ca=getColunasDoAlvo(header.alvo);d.textContent=h.num;d.className='hslot '+(ca.includes(cr)?'green':'red');}}else{d.className='hslot empty';}
grid.appendChild(d);
}
// AZUL ISOLADO A-A B-B C-C D-D
blueBox.innerHTML='';
let isPreview = preview!=null;
let pCol = history.length % 4;
let isTriggerPhase = history.length < 4;
for(let col=0;col<4;col++){
let card=document.createElement('div');card.className='blue-card';
let header=history[col];
if(isPreview){
let shouldShow=false;
if(preview.num==="00"){shouldShow=(col==history.length);}
else if(isTriggerPhase){shouldShow=(col==history.length);}
else{shouldShow=(col==pCol);}
if(shouldShow){
card.classList.add('active','hasData');
if(preview.num==="00"){card.innerHTML=`<span class="label">00 - ZERAR</span>`;}
else if(isTriggerPhase){card.innerHTML=`<span class="label">${preview.num} ${preview.alvo}</span>`;}
else{
let cr=getColunaReal(preview.num);
let ca=getColunasDoAlvo(header.alvo);
let cor=ca.includes(cr)?'green':'red';
let r1=history[col+4];
function b(h){if(!h)return '';let cr2=getColunaReal(h.num);let ca2=getColunasDoAlvo(header.alvo);return `<div class="b ${ca2.includes(cr2)?'green':'red'}">${h.num}</div>`;}
let html=`<span class="label">${header.num} ${header.alvo}</span>`;
if(r1) html+=b(r1);
html+=`<div class="b ${cor}">${preview.num}</div>`;
card.innerHTML=html;
}
}else{card.innerHTML='';}
}else{
// SEM DIGITAR - MOSTRA CADA UM COM SEU HISTORICO
if(!header){card.innerHTML='';}
else{
card.classList.add('hasData');
let r1=history[col+4],r2=history[col+8];
function b(h){if(!h)return '';let cr=getColunaReal(h.num);let ca=getColunasDoAlvo(header.alvo);return `<div class="b ${ca.includes(cr)?'green':'red'}">${h.num}</div>`;}
card.innerHTML=`<span class="label">${header.num} ${header.alvo}</span>${b(r1)}${b(r2)}`;
}
}
blueBox.appendChild(card);
}
}
function addN(n){
if(cur==="0" && n===0){cur="00";render({num:"00",alvo:""});return;}
if(cur==="00"){cur=n.toString();let v=parseInt(cur);render({num:v,alvo:getAlvo(v)});return;}
if(cur.length>=2)return;
cur+=n.toString();
if(cur==="00"){render({num:"00",alvo:""});return;}
let v=parseInt(cur);
render({num:v,alvo:getAlvo(v)});
}
function enterN(){
if(cur==='')return;
if(cur==="00"){history=[];cur='';render();return;}
let v=parseInt(cur);
if(v>36){cur='';render();return;}
if(v===0){history=[];cur='';render();return;}
let alvo=getAlvo(v);
history.push({num:v,alvo:alvo});
cur='';render();
if(history.length>=12){setTimeout(()=>{history=[];render();},900);}
}
function corrige(){
if(cur!=''){cur=cur.slice(0,-1);if(cur==''){render();}else if(cur==="00"){render({num:"00",alvo:""});}else{let v=parseInt(cur);render({num:v,alvo:getAlvo(v)});}}
else if(history.length>0){history.pop();render();}
}
render();
</script>
</body>
</html>
