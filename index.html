<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>RAFIGASP</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}html,body{height:100%;overflow:hidden}::-webkit-scrollbar{display:none}body{background:#000;display:flex;justify-content:center}.app{width:100%;max-width:400px;background:#000;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.topo{height:36px;background:linear-gradient(180deg,#f7e8a5,#d4af37);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}.topo h1{font-size:18px;font-weight:900}.topo span{font-size:7px;letter-spacing:2px}.menu{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px;padding:3px;flex-shrink:0}.menu button{height:28px;border-radius:5px;border:1px solid #d4af37;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:9px;font-weight:800}.barra-dig{display:grid;grid-template-columns:1fr 98px;gap:3px;margin:4px 3px;min-height:44px;flex-shrink:0}.barra-dig .esq{background:#ffff00;border:2px solid gold;color:#000;font-weight:900;border-radius:8px;display:flex;align-items:center;justify-content:flex-start;padding:0 8px;gap:6px;font-size:20px;overflow:hidden}.barra-dig .esq .chips-mini{display:flex;gap:3px;align-items:center;flex-wrap:nowrap}.mini-chip{width:22px;height:22px;min-width:22px;border-radius:4px;border:1px solid #000;display:flex;align-items:center;justify-content:center}.mini-chip.C{background:#00aa00}.mini-chip.E{background:#ff0000}.barra-dig .dir-black{background:#111;border:2px solid #fff;color:#fff;font-weight:900;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.hr-quad{width:calc((100% - 60px)/10);height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;border:1px solid #fff;flex-shrink:0}.hr-quad.C{background:#00c800}.hr-quad.E{background:#c80000}.hr-quad.zero{background:#00aa00}
.teclado{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:4px;background:#1a1a0a;border-top:1px solid #d4af37;flex-shrink:0}.b{border-radius:8px;border:1px solid #8a6a1a;background:linear-gradient(180deg,#f7e8a5,#d4af37);font-size:24px;font-weight:900;min-height:50px}.b:active{transform:scale(0.96)}.pagina{display:none;flex:1;flex-direction:column;overflow:hidden}.pagina.ativa{display:flex}.boasorte{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px;padding-bottom:80px;background:#000}.btn-jogar{width:90%;height:54px;background:linear-gradient(180deg,#f7e8a5,#d4af37);border:2px solid gold;border-radius:12px;font-size:20px;font-weight:900}
.bloco10{display:flex;flex-wrap:wrap;gap:4px;padding:6px 3px;width:100%;border-bottom:1px solid #222;align-items:center}
.bloco10 .hr-quad:nth-child(2n){margin-right:12px}
.bloco10 .hr-quad:nth-child(10n){margin-right:0}
</style></head><body><div class="app"><div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div><div class="menu"><button onclick="irPara(1)">🏠 INICIO</button><button onclick="apagar()">⬅️ APAGAR</button><button onclick="limparTudoGeral()">🗑️ LIMPAR</button><button onclick="proximaPagina()">➡️ PROX</button></div><div id="pag1" class="pagina ativa"><div class="boasorte"><button class="btn-jogar" onclick="irPara(2)">Começar a jogar</button></div></div><div id="pag2" class="pagina" style="flex:1;overflow:hidden"><div id="lista-geral" style="display:flex;flex-direction:column;padding:0;flex:1;overflow-y:auto;background:#000"></div><div class="barra-dig"><div class="esq"><span id="txt-col">_</span><div class="chips-mini" id="chips-col"></div></div><div class="dir-black" id="mkt-val">R$: 0,10</div></div><div class="teclado">
<button class="b" onclick="dig(1)">1</button><button class="b" onclick="dig(2)">2</button><button class="b" onclick="dig(3)">3</button>
<button class="b" onclick="dig(4)">4</button><button class="b" onclick="dig(5)">5</button><button class="b" onclick="dig(6)">6</button>
<button class="b" onclick="dig(7)">7</button><button class="b" onclick="dig(8)">8</button><button class="b" onclick="dig(9)">9</button>
<button class="b" onclick="enter()">ENTER</button><button class="b" style="background:linear-gradient(180deg,#00cc00,#006600);color:#fff;border:2px solid gold" onclick="dig(0)">0</button><button class="b" onclick="corrigir()">CORRIGIR</button>
</div></div></div><script>
const TABELA={0:"ZERO",1:"2/3",2:"1/2",3:"1/2",4:"1/2",5:"2/3",6:"1/2",7:"2/3",8:"1/2",9:"2/3",10:"2/3",11:"1/3",12:"2/3",13:"1/3",14:"2/3",15:"1/3",16:"1/3",17:"1/3",18:"2/3",19:"1/2",20:"1/2",21:"2/3",22:"1/2",23:"1/2",24:"2/3",25:"1/3",26:"2/3",27:"1/3",28:"2/3",29:"1/3",30:"2/3",31:"1/3",32:"1/2",33:"2/3",34:"1/2",35:"2/3",36:"1/2"};
let buf="";let geral=JSON.parse(localStorage.getItem('rafigasp_geral')||'[]');let stats=JSON.parse(localStorage.getItem('rafigasp_stats')||'{}');let ultimoNum="_";let ultimoNumInt=null;
function irPara(n){document.querySelectorAll('.pagina').forEach(p=>p.classList.remove('ativa'));document.getElementById('pag'+(n>2?2:1)).classList.add('ativa');if(n==2)renderGeral();}
function proximaPagina(){irPara(2);}
function renderChipsForNum(num){let el=document.getElementById('chips-col');if(!el)return;el.innerHTML='';let hist=stats[num]||[];hist.slice(-6).forEach(v=>{let d=document.createElement('div');d.className='mini-chip '+(v?'C':'E');el.appendChild(d);});}
function dig(n){if(buf.length<2)buf+=n;let v=parseInt(buf);if(v>36)buf=buf.slice(0,-1);document.getElementById('txt-col').innerText=buf?buf+"> "+(TABELA[parseInt(buf)]||""):ultimoNum;if(!isNaN(parseInt(buf)))renderChipsForNum(parseInt(buf));}
function apagar(){if(buf.length>0){buf=buf.slice(0,-1);document.getElementById('txt-col').innerText=buf?buf:ultimoNum;}}
function limparTudoGeral(){geral=[];stats={};localStorage.setItem('rafigasp_geral','[]');localStorage.setItem('rafigasp_stats','{}');renderGeral();document.getElementById('txt-col').innerText="_";document.getElementById('chips-col').innerHTML="";buf="";ultimoNum="_";}
function renderGeral(){
let div=document.getElementById('lista-geral');
div.innerHTML='';
if(geral.length==0)return;
let bloco=null;
geral.forEach((item, idx)=>{
if(idx%10==0){
bloco=document.createElement('div');
bloco.className='bloco10';
div.appendChild(bloco);
}
let cls='hr-quad '+(item.num==0?'zero':(item.acertou?'C':'E'));
let q=document.createElement('div');
q.className=cls;
q.textContent=item.num;
bloco.appendChild(q);
});
}
function corrigir(){if(buf.length>0){buf=buf.slice(0,-1);document.getElementById('txt-col').innerText=buf?buf:ultimoNum;return;}if(geral.length>0){let prev=geral[1];if(prev!==undefined && stats[prev.num]){stats[prev.num].pop();localStorage.setItem('rafigasp_stats',JSON.stringify(stats));}geral.shift();localStorage.setItem('rafigasp_geral',JSON.stringify(geral));if(geral.length>0){ultimoNumInt=geral[0].num;ultimoNum=ultimoNumInt+"> "+(TABELA[ultimoNumInt]||"");}else{ultimoNum="_";ultimoNumInt=null;}document.getElementById('txt-col').innerText=ultimoNum;if(ultimoNumInt!==null)renderChipsForNum(ultimoNumInt);else document.getElementById('chips-col').innerHTML="";renderGeral();}}
function enter(){if(buf=="")return;let num=parseInt(buf);if(isNaN(num)||num<0||num>36){buf="";return;}let colReal=0;const c1=[1,4,7,10,13,16,19,22,25,28,31,34];const c2=[2,5,8,11,14,17,20,23,26,29,32,35];if(c1.includes(num))colReal=1;else if(c2.includes(num))colReal=2;else if(num!=0)colReal=3;let acertou=false;if(geral.length>0){let ultimo=geral[0].num;let alvo=TABELA[ultimo];if(alvo && alvo!="ZERO" && alvo!="BOA SORTE"){let nums=alvo.split('/').map(Number);acertou=nums.includes(colReal);}}let txt=num+"> "+(TABELA[num]||"ZERO");ultimoNum=txt;ultimoNumInt=num;document.getElementById('txt-col').innerText=txt;if(geral.length>0){let trigger=geral[0].num;if(!stats[trigger])stats[trigger]=[];stats[trigger].push(acertou);localStorage.setItem('rafigasp_stats',JSON.stringify(stats));}geral.unshift({num:num,acertou:acertou});localStorage.setItem('rafigasp_geral',JSON.stringify(geral));buf="";renderGeral();renderChipsForNum(num);}
renderGeral();
</script></body></html>
