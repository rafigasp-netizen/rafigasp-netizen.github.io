function calcAlerta(arr){if(!arr||arr.length<2)return false;let ult=arr[0],pen=arr[1];if(ult&&ult.ok)return false;if(ult&&pen&&!ult.ok&&!pen.ok)return true;return false;}
function mudaModo(){modoIdx=(modoIdx+1)%4;modo=MODOS[modoIdx];localStorage.setItem('modoIdx',modoIdx);render();}
function calculaJogada(n1,n2){
  let c1=COL[n1],c2=COL[n2];
  if(c1===0||c2===0) return null;
  if(c1===c2){
    let jogar=[1,2,3].filter(c=>c!==c1);
    return {tipo:'IGUAL',c1:c1,c2:c2,jogar:jogar,txt:'COLUNA IGUAL C'+c1+' → JOGAR '+jogar.join('/'), n1:n1,n2:n2};
  }else{
    let jogar=[c1,c2].sort((a,b)=>a-b);

}

   });

 }

     }else{
       verdeEl.innerHTML='<div class="linha4 ativoA"><div class="titulo4">A:</div><span style="color:#000;font-size:12px">VEZ DO A - TOQUE 2 NÚMEROS</span></div>';

 }else{

function corr(){
 if(histGeralCron.length===0) return;
