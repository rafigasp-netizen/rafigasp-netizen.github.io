<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP - IGUAL A FOTO EXATAMENTE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a2a18;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:100%;max-width:400px;height:100dvh;background:#0a2210;display:flex;flex-direction:column;border:2px solid #c9a227}
.topo{text-align:center;background:linear-gradient(180deg,#f6e8a6 0%,#e8c76a 15%,#d4af37 35%,#b8941f 65%,#8a6d1b 100%);padding:14px 0 10px;flex-shrink:0;border-bottom:3px solid #000}
.topoR{font-weight:900;font-size:36px;color:#0f2f0f;letter-spacing:4px;line-height:1;font-family:Georgia, serif;text-shadow:0 1px 0 rgba(255,255,255,0.8)}
.topoS{font-size:10px;letter-spacing:6px;color:#0f2f0f;font-weight:900;opacity:0.9}
.nav2{display:flex;gap:4px;padding:6px;background:#0a0f0a;flex-shrink:0;border-bottom:2px solid #333}
.nav2 button{flex:1;height:36px;border-radius:8px;border:1.5px solid #d4af37;font-weight:900;font-size:9px;background:#1a2a1a;color:#d4af37}
.nav2 button.home{background:linear-gradient(180deg,#f6e8a6,#d4af37);color:#111;border-color:#000}
.nav2 button.limpar{background:#2a1a1a;color:#ffaaaa;border-color:#ff6666}
.display{margin:5px;background:#000;border:2px solid #c9a227;border-radius:10px;height:48px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;text-align:center;color:#00ff00}
.display.alerta{background:#ff0000;color:#fff;border:3px solid #ffff00;box-shadow:0 0 20px #ff0000}
.page{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:#0a1f12}
.topBar{background:#000;border:2px solid #c9a227;border-radius:12px;padding:14px 10px 10px;display:flex;gap:5px;flex-wrap:wrap;min-height:88px;align-items:center;position:relative;margin-top:8px}
.topBar::before{content:'HISTÓRICO';position:absolute;top:-9px;left:14px;background:#d4af37;color:#000;font-size:8px;font-weight:900;padding:3px 10px;border-radius:5px}
.nBox{height:38px;min-width:38px;padding:0 9px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;border:2px solid #5a4a1a}
.nBox.green{background:linear-gradient(180deg,#2abf4a,#0f8a2a);border-color:#00ff00}
.nBox.red{background:linear-gradient(180deg,#ff3a3a,#d80f0f);border-color:#ffb3b3}
.nBox.blue{background:linear-gradient(180deg,#4a7aff,#1e40af);border-color:#fff}
.nBox.new{animation:novo 0.5s}
@keyframes novo{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.alertaGrande{background:linear-gradient(180deg,#2ae85a,#0f8a2a 60%,#065a18);border:3px solid #ffd700;border-radius:16px;padding:18px;text-align:center;font-weight:900;color:#fff;box-shadow:0 0 25px rgba(0,255,0,0.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:170px;flex:1}
.alertaGrande.vermelho{background:linear-gradient(180deg,#ff4a4a,#cc0000);border:3px solid #ffff00;box-shadow:0 0 35px #ff0000}
.alertaGrande.acertou{background:linear-gradient(180deg,#3aff6a,#00aa00);border:3px solid #00ff00;box-shadow:0 0 50px #00ff00}
.alertaGrande.errou{background:linear-gradient(180deg,#ff5a5a,#990000);border:3px solid #ff4444;box-shadow:0 0 50px #ff0000}
.colunaGrande{font-size:28px;letter-spacing:1px;text-shadow:0 2px 4px #000;line-height:1.1;font-weight:900;display:flex;align-items:center;gap:10px;justify-content:center}
.checkCircle{width:38px;height:38px;background:linear-gradient(180deg,#ffe86a,#d4af37);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0a2210;font-size:22px;font-weight:900;border:2px solid #fff}
.colunaNumero{font-size:48px;font-weight:900;color:#fff;text-shadow:0 3px 6px #000;line-height:1}
.placarSimples{background:linear-gradient(180deg,#1e1e1e,#000);border:2px solid #c9a227;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;margin-top:4px;position:relative}
.placarSimples::before{content:'PLACAR';position:absolute;top:-9px;left:14px;background:#d4af37;color:#000;font-size:8px;font-weight:900;padding:3px 10px;border-radius:5px}
.placarItemSimples{display:flex;align-items:center;gap:8px}
.placarLabelSimples{font-size:10px;color:#d4af37;font-weight:900}
.placarValorSimples{font-size:26px;font-weight:900}
.kb{background:linear-gradient(180deg,#f0d97a 0%,#e8c76a 15%,#d4af37 40%,#b8941f 80%);border-top:3px solid #8a6d1b;padding:7px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;height:40%;min-height:250px}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.k{border-radius:10px;border:2px solid #8a6d1b;font-weight:900;font-size:21px;background:linear-gradient(180deg,#fff2a0 0%,#f9e27a 20%,#e8c86a 50%,#d4af37 100%);color:#1a1000;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,0.4), inset 0 2px 0 #fff}
.k:active{transform:scale(0.95);background:#fff}
.paginasEscondidas{display:none}
</style>
</head>
<body>
<div class="app">
<div class="topo"><div class="topoR">RAFIGASP</div><div class="topoS">COACH DA ROLETA</div></div>
<div class="nav2">
<button class="home">🏠 INICIO</button>
<button onclick="apagarUltimo()">➡️ APAGAR</button>
<button class="limpar" onclick="limparTudo()">🗑️ LIMPAR</button>
<button>➡️ PRÓX</button>
</div>
<div class="display" id="disp">PÁG 1 - TABELA COLUNA</div>
<div class="page" id="page1">
<div class="topBar" id="topBar1"></div>
<div class="alertaGrande verde" id="alertaGrande1">
<div class="colunaGrande" id="colunaGrandeTexto1"><div class="checkCircle">✓</div>ACERTOU<br>COLUNA 1/3</div>
<div class="placarSimples">
<div class="placarItemSimples"><div class="placarLabelSimples">ACERTOU</div><div class="placarValorSimples" style="color:#00ff00" id="placarAcertou1">9</div></div>
<div class="placarItemSimples"><div class="placarLabelSimples">ERROU</div><div class="placarValorSimples" style="color:#ff4444" id="placarErrou1">0</div></div>
</div>
</div>
</div>
<div class="paginasEscondidas"><div id="conjuntosP2"></div><div id="conjuntosP3"></div></div>
<div class="kb">
<div class="kr"><button class="k" onclick="dig('1')">1</button><button class="k" onclick="dig('2')">2</button><button class="k" onclick="dig('3')">3</button></div>
<div class="kr"><button class="k" onclick="dig('4')">4</button><button class="k" onclick="dig('5')">5</button><button class="k" onclick="dig('6')">6</button></div>
<div class="kr"><button class="k" onclick="dig('7')">7</button><button class="k" onclick="dig('8')">8</button><button class="k" onclick="dig('9')">9</button></div>
<div class="kr"><button class="k" onclick="ok()">ENTER</button><button class="k" onclick="dig('0')">0</button><button class="k" onclick="corr()">CORRIGIR</button></div>
</div>
</div>
<script>
var cur="",lista=[],paginaAtual=1;
var green=0,red=0;
var esperandoP2=false, esperandoP3=false;
var colunaP2=null, colunaP3=null;
var linhasP2=[],linhasP3=[];
var tabelaColunas={1:"2/3",2:"1/2",3:"1/2",4:"1/2",5:"2/3",6:"1/2",7:"2/3",8:"1/2",9:"2/3",10:"2/3",11:"1/3",12:"2/3",13:"1/3",14:"2/3",15:"1/3",16:"1/3",17:"1/3",18:"2/3",19:"1/2",20:"1/2",21:"2/3",22:"1/2",23:"1/2",24:"2/3",25:"1/3",26:"2/3",27:"1/3",28:"2/3",29:"1/3",30:"2/3",31:"1/3",32:"1/2",33:"2/3",34:"1/2",35:"2/3",36:"1/2",0:"0"};
function salvarTudo(){
 try{
  localStorage.setItem('rafigasp_lista', JSON.stringify(lista));
  localStorage.setItem('rafigasp_green', String(green));
  localStorage.setItem('rafigasp_red', String(red));
  localStorage.setItem('rafigasp_esperandoP2', String(esperandoP2));
  localStorage.setItem('rafigasp_esperandoP3', String(esperandoP3));
  localStorage.setItem('rafigasp_colunaP2', colunaP2||'');
  localStorage.setItem('rafigasp_colunaP3', colunaP3||'');
 }catch(e){}
}
function carregarTudo(){
 try{
  var l=localStorage.getItem('rafigasp_lista'); if(l){ lista=JSON.parse(l); }
  var g=localStorage.getItem('rafigasp_green'); if(g!==null){ green=parseInt(g)||0; }
  var r=localStorage.getItem('rafigasp_red'); if(r!==null){ red=parseInt(r)||0; }
  var ep2=localStorage.getItem('rafigasp_esperandoP2'); if(ep2!==null){ esperandoP2=(ep2==='true'); }
  var ep3=localStorage.getItem('rafigasp_esperandoP3'); if(ep3!==null){ esperandoP3=(ep3==='true'); }
  var c2=localStorage.getItem('rafigasp_colunaP2'); if(c2){ colunaP2=c2; }
  var c3=localStorage.getItem('rafigasp_colunaP3'); if(c3){ colunaP3=c3; }
 }catch(e){}
}
function getCol(n){
 if(n==0) return 0;
 if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0) return 1;
 if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0) return 2;
 return 3;
}
function getColunasParaJogar(numeroAzul){ return tabelaColunas[numeroAzul]||"-"; }
function inicializar(){
 linhasP2=[];linhasP3=[];
 var brancosPorLinha=[1,2,3,4,5];
 for(var r=0;r<5;r++){
  linhasP2.push({itens:[],brancos:brancosPorLinha[r]});
  linhasP3.push({itens:[],brancos:brancosPorLinha[r]});
 }
}
function setEstadoQuadrado(estado,textoGrande){
 var el=document.getElementById('alertaGrande1');
 var txt=document.getElementById('colunaGrandeTexto1');
 if(el){ el.className='alertaGrande '+estado; if(txt) txt.innerHTML=textoGrande; }
}
function show(){
 var d=document.getElementById('disp');
 if(cur!=""){
  if(cur=="0"){d.textContent="0 = APAGAR";d.className="display alerta";}
  else if(cur=="00"){d.textContent="00 = LIMPAR";d.className="display alerta";}
  else{
   if(esperandoP2||esperandoP3){
    var col=esperandoP3?colunaP3:colunaP2; var pag=esperandoP3?"P1":"P2";
    d.innerHTML="🔴 "+pag+" SINAL - COLUNA "+col; d.className="display alerta";
   }else{ d.textContent="NUM: "+cur+" - ENTER"; d.className="display"; }
  }
  return;
 }
 if(esperandoP3){ d.innerHTML="🔴 P1 SINAL 🟦🟥🟥 - COLUNA "+colunaP3; d.className="display alerta"; }
 else if(esperandoP2){ d.innerHTML="🔵 P2 SINAL 🟦🟥 - COLUNA "+colunaP2; d.className="display alerta"; }
 else{ d.textContent="PÁG 1 - TABELA COLUNA - ✅:"+green+" ❌:"+red; d.className="display"; }
}
function dig(v){if(cur=="0"||cur=="00"){cur=v;}else if(cur.length>=2){cur=v;}else{cur+=v;}show();}
function corr(){if(cur=="0"){apagarUltimo();return;}if(cur=="00"){limparTudo();return;}if(cur!=""){cur=cur.slice(0,-1);show();}else{apagarUltimo();}}
function apagarUltimo(){ if(lista.length>0){ lista.pop(); reconstruirTudo(); show();upd(); salvarTudo(); } }
function limparTudo(){
 if(!confirm("LIMPAR TUDO?")) return;
 cur="";lista=[];colunaP2=null;colunaP3=null;green=0;red=0;esperandoP2=false;esperandoP3=false;
 try{ localStorage.clear(); }catch(e){}
 inicializar(); setEstadoQuadrado('verde','AGUARDANDO<br>SINAL...'); show();upd();
}
function reconstruirTudo(){
 inicializar(); var temp=lista.slice(); esperandoP2=false;esperandoP3=false;colunaP2=null;colunaP3=null;
 temp.forEach(function(n){ aplicarNumero(n,false); }); checarSinais(); lista=temp.slice();
 if(esperandoP2){ setEstadoQuadrado('vermelho','<div class="colunaGrande"><div class="checkCircle">!</div>P2 COLUNA</div><div class="colunaNumero">'+colunaP2+'</div>'); }
 else if(esperandoP3){ setEstadoQuadrado('vermelho','<div class="colunaGrande"><div class="checkCircle">!</div>P1 COLUNA</div><div class="colunaNumero">'+colunaP3+'</div>'); }
 else{ setEstadoQuadrado('verde','AGUARDANDO<br>SINAL...'); }
}
function aplicarNumero(n,adicionarNaLista){
 for(var r=0;r<linhasP2.length;r++){ var linha=linhasP2[r]; var pos=linha.itens.length; var ciclo=linha.brancos+1; var isAzul=(pos%ciclo==0); linha.itens.push({valor:n,isAzul:isAzul}); }
 for(var r=0;r<linhasP3.length;r++){ var linha=linhasP3[r]; var pos=linha.itens.length; var ciclo=linha.brancos+1; var isAzul=(pos%ciclo==0); linha.itens.push({valor:n,isAzul:isAzul}); }
 if(adicionarNaLista){ lista.push(n); }
}
function checarSinais(){ if(checarSinalP3()) return true; if(checarSinalP2()) return true; setEstadoQuadrado('verde','AGUARDANDO<br>SINAL...'); return false; }
function checarSinalP2(){
 if(esperandoP2||esperandoP3) return false;
 for(var r=0;r<linhasP2.length;r++){ var linha=linhasP2[r]; for(var i=0;i<linha.itens.length-1;i++){ var itAzul=linha.itens[i]; var itVerm=linha.itens[i+1]; if(itAzul.isAzul&&!itVerm.isAzul){ if(getCol(itVerm.valor)==1){ colunaP2=getColunasParaJogar(itAzul.valor); esperandoP2=true; setEstadoQuadrado('vermelho','<div class="colunaGrande"><div class="checkCircle">!</div>P2 COLUNA</div><div class="colunaNumero">'+colunaP2+'</div>'); salvarTudo(); return true; } } } } return false;
}
function checarSinalP3(){
 if(esperandoP3) return true;
 for(var r=0;r<linhasP3.length;r++){ var linha=linhasP3[r]; for(var i=0;i<linha.itens.length-2;i++){ var itAzul=linha.itens[i]; var itV1=linha.itens[i+1]; var itV2=linha.itens[i+2]; if(itAzul.isAzul&&!itV1.isAzul&&!itV2.isAzul){ if(getCol(itV1.valor)==1&&getCol(itV2.valor)==1){ colunaP3=getColunasParaJogar(itAzul.valor); esperandoP3=true; setEstadoQuadrado('vermelho','<div class="colunaGrande"><div class="checkCircle">!</div>P1 COLUNA</div><div class="colunaNumero">'+colunaP3+'</div>'); salvarTudo(); return true; } } } } return false;
}
function ok(){
 if(cur===""){return;} if(cur==="00"){limparTudo();return;} if(cur==="0"){apagarUltimo();return;}
 var n=parseInt(cur);if(isNaN(n)||n<0||n>36){cur="";show();return;}
 if(esperandoP3){
  var colResultado=getCol(n); var colunasPermitidas=colunaP3.split('/'); var acertou=colunasPermitidas.indexOf(String(colResultado))>=0;
  if(acertou){ green++; setEstadoQuadrado('acertou','<div class="colunaGrande"><div class="checkCircle">✓</div>ACERTOU</div><div class="colunaNumero">COLUNA '+colunaP3+'</div>'); } else{ red++; setEstadoQuadrado('errou','<div class="colunaGrande">✕ ERROU</div><div class="colunaNumero">COLUNA '+colunaP3+'</div>'); }
  document.getElementById('placarAcertou1').textContent=green; document.getElementById('placarErrou1').textContent=red; esperandoP3=false; colunaP3=null; salvarTudo();
  setTimeout(function(){ setEstadoQuadrado('verde','AGUARDANDO<br>SINAL...'); show(); salvarTudo(); },2500);
  aplicarNumero(n,true); cur="";show();upd(); salvarTudo(); return;
 }
 if(esperandoP2){
  var colResultado=getCol(n); var colunasPermitidas=colunaP2.split('/'); var acertou=colunasPermitidas.indexOf(String(colResultado))>=0;
  if(acertou){ green++; setEstadoQuadrado('acertou','<div class="colunaGrande"><div class="checkCircle">✓</div>ACERTOU</div><div class="colunaNumero">COLUNA '+colunaP2+'</div>'); } else{ red++; setEstadoQuadrado('errou','<div class="colunaGrande">✕ ERROU</div><div class="colunaNumero">COLUNA '+colunaP2+'</div>'); }
  document.getElementById('placarAcertou1').textContent=green; document.getElementById('placarErrou1').textContent=red; esperandoP2=false; colunaP2=null; salvarTudo();
  setTimeout(function(){ setEstadoQuadrado('verde','AGUARDANDO<br>SINAL...'); show(); salvarTudo(); },2500);
  aplicarNumero(n,true); cur="";show();upd(); salvarTudo(); return;
 }
 aplicarNumero(n,true); cur="";show();upd(); checarSinais(); salvarTudo();
}
function upd(){
 var topBar1=document.getElementById('topBar1');
 if(topBar1){
  topBar1.innerHTML="";
  if(lista.length==0){
   var e=document.createElement('div');e.style.cssText="font-size:11px;color:#1a5a1a;padding:8px;text-align:center;width:100%";e.textContent="HISTÓRICO VAZIO";topBar1.appendChild(e);
  }else{
   lista.forEach(function(num){ var col=getCol(num); var cor=(col==1?'red':(col==0?'blue':'green')); var box=document.createElement('div');box.className='nBox '+cor;box.textContent=num;topBar1.appendChild(box); });
  }
 }
 document.getElementById('placarAcertou1').textContent=green; document.getElementById('placarErrou1').textContent=red; show();
}
carregarTudo();
inicializar();
if(lista.length>0){ reconstruirTudo(); }
upd(); salvarTudo();
</script>
</body>
</html>
