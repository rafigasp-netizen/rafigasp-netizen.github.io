<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d2818;display:flex;justify-content:center;font-family:Arial}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:2px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:10px;text-align:center}
.topo h1{color:#000;font-size:20px;font-weight:900}
.topo span{font-size:12px;color:#4a3410;font-weight:800;display:block}
.history{background:#123524;padding:8px}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hslot{height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.hslot.empty{border:2px dashed #d4af37;opacity:.3}
.hslot.yellow{background:#d4af37!important;color:#000!important}
.hslot.green{background:#16a34a!important;color:#fff!important}
.hslot.red{background:#dc2626!important;color:#fff!important}
.keypad{flex:1;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px;background:#0a1f12}
.k{height:100%;min-height:70px;border-radius:14px;border:none;font-weight:900;font-size:28px}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:15px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP</h1><span>COACH DA ROLETA</span></div>
<div class="history"><div class="hist-grid" id="grid"></div></div>
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
<script>
let history=[],cur='';
const grid=document.getElementById('grid');
const gC23=[6,9,11,14,16,17,19,21,26,29,33,36];
const gC13=[2,3,5,8,10,13,20,25,28,31,32,35];
const gC12=[1,4,7,12,15,18,22,23,24,27,30,34];
function getAlvo(n){
if(gC23.includes(n))return "C2/3";
if(gC13.includes(n))return "C1/3";
if(gC12.includes(n))return "C1/2";
return "";
}
function getColunaReal(n){
if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;
if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;
if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;
return 0;
}
function getColunaDoAlvo(alvo){
if(alvo=="C1/3")return 3;
if(alvo=="C2/3")return 2;
if(alvo=="C1/2")return 1;
return 0;
}
function render(){
grid.innerHTML='';
for(let i=0;i<12;i++){
let d=document.createElement('div');
if(i<history.length){
let h=history[i];
if(i<4){d.className='hslot yellow'; d.textContent=`${h.num} ${h.alvo}`;}
else{
let col=i%4; let alvoTopo=history[col]?.alvo;
let colReal=getColunaReal(h.num);
let colAlvo=getColunaDoAlvo(alvoTopo);
d.textContent=`${h.num}`; d.className='hslot '+(colReal==colAlvo?'green':'red');
}
}else{d.className='hslot empty';}
grid.appendChild(d);
}
}
function addN(n){
if(cur.length>=2)return;
cur+=n; 
let tempGrid=document.getElementById('grid');
tempGrid.innerHTML='';
for(let i=0;i<12;i++){
let d=document.createElement('div');
if(i==history.length){
let v=parseInt(cur); if(!isNaN(v)){
let alvo=getAlvo(v);
if(i<4){d.className='hslot yellow'; d.style.opacity='.6'; d.textContent=`${v} ${alvo}`;}
else{
let col=i%4; let alvoTopo=history[col]?.alvo;
let colReal=getColunaReal(v);
let colAlvo=getColunaDoAlvo(alvoTopo);
d.textContent=`${v}`; d.style.opacity='.6';
d.className='hslot '+(colReal==colAlvo?'green':'red');
}
tempGrid.appendChild(d); continue;
}
}
if(i<history.length){
let h=history[i];
if(i<4){d.className='hslot yellow'; d.textContent=`${h.num} ${h.alvo}`;}
else{let col=i%4; let alvoTopo=history[col]?.alvo; let colReal=getColunaReal(h.num); let colAlvo=getColunaDoAlvo(alvoTopo); d.textContent=`${h.num}`; d.className='hslot '+(colReal==colAlvo?'green':'red');}
}else{d.className='hslot empty';}
tempGrid.appendChild(d);
}
}
function enterN(){
if(cur=='')return;
if(cur=='00'){history=[];cur='';render();return;}
let v=parseInt(cur);if(v>36)return;
if(v==0){history=[];cur='';render();return}
let alvo=getAlvo(v);
history.push({num:v, alvo:alvo});
cur='';render();
if(history.length>=12){setTimeout(()=>{history=[];render();}, 900);}
}
function corrige(){if(cur!=''){cur=cur.slice(0,-1);render();}else if(history.length>0){history.pop();render();}}
render();
</script>
</body>
</html>
