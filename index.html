<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP - PAGINA 2 LIMPA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a1f12;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:100%;max-width:400px;height:100dvh;background:#0a2210;display:flex;flex-direction:column;border:2px solid #d4af37}
.topo{text-align:center;background:linear-gradient(180deg,#e8c76a,#b8941f);padding:8px 0 4px;flex-shrink:0;cursor:pointer}
.topoR{font-weight:900;font-size:32px;color:#111;letter-spacing:2px;line-height:1}
.topoS{font-size:8px;letter-spacing:4px;color:#333;font-weight:800}
.pagesNav{display:flex;gap:1px;padding:3px;background:#001a00;flex-shrink:0;overflow-x:auto}
.pagesNav button{flex:0 0 38px;height:28px;border-radius:5px;border:1px solid #d4af37;font-weight:900;font-size:8px;background:#112a1a;color:#d4af37;white-space:nowrap}
.pagesNav button.ativo{background:#e8c76a;color:#111;border-color:#fff;box-shadow:0 0 6px #e8c76a}
.nav2{display:flex;gap:2px;padding:2px 3px;background:#001a00;flex-shrink:0}
.nav2 button{flex:1;height:26px;border-radius:5px;border:1px solid #d4af37;font-weight:900;font-size:8px;background:#112a1a;color:#d4af37}
.nav2 button.home{background:#e8c76a;color:#111}
.nav2 button.limpar{background:#330000;color:#ffaaaa}
.display{margin:3px;background:#000;border:2px solid #d4af37;border-radius:8px;height:42px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;flex-shrink:0;text-align:center;padding:2px;transition:all 0.3s}
.display.inicial{color:#1a7a2a}
.display.sinal{background:#ffaa00;color:#000;border-color:#fff;animation:pisca 0.6s infinite alternate}
.display.verde{background:#00aa00;color:#fff;border-color:#00ff00;box-shadow:0 0 10px #00ff00}
.display.vermelho{background:#cc0000;color:#fff;border-color:#ff0000;box-shadow:0 0 10px #ff0000}
@keyframes pisca{0%{background:#ffaa00}100%{background:#ff8800}}
.page{flex:1;overflow-y:auto;padding:4px;display:none;flex-direction:column;gap:4px}
.page.ativa{display:flex}
.patternFixed{background:#000;border:2.5px solid #d4af37;border-radius:10px;padding:10px;display:flex;gap:3px;flex-wrap:wrap;align-items:center;min-height:90px;justify-content:flex-start}
.sq{width:28px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:#fff;transition:all 0.4s;position:relative;border:1px solid #333}
.sq.blue{background:#1e40af;border:2px solid #fff;box-shadow:0 0 4px #60a5fa;color:#fff;cursor:default}
.sq.white{background:#fff;border:1.5px solid #999;color:#000;cursor:pointer}
.sq.white.vazio{background:#fff;color:#999}
.sq.green{background:#0f8a2a;border:2px solid #00ff00;box-shadow:0 0 6px #00ff00;color:#fff;animation:entra 0.4s}
.sq.red{background:#d80f0f;border:2px solid #ff6666;box-shadow:0 0 6px #ff0000;color:#fff;animation:entra 0.4s}
.sq.new{transform:scale(1.15);border:2px solid #fff;box-shadow:0 0 12px #fff;animation:novo 0.5s}
@keyframes entra{0%{transform:scale(0.5)}100%{transform:scale(1)}}
@keyframes novo{0%{transform:scale(0) rotate(-10deg)}50%{transform:scale(1.3)}100%{transform:scale(1.15)}}
.topBar{background:#000;border:1.5px solid #d4af37;border-radius:8px;padding:5px;display:flex;gap:3px;flex-wrap:wrap;min-height:36px;align-items:center}
.nBox{height:26px;min-width:26px;padding:0 7px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff}
.nBox.green{background:#0f8a2a}
.nBox.red{background:#d80f0f}
.nBox.blue{background:#1e40af;border:2px solid #fff}
.card{background:#0a2814;border:2px solid #d4af37;border-radius:10px;padding:6px;min-height:80px;display:flex;flex-direction:column}
.cardTitle{font-size:8px;font-weight:900;color:#d4af37;letter-spacing:1px;margin-bottom:4px}
.numGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:1}
.numGridBox{height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff}
.numGridBox.green{background:#0f8a2a}
.numGridBox.red{background:#d80f0f}
.numGridBox.blue{background:#1e40af}
.centerBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.jogarBtn{background:linear-gradient(180deg,#f9e27a,#d4af37);border-radius:20px;padding:8px 14px;font-weight:900;font-size:12px;color:#111;border:2px solid #fff;min-width:90px;text-align:center}
.jogarBtn.sinal{background:linear-gradient(180deg,#ffaa00,#ff6600);color:#000;animation:pisca 0.6s infinite alternate;box-shadow:0 0 10px #ffaa00}
.kb{background:linear-gradient(180deg,#e8c76a,#b8941f);border-top:2px solid #d4af37;padding:5px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;height:32%;min-height:180px}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.k{border-radius:8px;border:1.5px solid #8a6d1b;font-weight:900;font-size:18px;background:linear-gradient(180deg,#f9e27a,#e8c86a 50%,#b8941f 100%);color:#1a1000;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 3px rgba(0,0,0,0.3)}
.k:active{transform:scale(0.96);background:#fff}
.infoBar{background:#111;border:1px solid #333;border-radius:6px;padding:6px;margin:2px 0;font-size:9px;color:#d4af37;text-align:center}
</style>
</head>
<body>
<div class="app">
<div class="topo" onclick="irPara(2)"><div class="topoR">RAFIGASP</div><div class="topoS">COACH DA ROLETA - 10 PÁGINAS</div></div>
<div class="pagesNav" id="pagesNav">
<button onclick="irPara(1)">1 INICIO</button>
<button class="ativo" onclick="irPara(2)">2 PADRÃO</button>
<button onclick="irPara(3)">3 NUM</button>
<button onclick="irPara(4)">4 COLUNA</button>
<button onclick="irPara(5)">5 ACERTO</button>
<button onclick="irPara(6)">6 A HIST</button>
<button onclick="irPara(7)">7 B HIST</button>
<button onclick="irPara(8)">8 C HIST</button>
<button onclick="irPara(9)">9 D HIST</button>
<button onclick="irPara(10)">10 PLACAR</button>
</div>
<div class="nav2">
<button class="home" onclick="irPara(2)">🏠 PÁG 2</button>
<button onclick="apagarUltimo()">⬅️ APAGAR</button>
<button class="limpar" onclick="limparTudo()">🗑️ LIMPAR</button>
<button onclick="proximaPagina()">➡️ PRÓX</button>
</div>
<div class="display inicial" id="disp">PÁGINA 2 - DIGITE NÚMERO - VAI DENTRO DO QUADRADO</div>

<div class="page" id="page1"><div class="topBar" id="topBar1"></div></div>

<div class="page ativa" id="page2">
<div class="patternFixed" id="patternFixed2"></div>
<div class="infoBar" id="infoBar2">🔵 Azul fixo = gatilho | ⬜ Branco = vazio | 🟢 Verde = C2/3 | 🔴 Vermelho = C1</div>
</div>

<div class="page" id="page3"><div class="topBar" id="topBar3"></div><div class="card"><div class="cardTitle">NUMERO CHAMADO</div><div class="numGrid" id="numGrid3"></div></div></div>
<div class="page" id="page4"><div class="topBar" id="topBar4"></div><div class="card"><div class="cardTitle">JOGAR NA COLUNA</div><div class="centerBox"><div class="jogarBtn" id="jogarBtn4">AGUARDANDO</div><div style="font-size:9px;color:#d4af37" id="jogarSub4">-</div></div></div></div>
<div class="page" id="page5"><div class="topBar" id="topBar5"></div><div class="card"><div class="cardTitle">ACERTO OU ERRO</div><div class="centerBox"><div class="jogarBtn" id="acertoBox5">-</div><div style="font-size:9px;color:#d4af37" id="acertoSub5">-</div></div></div></div>
<div class="page" id="page6"><div class="histLine" id="lineA6"></div></div>
<div class="page" id="page7"><div class="histLine" id="lineB7"></div></div>
<div class="page" id="page8"><div class="histLine" id="lineC8"></div></div>
<div class="page" id="page9"><div class="histLine" id="lineD9"></div></div>
<div class="page" id="page10"><div class="topBar" id="topBar10"></div><div class="card"><div class="placarBig" id="placarBig10">GREEN 0 x 0 RED</div></div></div>

<div class="kb">
<div class="kr"><button class="k" onclick="dig('1')">1</button><button class="k" onclick="dig('2')">2</button><button class="k" onclick="dig('3')">3</button></div>
<div class="kr"><button class="k" onclick="dig('4')">4</button><button class="k" onclick="dig('5')">5</button><button class="k" onclick="dig('6')">6</button></div>
<div class="kr"><button class="k" onclick="dig('7')">7</button><button class="k" onclick="dig('8')">8</button><button class="k" onclick="dig('9')">9</button></div>
<div class="kr"><button class="k" onclick="ok()">ENTER</button><button class="k" onclick="dig('0')">0</button><button class="k" onclick="corr()">CORRIGIR</button></div>
</div>
</div>

<script>
var cur="",lista=[],paginaAtual=2;
var green=0,red=0,ultimoSinal=null,ultimoResultado=null;
var padraoBrancos=[1,2,2,3,4,5];
var quadradosBrancos=[];
var proximoBrancoIdx=0;
function getCol(n){
 if(n==0) return 0;
 if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0) return 1;
 if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0) return 2;
 return 3;
}
function isGatilhoNum(n){return n==2||n==0;}
function irPara(p){
 paginaAtual=p;
 document.querySelectorAll('.page').forEach(function(el){el.classList.remove('ativa')});
 document.getElementById('page'+p).classList.add('ativa');
 document.querySelectorAll('.pagesNav button').forEach(function(b,i){b.classList.toggle('ativo',i+1==p)});
 upd();
}
function proximaPagina(){irPara(paginaAtual%10+1);}
function show(){
 var d=document.getElementById('disp');
 if(cur==""){
  if(ultimoSinal){
   d.textContent="P"+paginaAtual+" - 🔴 "+ultimoSinal.vermelhos+" VERMELHO(S) DEPOIS DO 🟦 "+ultimoSinal.gatilho+" - JOGAR C2/3!";
   d.className="display sinal";
  }else{
   if(paginaAtual==2){
    d.textContent="PÁGINA 2 - DIGITE NÚMERO - VAI DENTRO DO QUADRADO ⬜️ -> 🟢/🔴 - AZUL FIXO";
   }else{
    d.textContent="PÁGINA "+paginaAtual+" - DIGITE NÚMERO - NOVO NA FRENTE NO LUGAR DO 5";
   }
   d.className="display inicial";
  }
 }else if(cur=="0"){d.textContent="P"+paginaAtual+" - 0 = APAGAR ULTIMO";d.className="display vermelho";}
 else if(cur=="00"){d.textContent="P"+paginaAtual+" - 00 = LIMPAR TUDO";d.className="display vermelho";}
 else{d.textContent="P"+paginaAtual+" - NUM: "+cur;d.className="display inicial";}
}
function irInicio(){cur="";lista=[];green=0;red=0;ultimoSinal=null;ultimoResultado=null;proximoBrancoIdx=0;irPara(2);}
function dig(v){if(cur=="0"||cur=="00"){cur=v;}else if(cur.length>=2){cur=v;}else{cur+=v;}show();}
function corr(){if(cur=="0"){apagarUltimo();return;}if(cur=="00"){limparTudo();return;}if(cur!=""){cur=cur.slice(0,-1);show();}else{apagarUltimo();}}
function apagarUltimo(){
 if(paginaAtual==2){
  if(proximoBrancoIdx>0){
   proximoBrancoIdx--;
   var sq=quadradosBrancos[proximoBrancoIdx];
   sq.textContent="";
   sq.className="sq white vazio";
   if(lista.length>0) lista.pop();
   show();upd();
  }
 }else{
  if(lista.length>0){lista.pop();show();upd();}
 }
}
function limparTudo(){
 cur="";lista=[];green=0;red=0;ultimoSinal=null;ultimoResultado=null;proximoBrancoIdx=0;
 quadradosBrancos.forEach(function(sq){
  sq.textContent="";
  sq.className="sq white vazio";
 });
 irPara(paginaAtual);
 show();upd();
}
function ok(){
 if(cur===""){return;}
 if(cur==="00"){limparTudo();return;}
 if(cur==="0"){apagarUltimo();return;}
 var n=parseInt(cur);if(isNaN(n)||n<0||n>36){cur="";show();return;}
 if(ultimoSinal){
  var col=getCol(n);
  if(col==2||col==3){green++;ultimoResultado={tipo:'verde',num:n};}
  else if(col==1){red++;ultimoResultado={tipo:'vermelho',num:n};}
  else{ultimoResultado={tipo:'azul',num:n};}
  ultimoSinal=null;
 }
 if(paginaAtual==2){
  if(proximoBrancoIdx < quadradosBrancos.length){
   var sq=quadradosBrancos[proximoBrancoIdx];
   var col=getCol(n);
   sq.textContent=n;
   if(col==1){
    sq.className="sq red new";
   }else if(col==2||col==3){
    sq.className="sq green new";
   }else{
    sq.className="sq green new";
   }
   proximoBrancoIdx++;
   lista.push(n);
   cur="";
   show();upd();
   if(proximoBrancoIdx>=quadradosBrancos.length){
    var d=document.getElementById('disp');
    d.textContent="✅ TODOS OS "+quadradosBrancos.length+" QUADRADOS PREENCHIDOS! APAGAR PARA CONTINUAR";
    d.className="display verde";
   }else if(ultimoResultado){
    var d=document.getElementById('disp');
    if(ultimoResultado.tipo=='verde'){d.textContent="P2 - ✅ ACERTOU! "+n+" É C"+getCol(n)+" - VERDE DENTRO DO QUADRADO";d.className="display verde";}
    else if(ultimoResultado.tipo=='vermelho'){d.textContent="P2 - ❌ ERROU! "+n+" É C1 - VERMELHO DENTRO DO QUADRADO";d.className="display vermelho";}
    setTimeout(function(){show();},1800);
   }
  }else{
   var d=document.getElementById('disp');
   d.textContent="⚠️ TODOS OS QUADRADOS CHEIOS! APAGAR ULTIMO OU LIMPAR";
   d.className="display vermelho";
   setTimeout(function(){show();},2000);
  }
 }else{
  lista.push(n);
  cur="";
  show();upd();
  if(ultimoResultado && lista[lista.length-1]==n){
   var d=document.getElementById('disp');
   if(ultimoResultado.tipo=='verde'){d.textContent="P"+paginaAtual+" - ✅ ACERTOU! "+n+" VERDE";d.className="display verde";}
   else if(ultimoResultado.tipo=='vermelho'){d.textContent="P"+paginaAtual+" - ❌ ERROU! "+n+" VERMELHO";d.className="display vermelho";}
   setTimeout(function(){show();},2000);
  }
 }
}
function makeSq(t){
 var e=document.createElement('div');
 e.className='sq '+t+(t=='white'?' vazio':'');
 if(t=='blue'){
  e.textContent="";
 }else{
  e.textContent="";
 }
 return e;
}
function criarQuadradosPagina2(){
 var container=document.getElementById('patternFixed2');
 if(!container) return;
 container.innerHTML="";
 quadradosBrancos=[];
 padraoBrancos.forEach(function(qtdBranco, idx){
  var blueSq=document.createElement('div');
  blueSq.className='sq blue';
  blueSq.textContent="";
  blueSq.title="GATILHO AZUL FIXO - NÃO MEXER - 2 ou 0";
  container.appendChild(blueSq);
  for(var w=0;w<qtdBranco;w++){
   var whiteSq=document.createElement('div');
   whiteSq.className='sq white vazio';
   whiteSq.textContent="";
   whiteSq.title="QUADRADO VAZIO - DIGITE NÚMERO E VIRA VERDE OU VERMELHO";
   container.appendChild(whiteSq);
   quadradosBrancos.push(whiteSq);
  }
  var sep=document.createElement('div');
  sep.style.width="10px";
  sep.style.height="1px";
  container.appendChild(sep);
 });
 proximoBrancoIdx=0;
 for(var i=0;i<Math.min(lista.length, quadradosBrancos.length);i++){
  var num=lista[i];
  var col=getCol(num);
  var sq=quadradosBrancos[i];
  sq.textContent=num;
  if(col==1) sq.className='sq red';
  else sq.className='sq green';
  proximoBrancoIdx++;
 }
}
function upd(){
 var eventos=[];var gatilhoSet=new Set();var i=0;
 while(i<lista.length){
  var n=lista[i];
  if(isGatilhoNum(n)){
   var verm=0;var j=i+1;
   while(j<lista.length && getCol(lista[j])==1){verm++;j++;}
   if(verm>0){eventos.push({pos:i,vermelhos:verm,gatilho:n});gatilhoSet.add(i);}
   i=j;
  }else{i++;}
 }
 ultimoSinal=null;
 if(eventos.length>0){
  var ev=eventos[eventos.length-1];
  if(lista.length==ev.pos+ev.vermelhos+1){ultimoSinal=ev;}
 }
 if(quadradosBrancos.length==0){
  criarQuadradosPagina2();
 }
 var rev=lista.slice().reverse();
 ['topBar1','topBar3','topBar4','topBar5','topBar10'].forEach(function(id){
  var el=document.getElementById(id);
  if(!el) return;
  el.innerHTML="";
  var mostrar=rev.slice(0,12);
  if(mostrar.length==0){
   var e=document.createElement('div');e.style.cssText="font-size:9px;color:#888;padding:2px";e.textContent="Sem números - novo entra na frente no lugar do 5";el.appendChild(e);
  }else{
   mostrar.forEach(function(num,idx){
    var posOrig=lista.length-1-idx;
    var isGat=gatilhoSet.has(posOrig);
    var col=getCol(num);
    var cor=isGat?'blue':(col==1?'red':(col==0?'blue':'green'));
    var box=document.createElement('div');box.className='nBox '+cor+(idx==0?' new':'');box.textContent=num;el.appendChild(box);
   });
  }
 });
 var numGrid3=document.getElementById('numGrid3');
 if(numGrid3){
  numGrid3.innerHTML="";
  var rev9=rev.slice(0,9);
  if(rev9.length==0){for(var i=0;i<9;i++){var e=document.createElement('div');e.className='numGridBox green';e.textContent="-";e.style.opacity="0.3";numGrid3.appendChild(e);}}
  else{
   while(rev9.length<9){rev9.push("-");}
   for(var i=0;i<9;i++){
    var val=rev9[i];
    var e=document.createElement('div');
    if(val=="-"){e.className='numGridBox green';e.textContent="-";e.style.opacity="0.3";}
    else{
     var posOrig=lista.length-1-i;
     var isGat=gatilhoSet.has(posOrig);
     var col=getCol(val);
     if(isGat) e.className='numGridBox blue'+(i==0?' new':'');
     else if(col==1) e.className='numGridBox red'+(i==0?' new':'');
     else e.className='numGridBox green'+(i==0?' new':'');
     e.textContent=val;
    }
    numGrid3.appendChild(e);
   }
  }
 }
 var jogarBtn4=document.getElementById('jogarBtn4');
 var jogarSub4=document.getElementById('jogarSub4');
 if(jogarBtn4){
  if(ultimoSinal){jogarBtn4.textContent="C2/3";jogarBtn4.className="jogarBtn sinal";jogarSub4.textContent=ultimoSinal.vermelhos+" VERMELHO(S) DEPOIS DO 🟦 "+ultimoSinal.gatilho+" - JOGAR!";}
  else{jogarBtn4.textContent="AGUARDANDO";jogarBtn4.className="jogarBtn";jogarSub4.textContent="Aguardando 🟦+🔴";}
 }
 var acertoBox5=document.getElementById('acertoBox5');
 var acertoSub5=document.getElementById('acertoSub5');
 if(acertoBox5){
  if(ultimoResultado){
   if(ultimoResultado.tipo=='verde'){acertoBox5.textContent="✅ "+ultimoResultado.num+" VERDE";acertoBox5.className="jogarBtn verde";acertoSub5.textContent="ACERTOU! C"+getCol(ultimoResultado.num);}
   else if(ultimoResultado.tipo=='vermelho'){acertoBox5.textContent="❌ "+ultimoResultado.num+" VERMELHO";acertoBox5.className="jogarBtn vermelho";acertoSub5.textContent="ERROU! C1";}
  }else{acertoBox5.textContent=lista.length>0?lista[lista.length-1]:"-";acertoBox5.className="jogarBtn";acertoSub5.textContent=lista.length>0?"Ultimo: "+lista[lista.length-1]:"Sem jogadas";}
 }
 var linhas=[{id:"lineA6",nivel:1},{id:"lineB7",nivel:2},{id:"lineC8",nivel:3},{id:"lineD9",nivel:4}];
 linhas.forEach(function(item){
  var el=document.getElementById(item.id);
  if(!el) return;
  el.innerHTML='<span style="font-size:8px;color:#d4af37;font-weight:900;margin-right:4px">'+item.id+'</span>';
  var cont=0;
  for(var ev of eventos){if(ev.vermelhos>=item.nivel)cont++;}
  var max=lista.length==0?2:Math.min(cont,5);
  for(var c=0;c<max;c++){el.appendChild(makeSq('blue'));for(var w=0;w<item.nivel;w++)el.appendChild(makeSq('white'));var sep=document.createElement('div');sep.style.width="5px";el.appendChild(sep);}
 });
 var placarBig10=document.getElementById('placarBig10');
 if(placarBig10){placarBig10.textContent="GREEN "+green+" x "+red+" RED";}
 var infoBar2=document.getElementById('infoBar2');
 if(infoBar2){
  infoBar2.textContent="🔵 "+(quadradosBrancos.length-proximoBrancoIdx)+" quadrados vazios - "+proximoBrancoIdx+"/"+quadradosBrancos.length+" preenchidos - Azul fixo não mexe - Branco vira 🟢 C2/3 ou 🔴 C1 - Total: "+lista.length;
 }
 show();
}
show();upd();
criarQuadradosPagina2();
</script>
</body>
</html>
