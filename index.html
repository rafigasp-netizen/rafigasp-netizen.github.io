<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>RAFIGASP</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black}body{background:#000;display:flex;justify-content:center}#app{width:98%;max-width:400px;background:#0a2e1e;display:flex;flex-direction:column;gap:3px;min-height:100dvh;padding-bottom:8px}.topo{background:#ffcc00;text-align:center;padding:14px 6px;font-size:15px;cursor:pointer;line-height:16px;border-radius:0 0 8px 8px}.verde{margin:2px 3px;background:#0a5a2e;border-radius:8px;padding:5px;min-height:58px;display:flex;overflow-x:auto;gap:4px}.historico{display:flex;gap:4px}.coluna{display:flex;flex-direction:column;gap:3px}.boxLinha{background:#0a3d1f;border-radius:8px;margin:2px 3px;padding:6px;border:2px solid transparent;display:none}.boxLinha.ativa{border-color:#ff00ff;box-shadow:0 0 12px #ff00ff;display:block}.boxLinha h3{color:#ffcc00;font-size:11px;margin-bottom:4px}.hist{width:46px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;border:1.5px solid #fff;flex-shrink:0}.C{background:#00a000}.E{background:#c00000}.boxHist{background:#0a3d1f;border-radius:8px;margin:2px 3px;padding:6px;display:none}.boxHist.ativa{display:block}.linhaH{background:#001a1a;border-radius:6px;padding:6px;margin-bottom:4px}.linhaH h3{color:#ffcc00;font-size:11px}.faixa{display:flex;gap:3px;overflow-x:auto;min-height:28px}.q{width:28px;height:24px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;border:1px solid #fff}.q.C{background:#00a000}.q.E{background:#c00000}.vermelho{margin:2px 3px;background:#0a3d1f;border-radius:8px;padding:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.cell{border:1.5px solid #d4af37;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;min-height:40px;position:relative}.cell.red{background:#b50000}.cell.black{background:#111}.cell.marcadoA{background:#ffea00!important;color:#000!important;box-shadow:0 0 10px #ffea00}.cell.marcadoB{background:#00e5ff!important;color:#000!important;box-shadow:0 0 10px #00e5ff}.cell.marcadoAB{background:linear-gradient(45deg,#ffea00 50%,#00e5ff 50%)!important;color:#000!important}.badge{position:absolute;top:-6px;right:-4px;background:#000;color:#ffcc00;font-size:10px;padding:1px 5px;border-radius:10px;border:1px solid #ffcc00}.doisparaum{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:4px}.doisparaum div{background:#0a5a2e;border:1px solid #d4af37;color:#d4d46a;text-align:center;padding:7px 0;font-size:16px;font-weight:900;border-radius:4px}.azulBox{display:flex;gap:3px;margin:2px 3px}.azul{flex:1;background:#001a8a;border-radius:6px;padding:7px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:11px;font-weight:900}.azul span{color:#ffcc00}.azul.alerta{background:#cc0000!important;box-shadow:0 0 15px #f00;animation:pisca .5s infinite alternate}@keyframes pisca{from{background:#c00}to{background:#f00}}.btns{display:flex;gap:3px;padding:4px 3px}.btns button{flex:1;padding:12px;border:0;border-radius:6px;font-weight:900;font-size:14px;background:#ffcc00}</style></head><body><div id="app">
<div class="topo" onclick="mudaModo()"><b id="tituloTopo">RAFIGASP GERAL</b></div>
<div class="verde" id="verdeInicial"><div class="historico" id="listaInicial"></div></div>
<div class="boxLinha" id="boxA"></div><div class="boxLinha" id="boxB"></div>
<div class="boxHist" id="boxH"><div class="linhaH"><h3>1/2 🟥🟩</h3><div class="faixa" id="f12"></div></div><div class="linhaH"><h3>1/3 🟥🟩</h3><div class="faixa" id="f13"></div></div><div class="linhaH"><h3>2/3 🟥🟩</h3><div class="faixa" id="f23"></div></div></div>
<div class="vermelho"><div class="grid" id="grid"></div><div class="doisparaum"><div>1</div><div>2</div><div>3</div></div></div>
<div class="azulBox"><div class="azul" id="azulA"><div id="leftA">A: -</div><div id="placarA">0 X 0</div></div><div class="azul" id="azulB"><div id="leftB">B: -</div><div id="placarB">0 X 0</div></div></div>
<div class="btns"><button onclick="corr()">CORRIGIR</button><button onclick="if(confirm('Zerar tudo?')){localStorage.clear();location.reload()}">LIMPAR</button></div>
</div><script>
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};
const TAB={0:"ZERO",1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2"};
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const PISTA_A=[0,2,3,4,7,12,15,18,19,21,22,25,26,28,29,32,35];
const PISTA_B=[1,5,6,8,9,10,11,13,14,16,17,20,23,24,27,30,31,33,34,36];
const NOMES=["RAFIGASP GERAL","RAFIGASP LADO A","RAFIGASP LADO B","RAFIGASP COLUNAS","RAFIGASP LADO A","RAFIGASP LADO B"];
const MODOS=["GERAL","LADO_A","LADO_B","COLUNAS","LADO_A2","LADO_B2"];
let modoIdx=parseInt(localStorage.getItem('modoIdx')||'0');let modo=MODOS[modoIdx];
let countsA=JSON.parse(localStorage.getItem('cntA')||'{}');let countsB=JSON.parse(localStorage.getItem('cntB')||'{}');
let histA=JSON.parse(localStorage.getItem('histA')||'[]');let histB=JSON.parse(localStorage.getItem('histB')||'[]');
let hist123=JSON.parse(localStorage.getItem('hist123')||'[]');let ultimo123=localStorage.getItem('ultimo123')?parseInt(localStorage.getItem('ultimo123')):null;
let acertoA=parseInt(localStorage.getItem('placarAcertoA')||'0'),erroA=parseInt(localStorage.getItem('placarErroA')||'0');
let acertoB=parseInt(localStorage.getItem('placarAcertoB')||'0'),erroB=parseInt(localStorage.getItem('placarErroB')||'0');
let grid=document.getElementById('grid');
for(let i=1;i<=36;i++){let d=document.createElement('div');d.className='cell '+(REDS.includes(i)?'red':'black');d.id='c'+i;d.onclick=()=>pick(i);d.innerHTML='<span>'+i+'</span><span class="badge" id="cnt'+i+'"></span>';grid.appendChild(d);}
function atualiza(){for(let i=1;i<=36;i++){let ca=countsA[i]||0,cb=countsB[i]||0;let el=document.getElementById('cnt'+i);let b=document.getElementById('c'+i);if(modo.includes('LADO_A')){el.textContent=ca>0?ca+'x':'';b.className='cell '+(REDS.includes(i)?'red':'black')+(ca>0?' marcadoA':'');}else if(modo.includes('LADO_B')){el.textContent=cb>0?cb+'x':'';b.className='cell '+(REDS.includes(i)?'red':'black')+(cb>0?' marcadoB':'');}else if(modo==='COLUNAS'){el.textContent='';b.className='cell '+(REDS.includes(i)?'red':'black');}else{let tot=ca+cb;el.textContent=tot>0?tot+'x':'';let cls='cell '+(REDS.includes(i)?'red':'black');if(ca>0&&cb>0)cls+=' marcadoAB';else if(ca>0)cls+=' marcadoA';else if(cb>0)cls+=' marcadoB';b.className=cls;}}}
function calcAlerta(arr){if(arr.length<2)return false;for(let i=0;i<arr.length-1;i++){let c=arr[i],n=arr[i+1];if(c&&n&&!c.ok&&!n.ok){let temVerde=false;for(let j=0;j<i;j++){if(arr[j]&&arr[j].ok)temVerde=true;}if(!temVerde)return true;}}return false;}
function mudaModo(){modoIdx=(modoIdx+1)%NOMES.length;modo=MODOS[modoIdx];localStorage.setItem('modoIdx',modoIdx);render();}
function render(){
 document.getElementById('tituloTopo').textContent=NOMES[modoIdx];
 let ini=document.getElementById('verdeInicial'),bA=document.getElementById('boxA'),bB=document.getElementById('boxB'),bH=document.getElementById('boxH');
 if(modo==='GERAL'){ini.style.display='flex';bA.style.display='none';bB.style.display='none';bH.style.display='none';}
 else if(modo.includes('LADO_A')){ini.style.display='none';bA.style.display='block';bB.style.display='none';bH.style.display='none';bA.classList.add('ativa');}
 else if(modo.includes('LADO_B')){ini.style.display='none';bA.style.display='none';bB.style.display='block';bH.style.display='none';bB.classList.add('ativa');}
 else if(modo==='COLUNAS'){ini.style.display='none';bA.style.display='none';bB.style.display='none';bH.style.display='block';bH.classList.add('ativa');}
 bA.innerHTML='<h3>🔵 LINHA A</h3><div class="historico" id="listaA"></div>'; bB.innerHTML='<h3>🟢 LINHA B</h3><div class="historico" id="listaB"></div>';
 let lIni=document.getElementById('listaInicial');lIni.innerHTML="";let max=Math.max(histA.length,histB.length);for(let i=0;i<max;i++){let col=document.createElement('div');col.className='coluna';let a=histA[i],b=histB[i];if(a){let d=document.createElement('div');d.className='hist '+(a.ok?'C':'E');d.textContent=a.num;col.appendChild(d);}if(b){let d=document.createElement('div');d.className='hist '+(b.ok?'C':'E');d.textContent=b.num;col.appendChild(d);}if(col.children.length)lIni.appendChild(col);}
 let lA=document.getElementById('listaA');lA.innerHTML="";histA.forEach(h=>{let d=document.createElement('div');d.className='hist '+(h.ok?'C':'E');d.textContent=h.num;lA.appendChild(d);});
 let lB=document.getElementById('listaB');lB.innerHTML="";histB.forEach(h=>{let d=document.createElement('div');d.className='hist '+(h.ok?'C':'E');d.textContent=h.num;lB.appendChild(d);});
 document.getElementById('placarA').innerHTML='ACERTO <span>'+acertoA+' X '+erroA+'</span> ERRO';
 document.getElementById('placarB').innerHTML='ACERTO <span>'+acertoB+' X '+erroB+'</span> ERRO';
 let alertaA=calcAlerta(histA),alertaB=calcAlerta(histB);
 let vezA=modo.includes('LADO_A')||(modo==='GERAL'&&histA.length<=histB.length);
 let vezB=modo.includes('LADO_B')||(modo==='GERAL'&&histA.length>histB.length);
 document.getElementById('azulA').classList.toggle('alerta',alertaA&&vezA);
 document.getElementById('azulB').classList.toggle('alerta',alertaB&&vezB);
 if(histA.length)document.getElementById('leftA').innerHTML='A: '+histA[0].num+'> <span>'+TAB[histA[0].num]+'</span>';else document.getElementById('leftA').textContent='A: -';
 if(histB.length)document.getElementById('leftB').innerHTML='B: '+histB[0].num+'> <span>'+TAB[histB[0].num]+'</span>';else document.getElementById('leftB').textContent='B: -';
 let f12=document.getElementById('f12'),f13=document.getElementById('f13'),f23=document.getElementById('f23');f12.innerHTML="";f13.innerHTML="";f23.innerHTML="";
 hist123.forEach(h=>{let q=document.createElement('div');q.className='q '+(h.ok?'C':'E');q.textContent=h.ok?'🟩':'🟥';if(h.tab==='1/2')f12.appendChild(q);if(h.tab==='1/3')f13.appendChild(q);if(h.tab==='2/3')f23.appendChild(q);});
 atualiza();
}render();
function corr(){if(modo==='COLUNAS'){if(hist123.length){let r=hist123.shift();ultimo123=r.prev;localStorage.setItem('hist123',JSON.stringify(hist123));localStorage.setItem('ultimo123',ultimo123);render();}return;}if(modo.includes('LADO_A')&&histA.length){let r=histA.shift();countsA[r.num]=Math.max(0,(countsA[r.num]||0)-1);if(r.foiAposta){if(r.ok)acertoA=Math.max(0,acertoA-1);else erroA=Math.max(0,erroA-1);}}else if(modo.includes('LADO_B')&&histB.length){let r=histB.shift();countsB[r.num]=Math.max(0,(countsB[r.num]||0)-1);if(r.foiAposta){if(r.ok)acertoB=Math.max(0,acertoB-1);else erroB=Math.max(0,erroB-1);}}else if(modo==='GERAL'){if(histA.length>histB.length){let r=histA.shift();countsA[r.num]=Math.max(0,(countsA[r.num]||0)-1);if(r.foiAposta){if(r.ok)acertoA=Math.max(0,acertoA-1);else erroA=Math.max(0,erroA-1);}}else if(histB.length){let r=histB.shift();countsB[r.num]=Math.max(0,(countsB[r.num]||0)-1);if(r.foiAposta){if(r.ok)acertoB=Math.max(0,acertoB-1);else erroB=Math.max(0,erroB-1);}}else if(histA.length){let r=histA.shift();countsA[r.num]=Math.max(0,(countsA[r.num]||0)-1);}}localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));localStorage.setItem('cntA',JSON.stringify(countsA));localStorage.setItem('cntB',JSON.stringify(countsB));localStorage.setItem('placarAcertoA',acertoA);localStorage.setItem('placarErroA',erroA);localStorage.setItem('placarAcertoB',acertoB);localStorage.setItem('placarErroB',erroB);render();}
function goNum(num){
 if(ultimo123===null){ultimo123=num;}else{let tab=TAB[ultimo123];if(tab!=="ZERO"){let ok=COL[num]===COL[ultimo123];hist123.unshift({prev:ultimo123,tab:tab,curr:num,ok:ok});}ultimo123=num;}localStorage.setItem('hist123',JSON.stringify(hist123));localStorage.setItem('ultimo123',ultimo123);
 let okA=true,okB=true;if(histA.length){let alvo=TAB[histA[0].num].split('/').map(Number);if(num!==0)okA=alvo.includes(COL[num]);}if(histB.length){let alvo=TAB[histB[0].num].split('/').map(Number);if(num!==0)okB=alvo.includes(COL[num]);}
 if(modo.includes('LADO_A')){let alerta=calcAlerta(histA);let foi=false;if(alerta){foi=true;if(okA)acertoA++;else erroA++;}histA.unshift({num:num,ok:okA,foiAposta:foi});countsA[num]=(countsA[num]||0)+1;}
 else if(modo.includes('LADO_B')){let alerta=calcAlerta(histB);let foi=false;if(alerta){foi=true;if(okB)acertoB++;else erroB++;}histB.unshift({num:num,ok:okB,foiAposta:foi});countsB[num]=(countsB[num]||0)+1;}
 else {if(histA.length<=histB.length){let alerta=calcAlerta(histA);let foi=false;if(alerta){foi=true;if(okA)acertoA++;else erroA++;}histA.unshift({num:num,ok:okA,foiAposta:foi});countsA[num]=(countsA[num]||0)+1;}else{let alerta=calcAlerta(histB);let foi=false;if(alerta){foi=true;if(okB)acertoB++;else erroB++;}histB.unshift({num:num,ok:okB,foiAposta:foi});countsB[num]=(countsB[num]||0)+1;}}
 localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));localStorage.setItem('cntA',JSON.stringify(countsA));localStorage.setItem('cntB',JSON.stringify(countsB));localStorage.setItem('placarAcertoA',acertoA);localStorage.setItem('placarErroA',erroA);localStorage.setItem('placarAcertoB',acertoB);localStorage.setItem('placarErroB',erroB);render();
}
function pick(n){goNum(n);}
</script></body></html>
