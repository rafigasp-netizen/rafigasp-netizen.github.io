<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>RAFIGASP COACH DA ROLETA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black;-webkit-tap-highlight-color:transparent}html,body{background:#000;min-height:100vh}body{padding:4px;touch-action:manipulation}#app{width:98%;max-width:480px;background:#0a2e1e;display:flex;flex-direction:column;gap:3px;border-radius:10px;padding:4px;margin:0 auto;min-height:98vh}.topo{background:#ffcc00;text-align:center;padding:12px 4px;font-size:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer}.verde{margin:2px;background:#0a5a2e;border-radius:10px;padding:8px;min-height:70px;display:flex;flex-direction:column;gap:8px;overflow-x:hidden;border:3px solid #00ff00}.linha4{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;overflow-x:auto;white-space:nowrap;padding:12px 6px;min-height:56px;border-radius:12px;background:#002a2a;border:3px solid #ffcc00}.linha4.A{border-color:#ffcc00;box-shadow:0 0 15px #ffcc00}.linha4.B{border-color:#00ffff;box-shadow:0 0 15px #00ffff;background:#001a33}.linha4 .titulo4{font-size:20px;min-width:30px;flex-shrink:0;color:#ffcc00;font-weight:900}.linha4.B .titulo4{color:#00ffff}.num4{width:42px;min-width:42px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;border:2px solid #fff;flex-shrink:0;font-weight:900;position:relative}.num4.C{background:#00a000!important}.num4.E{background:#c00000!important}.num4.pos1{border:3px solid #ffff00!important;transform:scale(1.15);box-shadow:0 0 10px #ffff00}.num4.pos4{border:3px solid #ff6600!important;transform:scale(1.15);box-shadow:0 0 10px #ff6600}.num4.pos1::after,.num4.pos4::after{display:none!important;content:none!important;visibility:hidden!important}.jogadaBox{background:#000;border:4px solid #00ff00;border-radius:12px;margin:2px;padding:16px;text-align:center;color:#fff;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.jogadaBox .quem{font-size:12px;color:#ffcc00}.jogadaBox span{color:#00ff00;font-size:26px;font-weight:900;text-shadow:0 0 12px #00ff00}.jogadaBox.B{border-color:#00ffff}.jogadaBox.B .quem{color:#00ffff}.jogadaBox.B span{color:#00ffff;text-shadow:0 0 12px #00ffff}.jogadaBox.travada{border-color:#ffff00;box-shadow:0 0 15px #ffff00}.faixaEntre{background:#000;border:3px solid #ffcc00;border-radius:10px;margin:2px;padding:10px;display:flex;gap:6px;overflow-x:auto;min-height:52px;align-items:center}.faixaEntre h4{color:#ffcc00;font-size:12px;white-space:nowrap}.numGeral{min-width:40px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;border:2px solid #fff;flex-shrink:0}.numGeral.A{background:#ffcc00!important;color:#000!important}.numGeral.B{background:#0066ff!important;color:#fff!important}.vermelho{margin:2px;background:#0a3d1f;border-radius:10px;padding:4px;display:flex;flex:1;flex-direction:column}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#0a3d1f;border-radius:10px;overflow:hidden}.cell{border:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;min-height:54px;position:relative;cursor:pointer;transition:0.2s}.cell.red{background:#b50000}.cell.black{background:#222}.cell.jogar{border:5px solid #ffcc00!important;box-shadow:0 0 22px #ffcc00!important;transform:scale(1.05);z-index:3;border-radius:10px;background:#8a7a00!important;color:#fff!important}.doisparaum{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:6px;background:#0a3d1f;border-radius:10px;overflow:hidden}.doisparaum div{background:#0a5a2e;color:#d4d46a;text-align:center;padding:14px 0;font-size:16px;font-weight:900}.doisparaum div.ativo{background:#ffcc00!important;color:#000!important;box-shadow:0 0 15px #ffcc00}.btns{display:flex;gap:4px;padding:8px}.btns button{flex:1;padding:14px;border:0;border-radius:8px;font-weight:900;font-size:13px;background:#ffcc00;cursor:pointer}</style></head><body><div id="app">
<div class="topo" onclick="if(confirm('Zerar tudo?')){localStorage.clear();location.reload()}"><b>RAFIGASP COACH DA ROLETA</b></div>
<div class="verde" id="verdeInicial"></div>
<div class="jogadaBox" id="jogadaBox"><div class="quem">-</div><span>JOGAR COLUNA -</span></div>
<div class="faixaEntre" id="faixaEntre"><h4>GERAL:</h4><div id="listaGeral" style="display:flex;gap:6px"></div></div>
<div class="vermelho"><div class="grid" id="grid"></div><div class="doisparaum"><div id="d1">1</div><div id="d2">2</div><div id="d3">3</div></div></div>
<div class="btns"><button onclick="corr()">↩️ CORRIGIR</button><button onclick="if(confirm('Zerar?')){localStorage.clear();location.reload()}">🗑️ LIMPAR</button></div>
</div><script>
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
let histA=JSON.parse(localStorage.getItem('histA')||'[]');let histB=JSON.parse(localStorage.getItem('histB')||'[]');
let histGeralCron=JSON.parse(localStorage.getItem('histGeralCron')||'[]');
let activeA=JSON.parse(localStorage.getItem('activeA')||'null');
let activeB=JSON.parse(localStorage.getItem('activeB')||'null');
let gridEl=document.getElementById('grid');
for(let i=1;i<=36;i++){let d=document.createElement('div');d.className='cell '+(REDS.includes(i)?'red':'black');d.id='c'+i;d.setAttribute('onclick','pick('+i+')');d.innerHTML='<span>'+i+'</span>';gridEl.appendChild(d);}
function calculaJogada1e4(n1,n4){
  if(!n1||!n4) return null;
  let c1=COL[n1],c4=COL[n4];
  if(!c1||!c4||c1===0||c4===0) return null;
  if(c1===c4){let jogar=[1,2,3].filter(c=>c!==c1);return {n1:n1,n4:n4,c1:c1,c4:c4,jogar:jogar};}
  else{let jogar=[c1,c4].sort((a,b)=>a-b);return {n1:n1,n4:n4,c1:c1,c4:c4,jogar:jogar};}
}
function marcaOndeJogar(jogada){
 document.querySelectorAll('.cell').forEach(c=>{c.classList.remove('jogar');});
 document.getElementById('d1').className='';document.getElementById('d2').className='';document.getElementById('d3').className='';
 if(!jogada) return;
 jogada.jogar.forEach(col=>{
   let el=document.getElementById('d'+col);
   if(el) el.classList.add('ativo');
 });
 for(let i=1;i<=36;i++){
   if(jogada.jogar.includes(COL[i])){
     let el=document.getElementById('c'+i);
     if(el) el.classList.add('jogar');
   }
 }
}
function render(){
 let verdeEl=document.getElementById('verdeInicial');verdeEl.innerHTML="";
 function criaLinha(titulo, arr, classe){
   let linha=document.createElement('div');linha.className='linha4 '+classe;
   let t=document.createElement('div');t.className='titulo4';t.textContent=titulo;linha.appendChild(t);
   if(arr.length===0){
     let span=document.createElement('span');span.style.color='#888';span.style.fontSize='12px';span.textContent='vazio';linha.appendChild(span);
   }else{
     arr.slice(0,20).forEach((item, idx)=>{
       let num=item.num;let ok=item.ok;
       let cls='num4 '+(ok?'C':'E');
       if(idx===0) cls+=' pos1';
       if(idx===3) cls+=' pos4';
       let d=document.createElement('div');d.className=cls;d.textContent=num;linha.appendChild(d);
     });
   }
   return linha;
 }
 let vezA = histA.length <= histB.length;
 if(vezA){ verdeEl.appendChild(criaLinha('A:',histA,'A')); }
 else{ verdeEl.appendChild(criaLinha('B:',histB,'B')); }
 let jogadaAtual = vezA ? activeA : activeB;
 let box=document.getElementById('jogadaBox');
 if(jogadaAtual){
   box.className='jogadaBox travada '+(vezA?'A':'B');
   box.innerHTML='<div class="quem">'+(vezA?'A':'B')+' - VEZ DO '+(vezA?'A':'B')+'</div><span>'+(vezA?'A':'B')+': JOGAR COLUNA '+jogadaAtual.jogar.join('/')+'</span>';
 }else{
   let arrVez = vezA?histA:histB;
   box.className='jogadaBox '+(vezA?'A':'B');
   if(arrVez.length<4) box.innerHTML='<div class="quem">'+(vezA?'A':'B')+' - FALTAM '+(4-arrVez.length)+'</div><span style="font-size:16px;color:#ffcc00">AGUARDANDO</span>';
   else box.innerHTML='<div class="quem">'+(vezA?'A':'B')+'</div><span>JOGAR COLUNA -</span>';
 }
 let listaGeralEl=document.getElementById('listaGeral');listaGeralEl.innerHTML="";
 histGeralCron.slice(0,30).forEach((h)=>{
   let d=document.createElement('div');d.className='numGeral '+(h.linha==='A'?'A':'B');d.textContent=h.num;listaGeralEl.appendChild(d);
 });
 marcaOndeJogar(jogadaAtual);
}
render();
function corr(){
 if(histGeralCron.length===0) return;
 let ultimo = histGeralCron.shift();
 let linhaErrada = ultimo.linha;
 if(linhaErrada==='A'){
   if(histA.length){
     let r=histA.shift();
     if(r.foiAposta && r.ok) activeA=null;
   }
 }else{
   if(histB.length){
     let r=histB.shift();
     if(r.foiAposta && r.ok) activeB=null;
   }
 }
 localStorage.setItem('activeA',JSON.stringify(activeA));
 localStorage.setItem('activeB',JSON.stringify(activeB));
 localStorage.setItem('histGeralCron',JSON.stringify(histGeralCron));
 localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));
 render();
}
function goNum(num){
 let vaiA = histA.length <= histB.length;
 let colNum=COL[num];
 let ok=true;let foiAposta=false;
 if(vaiA){
   if(activeA){
     foiAposta=true;
     ok=activeA.jogar.includes(colNum);
     if(ok) activeA=null;
   }
   histA.unshift({num:num,ok:ok,foiAposta:foiAposta});
   histGeralCron.unshift({num:num,linha:'A',ok:ok,foiAposta:foiAposta});
   if(!activeA && histA.length>=4){
     activeA=calculaJogada1e4(histA[0].num,histA[3].num);
   }
 }else{
   if(activeB){
     foiAposta=true;
     ok=activeB.jogar.includes(colNum);
     if(ok) activeB=null;
   }
   histB.unshift({num:num,ok:ok,foiAposta:foiAposta});
   histGeralCron.unshift({num:num,linha:'B',ok:ok,foiAposta:foiAposta});
   if(!activeB && histB.length>=4){
     activeB=calculaJogada1e4(histB[0].num,histB[3].num);
   }
 }
 localStorage.setItem('activeA',JSON.stringify(activeA));
 localStorage.setItem('activeB',JSON.stringify(activeB));
 localStorage.setItem('histGeralCron',JSON.stringify(histGeralCron));
 localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));
 render();
}
function pick(n){goNum(n);}
</script></body></html>
