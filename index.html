<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP - GATILHO AZUL CORRETO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#001a00;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:100%;max-width:400px;height:100dvh;background:#001a00;display:flex;flex-direction:column;border:2px solid #d4af37}
.topo{text-align:center;background:linear-gradient(180deg,#e8c76a,#b8941f);padding:6px 0 4px;flex-shrink:0}
.topoR{font-weight:900;font-size:28px;color:#111;letter-spacing:1px;line-height:1}
.display{margin:4px 6px;background:#000;border:2.5px solid #d4af37;border-radius:10px;height:44px;display:flex;align-items:center;justify-content:center;color:#0f8a1f;font-weight:900;font-size:12px;flex-shrink:0;text-align:center;padding:2px}
.display.sinal{background:linear-gradient(180deg,#ffaa00,#ff6600);color:#000;border-color:#fff;font-size:11px;animation:pisca 0.6s infinite alternate}
@keyframes pisca{0%{background:#ffaa00}100%{background:#ff8800}}
.topHistBar{background:#000;border:1.5px solid #1a4a1a;border-radius:6px;margin:0 4px;padding:4px;display:flex;gap:2px;flex-wrap:wrap;min-height:30px;flex-shrink:0}
.nBox{height:22px;min-width:22px;padding:0 5px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:#fff}
.nBox.green{background:#0f8a2a}.nBox.red{background:#cc0000}.nBox.blue{background:#1e40af;border:2px solid #fff;box-shadow:0 0 4px #60a5fa}
.histContainer{flex:1;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:4px;background:#001a00}
.hCard{background:#0a2a0a;border:1.5px solid #2a5a2a;border-radius:6px;padding:5px}
.hCard.ativo{border-color:#ffaa00;box-shadow:0 0 8px #ffaa00;background:#1a2a00}
.hTitle{font-size:11px;font-weight:900;color:#d4af37;margin-bottom:4px;display:flex;gap:4px;align-items:center}
.hTitle b{color:#ffaa00;font-size:12px}
.icons{display:flex;gap:2px}
.iconB{width:14px;height:12px;background:#1e40af;border:2px solid #fff;border-radius:2px}
.iconW{width:14px;height:12px;background:#fff;border:1px solid #999;border-radius:2px}
.squareRow{display:flex;gap:1px;flex-wrap:wrap;min-height:18px;margin-top:3px;padding:2px;background:#000;border-radius:4px;border:1px solid #1a3a1a}
.sq{width:14px;height:12px;border-radius:2px}
.sq.blue{background:#1e40af;border:1.5px solid #fff}.sq.white{background:#fff;border:1px solid #999}.sq.red{background:#cc0000}.sq.green{background:#0f8a2a}
.jogarBar{background:linear-gradient(180deg,#4a0000,#8a0000);border:2px solid #ff4444;border-radius:8px;padding:8px;text-align:center;color:#fff;font-weight:900;font-size:14px;flex-shrink:0;margin:4px}
.jogarBar.sinal{background:linear-gradient(180deg,#ffaa00,#ff6600);color:#000;border-color:#fff;animation:piscaBar 0.7s infinite alternate}
@keyframes piscaBar{0%{background:#ffaa00}100%{background:#ff8800}}
.kb{background:linear-gradient(180deg,#e8c76a,#b8941f);border-top:2px solid #d4af37;padding:5px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;height:36%;min-height:190px}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.k{border-radius:8px;border:1.5px solid #8a6d1b;font-weight:900;font-size:18px;background:linear-gradient(180deg,#f9e27a,#b8941f);color:#111;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="app">
<div class="topo"><div class="topoR">RAFIGASP</div><div class="topoS">COACH DA ROLETA</div></div>
<div class="display" id="disp">🟦 GATILHO AZUL + ⬜️ VERMELHO = ENTRA C2/3</div>
<div class="topHistBar" id="topHist"></div>
<div class="histContainer">
<div class="hCard" id="card-A"><div class="hTitle"><b>A HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+1) = 🟦⬜️</div><div class="squareRow" id="row-A"></div><div style="font-size:8px;color:#888;margin-top:2px" id="count-A"></div></div>
<div class="hCard" id="card-B"><div class="hTitle"><b>B HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div><div class="iconW"></div></div> (1+2) = 🟦⬜️⬜️</div><div class="squareRow" id="row-B"></div><div style="font-size:8px;color:#888;margin-top:2px" id="count-B"></div></div>
<div class="hCard" id="card-C"><div class="hTitle"><b>C HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div><div class="iconW"></div></div> (1+3) = 🟦⬜️⬜️⬜️</div><div class="squareRow" id="row-C"></div><div style="font-size:8px;color:#888;margin-top:2px" id="count-C"></div></div>
<div class="hCard" id="card-D"><div class="hTitle"><b>D HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div></div> (1+4)</div><div class="squareRow" id="row-D"></div><div style="font-size:8px;color:#888" id="count-D"></div></div>
<div class="hCard" id="card-E"><div class="hTitle"><b>E HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div><div class="iconW"></div></div> (1+5)</div><div class="squareRow" id="row-E"></div><div style="font-size:8px;color:#888" id="count-E"></div></div>
<div class="hCard" id="card-F"><div class="hTitle"><b>F HIST</b> <div class="icons"><div class="iconB"></div><div class="iconW"></div><div class="iconW"></div></div> (1+6)</div><div class="squareRow" id="row-F"></div><div style="font-size:8px;color:#888" id="count-F"></div></div>
</div>
<div class="jogarBar" id="jogarBar">AGUARDANDO 🟦 GATILHO AZUL + 🔴 VERMELHO - JOGAR C2/3</div>
<div class="kb">
<div class="kr"><button class="k" onclick="dig('1')">1</button><button class="k" onclick="dig('2')">2</button><button class="k" onclick="dig('3')">3</button></div>
<div class="kr"><button class="k" onclick="dig('4')">4</button><button class="k" onclick="dig('5')">5</button><button class="k" onclick="dig('6')">6</button></div>
<div class="kr"><button class="k" onclick="dig('7')">7</button><button class="k" onclick="dig('8')">8</button><button class="k" onclick="dig('9')">9</button></div>
<div class="kr"><button class="k" onclick="ok()">ENTER</button><button class="k" onclick="dig('0')">0</button><button class="k" onclick="corr()">CORRIGIR</button></div>
</div>
</div>
<script>
var cur="",lista=[];
function getCol(n){if(n==0)return 0;if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0)return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0)return 2;return 3;}
function isGatilho(n){return n==2||n==0;}
function show(){var d=document.getElementById('disp');if(cur=="")d.textContent="🟦=GATILHO AZUL (2,0) + ⬜️=VERMELHO C1 - DIGITE NÚMERO",d.className="display";else if(cur=="0")d.textContent="0 = APAGAR ULTIMO",d.className="display";else if(cur=="00")d.textContent="00 = LIMPAR TUDO",d.className="display";else d.textContent="NUM: "+cur,d.className="display";}
function dig(v){if(cur.length>=2)cur=v;else cur+=v;show();}
function corr(){if(cur!=""){cur=cur.slice(0,-1);show();}else{if(lista.length){lista.pop();upd();}}}
function limpar(){lista=[];cur="";upd();show();}
function ok(){if(cur===""){return;}if(cur==="00"){limpar();return;}if(cur==="0"){if(lista.length)lista.pop();cur="";show();upd();return;}var n=parseInt(cur);if(isNaN(n)||n<0||n>36){cur="";show();return;}lista.push(n);cur="";show();upd();}
function makeNumBox(num, cor){var e=document.createElement('div');e.className='nBox '+cor;e.textContent=num;return e;}
function makeSquare(tipo){var e=document.createElement('div');e.className='sq '+tipo;return e;}
function upd(){
 var top=document.getElementById('topHist');top.innerHTML="";
 var mostrarTop=lista.length>0?lista.slice(-14):[5,6,4,5,2,14,1,6,5,4];
 for(var i=0;i<mostrarTop.length;i++){var num=mostrarTop[i];var cor=isGatilho(num)?'blue':(getCol(num)==1?'red':(getCol(num)==0?'blue':'green'));top.appendChild(makeNumBox(num, cor));}
 var eventos=[];var i=0;while(i<lista.length){var n=lista[i];if(isGatilho(n)){var vermelhos=0;var j=i+1;while(j<lista.length&&getCol(lista[j])==1){vermelhos++;j++;}if(vermelhos>0)eventos.push({pos:i,vermelhos:vermelhos,gatilhoNum:n});i=j;}else{i++;}}
 var letras=["A","B","C","D","E","F"];var niveis=[1,2,3,4,5,6];var contadores=[0,0,0,0,0,0];
 for(var ev of eventos){for(var lvlIdx=0;lvlIdx<niveis.length;lvlIdx++){if(ev.vermelhos>=niveis[lvlIdx])contadores[lvlIdx]++;}}
 for(var lvlIdx=0;lvlIdx<niveis.length;lvlIdx++){
  var letra=letras[lvlIdx];var nivel=niveis[lvlIdx];var row=document.getElementById('row-'+letra);var countEl=document.getElementById('count-'+letra);var card=document.getElementById('card-'+letra);row.innerHTML="";card.classList.remove('ativo');
  var count=contadores[lvlIdx];
  if(lista.length==0){
   if(letra=='A'){for(var k=0;k<5;k++){row.appendChild(makeSquare('blue'));row.appendChild(makeSquare('white'));}countEl.textContent="Ex: 5x 🟦⬜️ = seu exemplo linha 1";}
   else if(letra=='B'){for(var k=0;k<4;k++){row.appendChild(makeSquare('blue'));row.appendChild(makeSquare('white'));row.appendChild(makeSquare('white'));}for(var k=0;k<3;k++){row.appendChild(makeSquare('blue'));for(var w=0;w<3;w++)row.appendChild(makeSquare('white'));}countEl.textContent="Ex: 🟦⬜️⬜️ x4 + 🟦⬜️⬜️⬜️ x3 - sua linha 2";}
   else if(letra=='C'){for(var k=0;k<2;k++){row.appendChild(makeSquare('blue'));for(var w=0;w<4;w++)row.appendChild(makeSquare('white'));}countEl.textContent="Ex: 🟦⬜️⬜️⬜️⬜️ x2 - sua linha 3";}
   else if(letra=='D'){for(var k=0;k<2;k++){row.appendChild(makeSquare('blue'));for(var w=0;w<4;w++)row.appendChild(makeSquare('white'));}countEl.textContent="Ex: 🟦⬜️⬜️⬜️⬜️ x2 - linha 4";}
   else if(letra=='E'||letra=='F'){for(var k=0;k<6;k++){row.appendChild(makeSquare('blue'));for(var w=0;w<5;w++)row.appendChild(makeSquare('white'));}countEl.textContent="Ex: 6x 🟦⬜️⬜️⬜️⬜️⬜️ - sua linha 5 longa";}
   continue;
  }
  if(count==0){countEl.textContent="0x - aguardando "+nivel+" vermelho(s)";continue;}
  var maxMostrar=Math.min(count, 20);
  for(var c=0;c<maxMostrar;c++){row.appendChild(makeSquare('blue'));for(var w=0;w<nivel;w++){row.appendChild(makeSquare('white'));}}
  countEl.textContent=count+"x 🟦"+"⬜️".repeat(nivel)+" = "+count+" gatilhos";
  if(eventos.length>0){var ultimo=eventos[eventos.length-1];if(ultimo.vermelhos==nivel){card.classList.add('ativo');}}
 }
 var bar=document.getElementById('jogarBar');var disp=document.getElementById('disp');
 if(eventos.length==0){
  if(lista.length>0&&isGatilho(lista[lista.length-1])){bar.textContent="🟦 GATILHO AZUL SAIU ("+lista[lista.length-1]+") - AGUARDANDO 🔴 VERMELHO C1";bar.className="jogarBar sinal";}
  else{bar.textContent="AGUARDANDO 🟦 GATILHO AZUL (2 ou 0) + 🔴 VERMELHO C1 - JOGAR NA COLUNA C2/3";bar.className="jogarBar";}
 }else{
  var ultimoEv=eventos[eventos.length-1];
  var posDepois=ultimoEv.pos+1+ultimoEv.vermelhos;
  if(posDepois<lista.length){
   var depois=lista[posDepois];var colDepois=getCol(depois);
   if(colDepois==2||colDepois==3){bar.textContent="🟢 GANHOU! Depois de 🟦+"+ultimoEv.vermelhos+"🔴 veio C2/3 ("+depois+")";bar.className="jogarBar";bar.style.background="linear-gradient(180deg,#004400,#00aa00)";}
   else if(colDepois==1){bar.textContent="🔴 CONTINUOU VERMELHO - "+(ultimoEv.vermelhos+1)+" vermelhos - Ver "+String.fromCharCode(65+ultimoEv.vermelhos)+" HIST";bar.className="jogarBar sinal";}
  }else{
   bar.textContent="🔴 "+ultimoEv.vermelhos+" VERMELHO(S) DEPOIS DO 🟦 GATILHO AZUL ("+ultimoEv.gatilhoNum+") - JOGAR NA COLUNA C2/3 AGORA! - "+String.fromCharCode(64+ultimoEv.vermelhos)+" HIST (1+"+ultimoEv.vermelhos+")";
   bar.className="jogarBar sinal";
   if(cur==""){disp.textContent="🔴 SINAL! 🟦 + "+ultimoEv.vermelhos+" VERMELHO(S) - ENTRAR C2/3! - "+String.fromCharCode(64+ultimoEv.vermelhos)+" HIST";disp.className="display sinal";}
  }
 }
}
show();upd();
</script>
</body>
</html>
