<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d2818;display:flex;justify-content:center;font-family:Arial}
.app{width:100%;max-width:420px;min-height:100dvh;background:#0d2818;border:2px solid #d4af37;display:flex;flex-direction:column}
.top-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#0f2e1f}
.top-box{background:#000;border:2px solid #d4af37;border-radius:12px;height:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px}
.history{background:#0f2e1f;padding:8px;min-height:155px}
.hist-grid{display:grid!important;grid-template-columns:repeat(4,1fr);gap:6px}
.hslot{height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.hslot.empty{border:1.5px dashed #8a7a3a;background:rgba(212,175,55,0.08)}
.hslot.yellow{background:#d4af37!important;color:#000!important}
.hslot.green{background:#16a34a!important;color:#fff!important}
.hslot.red{background:#dc2626!important;color:#fff!important}
.hslot.preview{outline:2px solid #fff}
.bottom-info{padding:8px;display:grid;grid-template-columns:80px 1fr;gap:8px}
.info-a{background:#0a2a1a;border:2px solid #d4af37;border-radius:12px;padding:6px;text-align:center}
.info-a .lab{font-size:9px;color:#d4af37;font-weight:800}
.info-a .val{background:#d4af37;color:#000;border-radius:8px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:900;margin-top:4px}
.info-b{background:#0a2a1a;border:2px solid #d4af37;border-radius:12px;padding:6px 10px;min-height:54px}
.info-b .lab{font-size:9px;color:#d4af37;font-weight:800}
.info-b .val{color:#fff;font-weight:900;font-size:14px;margin-top:2px;display:flex;gap:6px;align-items:center}
.badge{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.badge.green{background:#16a34a}.badge.red{background:#dc2626}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.k{height:62px;border-radius:14px;border:none;font-weight:900;font-size:22px}
.k.num{background:#d4af37;color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:#d4af37;color:#4a3410;font-size:11px}
</style>
</head>
<body>
<div class="app">
<div class="top-bar"><div class="top-box" id="topNum">-</div><div class="top-box" id="topCol">COLUNA -</div></div>
<div class="history"><div class="hist-grid" id="grid"></div></div>
<div class="bottom-info">
<div class="info-a"><div class="lab">A</div><div class="val" id="aVal">-</div></div>
<div class="info-b"><div class="lab">B - ULTIMO RESULTADO</div><div class="val" id="bVal">-</div></div>
</div>
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
<script>
let history=[],cur='',memoria={};
try{let m=localStorage.getItem('raf_mem'); if(m) memoria=JSON.parse(m);}catch(e){}
const grid=document.getElementById('grid');
const topNum=document.getElementById('topNum');
const topCol=document.getElementById('topCol');
const aVal=document.getElementById('aVal');
const bVal=document.getElementById('bVal');
function getColunaReal(n){if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;return 0;}
function getAlvo(n){ // para cor verde/vermelho
let cr=getColunaReal(n);
if(cr==1) return [1,2]; // C1/2 = col 1 e 2 - vamos usar para logica
if(cr==2) return [1,3];
if(cr==3) return [2,3];
return [];
}
function getGrupo(n){
if([1,4,7,12,15,18,22,23,24,27,30,34].includes(n)) return "C1/2";
if([2,3,5,8,10,13,20,25,28,31,32,35].includes(n)) return "C1/3";
if([6,9,11,14,16,17,19,21,26,29,33,36].includes(n)) return "C2/3";
return "";
}
function salvar(){
for(let col=0;col<4;col++){
let h=history[col];if(!h)continue;
let r1=history[col+4],r2=history[col+8];
let lista=[];if(r1)lista.push(r1);if(r2)lista.push(r2);
if(lista.length) memoria[h.num]=lista;
}
localStorage.setItem('raf_mem',JSON.stringify(memoria));
}
function render(preview=null){
grid.innerHTML='';
for(let i=0;i<12;i++){
let d=document.createElement('div');
if(preview && i==history.length){
let v=preview.num;
if(i<4){d.className='hslot yellow preview';d.textContent=v;}
else{
let header=history[i%4];
if(!header){d.className='hslot empty';}
else{
let cr=getColunaReal(v);
let grupo=header.grupo;
let cols=grupo=="C1/2"?[1,2]:grupo=="C1/3"?[1,3]:[2,3];
d.textContent=v;
d.className='hslot '+(cols.includes(cr)?'green':'red')+' preview';
}
}
grid.appendChild(d);continue;
}
if(i<history.length){
let h=history[i];
if(i<4){d.className='hslot yellow';d.textContent=h.num;}
else{
let header=history[i%4];
let cr=getColunaReal(h.num);
let cols=header.grupo=="C1/2"?[1,2]:header.grupo=="C1/3"?[1,3]:[2,3];
d.textContent=h.num;
d.className='hslot '+(cols.includes(cr)?'green':'red');
}
}else{d.className='hslot empty';}
grid.appendChild(d);
}
if(preview){
let cr=getColunaReal(preview.num);
topNum.textContent=preview.num;
topCol.textContent="COLUNA "+cr;
aVal.textContent=preview.num;
let mem=memoria[preview.num];
if(mem && mem.length>0){
let grupo=memoria[preview.num+"_grupo"] || getGrupo(preview.num);
if(!memoria[preview.num+"_grupo"]) grupo=getGrupo(preview.num);
let html=`${preview.num==mem[0].num?'AGORA':'1ª VEZ DO '+preview.num} `;
if(mem.length>0){
let h=mem[0];
let cr2=getColunaReal(h.num);
let cols=grupo=="C1/2"?[1,2]:grupo=="C1/3"?[1,3]:[2,3];
let cor=cols.includes(cr2)?'green':'red';
html+=`<span class="badge ${cor}">${h.num}</span>`;
}
if(mem[1]){
let h=mem[1];
let cr2=getColunaReal(h.num);
let cols=grupo=="C1/2"?[1,2]:grupo=="C1/3"?[1,3]:[2,3];
let cor=cols.includes(cr2)?'green':'red';
html+=`<span class="badge ${cor}">${h.num}</span>`;
}
bVal.innerHTML=html;
}else{
bVal.innerHTML=`1ª VEZ DO ${preview.num}`;
}
}else{
topNum.textContent='-';topCol.textContent='COLUNA -';aVal.textContent='-';bVal.textContent='-';
}
}
function addN(n){
if(cur.length>=2)return;
cur+=n;
let v=parseInt(cur);
let grupo=getGrupo(v);
render({num:v,grupo:grupo});
}
function enterN(){
if(cur=='')return;
if(cur=='00'){history=[];cur='';memoria={};localStorage.removeItem('raf_mem');render();return;}
let v=parseInt(cur);
if(v>36){cur='';render();return;}
if(v==0){history=[];cur='';render();return;}
let grupo=getGrupo(v);
history.push({num:v,grupo:grupo});
memoria[v+"_grupo"]=grupo;
cur='';render();
if(history.length>=12){salvar();setTimeout(()=>{history=[];render();},900);}
}
function corrige(){
if(cur!=''){cur=cur.slice(0,-1);if(cur==''){render();}else{let v=parseInt(cur);let g=getGrupo(v);render({num:v,grupo:g});}}
else if(history.length>0){history.pop();render();}
}
render();
</script>
</body>
</html>
