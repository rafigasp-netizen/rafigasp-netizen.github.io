<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RAFIGASP</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black}html,body{height:100%;background:#000;display:flex;justify-content:center;align-items:center}body{overflow:hidden}#app{width:98%;max-width:460px;height:95dvh;max-height:800px;background:#0a2e1e;display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:3px;box-shadow:0 0 20px rgba(0,0,0,.8);margin:auto}.topo{background:#ffcc00;text-align:center;padding:10px 6px;font-size:14px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:40px}.verde{margin:2px;background:#0a5a2e;border-radius:6px;padding:4px;min-height:50px;display:none;overflow-x:auto}.verde.ativa{display:flex}.historico{display:flex;gap:4px}.coluna{display:flex;flex-direction:column;gap:3px}.hist{width:32px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;border:1.5px solid #fff}.C{background:#00c000}.E{background:#c00000}.boxHist{background:#0a3d1f;border-radius:6px;margin:2px;padding:4px;display:none;max-height:240px;overflow-y:auto}.boxHist.ativa{display:block}.linhaH{background:#001a1a;border-radius:5px;padding:4px;margin-bottom:3px;border:2px solid transparent}.linhaH h3{color:#ffcc00;font-size:10px}.linhaH.piscaAmarelo{background:#b89600!important;border:2px solid #ffcc00!important;animation:piscaAmarelo 0.6s infinite}.linhaH.piscaAzul{background:#0022aa!important;border:2px solid #00aaff!important;animation:piscaAzul 0.6s infinite}.faixa{display:flex;gap:3px;min-height:26px;flex-wrap:nowrap;overflow-x:auto}.q{width:34px;min-width:34px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;border:1.5px solid #fff;flex-shrink:0}.q.C{background:#00a000}.q.E{background:#c00000}.vermelho{margin:2px;background:#0a3d1f;border-radius:6px;padding:3px;display:none;flex:1}.vermelho.ativa{display:flex;flex-direction:column}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:1}.cell{border:1px solid #d4af37;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;min-height:30px;position:relative}.cell.red{background:#b50000}.cell.black{background:#111}.cell.marcadoA{background:#ffcc00!important;color:#000!important;border:2px solid #fff!important}.cell.marcadoB{background:#0066ff!important;color:#fff!important;border:2px solid #fff!important}.cell.marcadoAB{background:linear-gradient(135deg,#ffcc00 50%,#0066ff 50%)!important;color:#000!important;border:2px solid #fff!important}.badgeG{position:absolute;top:-5px;right:-3px;background:#000;color:#ffcc00;font-size:8px;padding:1px 4px;border-radius:8px;border:1px solid #ffcc00}.doisparaum{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:3px}.doisparaum div{background:#0a5a2e;border:1px solid #d4af37;color:#d4d46a;text-align:center;padding:4px 0;font-size:12px;font-weight:900;border-radius:3px}.azulBox{display:flex;gap:2px;margin:2px}.azul{flex:1;background:#001a8a;border-radius:5px;padding:4px;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:9px;font-weight:900}.azul span{color:#ffcc00}.azul.jogarA{background:#ffcc00!important;color:#000!important}.azul.jogarB{background:#0066ff!important;color:#fff!important;border:2px solid #00ffff}.azul.alerta{background:#ff0000!important;color:#ffff00!important;animation:piscaAlerta 0.4s infinite!important;border:3px solid #ffff00!important}@keyframes piscaAlerta{0%,50%{background:#ff0000!important}51%,100%{background:#ffff00!important;color:#ff0000!important}}@keyframes piscaAzul{0%,50%{background:#0044ff!important}51%,100%{background:#001a8a!important}}@keyframes piscaAmarelo{0%,50%{background:#ffcc00!important}51%,100%{background:#b89600!important}}.btns{display:flex;gap:2px;padding:3px}.btns button{flex:1;padding:7px;border:0;border-radius:5px;font-weight:900;font-size:11px;background:#ffcc00}.placarFoto{background:#000;color:#ffcc00;padding:5px;border-radius:5px;font-size:11px;margin:3px;white-space:pre-line}</style></head><body><div id="app">
<div class="topo" onclick="mudaModo()"><b id="tituloTopo">RAFIGASP GERAL</b></div>
<div class="verde" id="verdeInicial"><div class="historico" id="listaInicial"></div></div>
<div class="boxHist" id="boxH"></div>

<div class="azulBox"><div class="azul" id="azulA"><div id="leftA">A: -</div><div id="placarA">0 X 0</div></div><div class="azul" id="azulB"><div id="leftB">B: -</div><div id="placarB">0 X 0</div></div></div>
<div class="btns"><button onclick="document.getElementById('inputFoto').click()">📷 FOTO</button><button onclick="corr()">CORRIGIR</button><button onclick="if(confirm('Zerar?')){localStorage.clear();location.reload()}">LIMPAR</button></div>
<input type="file" id="inputFoto" accept="image/*" style="display:none" onchange="lerFoto(this)">
</div><script>
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};
const TAB={0:"ZERO",1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2"};
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const NOMES=["RAFIGASP GERAL","RAFIGASP 123 GERAL (A+B)","RAFIGASP 123 A","RAFIGASP 123 B"];const MODOS=["GERAL","123_GERAL","123_A","123_B"];
let modoIdx=parseInt(localStorage.getItem('modoIdx')||'0');if(modoIdx>=4)modoIdx=0;let modo=MODOS[modoIdx];
let countsA=JSON.parse(localStorage.getItem('cntA')||'{}');let countsB=JSON.parse(localStorage.getItem('cntB')||'{}');
let histA=JSON.parse(localStorage.getItem('histA')||'[]');let histB=JSON.parse(localStorage.getItem('histB')||'[]');
let hist123A=JSON.parse(localStorage.getItem('hist123A')||'[]');let hist123B=JSON.parse(localStorage.getItem('hist123B')||'[]');
let hist123Geral=JSON.parse(localStorage.getItem('hist123Geral')||'[]');
let ultimo123A=localStorage.getItem('ultimo123A')?parseInt(localStorage.getItem('ultimo123A')):null;let ultimo123B=localStorage.getItem('ultimo123B')?parseInt(localStorage.getItem('ultimo123B')):null;
let gridEl=document.getElementById('grid');for(let i=1;i<=36;i++){let d=document.createElement('div');d.className='cell '+(REDS.includes(i)?'red':'black');d.id='c'+i;d.onclick=()=>pick(i);d.innerHTML='<span>'+i+'</span><span class="badgeG" id="cnt'+i+'"></span>';gridEl.appendChild(d);}
function atualiza(){for(let i=1;i<=36;i++){let el=document.getElementById('cnt'+i);let b=document.getElementById('c'+i);if(!b)continue;let ca=countsA[i]||0,cb=countsB[i]||0;let tot=ca+cb;let base='cell '+(REDS.includes(i)?'red':'black');if(ca>0&&cb>0)base='cell marcadoAB';else if(ca>0)base='cell marcadoA';else if(cb>0)base='cell marcadoB';if(el)el.textContent=tot>0?tot+'x':'';b.className=base;}}
function calcAlerta(arr){if(!arr||arr.length<2)return false;let ult=arr[0],pen=arr[1];if(ult&&ult.ok)return false;if(ult&&pen&&!ult.ok&&!pen.ok)return true;return false;}
function mudaModo(){modoIdx=(modoIdx+1)%4;modo=MODOS[modoIdx];localStorage.setItem('modoIdx',modoIdx);render();}
function render(){
 document.getElementById('tituloTopo').textContent=NOMES[modoIdx];
 let ini=document.getElementById('verdeInicial'),bH=document.getElementById('boxH'),vm=document.getElementById('vermelho');ini.classList.remove('ativa');bH.classList.remove('ativa');vm.classList.remove('ativa');
 if(modo==='GERAL'){ini.classList.add('ativa');vm.classList.add('ativa');}else{bH.classList.add('ativa');vm.classList.add('ativa');}
 let lIni=document.getElementById('listaInicial');lIni.innerHTML="";let max=Math.max(histA.length,histB.length);
 for(let i=0;i<max;i++){let col=document.createElement('div');col.className='coluna';let a=histA[i],b=histB[i];if(a){let d=document.createElement('div');let ok=(typeof a==='object')?a.ok:true;let num=(typeof a==='object')?a.num:a;d.className='hist '+(ok?'C':'E');d.textContent=num;col.appendChild(d);}if(b){let d=document.createElement('div');let ok=(typeof b==='object')?b.ok:true;let num=(typeof b==='object')?b.num:b;d.className='hist '+(ok?'C':'E');d.textContent=num;col.appendChild(d);}if(col.children.length)lIni.appendChild(col);}
 let azulAEl=document.getElementById('azulA'),azulBEl=document.getElementById('azulB');azulAEl.className='azul';azulBEl.className='azul';
 if(modo==='123_A'){let tabA=ultimo123A!==null?TAB[ultimo123A]:'-';document.getElementById('leftA').innerHTML='A: '+ (ultimo123A||'-')+' > <span>'+tabA+'</span> JOGAR '+tabA;document.getElementById('placarA').innerHTML='ACERTO <span>GERAL</span>';document.getElementById('leftB').textContent='B: -';document.getElementById('placarB').textContent='LINHA A';if(calcAlerta(hist123A))azulAEl.classList.add('alerta');else azulAEl.classList.add('jogarA');}
 else if(modo==='123_B'){let tabB=ultimo123B!==null?TAB[ultimo123B]:'-';document.getElementById('leftA').textContent='A: -';document.getElementById('placarA').textContent='LINHA B';document.getElementById('leftB').innerHTML='B: '+ (ultimo123B||'-')+' > <span>'+tabB+'</span> JOGAR '+tabB;document.getElementById('placarB').innerHTML='ACERTO <span>GERAL</span>';if(calcAlerta(hist123B))azulBEl.classList.add('alerta');else azulBEl.classList.add('jogarB');}
 else if(modo==='123_GERAL'){let tabA=ultimo123A!==null?TAB[ultimo123A]:'-';let tabB=ultimo123B!==null?TAB[ultimo123B]:'-';let vezA = histA.length <= histB.length;if(vezA){document.getElementById('leftA').innerHTML='A: JOGAR <span>'+tabA+'</span> ('+(ultimo123A||'-')+')';document.getElementById('leftB').innerHTML='B: AGUARDANDO';document.getElementById('placarA').innerHTML='VEZ DO <span>A</span>';document.getElementById('placarB').innerHTML='GERAL';if(calcAlerta(hist123A))azulAEl.classList.add('alerta');else azulAEl.classList.add('jogarA');}else{document.getElementById('leftA').innerHTML='A: AGUARDANDO';document.getElementById('leftB').innerHTML='B: JOGAR <span>'+tabB+'</span> ('+(ultimo123B||'-')+')';document.getElementById('placarA').innerHTML='VEZ DO <span>B</span>';document.getElementById('placarB').innerHTML='GERAL';if(calcAlerta(hist123B))azulBEl.classList.add('alerta');else azulBEl.classList.add('jogarB');}}
 else{document.getElementById('placarA').innerHTML='GERAL A';document.getElementById('placarB').innerHTML='GERAL B';let alA=calcAlerta(histA),alB=calcAlerta(histB);if(alA)azulAEl.classList.add('alerta');if(alB)azulBEl.classList.add('alerta');if(histA.length){let n=(typeof histA[0]==='object')?histA[0].num:histA[0];document.getElementById('leftA').innerHTML='A: '+n+'> <span>'+TAB[n]+'</span>';}else document.getElementById('leftA').textContent='A: -';if(histB.length){let n=(typeof histB[0]==='object')?histB[0].num:histB[0];document.getElementById('leftB').innerHTML='B: '+n+'> <span>'+TAB[n]+'</span>';}else document.getElementById('leftB').textContent='B: -';}
 let boxH=document.getElementById('boxH');boxH.innerHTML="";
 if(modo==='123_GERAL'){boxH.innerHTML='<div class="linhaH" id="lh12"><h3>1/2 🟩🟥 GERAL (A+B) - JOGAR AQUI</h3><div class="faixa" id="f12"></div></div><div class="linhaH" id="lh13"><h3>1/3 🟩🟥 GERAL (A+B) - JOGAR AQUI</h3><div class="faixa" id="f13"></div></div><div class="linhaH" id="lh23"><h3>2/3 🟩🟩 GERAL (A+B) - JOGAR AQUI</h3><div class="faixa" id="f23"></div></div>';}
 else if(modo==='123_A')boxH.innerHTML='<div class="linhaH" id="lh12"><h3>1/2 🟥🟩 SÓ LINHA A - JOGAR AQUI</h3><div class="faixa" id="f12"></div></div><div class="linhaH" id="lh13"><h3>1/3 🟥🟩 SÓ LINHA A - JOGAR AQUI</h3><div class="faixa" id="f13"></div></div><div class="linhaH" id="lh23"><h3>2/3 🟥🟩 SÓ LINHA A - JOGAR AQUI</h3><div class="faixa" id="f23"></div></div>';
 else if(modo==='123_B')boxH.innerHTML='<div class="linhaH" id="lh12"><h3>1/2 🟥🟩 SÓ LINHA B - JOGAR AQUI</h3><div class="faixa" id="f12"></div></div><div class="linhaH" id="lh13"><h3>1/3 🟥🟩 SÓ LINHA B - JOGAR AQUI</h3><div class="faixa" id="f13"></div></div><div class="linhaH" id="lh23"><h3>2/3 🟥🟩 SÓ LINHA B - JOGAR AQUI</h3><div class="faixa" id="f23"></div></div>';
 let f12=document.getElementById('f12'),f13=document.getElementById('f13'),f23=document.getElementById('f23');let lh12=document.getElementById('lh12'),lh13=document.getElementById('lh13'),lh23=document.getElementById('lh23');
 if(f12){
   f12.innerHTML="";f13.innerHTML="";f23.innerHTML="";
   let todos=[...hist123Geral];
   todos.forEach(h=>{
     let q=document.createElement('div');
     q.className='q '+(h.ok?'C':'E');
     q.textContent=h.curr;
     if(h.tab==='1/2') f12.appendChild(q);
     if(h.tab==='1/3') f13.appendChild(q);
     if(h.tab==='2/3') f23.appendChild(q);
   });
   if(lh12){lh12.classList.remove('piscaAzul','piscaAmarelo');lh13.classList.remove('piscaAzul','piscaAmarelo');lh23.classList.remove('piscaAzul','piscaAmarelo');let tabA=ultimo123A!==null?TAB[ultimo123A]:null;let tabB=ultimo123B!==null?TAB[ultimo123B]:null;let vezA=histA.length <= histB.length;if(modo==='123_A' && tabA){if(tabA==='1/2')lh12.classList.add('piscaAmarelo');if(tabA==='1/3')lh13.classList.add('piscaAmarelo');if(tabA==='2/3')lh23.classList.add('piscaAmarelo');}else if(modo==='123_B' && tabB){if(tabB==='1/2')lh12.classList.add('piscaAzul');if(tabB==='1/3')lh13.classList.add('piscaAzul');if(tabB==='2/3')lh23.classList.add('piscaAzul');}else if(modo==='123_GERAL'){if(vezA && tabA){if(tabA==='1/2')lh12.classList.add('piscaAmarelo');if(tabA==='1/3')lh13.classList.add('piscaAmarelo');if(tabA==='2/3')lh23.classList.add('piscaAmarelo');}else if(!vezA && tabB){if(tabB==='1/2')lh12.classList.add('piscaAzul');if(tabB==='1/3')lh13.classList.add('piscaAzul');if(tabB==='2/3')lh23.classList.add('piscaAzul');}}}}
 atualiza();
}render();
function corr(){
  if(modo==='123_GERAL' && hist123Geral.length){
    let r=hist123Geral.shift();
    hist123A=hist123A.filter(x=>!(x.curr===r.curr && x.tab===r.tab && x.prev===r.prev));
    hist123B=hist123B.filter(x=>!(x.curr===r.curr && x.tab===r.tab && x.prev===r.prev));
    if(r.linha==='A'){ if(r.isPrimeiro) ultimo123A=null; else ultimo123A=r.prev; } else { if(r.isPrimeiro) ultimo123B=null; else ultimo123B=r.prev; }
    localStorage.setItem('hist123A',JSON.stringify(hist123A)); localStorage.setItem('hist123B',JSON.stringify(hist123B)); localStorage.setItem('hist123Geral',JSON.stringify(hist123Geral)); localStorage.setItem('ultimo123A',ultimo123A); localStorage.setItem('ultimo123B',ultimo123B); render(); return;
  }
  if(histA.length>histB.length){let r=histA.shift();let num=(typeof r==='object')?r.num:r;countsA[num]=Math.max(0,(countsA[num]||0)-1);}else if(histB.length){let r=histB.shift();let num=(typeof r==='object')?r.num:r;countsB[num]=Math.max(0,(countsB[num]||0)-1);}else if(histA.length){let r=histA.shift();let num=(typeof r==='object')?r.num:r;countsA[num]=Math.max(0,(countsA[num]||0)-1);}localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));localStorage.setItem('cntA',JSON.stringify(countsA));localStorage.setItem('cntB',JSON.stringify(countsB));render();
}
function goNum(num){
  let vaiA = histA.length <= histB.length;
  let tabNum = TAB[num];
  if(vaiA){
    if(ultimo123A===null){
      let entry={prev:null, tab:tabNum, curr:num, ok:true, linha:'A', isPrimeiro:true};
      hist123A.unshift(entry); hist123Geral.unshift(entry); ultimo123A=num;
    }else{
      let tab=TAB[ultimo123A];
      let ok=true;
      if(tab!=="ZERO"){ ok=tab.split('/').map(Number).includes(COL[num]); }
      let entry={prev:ultimo123A, tab:tab, curr:num, ok:ok, linha:'A', isPrimeiro:false};
      hist123A.unshift(entry); hist123Geral.unshift(entry);
      ultimo123A=num;
    }
  }else{
    if(ultimo123B===null){
      let entry={prev:null, tab:tabNum, curr:num, ok:true, linha:'B', isPrimeiro:true};
      hist123B.unshift(entry); hist123Geral.unshift(entry); ultimo123B=num;
    }else{
      let tab=TAB[ultimo123B];
      let ok=true;
      if(tab!=="ZERO"){ ok=tab.split('/').map(Number).includes(COL[num]); }
      let entry={prev:ultimo123B, tab:tab, curr:num, ok:ok, linha:'B', isPrimeiro:false};
      hist123B.unshift(entry); hist123Geral.unshift(entry);
      ultimo123B=num;
    }
  }
  localStorage.setItem('hist123A',JSON.stringify(hist123A));localStorage.setItem('hist123B',JSON.stringify(hist123B));localStorage.setItem('hist123Geral',JSON.stringify(hist123Geral));localStorage.setItem('ultimo123A',ultimo123A);localStorage.setItem('ultimo123B',ultimo123B);
  let okA=true,okB=true;if(histA.length){let alvo=TAB[(typeof histA[0]==='object')?histA[0].num:histA[0]].split('/').map(Number);if(num!==0)okA=alvo.includes(COL[num]);}if(histB.length){let alvo=TAB[(typeof histB[0]==='object')?histB[0].num:histB[0]].split('/').map(Number);if(num!==0)okB=alvo.includes(COL[num]);}
  if(vaiA){histA.unshift({num:num,ok:okA});countsA[num]=(countsA[num]||0)+1;}else{histB.unshift({num:num,ok:okB});countsB[num]=(countsB[num]||0)+1;}
  localStorage.setItem('histA',JSON.stringify(histA));localStorage.setItem('histB',JSON.stringify(histB));localStorage.setItem('cntA',JSON.stringify(countsA));localStorage.setItem('cntB',JSON.stringify(countsB));render();
}
function pick(n){goNum(n);}
async function lerFoto(input){
  let file=input.files[0];if(!file) return;
  let box=document.getElementById('placarFoto');box.style.display='block';box.textContent='📷 LENDO FOTO... AGUARDE 5s (pode demorar)';
  try{
    let result = await Tesseract.recognize(file, 'eng');
    let text = result.data.text;
    let nums = text.match(/\b([0-9]|[12][0-9]|3[0-6])\b/g);
    if(!nums){ box.textContent='❌ NÃO ACHOU NÚMEROS, TIRA PRINT MAIS NÍTIDO'; return; }
    let list = nums.map(n=>parseInt(n)).filter(n=>n>=0&&n<=36);
    if(list.length>200) list=list.slice(0,200);
    let ordemAntiga = list.slice().reverse();
    let stats={"1/2":{g:0,r:0},"1/3":{g:0,r:0},"2/3":{g:0,r:0}};
    let alerta2={"1/2":{g:0,r:0},"1/3":{g:0,r:0},"2/3":{g:0,r:0}};
    let lastOk={"1/2":[],"1/3":[],"2/3":[]};
    for(let i=0;i<ordemAntiga.length-1;i++){
      let prev=ordemAntiga[i];let curr=ordemAntiga[i+1];
      if(prev==0||curr==0) continue;
      let tab=TAB[prev];let ok=tab.split('/').map(Number).includes(COL[curr]);
      if(ok) stats[tab].g++; else stats[tab].r++;
      let arr=lastOk[tab];
      if(arr.length>=2 && !arr[arr.length-1] && !arr[arr.length-2]){
        if(ok) alerta2[tab].g++; else alerta2[tab].r++;
      }
      arr.push(ok);
    }
    if(confirm('Achou '+list.length+' números! Jogar no app? Vai limpar histórico.')){
      localStorage.clear();histA=[];histB=[];hist123A=[];hist123B=[];hist123Geral=[];countsA={};countsB={};ultimo123A=null;ultimo123B=null;
      ordemAntiga.forEach(n=>{ goNum(n); });
      modoIdx=1;modo=MODOS[1];localStorage.setItem('modoIdx',modoIdx);
    }
    box.textContent=`📸 FOTO LIDA: ${list.length} NÚMEROS
A 1/2 🟩 [${stats["1/2"].g}] 🟥 [${stats["1/2"].r}]
B 1/3 🟩 [${stats["1/3"].g}] 🟥 [${stats["1/3"].r}]
C 2/3 🟩 [${stats["2/3"].g}] 🟥 [${stats["2/3"].r}]
