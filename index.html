<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d2818;display:flex;justify-content:center;font-family:Arial}
.app{width:100%;max-width:420px;min-height:100dvh;background:#0d2818;border:2px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:10px;text-align:center}
.topo h1{color:#000;font-size:20px;font-weight:900}
.topo span{font-size:11px;color:#4a3410;font-weight:800;display:block}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:#0f2e1f}
.slot{height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;border:2px dashed #d4af37;color:#d4af37}
.slot.yellow{background:#d4af37;color:#000;border-style:solid}
.slot.green{background:#16a34a;color:#fff;border-style:solid}
.slot.red{background:#dc2626;color:#fff;border-style:solid}
.slot.next{border:3px solid #fff;background:rgba(255,255,255,0.15)}
.historyBox{flex:1;background:#0a2a1a;margin:10px;border:3px solid #3b82f6;border-radius:14px;padding:10px;min-height:300px;max-height:500px;overflow-y:auto}
.hist-title{color:#d4af37;font-size:11px;font-weight:900;text-align:center;margin-bottom:8px}
.hist-grid{display:flex;flex-direction:column;gap:6px}
.hist-item{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px;background:#123524;border-radius:8px}
.hist-item .h{display:flex;align-items:center;gap:6px;padding:4px;border-radius:6px;font-weight:900;font-size:12px}
.h.yellow{background:#d4af37;color:#000}
.h.green{background:#16a34a;color:#fff}
.h.red{background:#dc2626;color:#fff}
.h .num{font-size:13px}
.page-info{color:#888;font-size:10px;text-align:center;margin-top:6px}
.bottom{padding:10px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{height:58px;border-radius:14px;border:none;font-weight:900;font-size:20px}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:11px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP</h1><span>AUTO - 2 QUADRADOS + HISTORICO 15</span><span id="nextInfo">DIGITE 1º AMARELO</span></div>
<div class="top2">
<div class="slot" id="slotY">VAZIO</div>
<div class="slot" id="slotR">VAZIO</div>
</div>
<div class="historyBox">
<div class="hist-title">HISTORICO - 15 POR VEZ DESCENDO</div>
<div class="hist-grid" id="histGrid"></div>
<div class="page-info" id="pageInfo"></div>
</div>
<div class="bottom">
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
</div>
<script>
let history=[],cur='',allPlays=[];
const gC23=[6,9,11,14,16,17,19,21,26,29,33,36];
const gC13=[2,3,5,8,10,13,20,25,28,31,32,35];
const gC12=[1,4,7,12,15,18,22,23,24,27,30,34];
function getAlvo(n){if(gC23.includes(n))return "C2/3";if(gC13.includes(n))return "C1/3";if(gC12.includes(n))return "C1/2";return "";}
function getColunaReal(n){if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n))return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n))return 2;if([3,6,9,12,15,18,21,24,27,30,33,36].includes(n))return 3;return 0;}
function getColunasDoAlvo(a){if(a=="C1/3")return [1,3];if(a=="C2/3")return [2,3];if(a=="C1/2")return [1,2];return [];}
const slotY=document.getElementById('slotY');
const slotR=document.getElementById('slotR');
const histGrid=document.getElementById('histGrid');
const nextInfo=document.getElementById('nextInfo');
const pageInfo=document.getElementById('pageInfo');

function render(preview){
if(!preview) preview=null;
let isYellowNext = history.length%2===0;

// TOP 2 QUADRADOS
if(history.length===0 && !preview){
slotY.className='slot next'; slotY.textContent='AMARELO';
slotR.className='slot'; slotR.textContent='RESULTADO';
}else if(preview){
if(isYellowNext){
slotY.className='slot yellow'; slotY.textContent=preview.num+' '+preview.alvo;
slotR.className='slot next'; slotR.textContent='?';
}else{
let header=history[history.length-1];
slotY.className='slot yellow'; slotY.textContent=header.num+' '+header.alvo;
let cr=getColunaReal(preview.num);
let ca=getColunasDoAlvo(header.alvo);
let cls=ca.includes(cr)?'green':'red';
slotR.className='slot '+cls; slotR.textContent=preview.num;
}
}else{
if(history.length>=1){
let lastY = history.length%2===1 ? history[history.length-1] : history[history.length-2];
slotY.className='slot yellow'; slotY.textContent=lastY.num+' '+lastY.alvo;
}
if(history.length>=2){
let lastR = history[history.length-1];
let header = history[history.length-2];
let cr=getColunaReal(lastR.num);
let ca=getColunasDoAlvo(header.alvo);
let cls=ca.includes(cr)?'green':'red';
slotR.className='slot '+cls; slotR.textContent=lastR.num;
}else if(history.length==1){
slotR.className='slot next'; slotR.textContent='RESULTADO';
}
}

if(history.length==0) nextInfo.textContent="DIGITE 1º AMARELO (ex: 1)";
else if(isYellowNext) nextInfo.textContent="PROXIMO: RESULTADO VERDE/VERMELHO - AUTO AMARELO";
else nextInfo.textContent="DIGITE RESULTADO + ENTER";

// HISTORICO 15 EM 15 DESCENDO COM COR
histGrid.innerHTML='';
let total = allPlays.length;
for(let i=total-1; i>=0; i--){
let p=allPlays[i];
let div=document.createElement('div');
div.className='hist-item';
let hY = '<div class="h yellow"><span class="num">'+p.y.num+' '+p.y.alvo+'</span></div>';
let cls = p.win ? 'green' : 'red';
let hR = '<div class="h '+cls+'"><span class="num">'+p.r.num+'</span> '+(p.win?'✓':'✗')+'</div>';
div.innerHTML=hY+hR;
histGrid.appendChild(div);
}
pageInfo.textContent = total==0 ? "Nenhum jogo ainda" : total+" jogos - "+Math.ceil(total/15)+" páginas de 15";
}

function addN(n){
if(cur==="0" && n===0){cur="00";let a=getAlvo(0);render({num:"00",alvo:""});return;}
if(cur==="00"){cur=n.toString();let v=parseInt(cur);render({num:v,alvo:getAlvo(v)});return;}
if(cur.length>=2)return;
cur+=n.toString();
if(cur==="00"){render({num:"00",alvo:""});return;}
let v=parseInt(cur);
render({num:v,alvo:getAlvo(v)});
}

function enterN(){
if(cur==='')return;
if(cur==="00"){history=[];allPlays=[];cur='';render();return;}
let v=parseInt(cur);
if(v>36){cur='';render();return;}
if(v===0){history=[];allPlays=[];cur='';render();return;}
let alvo=getAlvo(v);

// AMARELO
if(history.length%2===0){
history.push({num:v, alvo:alvo});
}else{
// VERDE/VERMELHO - RESULTADO
history.push({num:v, alvo:""});
let y = history[history.length-2];
let r = history[history.length-1];
let cr=getColunaReal(r.num);
let ca=getColunasDoAlvo(y.alvo);
let win=ca.includes(cr);
allPlays.push({y:y, r:r, win:win});
// AUTO CRIA PROXIMO AMARELO COM MESMO NUMERO DO RESULTADO
let autoAlvo=getAlvo(v);
history.push({num:v, alvo:autoAlvo});
}
cur='';render();
}

function corrige(){
if(cur!=''){cur=cur.slice(0,-1);if(cur==''){render();}else{let v=parseInt(cur);render({num:v,alvo:getAlvo(v)});}}
else if(history.length>0){
let wasAuto = history.length>=3 && history[history.length-1].num===history[history.length-2].num && history.length%2===1;
history.pop();
if(wasAuto && allPlays.length>0){
allPlays.pop();
if(history.length>0) history.pop();
}
render();
}
}
render();
</script>
</body>
</html>
