<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAFIGASP</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black}body{background:#0a2e1e;height:100dvh;display:flex;flex-direction:column}.topo{background:#ffcc00;text-align:center;padding:6px;font-size:13px}
/* VERDE - NUMEROS CHAMADOS */
.verde{margin:4px;background:#0a5a2e;border:2px solid #00ff00;border-radius:8px;padding:6px;display:flex;gap:4px;align-items:center;min-height:58px;overflow-x:auto}.zero{width:90px;height:46px;background:#ffcc00;border-radius:6px;color:#000;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;flex-shrink:0}.zero .cnt{position:absolute;right:4px;top:2px;background:#000;color:#ffcc00;font-size:8px;padding:1px 4px;border-radius:8px}.historico{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto}.hist{width:34px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}.C{background:#00a000}.E{background:#c00000}
/* VERMELHO - ROLETA */
.vermelho{flex:1;margin:4px;background:#0a3d1f;border:2px solid #ff0000;border-radius:8px;padding:6px;display:flex;flex-direction:column;overflow:hidden}.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(12,1fr);gap:3px}.cell{border:1.5px solid #d4af37;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;position:relative;cursor:pointer}.cell.red{background:#b50000}.cell.black{background:#111}.cell.marcado{background:#ffea00!important;color:#000!important}.cell .badge{position:absolute;top:-4px;right:-4px;background:#000;color:#ffcc00;font-size:7px;padding:1px 3px;border-radius:8px}.doisparaum{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:4px}.doisparaum div{background:#0a5a2e;border:1px solid #d4af37;color:#d4d46a;text-align:center;padding:5px 0;font-size:10px;border-radius:3px}
/* AZUL - ALERTA + PLACAR */
.azul{margin:4px;background:#001a8a;border:2px solid #00aaff;border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:13px}.azul span{color:#ffcc00}.btns{display:flex;gap:4px;padding:4px}.btns button{flex:1;padding:12px;border:0;border-radius:6px;font-weight:900;background:#ffcc00}</style></head><body>
<div class="topo"><b>RAFIGASP COACH DA ROLETA</b></div>

<!-- VERDE -->
<div class="verde"><div class="zero" id="zeroBox" onclick="pick(0)"><span>0</span><span class="cnt" id="cnt0"></span></div><div class="historico" id="lista"></div></div>

<!-- VERMELHO -->
<div class="vermelho"><div class="grid" id="grid"></div><div class="doisparaum"><div>1st 12</div><div>2nd 12</div><div>3rd 12</div></div></div>

<!-- AZUL -->
<div class="azul"><div id="left">-</div><div id="placar">ACERTO 0 X 0 ERRO</div></div>
<div class="btns"><button onclick="corr()">CORRIGIR</button><button onclick="if(confirm('Limpar tudo?')){localStorage.clear();location.reload()}">LIMPAR</button></div>

<script>
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};const TAB={0:"ZERO",1:"2/3",2:"1/3",3:"1/2",4:"2/3",5:"1/3",6:"1/2",7:"2/3",8:"1/3",9:"1/2",10:"2/3",11:"1/3",12:"1/2",13:"2/3",14:"1/3",15:"1/2",16:"2/3",17:"1/3",18:"1/2",19:"2/3",20:"1/3",21:"1/2",22:"2/3",23:"1/3",24:"1/2",25:"2/3",26:"1/3",27:"1/2",28:"2/3",29:"1/3",30:"1/2",31:"2/3",32:"1/3",33:"1/2",34:"2/3",35:"1/3",36:"1/2"};
let order=[];for(let i=1;i<=36;i++)order.push(i);
let counts=JSON.parse(localStorage.getItem('cnt36')||'{}');let grid=document.getElementById('grid');
order.forEach(n=>{let d=document.createElement('div');d.className='cell '+(REDS.includes(n)?'red':'black');d.id='c'+n;d.onclick=()=>pick(n);d.innerHTML='<span>'+n+'</span><span class="badge" id="cnt'+n+'"></span>';grid.appendChild(d);});
function atualiza(){for(let i=0;i<=36;i++){let c=counts[i]||0;let el=document.getElementById('cnt'+i);let b=document.getElementById('c'+i);if(el)el.textContent=c>0?c+'x':'';if(b){if(c>0)b.classList.add('marcado');else b.classList.remove('marcado');}}let c0=counts[0]||0;let e0=document.getElementById('cnt0');let z=document.getElementById('zeroBox');if(e0)e0.textContent=c0>0?c0+'x':'';}
atualiza();
let geral=JSON.parse(localStorage.getItem('g')||'[]');
function render(){let l=document.getElementById('lista');l.innerHTML="";let a=0,e=0;geral.forEach(it=>it.ok?a++:e++);document.getElementById('placar').innerHTML='ACERTO <span>'+a+' X '+e+'</span> ERRO';geral.forEach((it,i)=>{let div=document.createElement('div');div.className='hist '+(it.ok?'C':'E');div.textContent=it.num;if(i===0)div.style.border='2px solid #ffcc00';l.appendChild(div);});}
render();if(geral.length)document.getElementById('left').innerHTML=geral[0].num+'> <span>'+TAB[geral[0].num]+'</span>';
function corr(){if(geral.length){let r=geral.shift();if(counts[r.num])counts[r.num]=Math.max(0,counts[r.num]-1);localStorage.setItem('g',JSON.stringify(geral));localStorage.setItem('cnt36',JSON.stringify(counts));render();atualiza();if(geral.length)document.getElementById('left').innerHTML=geral[0].num+'> <span>'+TAB[geral[0].num]+'</span>';else document.getElementById('left').innerText="-";}}
function goNum(num){let ok=true;if(geral.length){let alvo=TAB[geral[0].num].split('/').map(Number);if(num===0)ok=true;else ok=alvo.includes(COL[num]);}geral.unshift({num:num,ok:ok});counts[num]=(counts[num]||0)+1;localStorage.setItem('g',JSON.stringify(geral));localStorage.setItem('cnt36',JSON.stringify(counts));document.getElementById('left').innerHTML=num+'> <span>'+TAB[num]+'</span>';render();atualiza();}
function pick(n){goNum(n);}
</script></body></html>
