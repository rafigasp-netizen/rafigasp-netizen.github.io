<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RAFIGASP - COLUNAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d2818;display:flex;justify-content:center;font-family:Arial,sans-serif}
.app{width:100%;max-width:420px;min-height:100vh;background:#0d2818;border:2px solid #d4af37;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.blacks{display:flex;gap:12px;padding:12px;background:#0a1f12}
.bbox{flex:1;background:#000;border:1.5px solid #d4af37;border-radius:14px;height:56px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px}
.history{background:#123524;padding:12px}
.hist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hslot{height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px}
.hslot.empty{border:1.8px dashed #d4af37;opacity:0.3}
.hslot.yellow{background:#d4af37;color:#000}
.hslot.green{background:#16a34a;color:#fff;border:1.5px solid #fff;box-shadow:0 0 8px #16a34a}
.hslot.red{background:#dc2626;color:#fff;border:1.5px solid #fff;box-shadow:0 0 8px #dc2626}
.keypad{padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;align-content:start}
.k{height:92px;border-radius:18px;border:none;font-weight:900;font-size:32px;cursor:pointer}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;box-shadow:0 5px 0 #7a5d18}
.k.zero{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 5px 0 #7f1d1d}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#4a3410;font-size:17px;box-shadow:0 5px 0 #7a5d18}
.k:active{transform:translateY(4px);box-shadow:none}
</style>
</head>
<body>
<div class="app">
<div class="blacks"><div class="bbox" id="boxUlt">-</div><div class="bbox" id="boxCol">COLUNA</div></div>
<div class="history"><div class="hist-grid" id="grid"></div></div>
<div class="keypad">
<button class="k num" onclick="addN(1)">1</button><button class="k num" onclick="addN(2)">2</button><button class="k num" onclick="addN(3)">3</button>
<button class="k num" onclick="addN(4)">4</button><button class="k num" onclick="addN(5)">5</button><button class="k num" onclick="addN(6)">6</button>
<button class="k num" onclick="addN(7)">7</button><button class="k num" onclick="addN(8)">8</button><button class="k num" onclick="addN(9)">9</button>
<button class="k act" onclick="enterN()">ENTER</button><button class="k zero" onclick="addN(0)">0</button><button class="k act" onclick="corrige()">CORRIGIR</button>
</div>
</div>
<script>
let history=[]; let cur='';
const grid=document.getElementById('grid');
const boxUlt=document.getElementById('boxUlt');
const boxCol=document.getElementById('boxCol');

// SUA REGRA DE ESTRATÉGIA
const paraColuna1 = [6,9,11,14,16,17,19,21,26,29,33,36];
const paraColuna2 = [2,3,5,8,10,13,20,25,28,31,32,35];
const paraColuna3 = [1,4,7,12,15,18,22,23,24,27,30,34];

function getAlvo(n){
if(paraColuna1.includes(n)) return 1;
if(paraColuna2.includes(n)) return 2;
if(paraColuna3.includes(n)) return 3;
return 0;
}
// Coluna REAL da roleta para conferir acerto
function getColReal(n){
if(n==0) return 0;
if([1,4,7,10,13,16,19,22,25,28,31,34].includes(n)) return 1;
if([2,5,8,11,14,17,20,23,26,29,32,35].includes(n)) return 2;
return 3;
}

function render(){
grid.innerHTML='';
for(let i=0;i<12;i++){
let d=document.createElement('div');
if(i<history.length){
let h=history[i];
if(h.result==='win') d.className='hslot green';
else if(h.result==='lose') d.className='hslot red';
else d.className='hslot yellow';
d.textContent=h.num;
}else{d.className='hslot empty';}
grid.appendChild(d);
}
}
function addN(n){
if(cur.length>=2) return;
cur+=n; boxUlt.textContent=cur;
let v=parseInt(cur);
if(!isNaN(v)){
let alvo=getAlvo(v);
if(alvo>0) boxCol.textContent='COLUNA '+alvo;
else boxCol.textContent=v==0?'ZERO':'COLUNA';
}
}
function enterN(){
if(cur==='') return;
let v=parseInt(cur); if(v>36) return;
if(v===0){history=[]; cur=''; boxUlt.textContent='-'; boxCol.textContent='COLUNA'; render(); return;}

let idx = history.length;
let colReal = getColReal(v);
let alvoAtual = getAlvo(v);
let res;

if(idx % 4 === 0){
// Primeira coluna = SEMPRE AMARELO
res='pending';
} else {
// Área C = verifica se a coluna REAL é igual ao ALVO do número anterior
if(history.length>0){
let alvoAnterior = history[history.length-1].alvo;
res = (colReal === alvoAnterior)? 'win':'lose';
} else res='pending';
}

history.push({num:v, colReal:colReal, alvo:alvoAtual, result:res});
if(history.length>12) history.shift();
cur=''; boxUlt.textContent=v;
boxCol.textContent= alvoAtual>0? 'COLUNA '+alvoAtual : 'ZERO';
render();
}
function corrige(){
if(cur!==''){cur=cur.slice(0,-1); boxUlt.textContent=cur|| (history.length?history[history.length-1].num:'-');}
else{history.pop(); if(history.length>0){boxUlt.textContent=history[history.length-1].num; boxCol.textContent='COLUNA '+history[history.length-1].alvo;}else{boxUlt.textContent='-'; boxCol.textContent='COLUNA';} render();}
}
render();
</script>
</body>
</html>
