<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0d2818}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:3px solid #d4af37;display:flex;flex-direction:column}
.topo{background:#d4af37;padding:6px;text-align:center;color:#000;font-weight:900;font-size:13px}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.s{height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px dashed #d4af37;color:#d4af37;background:#0a2a1a;font-size:16px}
.s.y{background:#d4af37;color:#000;border-style:solid}
.s.g{background:#16a34a;color:#fff;border-color:#16a34a;border-style:solid}
.s.r{background:#dc2626;color:#fff;border-color:#dc2626;border-style:solid}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 6px 6px 6px}
.t{height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px}
.t.b{background:#000;color:#fff}.t.w{background:#fff;color:#000}
.box{background:#0a2a1a;margin:0 6px;border:1px solid #1e4d8a;border-radius:8px;min-height:90px;display:flex;gap:6px;padding:6px}
.cb{flex:1;background:#0f2e1f;border-radius:6px;padding:4px}
.head{color:#d4af37;font-weight:900;text-align:center;font-size:14px;margin-bottom:4px}
.sq{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:4px}
.q{height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff}
.q.e{background:#1a3d2a;border:1px dashed #2a5a3a}.q.g{background:#16a34a}.q.r{background:#dc2626}
.hist{margin:6px 6px 0 6px;background:#0a1f14;border:1px solid #1e4d2b;border-radius:6px;padding:6px;display:flex;gap:4px;align-items:center;min-height:36px}
.hist2{margin:0 6px 6px 6px;background:#0a1f14;border:2px solid #d4af37;border-radius:6px;padding:6px;display:flex;gap:4px;align-items:center;min-height:36px}
.histT{font-size:9px;color:#4ade80;font-weight:900;min-width:40px}
.histT2{font-size:8px;color:#fbbf24;font-weight:900;min-width:40px}
.lg{display:flex;gap:3px;overflow-x:auto;flex:1}
.ln{min-width:26px;height:22px;border-radius:4px;background:#1e3a2a;color:#a7f3d0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:1px solid #2a5a3a;flex-shrink:0}
.ln.g{background:#16a34a;color:#fff}.ln.r{background:#dc2626;color:#fff}.ln.d{background:#14532d;color:#86efac;border-color:#166534}
.ln2{min-width:28px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0;border:1px solid}
.ln2.d{background:#14532d;color:#fff;border-color:#22c55e}
.ln2.g{background:#16a34a;color:#fff;border-color:#16a34a}.ln2.r{background:#dc2626;color:#fff;border-color:#dc2626}
.kb{flex:1;display:flex;flex-direction:column;gap:7px;padding:6px}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.k{width:100%;height:100%;border-radius:14px;border:none;font-weight:900;font-size:22px;background:linear-gradient(#e8c86a,#b8941f);color:#3a2a0a}
.k:active{transform:scale(0.96)}
.k.z{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="topo">RAFIGASP COACH DA ROLETA</div>
<div class="top2"><div class="s" id="sy">VAZIO</div><div class="s" id="sr">VAZIO</div></div>
<div class="tabs"><div class="t b">COLUNA</div><div class="t w">DUZIA</div></div>
<div class="box"><div class="cb" id="ca"></div><div class="cb" id="da"></div></div>
<div class="hist"><div class="histT">HIST:</div><div class="lg" id="lg"></div></div>
<div class="hist2"><div class="histT2">2º HIST:</div><div class="lg" id="lg2"></div></div>
<div class="kb">
<div class="kr"><button class="k" onclick="A('1')">1</button><button class="k" onclick="A('2')">2</button><button class="k" onclick="A('3')">3</button></div>
<div class="kr"><button class="k" onclick="A('4')">4</button><button class="k" onclick="A('5')">5</button><button class="k" onclick="A('6')">6</button></div>
<div class="kr"><button class="k" onclick="A('7')">7</button><button class="k" onclick="A('8')">8</button><button class="k" onclick="A('9')">9</button></div>
<div class="kr"><button class="k" onclick="E()" style="font-size:13px">ENTER</button><button class="k z" onclick="A('0')">0</button><button class="k" onclick="C()" style="font-size:13px">CORRIGIR</button></div>
</div>
</div>
<script>
var cur='',cs=null,ar=[],wait=1,log=[],secLog=[];
var tb={
1:"C2/3",2:"C1/2",3:"C1/2",4:"C1/2",5:"C2/3",6:"C1/2",7:"C2/3",8:"C1/2",9:"C2/3",10:"C2/3",
11:"C1/3",12:"C2/3",13:"C1/3",14:"C2/3",15:"C1/3",16:"C1/3",17:"C1/3",18:"C2/3",19:"C1/2",20:"C1/2",
21:"C2/3",22:"C1/2",23:"C1/2",24:"C2/3",25:"C1/3",26:"C2/3",27:"C1/3",28:"C2/3",29:"C1/3",30:"C2/3",
31:"C1/3",32:"C1/2",33:"C2/3",34:"C1/2",35:"C2/3",36:"C1/2"
};
function gv(n){return tb[n]||""}
function gc(n){if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0)return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0)return 2;return 3}
function gd(n){if(n<=12)return 1;if(n<=24)return 2;return 3}
function ga(a){var t=a.replace('C','');return t.split('/').map(function(x){return +x})}
function R(p){
var sy=document.getElementById('sy'),sr=document.getElementById('sr'),ca=document.getElementById('ca'),da=document.getElementById('da'),lg=document.getElementById('lg'),lg2=document.getElementById('lg2');
if(p){sy.className='s y';sy.textContent=p.n+' '+p.a;if(wait===1){sr.className='s y';sr.textContent=p.a;}else{var cw=ga(cs.a).indexOf(gc(p.n))>=0;sr.className='s '+(cw?'g':'r');sr.textContent=cs.a;}}
else{sy.className='s';sy.textContent='VAZIO';if(!cs){sr.className='s';sr.textContent='VAZIO';}else{sr.className='s y';sr.textContent=cs.a;if(ar.length){var l=ar[ar.length-1];sr.className='s '+l.cc;sr.textContent=cs.a;}}}
ca.innerHTML='';da.innerHTML='';
if(!cs){ca.innerHTML='<div style="color:#2a5a3a;text-align:center;margin-top:20px">VAZIO</div>';da.innerHTML='<div style="color:#2a5a3a;text-align:center;margin-top:20px">VAZIO</div>';}
else{var h='<div class="head">'+cs.a+'</div>';var s1='<div class="sq">';for(var i=0;i<5;i++){s1+=ar[i]?'<div class="q '+ar[i].cc+'">'+ar[i].n+'</div>':'<div class="q e"></div>';}s1+='</div>';var s2='<div class="sq">';for(var i=0;i<5;i++){s2+=ar[i]?'<div class="q '+ar[i].dc+'">'+ar[i].n+'</div>':'<div class="q e"></div>';}s2+='</div>';ca.innerHTML=h+s1;da.innerHTML=h+s2;}
lg.innerHTML='';for(var j=0;j<log.length;j++){var l=log[j];var d=document.createElement('div');d.className='ln '+(l.w===true?'g':l.w===false?'r':'d');d.textContent=l.n;lg.appendChild(d);}
lg2.innerHTML='';for(var j=0;j<secLog.length;j++){var l=secLog[j];var d=document.createElement('div');d.className='ln2 '+(l.w===true?'g':l.w===false?'r':'d');d.textContent=l.n;lg2.appendChild(d);}
}
function A(d){if(cur.length>=2)return;cur+=d;var v=+cur;if(v>36){cur=d;v=+cur}if(cur==="0"){R({n:"0",a:""});return}R({n:v,a:gv(v)})}
function E(){
if(cur==='')return;
if(cur==="0"){cs=null;ar=[];log=[];secLog=[];wait=1;cur='';R();return}
var v=+cur;if(v<1||v>36){cur='';R();return}
var col=gv(v);
if(wait){
cs={n:v,a:col};ar=[];wait=0;
log.push({n:v,w:null});
// 2º HIST: GATILHO = VERDE ESCURO
secLog.push({n:v,w:null});
}else{
var ca=ga(cs.a);var cr=gc(v);var dr=gd(v);var cw=ca.indexOf(cr)>=0;var dw=ca.indexOf(dr)>=0;
ar.push({n:v,cc:cw?'g':'r',dc:dw?'g':'r'});
log.push({n:v,w:cw});
if(cw){
// ACERTOU: NO 2º HIST = VERDE CLARO
secLog.push({n:v,w:true});
cs=null;ar=[];wait=1;
}else if(ar.length>=5){
// ERROU 5 VEZES: NO 2º HIST = VERMELHO
secLog.push({n:v,w:false});
cs=null;ar=[];wait=1;
}
}
cur='';R();
}
function C(){if(cur!==''){cur=cur.slice(0,-1);if(cur==='')R();else R({n:+cur,a:gv(+cur)});return}if(ar.length)ar.pop();if(log.length)log.shift();R();}
R();
</script>
</body>
</html>
