<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0d2818;overflow:hidden}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:3px solid #d4af37;display:flex;flex-direction:column}
.topo{background:#d4af37;padding:5px;text-align:center;color:#000;font-weight:900;font-size:13px}
.top3{display:grid;grid-template-columns:1fr 1fr 115px;gap:5px;padding:4px;background:#0a2a1a;border:1px solid #d4af37;border-radius:8px;margin:4px}
.top3.b3{border:2px solid #3b82f6}
.s{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:#d4af37;color:#000;border:1px solid #000}
.s.d{border:2px dashed #d4af37;color:#d4af37;background:#0a2a1a}
.corBox{display:flex;gap:3px;align-items:center;justify-content:flex-start;min-height:34px}
.cb{width:30px;height:26px;border-radius:6px;flex-shrink:0;border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff}
.cb.g{background:#16a34a;border-color:#22c55e}
.cb.r{background:#dc2626;border-color:#fca5a5}
.hist{margin:0 4px;background:#0a1f14;border:1px solid #1e4d2b;border-radius:6px;padding:4px;display:flex;gap:4px;align-items:center;min-height:36px;overflow:hidden}
.hist2{margin:4px;background:#0a1f14;border:1px solid #d4af37;border-radius:6px;padding:4px;display:flex;gap:4px;align-items:center;min-height:36px;overflow:hidden}
.histT{font-size:9px;color:#4ade80;font-weight:900;min-width:38px}
.lg{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.lg::-webkit-scrollbar{display:none}
.ln{min-width:32px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;border:1px solid}
.ln.g{background:#16a34a;color:#fff}.ln.r{background:#dc2626;color:#fff}.ln.d{background:#14532d;color:#86efac}
.kb{flex:1;display:flex;flex-direction:column;gap:3px;padding:4px;min-height:0}
.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;min-height:0}
.k{width:100%;height:100%;border-radius:12px;border:none;font-weight:900;font-size:20px;background:linear-gradient(#e8c86a,#b8941f);color:#3a2a0a}
.k:active{transform:scale(0.96)}
.k.z{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="topo">RAFIGASP COACH DA ROLETA</div>
<div class="top3"><div class="s d" id="sy">VAZIO</div><div class="s d" id="sr">VAZIO</div><div class="corBox" id="cr1"></div></div>
<div class="hist"><div class="histT">HIST:</div><div class="lg" id="lg"></div></div>
<div class="top3"><div class="s d" id="sy2">VAZIO</div><div class="s d" id="sr2">VAZIO</div><div class="corBox" id="cr2"></div></div>
<div class="hist2"><div class="histT" style="color:#fbbf24">2º HIST:</div><div class="lg" id="lg2"></div></div>
<div class="top3 b3"><div class="s d" id="sy3">VAZIO</div><div class="s d" id="sr3">VAZIO</div><div class="corBox" id="cr3"></div></div>
<div class="hist2" style="border-color:#3b82f6"><div class="histT" style="color:#60a5fa">3º HIST:</div><div class="lg" id="lg3"></div></div>
<div class="kb">
<div class="kr"><button class="k" onclick="A('1')">1</button><button class="k" onclick="A('2')">2</button><button class="k" onclick="A('3')">3</button></div>
<div class="kr"><button class="k" onclick="A('4')">4</button><button class="k" onclick="A('5')">5</button><button class="k" onclick="A('6')">6</button></div>
<div class="kr"><button class="k" onclick="A('7')">7</button><button class="k" onclick="A('8')">8</button><button class="k" onclick="A('9')">9</button></div>
<div class="kr"><button class="k" onclick="E()" style="font-size:11px">ENTER</button><button class="k z" onclick="A('0')">0</button><button class="k" onclick="C()" style="font-size:11px">CORRIGIR</button></div>
</div>
</div>
<script>
var cur='',log=[],secLog=[],log3=[],secLast=null,thirdLast=null,firstLast=null;
var tb={1:"C2/3",2:"C1/2",3:"C1/2",4:"C1/2",5:"C2/3",6:"C1/2",7:"C2/3",8:"C1/2",9:"C2/3",10:"C2/3",11:"C1/3",12:"C2/3",13:"C1/3",14:"C2/3",15:"C1/3",16:"C1/3",17:"C1/3",18:"C2/3",19:"C1/2",20:"C1/2",21:"C2/3",22:"C1/2",23:"C1/2",24:"C2/3",25:"C1/3",26:"C2/3",27:"C1/3",28:"C2/3",29:"C1/3",30:"C2/3",31:"C1/3",32:"C1/2",33:"C2/3",34:"C1/2",35:"C2/3",36:"C1/2"};
var h1={},h2={},h3={};
function gv(n){return tb[n]||""}
function gc(n){if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0)return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0)return 2;return 3}
function ga(a){var t=a.replace('C','');return t.split('/').map(function(x){return +x})}
function isDark(num, arr){for(var i=0;i<arr.length;i++){if(arr[i].n===num) return arr[i].w===null;}return false;}
function drawCors(num, map, arr, elId){
var el=document.getElementById(elId); el.innerHTML='';
if(!isDark(num, arr)) return;
var hist=map[num]||[];
for(var i=0;i<Math.min(5,hist.length);i++){
var d=document.createElement('div');d.className='cb '+(hist[i].w?'g':'r');d.textContent=hist[i].n;el.appendChild(d);
}
}
function R(p){
var show = p ? p : thirdLast;
if(show){
var col=show.a || gv(show.n);
document.getElementById('sy').textContent=show.n+' '+col;document.getElementById('sy').className='s';
document.getElementById('sr').textContent=col;document.getElementById('sr').className='s';
document.getElementById('sy2').textContent=show.n+' '+col;document.getElementById('sy2').className='s';
document.getElementById('sr2').textContent=col;document.getElementById('sr2').className='s';
document.getElementById('sy3').textContent=show.n+' '+col;document.getElementById('sy3').className='s';
document.getElementById('sr3').textContent=col;document.getElementById('sr3').className='s';
drawCors(show.n, h1, log, 'cr1');
drawCors(show.n, h2, secLog, 'cr2');
drawCors(show.n, h3, log3, 'cr3');
}else{
document.getElementById('sy').textContent='VAZIO';document.getElementById('sy').className='s d';document.getElementById('sr').textContent='VAZIO';document.getElementById('sr').className='s d';
document.getElementById('sy2').textContent='VAZIO';document.getElementById('sy2').className='s d';document.getElementById('sr2').textContent='VAZIO';document.getElementById('sr2').className='s d';
document.getElementById('sy3').textContent='VAZIO';document.getElementById('sy3').className='s d';document.getElementById('sr3').textContent='VAZIO';document.getElementById('sr3').className='s d';
document.getElementById('cr1').innerHTML='';document.getElementById('cr2').innerHTML='';document.getElementById('cr3').innerHTML='';
}
var lg=document.getElementById('lg'),lg2=document.getElementById('lg2'),lg3=document.getElementById('lg3');
lg.innerHTML='';for(var j=0;j<log.length;j++){var l=log[j];var d=document.createElement('div');d.className='ln '+(l.w===true?'g':l.w===false?'r':'d');d.textContent=l.n;lg.appendChild(d);}
lg2.innerHTML='';for(var j=0;j<secLog.length;j++){var l=secLog[j];var d=document.createElement('div');d.className='ln '+(l.w===true?'g':l.w===false?'r':'d');d.textContent=l.n;lg2.appendChild(d);}
lg3.innerHTML='';for(var j=0;j<log3.length;j++){var l=log3[j];var d=document.createElement('div');d.className='ln '+(l.w===true?'g':l.w===false?'r':'d');d.textContent=l.n;lg3.appendChild(d);}
}
function A(d){if(cur.length>=2)return;cur+=d;var v=+cur;if(v>36){cur=d;v=+cur}if(cur==="0"){R({n:"0",a:""});return}R({n:v,a:gv(v)})}
function E(){
if(cur==='')return;
if(cur==="0"){log=[];secLog=[];log3=[];firstLast=null;secLast=null;thirdLast=null;h1={};h2={};h3={};cur='';R();return}
var v=+cur;if(v<1||v>36){cur='';R();return}
var col=gv(v);
// 1º HIST - alternado igual 2º e 3º
if(log.length%2===0){firstLast={n:v,a:col};log.unshift({n:v,w:null});}
else{
var cw=ga(firstLast.a).indexOf(gc(v))>=0;
if(!h1[firstLast.n]) h1[firstLast.n]=[];h1[firstLast.n].unshift({n:v,w:cw});
log.unshift({n:v,w:cw});
firstLast={n:v,a:col};
}
// 2º HIST
if(secLog.length%2===0){secLast={n:v,a:col};secLog.unshift({n:v,w:null});}
else{
var cw2=ga(secLast.a).indexOf(gc(v))>=0;
if(!h2[secLast.n]) h2[secLast.n]=[];h2[secLast.n].unshift({n:v,w:cw2});
secLog.unshift({n:v,w:cw2});
secLast={n:v,a:col};
}
// 3º HIST
if(log3.length%2===0){thirdLast={n:v,a:col};log3.unshift({n:v,w:null});}
else{
var cw3=ga(thirdLast.a).indexOf(gc(v))>=0;
if(!h3[thirdLast.n]) h3[thirdLast.n]=[];h3[thirdLast.n].unshift({n:v,w:cw3});
log3.unshift({n:v,w:cw3});
thirdLast={n:v,a:col};
}
cur='';R();
}
function C(){
if(cur!==''){cur=cur.slice(0,-1);if(cur==='')R();else R({n:+cur,a:gv(+cur)});return;}
if(log.length>0){
var rem=log.shift();
if(rem.w!==null && log.length>0){
var prev=log[0];
if(h1[prev.n] && h1[prev.n].length>0) h1[prev.n].shift();
}
if(log.length===0) firstLast=null;
}
if(secLog.length>0){
var rem2=secLog.shift();
if(rem2.w!==null && secLog.length>0){
var prev2=secLog[0];
if(h2[prev2.n] && h2[prev2.n].length>0) h2[prev2.n].shift();
}
if(secLog.length===0) secLast=null;
}
if(log3.length>0){
var rem3=log3.shift();
if(rem3.w!==null && log3.length>0){
var prev3=log3[0];
if(h3[prev3.n] && h3[prev3.n].length>0) h3[prev3.n].shift();
}
if(log3.length===0) thirdLast=null;
}
R();
}
R();
</script>
</body>
</html>
