<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>RAFIGASP PREMIUM - PAISAGEM</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
html,body{background:#0a0f1a;color:#fff;height:100%;overflow:hidden}
body{touch-action:pan-x pan-y}
#wrap{width:100%;height:100vh;height:100dvh;overflow:auto;-webkit-overflow-scrolling:touch}
#app{width:100%;height:100%;min-height:100%;display:flex;flex-direction:column;padding:5px;gap:5px;transform-origin:top left;will-change:transform}
.topo{display:flex;gap:6px;align-items:center;height:62px;flex-shrink:0}
.logo{font-size:14px;font-weight:900;color:#D4AF37;line-height:1.1;white-space:nowrap}
.logo small{font-size:9px;color:#888;font-weight:400;display:block}
.zoomBtn{width:40px;height:44px;background:#000;color:#D4AF37;border:2px solid #D4AF37;border-radius:8px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.zoomInfo{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:2px solid #D4AF37;color:#D4AF37;padding:6px 14px;border-radius:20px;font-size:12px;z-index:100;display:none}
.quadrado-azul{flex:1;display:flex;gap:8px;background:#111;border:2px solid #00E5FF;border-radius:12px;padding:6px 10px;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 12px rgba(0,229,255,0.3)}
.quadrado-azul .titulo{color:#D4AF37;font-size:11px;font-weight:900;white-space:nowrap;line-height:1.2;text-align:center}
.quadrado-azul .titulo span{color:#fff;font-size:13px}
.bola-top{width:40px;height:40px;min-width:40px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.bola-top.red{background:#b50000}.bola-top.black{background:#222}.bola-top.green{background:#00a000}
.bola-top.pisca8{animation:pisca8 0.7s infinite;border-color:#FFD700!important;box-shadow:0 0 14px #FFD700}
@keyframes pisca8{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.15);filter:brightness(1.6)}}
.btn-voltar{background:#2a0000;border:1px solid #ff4444;color:#ff8888;padding:8px 14px;border-radius:8px;font-weight:900;cursor:pointer;font-size:13px;white-space:nowrap;height:44px}
.meio{flex:1;display:grid;grid-template-columns:68px 1fr;gap:6px;min-height:0}
.col-esq{display:flex;flex-direction:column;gap:4px;min-height:0}
.btn-remover{background:#111;border:1px solid #D4AF37;color:#D4AF37;padding:7px 4px;border-radius:8px;font-size:10px;text-align:center;font-weight:900;cursor:pointer;line-height:1.2}
.pct-ico{text-align:center;font-size:14px}
.col-esq .num{border:1px solid #444;background:#111;padding:10px 0;text-align:center;font-weight:900;border-radius:6px;cursor:pointer;font-size:18px;flex:1;display:flex;align-items:center;justify-content:center;min-height:44px}
.col-esq .num.red{background:#6b0000}.col-esq .num.black{background:#222}.col-esq .num.green{background:#00a000}
.btn-premium{background:#111;border:1px solid #D4AF37;color:#D4AF37;padding:8px 4px;border-radius:8px;text-align:center;font-weight:900;cursor:pointer;font-size:12px}
.mesa{background:#111;border:1px solid #444;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0;overflow:hidden}
.grid-mesa{flex:1;display:grid;grid-template-columns:32px repeat(12,1fr) 42px;grid-template-rows:repeat(3,1fr);gap:3px;min-height:0;overflow:hidden}
.cell-mesa{border:1px solid #222;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;font-size:24px;min-width:0;min-height:70px;white-space:nowrap;overflow:hidden;position:relative;flex-direction:column;line-height:1}
.cell-mesa.red{background:#b50000}.cell-mesa.black{background:#222}.cell-mesa.green{background:#00a000}
.cell-mesa.zero{background:#888;color:#000;writing-mode:vertical-rl;font-size:16px;min-width:32px}.cell-mesa.to1{background:#888;font-size:11px}
.cell-mesa.pisca8{animation:piscaMesa 0.7s infinite;border:3px solid #FFD700!important;box-shadow:0 0 20px #FFD700, inset 0 0 14px #FFD700;z-index:2}
@keyframes piscaMesa{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.07);filter:brightness(1.7)}}
.fire-mesa{position:absolute;top:1px;left:2px;font-size:15px;animation:fogo 0.5s infinite;line-height:1}
@keyframes fogo{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.35) rotate(3deg)}}
.ice-mesa{position:absolute;top:1px;right:2px;font-size:15px;animation:gelo 0.8s infinite;line-height:1}
@keyframes gelo{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.25) rotate(10deg)}}
.tag-hot{position:absolute;bottom:1px;left:3px;font-size:8px;color:#ffcc00;font-weight:900}
.tag-cold{position:absolute;bottom:1px;right:3px;font-size:8px;color:#00ccff;font-weight:900}
#virar{display:none;position:fixed;inset:0;background:#0a0f1a;z-index:999;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}
@media (orientation: portrait){ #virar{display:flex} }
</style>
</head>
<body>
<div id="virar"><span style="font-size:60px">🔄</span><b style="font-size:22px;color:#D4AF37">VIRE O CELULAR</b><p style="color:#aaa;font-size:13px">Esse modelo é em PAISAGEM.<br>Vire o celular deitado para usar igual a foto.</p><button onclick="document.getElementById('virar').style.display='none'" style="background:#D4AF37;color:#000;border:0;padding:12px 20px;border-radius:10px;font-weight:900">USAR ASSIM MESMO</button></div>
<div id="wrap"><div id="app">
  <div class="topo">
    <div class="zoomBtn" onclick="zoomMenos(event)">🔍-</div>
    <div class="logo">‹ RAFIGASP<small>COACH DA ROLETA</small></div>
    <div class="quadrado-azul"><div class="titulo">🎯 8 NÚMEROS<br><span id="confPct">--%</span></div><div id="prevBolas" style="display:flex;gap:6px"></div></div>
    <div class="zoomBtn" onclick="zoomMais(event)">🔍+</div>
    <button class="btn-voltar" onclick="limparTudo()">🗑️ LIMPAR</button>
  </div>
  <div class="meio">
    <div class="col-esq"><div class="btn-remover" onclick="removerUltimo()">◀ Remover<br>último número</div><div class="pct-ico">% 📊</div><div id="colEsq" style="flex:1;display:flex;flex-direction:column;gap:4px;min-height:0"></div><div class="btn-premium">App<br>Premium</div></div>
    <div class="mesa"><div class="grid-mesa" id="gridMesa"></div></div>
  </div>
</div></div>
<div class="zoomInfo" id="zoomInfo"></div>
<script>
let zoomLevel=1;
function aplicaZoom(){ let app=document.getElementById('app'); app.style.transform='scale('+zoomLevel+')'; app.style.width=(100/zoomLevel)+'%'; app.style.height=(100/zoomLevel)+'%'; localStorage.setItem('zoomPaisagem',zoomLevel); let i=document.getElementById('zoomInfo'); i.textContent='Zoom '+Math.round(zoomLevel*100)+'%'; i.style.display='block'; setTimeout(()=>i.style.display='none',1000); }
function zoomMais(e){e&&e.stopPropagation();zoomLevel=Math.min(2.5,zoomLevel+0.15);aplicaZoom();}
function zoomMenos(e){e&&e.stopPropagation();zoomLevel=Math.max(1,zoomLevel-0.15);aplicaZoom();}
aplicaZoom();
let pinchDist=0,pinchStart=1; let wrap=document.getElementById('wrap');
wrap.addEventListener('touchstart',e=>{ if(e.touches.length===2){ let dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; pinchDist=Math.sqrt(dx*dx+dy*dy); pinchStart=zoomLevel; } },{passive:true});
wrap.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinchDist>0){ let dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; let d=Math.sqrt(dx*dx+dy*dy); zoomLevel=Math.min(2.5,Math.max(1,pinchStart*(d/pinchDist))); let app=document.getElementById('app'); app.style.transform='scale('+zoomLevel+')'; app.style.width=(100/zoomLevel)+'%'; app.style.height=(100/zoomLevel)+'%'; localStorage.setItem('zoomPaisagem',zoomLevel); } },{passive:true});
let lastTap=0; wrap.addEventListener('touchend',()=>{ let n=Date.now(); if(n-lastTap<350){ zoomLevel=1; aplicaZoom(); } lastTap=n; });
const REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const COL={0:0,1:1,2:2,3:3,4:1,5:2,6:3,7:1,8:2,9:3,10:1,11:2,12:3,13:1,14:2,15:3,16:1,17:2,18:3,19:1,20:2,21:3,22:1,23:2,24:3,25:1,26:2,27:3,28:1,29:2,30:3,31:1,32:2,33:3,34:1,35:2,36:3};
const RODA=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
let hist = JSON.parse(localStorage.getItem('historico_rafigasp')||'[]');
let previsaoAtual = JSON.parse(localStorage.getItem('previsaoTravada')||'[]');
let confAtual = localStorage.getItem('confTravada') || '--%';
let hotSet = new Set(), coldSet = new Set();
function cor(n){ if(n===0) return 'green'; return REDS.includes(n)?'red':'black'; }
function bolaHTML(n, cls='bola-top'){ let pisca = previsaoAtual.includes(n) ? ' pisca8' : ''; return `<div class="${cls} ${cor(n)}${pisca}">${n}</div>`; }
function gerarNovos8(hot){
  let ultimo = hist.length? hist[hist.length-1] : 0; let pos = RODA.indexOf(ultimo); let viz=[];
  if(pos>=0){ viz=[RODA[(pos+1)%37], RODA[(pos+2)%37], RODA[(pos+36)%37]]; }
  let base = hot.slice(0,5).map(h=>h.n); let lista=[...base, ...viz].filter((v,i,a)=>a.indexOf(v)===i);
  while(lista.length<8){ let r=Math.floor(Math.random()*37); if(!lista.includes(r)) lista.push(r); }
  previsaoAtual = lista.slice(0,8).sort((a,b)=>a-b);
  confAtual = Math.min(90,50+(hot[0]?hot[0].qtd:1)*5)+'%';
  localStorage.setItem('previsaoTravada', JSON.stringify(previsaoAtual));
  localStorage.setItem('confTravada', confAtual);
}
function render(){
  let esq = [...hist].reverse().slice(0,7);
  document.getElementById('colEsq').innerHTML = esq.length ? esq.map(n=>`<div class="num ${cor(n)}" onclick="pick(${n})">${n}</div>`).join('') : '<div style="color:#888;font-size:11px;text-align:center">Sem<br>números</div>';
  let counts={}; hist.forEach(n=>counts[n]=(counts[n]||0)+1);
  let arr=[]; for(let i=0;i<=36;i++) arr.push({n:i,qtd:counts[i]||0});
  let hot=[...arr].sort((a,b)=>b.qtd-a.qtd).slice(0,10);
  let cold=[...arr].sort((a,b)=>a.qtd-b.qtd).slice(0,10);
  hotSet = new Set(hot.filter(h=>h.qtd>0).map(h=>h.n));
  coldSet = new Set(cold.map(c=>c.n));
  if(hist.length>0 && previsaoAtual.length!==8){ gerarNovos8(hot); }
  let grid = document.getElementById('gridMesa'); grid.innerHTML='';
  let linhas=[[3,6,9,12,15,18,21,24,27,30,33,36],[2,5,8,11,14,17,20,23,26,29,32,35],[1,4,7,10,13,16,19,22,25,28,31,34]];
  let zeroDiv=document.createElement('div'); zeroDiv.className='cell-mesa zero'+(previsaoAtual.includes(0)?' pisca8':''); zeroDiv.style.gridRow='1 / span 3'; zeroDiv.innerText='0'; zeroDiv.onclick=()=>pick(0); grid.appendChild(zeroDiv);
  linhas.forEach(linha=>{ linha.forEach(n=>{
    let d=document.createElement('div'); d.className=`cell-mesa ${cor(n)}`+(previsaoAtual.includes(n)?' pisca8':''); d.onclick=()=>pick(n);
    let html = `<span>${n}</span>`;
    if(hist.length>0 && hotSet.has(n)) html += `<span class="fire-mesa">🔥</span><span class="tag-hot">HOT ${counts[n]}x</span>`;
    if(hist.length>0 && coldSet.has(n)) html += `<span class="ice-mesa">❄️</span><span class="tag-cold">COLD ${counts[n]}x</span>`;
    d.innerHTML = html; grid.appendChild(d);
  }); let t=document.createElement('div'); t.className='cell-mesa to1'; t.innerText='2 to 1'; grid.appendChild(t); });
  if(hist.length===0){
    previsaoAtual=[]; confAtual='--%';
    document.getElementById('confPct').innerText='--%'; document.getElementById('prevBolas').innerHTML='<span style="color:#888;font-size:12px">Digite números para gerar os 8</span>'; return;
  }
  document.getElementById('confPct').innerText=confAtual;
  document.getElementById('prevBolas').innerHTML=previsaoAtual.map(n=>bolaHTML(n)).join('');
}
function pick(n){
  let acertou = previsaoAtual.includes(n);
  hist.push(n); localStorage.setItem('historico_rafigasp',JSON.stringify(hist)); localStorage.setItem('ultimo_rafigasp',n);
  if(acertou){
    let counts={}; hist.forEach(x=>counts[x]=(counts[x]||0)+1);
    let arr=[]; for(let i=0;i<=36;i++) arr.push({n:i,qtd:counts[i]||0});
    let hot=[...arr].sort((a,b)=>b.qtd-a.qtd).slice(0,10);
    gerarNovos8(hot);
    alert('✅ ACERTOU! Saiu '+n+' que estava nos 8! Novos 8 gerados: '+previsaoAtual.join(' - '));
  }
  render();
}
function removerUltimo(){ hist.pop(); localStorage.setItem('historico_rafigasp',JSON.stringify(hist)); render(); }
function limparTudo(){ if(!confirm('Zerar TUDO e começar do zero?')) return; hist=[]; previsaoAtual=[]; confAtual='--%'; hotSet=new Set(); coldSet=new Set(); localStorage.removeItem('historico_rafigasp'); localStorage.removeItem('ultimo_rafigasp'); localStorage.removeItem('previsaoTravada'); localStorage.removeItem('confTravada'); localStorage.removeItem('histA'); localStorage.removeItem('histB'); localStorage.removeItem('histGeralCron'); localStorage.removeItem('cntA'); localStorage.removeItem('cntB'); render(); }
function prever(){ if(hist.length<3){alert('Digite pelo menos 3 números!');return;} render(); alert('IA RAFIGASP - 8 travados até acertar: '+previsaoAtual.join(' - ')); }
render();
</script>
</body>
</html>
