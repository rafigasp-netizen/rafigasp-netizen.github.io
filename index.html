<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#0d2818;overflow:hidden}body{display:flex;justify-content:center}.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;display:flex;flex-direction:column}.topo{padding:8px 0 4px;text-align:center;background:#0a1f14;flex-shrink:0}.topoR{font-family:'Montserrat',sans-serif;font-weight:900;font-size:36px;color:#e8c76a;line-height:1}.topoS{font-size:8px;letter-spacing:4px;color:#d4af37;font-weight:800}.display{margin:5px 8px;background:#000;border:2px solid #d4af37;border-radius:10px;height:42px;display:flex;align-items:center;justify-content:center;color:#f9e27a;font-weight:900;font-size:18px;flex-shrink:0}.display.vazio{color:#3a7a3a;font-size:12px}.painel{flex:1;display:flex;flex-direction:column;overflow:hidden}.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px;overflow:hidden}.box{border:1.5px solid #d4af37;border-radius:10px;background:#0f2e1a;padding:5px;display:flex;flex-direction:column;overflow:hidden}.boxLabel{font-size:8px;font-weight:900;color:#d4af37;margin-bottom:3px}.sqs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;justify-items:center}.sq{width:100%;max-width:48px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:#fff}.sq.g{background:#16a34a}.sq.r{background:#dc2626}.sq.b{background:#1e40af}.pill{background:linear-gradient(180deg,#f9e27a,#d4af37);color:#0a2a12;font-weight:900;font-size:10px;padding:6px 12px;border-radius:18px;text-align:center;min-width:100px}.centroBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.kb{padding:6px;background:linear-gradient(180deg,#e8c76a,#c9a84a);margin:0 6px 5px 6px;border-radius:12px;border:2px solid #d4af37;height:36%;display:flex;flex-direction:column;gap:4px;flex-shrink:0}.kr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.k{width:100%;height:100%;border-radius:8px;border:1px solid #8a6d1b;font-weight:900;font-size:18px;background:linear-gradient(180deg,#f9e27a,#e8c86a 50%,#b8941f 100%);color:#1a1000;display:flex;align-items:center;justify-content:center}
.painel2,.painel3{flex:1;display:none;flex-direction:column;overflow:hidden;padding:5px;gap:5px}
.seqTop{display:flex;gap:3px;background:#000;border:1.5px solid #d4af37;border-radius:8px;padding:5px;flex-wrap:wrap;min-height:34px}
.ln{width:24px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff}.ln.b{background:#1e40af}.ln.g{background:#16a34a}.ln.r{background:#dc2626}
.histRow{border:1px solid #1a4d1a;background:#0f2e1a;border-radius:7px;padding:4px 6px;display:flex;align-items:center;gap:5px;min-height:28px}.histLabel{font-size:10px;font-weight:900;color:#e8c76a;width:48px;flex-shrink:0}.histNums{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.rouleteWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1f14;border:1.5px solid #d4af37;border-radius:12px;padding:6px}
#canvasRoleta{max-width:100%;max-height:100%}
.legenda{display:flex;gap:12px;margin-top:6px;font-size:10px;font-weight:900;color:#f9e27a;align-items:center}
.dot{width:10px;height:10px;border-radius:50%}.dot.verde{background:#22c55e;box-shadow:0 0 10px #22c55e;animation:piscar 0.6s infinite alternate}.dot.verm{background:#ef4444}
@keyframes piscar{0%{transform:scale(1)}100%{transform:scale(1.5);box-shadow:0 0 20px #22c55e}}
</style>
</head>
<body>
<div class="app">
<div class="topo"><div class="topoR">RAFIGASP</div><div class="topoS">COACH DA ROLETA</div></div>
<div class="display vazio" id="dig">DIGITE O NÚMERO</div>
<div class="painel" id="painel1">
<div class="grid">
<div class="box"><div class="boxLabel">NUMERO CHAMADO</div><div class="sqs" id="boxNum"></div></div>
<div class="box"><div class="boxLabel">JOGAR NA COLUNA</div><div class="centroBox"><span class="pill" id="pillCol">AGUARDANDO</span><div id="txtOrig" style="font-size:8px;color:#f9e27a;font-weight:900;text-align:center">-</div></div></div>
<div class="box"><div class="boxLabel">ACERTO OU ERRO</div><div class="sqs" id="boxAcerto"></div></div>
<div class="box"><div class="boxLabel">PLACAR</div><div class="centroBox"><span class="pill" id="pillPlacar">GREEN 0 x 0 RED</span><div style="font-weight:900;margin-top:3px"><span style="color:#4ade80" id="gCount">✅ 0</span> <span style="color:#f87171" id="rCount">❌ 0</span></div></div></div>
</div>
</div>
<div class="painel2" id="painel2"><div class="seqTop" id="seqTop"></div><div style="flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px"><div class="histRow"><div class="histLabel">A HIST</div><div class="histNums" id="hA"></div></div><div class="histRow"><div class="histLabel">B HIST</div><div class="histNums" id="hB"></div></div><div class="histRow"><div class="histLabel">C HIST</div><div class="histNums" id="hC"></div></div><div class="histRow"><div class="histLabel">D HIST</div><div class="histNums" id="hD"></div></div><div class="histRow"><div class="histLabel">E HIST</div><div class="histNums" id="hE"></div></div><div class="histRow"><div class="histLabel">F HIST</div><div class="histNums" id="hF"></div></div></div></div>
<div class="painel3" id="painel3"><div class="rouleteWrap"><canvas id="canvasRoleta" width="360" height="360"></canvas><div class="legenda"><div style="display:flex;align-items:center;gap:4px"><div class="dot verde"></div> ATUAL</div><div style="display:flex;align-items:center;gap:4px"><div class="dot verm"></div> ANTERIORES</div><div id="labelAtual" style="color:#22c55e;margin-left:6px">-</div></div><div style="font-size:9px;color:#d4af37;font-weight:800;margin-top:2px">000 = HIST | 001 = ROLETA | ENTER = VOLTAR</div></div></div>
<div class="kb"><div class="kr"><button class="k" onclick="digitar('1')">1</button><button class="k" onclick="digitar('2')">2</button><button class="k" onclick="digitar('3')">3</button></div><div class="kr"><button class="k" onclick="digitar('4')">4</button><button class="k" onclick="digitar('5')">5</button><button class="k" onclick="digitar('6')">6</button></div><div class="kr"><button class="k" onclick="digitar('7')">7</button><button class="k" onclick="digitar('8')">8</button><button class="k" onclick="digitar('9')">9</button></div><div class="kr"><button class="k" onclick="confirmar()">ENTER</button><button class="k" onclick="digitar('0')">0</button><button class="k" onclick="corrigir()">CORRIGIR</button></div></div>
</div>
<script>
var ordemRoleta=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
var vermelhos=[32,19,21,25,34,27,36,30,23,5,16,1,14,9,18,7,12,3];
function corRoleta(n){if(n===0)return "#16a34a";return vermelhos.indexOf(n)>=0?"#dc2626":"#1f2937";}
var cur="",lista=[],green=0,red=0,hist=[],logAcerto=[],tb={1:"C2/3",2:"C1/2",3:"C1/2",4:"C1/2",5:"C2/3",6:"C1/2",7:"C2/3",8:"C1/2",9:"C2/3",10:"C2/3",11:"C1/3",12:"C2/3",13:"C1/3",14:"C2/3",15:"C1/3",16:"C1/3",17:"C1/3",18:"C2/3",19:"C1/2",20:"C1/2",21:"C2/3",22:"C1/2",23:"C1/2",24:"C2/3",25:"C1/3",26:"C2/3",27:"C1/3",28:"C2/3",29:"C1/3",30:"C2/3",31:"C1/3",32:"C1/2",33:"C2/3",34:"C1/2",35:"C2/3",36:"C1/2"},sinal=null,paginaAtual=0;
function getCol(n){if([1,4,7,10,13,16,19,22,25,28,31,34].indexOf(n)>=0)return 1;if([2,5,8,11,14,17,20,23,26,29,32,35].indexOf(n)>=0)return 2;return 3;}
function getCols(s){try{return s.replace('C','').split('/').map(Number)}catch(e){return []}}
function mostrarDisplay(){var el=document.getElementById('dig');if(cur===""){el.textContent="DIGITE O NÚMERO";el.className="display vazio";}else if(cur==="0"){el.textContent="0 - APAGAR ULTIMO";el.className="display";}else if(cur==="00"){el.textContent="00 - APAGAR TUDO";el.className="display";}else if(cur==="000"){el.textContent="000 - PAGINA 2 (A-F)";el.className="display";}else if(cur==="001"){el.textContent="001 - MAPA DA ROLETA";el.className="display";}else{el.textContent=cur;el.className="display";}}
function desenharRoleta(pulse){var canvas=document.getElementById('canvasRoleta');if(!canvas)return;var ctx=canvas.getContext('2d');var W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,R=145,r2=90;ctx.clearRect(0,0,W,H);var total=ordemRoleta.length;var anguloPor=2*Math.PI/total;var inicio=-Math.PI/2 - anguloPor/2;for(var i=0;i<total;i++){var n=ordemRoleta[i];var a0=inicio+i*anguloPor;var a1=a0+anguloPor;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();ctx.fillStyle=corRoleta(n);ctx.fill();ctx.strokeStyle="#e8c76a";ctx.lineWidth=1;ctx.stroke();var am=(a0+a1)/2;var rx=cx+(R-16)*Math.cos(am);var ry=cy+(R-16)*Math.sin(am);ctx.save();ctx.translate(rx,ry);ctx.rotate(am+Math.PI/2);ctx.fillStyle="#fff";ctx.font="bold 12px Montserrat, Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(n,0,0);ctx.restore();}ctx.beginPath();ctx.arc(cx,cy,r2,0,Math.PI*2);ctx.fillStyle="#0a1f14";ctx.fill();ctx.strokeStyle="#d4af37";ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,16,0,Math.PI*2);ctx.fillStyle="#e8c76a";ctx.fill();if(lista.length>0){var pontos=[];for(var j=0;j<lista.length;j++){var num=lista[j].n;var idx=ordemRoleta.indexOf(num);if(idx<0)continue;var am=inicio+idx*anguloPor+anguloPor/2;var dist=R+14;var bx=cx+dist*Math.cos(am);var by=cy+dist*Math.sin(am);pontos.push({x:bx,y:by});}if(pontos.length>1){ctx.beginPath();for(var k=0;k<pontos.length;k++){if(k===0)ctx.moveTo(pontos[k].x,pontos[k].y);else ctx.lineTo(pontos[k].x,pontos[k].y);}ctx.strokeStyle="#facc15";ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);for(var k=1;k<pontos.length;k++){var p1=pontos[k-1],p2=pontos[k];var ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);var mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;ctx.save();ctx.translate(mx,my);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-6,-4);ctx.lineTo(-6,4);ctx.closePath();ctx.fillStyle=k===pontos.length-1?"#22c55e":"#facc15";ctx.fill();ctx.restore();}}for(var j=0;j<pontos.length;j++){var p=pontos[j];var ultimo=j===pontos.length-1;var raio=ultimo?(9+(pulse||0)*4):6;ctx.beginPath();ctx.arc(p.x,p.y,raio,0,Math.PI*2);ctx.fillStyle=ultimo?"#22c55e":"#ef4444";ctx.fill();if(ultimo){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();ctx.shadowColor="#22c55e";ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;}}document.getElementById('labelAtual').textContent="ATUAL: "+lista[lista.length-1].raw+" | TRAJETO: "+lista.length;}else{document.getElementById('labelAtual').textContent="SEM NUMEROS";}}
var animTime=0;function loopAnim(){animTime+=0.08;if(paginaAtual===2){var pulse=Math.abs(Math.sin(animTime));desenharRoleta(pulse);}requestAnimationFrame(loopAnim);}
function atualizarTela(){try{var bn=document.getElementById('boxNum');bn.innerHTML="";var m=lista.slice(-9);for(var i=m.length-1;i>=0;i--){var o=m[i];var d=document.createElement('div');d.className='sq '+(o.w===null?'b':o.w?'g':'r');d.textContent=o.raw;bn.appendChild(d);}var ba=document.getElementById('boxAcerto');ba.innerHTML="";var ma=logAcerto.slice(-9);for(var i=ma.length-1;i>=0;i--){var o=ma[i];var d=document.createElement('div');d.className='sq '+(o.acerto?'g':'r');d.textContent=o.raw;ba.appendChild(d);}document.getElementById('gCount').textContent="✅ "+green;document.getElementById('rCount').textContent="❌ "+red;document.getElementById('pillPlacar').textContent="GREEN "+green+" x "+red+" RED";var pc=document.getElementById('pillCol'),txt=document.getElementById('txtOrig');if(lista.length>0){var last=lista[lista.length-1];if(last.w===false){var col=tb[last.n]||"C1/2";pc.textContent=col;txt.textContent="ENTRADA APÓS RED "+last.raw;pc.style.background="#ef4444";pc.style.color="#fff";}else if(sinal){pc.textContent=sinal.col;txt.textContent=sinal.orig;pc.style.background="";pc.style.color="";pc.style.backgroundImage="linear-gradient(180deg,#f9e27a,#d4af37)";}else{pc.textContent="AGUARDANDO";txt.textContent="-";pc.style.background="";pc.style.color="";pc.style.backgroundImage="linear-gradient(180deg,#f9e27a,#d4af37)";}}else{pc.textContent="AGUARDANDO";txt.textContent="-";}var seq=document.getElementById('seqTop');seq.innerHTML="";for(var i=0;i<lista.length;i++){var l=lista[i];var d=document.createElement('div');d.className='ln '+(l.w===null?'b':l.w?'g':'r');d.textContent=l.raw;seq.appendChild(d);}var groups={A:[],B:[],C:[],D:[],E:[],F:[]};for(var i=0;i<lista.length;i++){var key=["A","B","C","D","E","F"][i%6];groups[key].push(lista[i]);}for(var k in groups){var el=document.getElementById('h'+k);if(el){el.innerHTML="";for(var j=0;j<groups[k].length;j++){var l=groups[k][j];var d=document.createElement('div');d.className='ln '+(l.w===null?'b':l.w?'g':'r');d.textContent=l.raw;el.appendChild(d);}}}desenharRoleta(0);}catch(e){}}
function save(){try{hist.push({lista:JSON.parse(JSON.stringify(lista)),green:green,red:red,sinal:sinal?JSON.parse(JSON.stringify(sinal)):null,logAcerto:JSON.parse(JSON.stringify(logAcerto))});if(hist.length>60)hist.shift();}catch(e){}}
function digitar(d){try{if(cur==="0"&&d==="0"){cur="00";}else if(cur==="00"&&d==="0"){cur="000";}else if(cur==="00"&&d==="1"){cur="001";}else if(cur==="0"||cur==="00"){cur=d;}else if(cur==="000"||cur==="001"){cur=d;}else{var t=cur+d;if(t!=="000"&&t!=="001"&&parseInt(t)>36&&t.length<=2)return;cur=t;}mostrarDisplay();}catch(e){cur="";mostrarDisplay()}}
function confirmar(){try{if(cur==="")return;if(cur==="000"){paginaAtual=1;document.getElementById('painel1').style.display='none';document.getElementById('painel2').style.display='flex';document.getElementById('painel3').style.display='none';cur="";mostrarDisplay();atualizarTela();return;}if(cur==="001"){paginaAtual=2;document.getElementById('painel1').style.display='none';document.getElementById('painel2').style.display='none';document.getElementById('painel3').style.display='flex';cur="";mostrarDisplay();atualizarTela();return;}if(paginaAtual!==0){paginaAtual=0;document.getElementById('painel1').style.display='flex';document.getElementById('painel2').style.display='none';document.getElementById('painel3').style.display='none';}if(cur==="0"){save();if(lista.length>0)lista.pop();sinal=null;cur="";mostrarDisplay();atualizarTela();return;}if(cur==="00"){save();lista=[];green=0;red=0;sinal=null;logAcerto=[];cur="";mostrarDisplay();atualizarTela();return;}var raw=cur;var v=parseInt(cur);if(v>36||isNaN(v)){cur="";mostrarDisplay();return;}save();if(sinal){var colNum=getCol(v);var cols=getCols(sinal.col);var acerto=cols.indexOf(colNum)>=0;if(acerto){green++;logAcerto.push({raw:raw,acerto:true});}else{red++;logAcerto.push({raw:raw,acerto:false});}sinal=null;var col=tb[v]||"C1/2";var tipo=true;if(lista.length>0){var last=lista[lista.length-1];var lastCol=tb[last.n]||"C1/2";tipo=getCols(lastCol).indexOf(getCol(v))>=0;}lista.push({n:v,raw:raw,w:lista.length===0?null:tipo});cur="";mostrarDisplay();atualizarTela();return;}var col=tb[v]||"C1/2";var w=null;if(lista.length>0){var last=lista[lista.length-1];var lastCol=tb[last.n]||"C1/2";w=getCols(lastCol).indexOf(getCol(v))>=0;if(!w){sinal={col:col,orig:"ORIGEM A "+last.raw+" RED"};}}lista.push({n:v,raw:raw,w:lista.length===0?null:w});cur="";mostrarDisplay();atualizarTela();}catch(e){cur="";mostrarDisplay();atualizarTela();}}
function corrigir(){try{if(cur!==""){cur=cur.slice(0,-1);mostrarDisplay();return;}if(hist.length>0){var p=hist.pop();lista=p.lista;green=p.green;red=p.red;sinal=p.sinal;logAcerto=p.logAcerto;atualizarTela();}}catch(e){}}
mostrarDisplay();desenharRoleta();atualizarTela();loopAnim();
</script>
</body>
</html>
