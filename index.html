<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RAFIGASP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d2818}
body{display:flex;justify-content:center}
.app{width:100%;max-width:420px;height:100dvh;background:#0d2818;border:3px solid #d4af37;display:flex;flex-direction:column}
.topo{background:linear-gradient(180deg,#e8c86a,#b8941f);padding:6px;text-align:center}
.topo h1{color:#000;font-size:13px;font-weight:900}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:#0f2e1f}
.slot{height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;border:2px dashed #d4af37;color:#d4af37;background:#0a2a1a}
.slot.yellow{background:#d4af37;color:#000;border-style:solid}
.slot.green{background:#16a34a;color:#fff;border-style:solid;border-color:#16a34a}
.slot.red{background:#dc2626;color:#fff;border-style:solid;border-color:#dc2626}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:#0f2e1f}
.tab{height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px}
.tab.col{background:#000;color:#fff}
.tab.duz{background:#fff;color:#000}
.trackArea{background:#0a2a1a;margin:0 6px 2px 6px;border-radius:8px;border:1.5px solid #1e4d8a;min-height:125px;padding:6px;display:flex;gap:6px}
.colBox{flex:1;background:#0f2e1f;border-radius:6px;padding:4px}
.groupHead{font-size:9px;color:#d4af37;font-weight:900;text-align:center;margin-bottom:4px}
.squares5{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.sq{height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#fff}
.sq.empty{background:#1a3d2a;border:1px dashed #2a5a3a}
.sq.green{background:#16a34a}.sq.red{background:#dc2626}
.keyboard{padding:6px;display:flex;flex-direction:column;gap:7px;background:#0f2e1f}
.krow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.k{height:60px;border-radius:14px;border:none;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.k:active{transform:scale(0.96)}
.k.num{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#3a2a0a}
.k.zero{background:#ef4444;color:#fff}
.k.act{background:linear-gradient(180deg,#e8c86a,#b8941f);color:#3a2a0a;font-size:14px}
</style>
</head>
<body>
<div class="app">
<div class="topo"><h1>RAFIGASP COACH DA ROLETA</h1></div>
<div class="top2">
